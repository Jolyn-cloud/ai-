<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>专升本学习</title>

<style>
  /* ============================================================
     Design Token（与 05_UI设计/设计Token.md 对齐，勿双份维护）
     ============================================================ */
  :root{
    --primary: #5B72F5;
    --primary-dark: #4358D7;
    --primary-light: #EEF1FF;

    --bg-top: #FFFFFF;
    --bg-middle: #FFFFFF;
    --bg-bottom: #FFFFFF;

    --text-primary: #202533;
    --text-secondary: #6E778B;
    --text-tertiary: #98A0B2;

    --success: #20A866;
    --warning: #F28B3D;

    --card-radius: 17px;
    --hero-radius: 22px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: var(--text-primary);
    background: #FFFFFF;
  }

  body { display: flex; justify-content: center; }

  /* ========================= 页面 =========================
     使用 PM 提供的淡紫梦幻背景图为全屏背景，底部叠加白色渐隐遮罩 */
  .page {
    position: relative;
    width: 100%;
    max-width: 430px;
    height: 100vh;
    overflow: hidden;
    display: flex; flex-direction: column;

    background: url('bg-flashcard-home.png') center top / cover no-repeat;
    background-color: #F8F9FC;
  }

  /* 底部白色渐隐：让长列表在下方保持可读 */
  .bottom-mask {
    position: absolute;
    z-index: 1;
    left: 0; right: 0;
    top: 380px; bottom: 0;
    pointer-events: none;
    background: linear-gradient(180deg,
      rgba(248,249,252,0) 0%,
      rgba(248,249,252,0.45) 14%,
      rgba(248,249,252,0.78) 32%,
      rgba(248,249,252,0.96) 52%,
      #F8F9FC 100%);
  }

  /* ========================= 中段 → 底部渐隐遮罩 =========================
     背诵卡下方起逐渐回归纯白 */
  .bottom-mask {
    position: absolute;
    z-index: 1;
    left: 0; right: 0;
    top: 380px; bottom: 0;
    pointer-events: none;
    background: linear-gradient(180deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0.25) 18%,
      rgba(255,255,255,0.62) 40%,
      rgba(255,255,255,0.88) 58%,
      rgba(255,255,255,0.97) 72%,
      #FFFFFF 100%);
  }

  /* ========================= 内容 ========================= */
  .content {
    position: relative;
    z-index: 2;
    flex: 1; min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 0 18px 30px;
  }
  .content::-webkit-scrollbar { display: none; }

  /* ========================= 手机壳：桌面端固定手机比例居中，页面在壳内滚动 ========================= */
  @media (min-width: 481px) {
    html, body { height: 100%; overflow: hidden; }
    body {
      align-items: center;
      background: linear-gradient(150deg, #E3E5F1 0%, #ECEEF6 55%, #E6E8F2 100%);
    }
    .page {
      width: 390px;
      height: min(844px, calc(100vh - 44px));
      border-radius: 34px;
      box-shadow:
        0 0 0 9px #1E2130,
        0 0 0 11px rgba(255,255,255,0.65),
        0 30px 80px rgba(30,33,48,0.38);
    }
  }

  /* ========================= 顶部 ========================= */
  .header {
    padding-top: 48px;
    padding-bottom: 20px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .greeting {
    font-size: 25px;
    line-height: 1.35;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .countdown {
    margin-top: 7px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: var(--text-secondary);
  }
  .countdown-icon {
    width: 16px; height: 16px;
    border: 2px solid #A8B0C8;
    border-radius: 50%;
    position: relative;
  }
  .countdown-icon::before {
    content: ""; position: absolute;
    width: 1.5px; height: 5px;
    background: #A8B0C8;
    left: 6px; top: 2px;
  }
  .countdown-icon::after {
    content: ""; position: absolute;
    width: 4px; height: 1.5px;
    background: #A8B0C8;
    left: 6px; top: 7px;
    transform: rotate(25deg);
    transform-origin: left center;
  }
  /* 仅数字 42：深紫 + 加大加粗；"天" 字保持次要灰小字 */
  .countdown .days-num {
    color: #4A3FA0;
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .countdown .days-unit {
    font-size: 14px;
    color: var(--text-secondary);
  }

  /* ========================= 用户头像 ========================= */
  .avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, rgba(255,255,255,0.9), rgba(235,239,255,0.95));
    border: 1px solid rgba(255,255,255,0.8);
    box-shadow: 0 8px 24px rgba(75,91,160,0.08);
    flex-shrink: 0;
  }
  .avatar svg { width: 25px; height: 25px; stroke: var(--primary); }

  /* ========================= 背诵计划卡 ========================= */
  .study-card {
    position: relative;
    overflow: hidden;
    padding: 22px 20px 20px;
    border-radius: var(--hero-radius);
    background: linear-gradient(135deg, #4A5FE0 0%, #5B6DEF 50%, #6B5FE8 100%);
    box-shadow: 0 14px 32px rgba(76,99,221,0.25);
  }
  .study-card::before {
    content: ""; position: absolute;
    width: 260px; height: 260px;
    top: -150px; right: -60px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.13), rgba(255,255,255,0));
  }
  .study-card::after {
    content: ""; position: absolute;
    width: 220px; height: 220px;
    bottom: -170px; left: -90px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.08), rgba(255,255,255,0));
  }
  .study-card > * { position: relative; z-index: 2; }

  .study-card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .study-title { color: #fff; font-size: 20px; font-weight: 700; }
  .study-subtitle {
    margin-top: 7px;
    color: rgba(255,255,255,0.85);
    font-size: 14px;
  }

  .streak {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 7px 11px;
    color: #fff;
    font-size: 12px;
    border-radius: 20px;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.12);
    flex-shrink: 0;
  }
  .streak span { font-size: 14px; }

  .settings-btn {
    width: 34px; height: 34px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 50%;
    background: rgba(255,255,255,0.16);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform .1s ease, background .2s ease;
  }
  .settings-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.28); }
  .settings-btn svg { width: 17px; height: 17px; stroke: #fff; }

  /* ========================= 每日数量设置弹窗（底部上滑 + 遮罩） ========================= */
  .sheet-mask {
    position: absolute; inset: 0;
    z-index: 90;
    background: rgba(20,24,40,.45);
    opacity: 0; visibility: hidden;
    transition: opacity .25s ease, visibility .25s;
  }
  .sheet-mask.show { opacity: 1; visibility: visible; }
  .settings-sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 91;
    background: #fff;
    border-radius: 22px 22px 0 0;
    padding: 10px 20px calc(18px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -8px 32px rgba(30,41,80,.18);
    transform: translateY(105%);
    visibility: hidden;
    transition: transform .3s cubic-bezier(.32,.72,.28,1), visibility .3s;
  }
  .settings-sheet.show { transform: translateY(0); visibility: visible; }
  .sheet-handle {
    width: 38px; height: 4px;
    margin: 4px auto 14px;
    border-radius: 2px;
    background: #E2E5F0;
  }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .sheet-title { font-size: 16px; font-weight: 700; color: #2A2F45; }
  .sheet-close {
    width: 28px; height: 28px;
    border: none; border-radius: 50%;
    background: #F2F3F9;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform .1s ease;
  }
  .sheet-close svg { width: 14px; height: 14px; stroke: #8A90A8; }
  .sheet-close:active { transform: scale(.92); }
  .pop-value { display: flex; align-items: baseline; gap: 4px; }
  .pop-value b { font-size: 28px; font-weight: 800; color: #5B72F5; }
  .pop-value span { font-size: 12px; color: #8A90A8; }
  .pop-range {
    width: 100%; margin-top: 13px;
    -webkit-appearance: none; appearance: none;
    height: 6px; border-radius: 3px;
    background: linear-gradient(to right, #5B72F5 0%, #5B72F5 100%, #E7EAF6 100%, #E7EAF6 100%);
    outline: none;
  }
  .pop-range::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 22px; height: 22px; border-radius: 50%;
    background: #fff; border: 3px solid #5B72F5;
    box-shadow: 0 2px 8px rgba(91,114,245,.35);
    cursor: grab;
  }
  .pop-range::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%;
    background: #fff; border: 3px solid #5B72F5;
    box-shadow: 0 2px 8px rgba(91,114,245,.35);
    cursor: grab;
  }
  .pop-chips { display: flex; gap: 7px; margin-top: 14px; }
  .pop-chip {
    flex: 1; height: 32px;
    border: 1px solid #E4E7F2; border-radius: 10px;
    background: #F7F8FC; color: #8A90A8;
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    transition: all .15s ease;
  }
  .pop-chip:active { transform: scale(.95); }
  .pop-chip.on { background: #EEF1FE; border-color: #5B72F5; color: #5B72F5; }
  .pop-save {
    width: 100%; height: 44px; margin-top: 15px;
    border: none; border-radius: 12px;
    background: #5B72F5; color: #fff;
    font-size: 15px; font-weight: 700; cursor: pointer;
    box-shadow: 0 8px 18px rgba(91,114,245,.28);
    transition: transform .1s ease;
  }
  .pop-save:active { transform: scale(.98); }
  .pop-tip {
    margin-top: 11px; padding: 9px 10px;
    border-radius: 10px; font-size: 12px; line-height: 1.45;
    text-align: center;
  }
  .pop-tip.ok { background: #E8F8F0; color: #1E9E6A; }
  .pop-tip.next { background: #FFF4E3; color: #C77A18; }

  /* ========================= 进度数据 ========================= */
  .study-data {
    margin-top: 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .data-left { display: flex; align-items: center; gap: 12px; }
  .data-icon {
    width: 48px; height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    background: rgba(255,255,255,0.18);
    flex-shrink: 0;
  }
  .data-icon svg { width: 27px; height: 27px; stroke: white; }
  .data-label { color: rgba(255,255,255,0.8); font-size: 13px; }
  .data-number {
    margin-top: 4px; /* 与"总进度"间距 +1 */
    color: #fff;
    font-size: 14px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
  }
  /* 3,568 与单位同字号，仅加粗（Q17A） */
  .data-number strong { font-weight: 700; }
  .percentage {
    color: white;
    font-size: 30px; /* 由 39px 缩小，避免压过卡片标题 */
    font-weight: 750;
    letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
  }

  /* ========================= 主进度条 ========================= */
  .main-progress {
    margin-top: 18px;
    width: 100%;
    height: 6px;
    border-radius: 10px;
    background: rgba(255,255,255,0.25);
    overflow: hidden;
  }
  .main-progress-inner {
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: rgba(255,255,255,0.95);
    transition: width 1s cubic-bezier(.22,.61,.36,1);
  }

  /* ========================= 继续按钮 ========================= */
  .continue-button {
    margin-top: 18px;
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 14px;
    background: rgba(255,255,255,0.98);
    color: #536be8;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(48,65,150,0.06);
    transition: transform .1s ease;
  }
  .continue-button:active { transform: scale(.98); }
  .continue-button span { margin-left: 5px; font-size: 20px; vertical-align: -1px; }

  /* ========================= 全部章节 ========================= */
  .chapter-section { margin-top: 26px; }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-title-wrap { display: flex; align-items: center; gap: 9px; }
  .section-line {
    width: 4px; height: 22px;
    border-radius: 10px;
    background: var(--primary);
  }
  .section-title { font-size: 20px; font-weight: 700; }

  /* ========================= 搜索 ========================= */
  .search {
    height: 36px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 13px;
    border-radius: 20px;
    background: rgba(255,255,255,0.75);
    border: 1px solid rgba(220,224,235,0.75);
    color: #9299a9;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .search svg { width: 16px; height: 16px; stroke: #8991a2; }

  /* ========================= 章节卡片 ========================= */
  .chapter-list { display: flex; flex-direction: column; gap: 9px; }

  .chapter-card {
    position: relative;
    padding: 14px 15px 13px;
    border-radius: var(--card-radius);
    background: rgba(255,255,255,0.92);
    box-shadow: 0 5px 18px rgba(54,66,108,0.055);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .chapter-head { cursor: pointer; }
  .chapter-head:active { opacity: .75; }

  .chapter-main { display: flex; align-items: center; gap: 12px; }

  .chapter-icon {
    width: 44px; height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 13px;
    background: var(--primary-light);
  }
  .chapter-icon svg { width: 23px; height: 23px; stroke: var(--primary); }

  .chapter-info { min-width: 0; flex: 1; }
  .chapter-name {
    color: var(--text-primary);
    font-size: 15px;
    font-weight: 650;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chapter-data {
    margin-top: 5px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    font-size: 12px;
    color: #8a92a4;
    font-variant-numeric: tabular-nums;
  }
  .remembered { color: var(--success); }
  .remembered strong { font-weight: 600; }

  .stubborn {
    display: inline-flex;
    align-items: center;
    padding: 2px 7px;
    border-radius: 7px;
    color: var(--warning);
    background: #fff1e6;
    font-size: 11px;
    font-weight: 500;
  }

  .chapter-right {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .chapter-percent {
    margin-left: 8px;
    color: var(--primary);
    font-size: 17px;
    font-weight: 700;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .arrow {
    margin-left: 5px;
    color: #8b93a4;
    font-size: 17px;
    line-height: 1;
    transition: transform .25s ease;
  }
  .chapter-card.open .arrow { transform: rotate(90deg); }

  /* ========================= 章节进度条（统一青蓝） ========================= */
  .chapter-progress {
    margin-left: 56px;
    margin-top: 9px;
    height: 3px;
    border-radius: 10px;
    background: #e7eaf3;
    overflow: hidden;
  }
  .chapter-progress-inner {
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #5872f5, #6377f2);
    transition: width .9s cubic-bezier(.22,.61,.36,1);
  }

  /* ========================= 二级章节（手风琴展开） ========================= */
  .sub-list {
    max-height: 0;
    overflow: hidden;
    transition: max-height .3s ease;
  }
  .sub-inner {
    padding-top: 12px; /* 一级进度条与首个二级容器的间隔 */
    margin-top: 0;
    border-top: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  /* 二级容器：极浅蓝紫底，隐约边框，完整包住所有三级 */
  .sub-container {
    background: #FAFBFF;
    border: 1px solid rgba(91,114,245,0.05);
    border-radius: 12px;
    padding: 13px;
  }
  .sub-item {
    display: flex;
    align-items: center;
    padding: 2px 0;
    cursor: pointer;
    border-radius: 0;
    background: transparent;
    transition: background .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .sub-item:active { background: transparent; }
  .sub-dot {
    width: 6px; height: 6px;
    margin-right: 11px;
    border-radius: 50%;
    background: #2f489a;
    flex-shrink: 0;
  }
  .sub-title {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    font-weight: 550;
    color: #2f489a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sub-right {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-shrink: 0;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .sub-mem { color: var(--text-tertiary); }
  .sub-mem strong { color: var(--success); font-weight: 600; }
  .sub-pct { color: var(--primary); font-weight: 700; }
  .sub-arrow {
    margin-left: 3px;
    color: #c3c9d5;
    font-size: 16px;
    line-height: 1;
    transition: transform .25s ease;
  }
  .sub-item.open-level2 .sub-arrow {
    transform: rotate(90deg);
  }
  /* 二级进度条（常驻显示） */
  .sub-progress {
    margin: 6px 0 4px 17px;
    height: 2px;
    border-radius: 10px;
    background: #EEF0F7;
    overflow: hidden;
  }
  .sub-progress-inner {
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: rgba(91,114,245,0.40);
    transition: width .9s cubic-bezier(.22,.61,.36,1);
  }

  /* ========================= 三级章节 ========================= */
  .level3-list {
    max-height: 0;
    overflow: hidden;
    transition: max-height .3s ease;
  }
  .level3-inner {
    margin-left: 0;
    padding-top: 8px; /* 展开时二级进度条与三级列表的间隔（收起时随 max-height:0 隐藏） */
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  /* 三级容器：白色底，极浅蓝紫边框，嵌套在二级容器内 */
  .l3-block {
    border: 1px solid rgba(91,114,245,0.07);
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
    padding: 9px 10px;
  }
  .level3-item {
    display: flex;
    align-items: center;
    padding: 3px 2px;
    cursor: pointer;
    transition: background .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .level3-item:active { background: rgba(91,114,245,0.04); }
  .level3-arrow {
    width: 13px; height: 13px;
    margin-right: 7px;
    color: #5571E8;
    font-size: 13px;
    font-weight: 600;
    line-height: 1;
    flex-shrink: 0;
    transition: transform .2s ease;
  }
  .level3-item.open .level3-arrow { transform: rotate(90deg); }
  .level3-title {
    flex: 1;
    min-width: 0;
    font-size: 12.5px;
    font-weight: 600;
    color: #5571E8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .level3-right {
    display: flex;
    align-items: baseline;
    gap: 7px;
    flex-shrink: 0;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .l3-mem { color: #8A90A8; }
  .l3-pct { color: #5571E8; font-weight: 700; }

  /* ========================= 四级章节 ========================= */
  .level4-list {
    max-height: 0;
    overflow: hidden;
    transition: max-height .3s ease;
  }
  .level4-inner {
    margin: 0 0 0 12px;
    padding-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

            +   '<div class="level3-right">'
            +     '<span class="l3-mem">'+fmt(safeNum(l3.memorized))+'/'+fmt(safeNum(l3.cards))+'</span>'
            +     '<span class="l3-pct">'+safeNum(l3.done)+'%</span>'
            +   '</div>'
            + '</div>'
            + '<div class="level4-list"><div class="level4-inner">'+level4Html+'</div></div>'
            + '</div>';
        }).join('');

        return '<div class="sub-container">'
          + '<div class="sub-item" onclick="toggleLevel2(this, event)">'
          +   '<div class="sub-dot"></div>'
          +   '<div class="sub-title">'+s.name+'</div>'
          +   '<div class="sub-right">'
          +     '<span class="sub-mem"><strong>'+fmt(safeNum(s.memorized))+'</strong>/'+fmt(safeNum(s.cards))+'</span>'
          +     '<span class="sub-pct">'+safeNum(s.done)+'%</span>'
          +     '<span class="sub-arrow">›</span>'
          +   '</div>'
          + '</div>'
          + '<div class="sub-progress"><div class="sub-progress-inner" data-w="'+safeNum(s.done)+'"></div></div>'
          + '<div class="level3-list"><div class="level3-inner">'+level3Html+'</div></div>'
          + '</div>';
      }).join('');

    return ''
      + '<div class="chapter-card" data-id="'+c.id+'">'
      +   '<div class="chapter-head" onclick="toggleChapter(this.parentElement, event)">'
      +     '<div class="chapter-main">'
      +       '<div class="chapter-icon">'+icon(c.icon)+'</div>'
      +       '<div class="chapter-info">'
      +         '<div class="chapter-name">'+c.name+'</div>'
      +         '<div class="chapter-data">'
      +           '<span class="remembered">已记住 <strong>'+fmt(memorized)+'</strong></span>'
      +           '<span>/</span><span>'+fmt(cards)+' 个考点</span>'
      +           (stubborn > 0 ? '<span class="stubborn">顽固 '+stubborn+'</span>' : '')
      +         '</div>'
      +       '</div>'
      +       '<div class="chapter-right">'
      +         '<div class="chapter-percent">'+donePct+'%</div>'
      +         '<div class="arrow">›</div>'
      +       '</div>'
      +     '</div>'
      +     '<div class="chapter-progress"><div class="chapter-progress-inner" data-w="'+donePct+'"></div></div>'
      +   '</div>'
      +   '<div class="sub-list"><div class="sub-inner">'+subs+'</div></div>'
      + '</div>';
  }).join('');
  document.getElementById('chapterList').innerHTML = html;

  /* 手风琴：点击一级箭头展开二级，同时只展开一个（Q16A） */
  let openId = null;
  window.toggleChapter = function(el, e) {
    if (e) e.stopPropagation();
    const id = +el.dataset.id;
    const sub = el.querySelector('.sub-list');
    if (openId === id){
      // 关闭时同时关闭所有二、三、四级
      sub.querySelectorAll('.level3-item.open').forEach(function(li){
        li.classList.remove('open');
        const l4 = li.nextElementSibling;
        if (l4) l4.style.maxHeight = '0';
      });
      sub.querySelectorAll('.sub-item.open-level2').forEach(function(si){
        si.classList.remove('open-level2');
        const l3 = si.nextElementSibling;
        if (l3) l3.style.maxHeight = '0';
      });
      sub.style.maxHeight = '0';
      el.classList.remove('open');
      openId = null;
    } else {
      document.querySelectorAll('.chapter-card').forEach(function(c){
        c.classList.remove('open');
        c.querySelectorAll('.level3-item.open').forEach(function(li){ li.classList.remove('open'); });
        c.querySelectorAll('.sub-item.open-level2').forEach(function(si){ si.classList.remove('open-level2'); });
        c.querySelectorAll('.level3-list, .level4-list').forEach(function(l){ l.style.maxHeight = '0'; });
        const sl = c.querySelector('.sub-list');
        if (sl) sl.style.maxHeight = '0';
      });
      sub.style.maxHeight = sub.scrollHeight + 'px';
      el.classList.add('open');
      openId = id;
    }
  };

  /* 同步祖先容器高度：子级展开/收起后，外层 max-height 需要跟上 */
  function syncAncestors(el){
    let node = el.parentElement;
    while (node) {
      if ((node.classList.contains('level3-list') || node.classList.contains('level4-list') || node.classList.contains('sub-list'))
          && node.style.maxHeight && node.style.maxHeight !== 'none' && node.style.maxHeight !== '0px') {
        node.style.maxHeight = node.scrollHeight + 'px';
      }
      node = node.parentElement;
    }
  }

  /* 二级展开/折叠 */
  window.toggleLevel2 = function(item, e) {
    if (e) e.stopPropagation();
    // 找下一个 .level3-list 兄弟元素（中间可能隔着 .sub-progress）
    let list = item.nextElementSibling;
    while (list && !list.classList.contains('level3-list')) list = list.nextElementSibling;
    if (!list) return;

    const isOpen = item.classList.contains('open-level2');
    if (isOpen) {
      // 关闭所有三级项及其四级
      list.querySelectorAll('.level3-item.open').forEach(function(l3) {
        l3.classList.remove('open');
        let l4List = l3.nextElementSibling;
        while (l4List && !l4List.classList.contains('level4-list')) l4List = l4List.nextElementSibling;
        if (l4List) l4List.style.maxHeight = '0';
      });
      list.style.maxHeight = list.scrollHeight + 'px';
      list.offsetHeight;
      list.style.maxHeight = '0';
      item.classList.remove('open-level2');
      setTimeout(function(){ syncAncestors(list); }, 320);
    } else {
      list.style.maxHeight = list.scrollHeight + 'px';
      item.classList.add('open-level2');
      syncAncestors(list);
      setTimeout(function(){ syncAncestors(list); }, 320);
    }
  };

  /* 三级展开/折叠 */
  window.toggleLevel3 = function(item, e) {
    if (e) e.stopPropagation();
    // 找下一个 .level4-list 兄弟元素
    let list = item.nextElementSibling;
    while (list && !list.classList.contains('level4-list')) list = list.nextElementSibling;
    if (!list) return;

    const isOpen = item.classList.contains('open');
    if (isOpen) {
      list.style.maxHeight = list.scrollHeight + 'px';
      list.offsetHeight;
      list.style.maxHeight = '0';
      item.classList.remove('open');
      setTimeout(function(){ syncAncestors(list); }, 320);
    } else {
      list.style.maxHeight = list.scrollHeight + 'px';
      item.classList.add('open');
      syncAncestors(list);
      setTimeout(function(){ syncAncestors(list); }, 320);
    }
  };

  /* 进度条入场动画 */
  requestAnimationFrame(function(){
    setTimeout(function(){
      document.getElementById('heroFill').style.width = pct + '%';
      document.querySelectorAll('.chapter-progress-inner, .sub-progress-inner').forEach(function(el){
        el.style.width = el.dataset.w + '%';
      });
    }, 120);
  });
}

function continueStudy(){
  /* 默认进入单卡模式；右上角按钮可随时切换列表模式，数据共享 */
  window.location.href = '闪卡单卡模式.html';
}

/* ============================================================
   每日学习卡片设置弹窗（底部上滑 + 背景遮罩）
   保存逻辑与闪卡设置页一致（闪卡题库.js saveConfig）：
   今天还没开始刷 → 立即生效；已开始 → 次日生效
   ============================================================ */
var popTimer = null;

function toggleSettingsPop(e){
  if (e) e.stopPropagation();
  var sheet = document.getElementById('settingsSheet');
  if (sheet.classList.contains('show')) { closeSettingsPop(); return; }
  hidePopTip(); /* 每次打开重置提示 */
  var range = document.getElementById('popRange');
  var cfg = loadConfig();
  range.value = Math.min(Math.max(cfg.dailyCount, +range.min), +range.max);
  syncPopUI();
  document.getElementById('settingsMask').classList.add('show');
  sheet.classList.add('show');
}

function closeSettingsPop(){
  document.getElementById('settingsSheet').classList.remove('show');
  document.getElementById('settingsMask').classList.remove('show');
}

function syncPopUI(){
  var range = document.getElementById('popRange');
  var v = +range.value;
  document.getElementById('popCount').textContent = v;
  document.querySelectorAll('#settingsSheet .pop-chip').forEach(function(c){
    c.classList.toggle('on', +c.getAttribute('data-v') === v);
  });
  var pct = (v - +range.min) / (+range.max - +range.min) * 100;
  range.style.background = 'linear-gradient(to right, #5B72F5 0%, #5B72F5 ' + pct + '%, #E7EAF6 ' + pct + '%, #E7EAF6 100%)';
}

function setPopCount(v){
  var range = document.getElementById('popRange');
  range.value = Math.min(Math.max(v, +range.min), +range.max);
  syncPopUI();
}

function savePopSettings(){
  var daily = +document.getElementById('popRange').value;
  var cfg = loadConfig(); /* 保留现有题型比例，仅更新每日数量 */
  saveConfig({ dailyCount: daily, weights: cfg.weights });

  /* 生效提示：与 saveConfig 内部判定同口径 */
  var s = null;
  try {
    var raw = localStorage.getItem(FLASH_KEY);
    if (raw) s = JSON.parse(raw);
  } catch (e) {}
  var immediate = !s || s.date !== todayStr() || calcStats(s).done === 0;
  showPopTip(immediate ? 'ok' : 'next',
    immediate ? '✓ 今天还没开始刷，已按新数量立即生效'
              : '⏳ 今天已开始背诵，新数量将于明日生效');

  /* 首页「每日 N 张」标签同步（卡池不足时自动收缩） */
  var dailyEl = document.getElementById('dailyLabel');
  if (dailyEl) dailyEl.textContent = getDailyCount();

  if (popTimer) clearTimeout(popTimer);
  popTimer = setTimeout(closeSettingsPop, 1800);
}

function showPopTip(type, text){
  var tip = document.getElementById('popTip');
  tip.className = 'pop-tip ' + type;
  tip.textContent = text;
  tip.hidden = false;
}
function hidePopTip(){
  var tip = document.getElementById('popTip');
  tip.hidden = true;
  tip.className = 'pop-tip';
}

function goChapterDetail(id){
  var c = CHAPTERS.find(function(x){ return x.id === id; });
  var name = c ? c.name : '';
  window.location.href = '闪卡章节统计.html?chapter=' + encodeURIComponent(name);
}

   跳转单卡模式（仅演示：传章节名称参数，进度数据不联动）
   ============================================================ */

  window.location.href = '闪卡单卡模式.html?chapter=' + encodeURIComponent(chapterName) + '&sub=' + encodeURIComponent(subName);

function goLevel4(chapterName, subName, pointName, e) {
  if (e) e.stopPropagation();
  window.location.href = '闪卡单卡模式.html?chapter=' + encodeURIComponent(chapterName) + '&sub=' + encodeURIComponent(subName) + '&point=' + encodeURIComponent(pointName);
}
