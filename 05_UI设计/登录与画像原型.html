<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>登录与画像原型 · 流程演示</title>
<style>
/* ============================================================
   Design Token（与 05_UI设计/设计Token.md 对齐）
   ============================================================ */
:root{
  --primary: #5B72F5;
  --primary-dark: #4358D7;
  --primary-light: #EEF1FF;

  --text-primary: #202533;
  --text-secondary: #6E778B;
  --text-tertiary: #98A0B2;

  --success: #20A866;
  --success-light: #E8F8F0;
  --warning: #F28B3D;
  --warning-light: #FFF1E6;
  --danger: #EF4444;
  --danger-light: #FEECEC;

  --card-radius: 17px;
  --hero-radius: 22px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body { width: 100%; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text-primary);
  background: #EDEFF7;
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* ========================= 手机壳区 ========================= */
.main { flex: 1; min-height: 0; display: flex; align-items: stretch; }
.phone-col {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px 16px;
  background:
    radial-gradient(circle at 70% 20%, rgba(91,114,245,0.07) 0%, transparent 50%),
    #EDEFF7;
}
.phone {
  position: relative;
  flex-shrink: 0;
  width: 390px;
  height: clamp(640px, calc(100vh - 48px), 900px);
  background: #1E2130;
  border-radius: 44px;
  padding: 12px;
  box-shadow:
    0 0 0 1px rgba(30,33,48,0.12),
    0 20px 60px rgba(30,33,48,0.28),
    inset 0 0 0 2px rgba(255,255,255,0.06);
  display: flex; flex-direction: column;
}
.phone-screen {
  flex: 1; min-height: 0;
  border-radius: 33px;
  background: #FFFFFF;
  overflow: hidden;
  position: relative;
}
/* 手机状态栏 */
.phone-statusbar {
  position: absolute; top: 0; left: 0; right: 0;
  height: 34px; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
  background: linear-gradient(180deg, rgba(255,255,255,0.96) 0%, rgba(255,255,255,0.88) 55%, rgba(255,255,255,0) 100%);
  pointer-events: none;
  font-size: 13px; font-weight: 600; color: #1E2130;
}
.phone-statusbar .status-time { letter-spacing: 0.4px; }
.phone-statusbar .status-icons { display: flex; align-items: center; gap: 8px; }
.phone-statusbar .status-icons svg { width: 16px; height: 12px; color: #1E2130; display: block; }
.phone-statusbar .status-icons .wifi { transform: translateY(1px); }

/* ========================= 视图容器 ========================= */
.views { position: absolute; inset: 0; overflow: hidden; }
.view { position: absolute; inset: 0; display: none; overflow: hidden; }
.view.active { display: block; }

.page { width: 100%; height: 100%; position: relative; background: var(--bg-bottom, #F8F9FC); overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* 遮罩（用于闪屏后的首页氛围） */
.bottom-mask {
  position: absolute; left: 0; right: 0; top: 320px; bottom: 0;
  background: linear-gradient(180deg,
    rgba(248,249,252,0) 0%,
    rgba(248,249,252,0.55) 18%,
    rgba(248,249,252,0.92) 44%,
    #F8F9FC 100%);
  pointer-events: none;
}

/* ============================================================
   视图：品牌闪屏
   说明：甲方素材图为"上部留白 + 下部品牌主体"的品牌页，
         不整铺 cover（会把下部主体裁出屏），改为内容层展示。
   ============================================================ */
.splash {
  position: relative;
  background: #F8F9FC;
  display: flex; align-items: flex-end;
  overflow: hidden;
}
.splash-brand {
  width: 100%;
  padding-bottom: 40px;
  display: flex; justify-content: center;
}
.splash-brand img {
  width: 100%;
  height: auto;
  max-height: 72%;
  object-fit: contain;
  display: block;
}

/* ============================================================
   视图：首页（AI 对话）
   ============================================================ */
.home-ai {
  display: flex; flex-direction: column;
  height: 100%;
  background: #F8F9FC;
}
/* 顶部简洁品牌栏 */
.ai-top {
  padding: 34px 18px 0;
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}
.ai-logo {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  display: flex; align-items: center; justify-content: center;
  color: #fff; flex-shrink: 0;
}
.ai-logo svg { width: 19px; height: 19px; }
.ai-title { font-size: 18px; font-weight: 700; letter-spacing: .3px; }

/* 对话流 */
.chat-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 18px 8px; display: flex; flex-direction: column; gap: 14px; }
.msg { display: flex; gap: 10px; align-items: flex-start; max-width: 96%; }
.msg.assistant { align-self: flex-start; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg-avatar {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.msg.assistant .msg-avatar { background: var(--primary-light); color: var(--primary); }
.msg.user .msg-avatar { background: #DDE2F5; color: var(--primary-dark); }
.msg-bubble {
  padding: 10px 13px; border-radius: 14px;
  font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
}
.msg.assistant .msg-bubble {
  background: #fff; color: var(--text-primary);
  border: 1px solid #ECEEF7;
  border-top-left-radius: 4px;
}
.msg.user .msg-bubble {
  background: var(--primary); color: #fff;
  border-top-right-radius: 4px;
}

/* 输入区 */
.chat-input-bar {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px 16px;
  background: linear-gradient(180deg, rgba(248,249,252,0) 0%, #F8F9FC 30%);
}
.chat-input {
  flex: 1; height: 40px;
  border: 1px solid #E7EAF3; border-radius: 20px;
  background: #fff;
  padding: 0 16px; font-size: 14px;
  outline: none; color: var(--text-primary);
}
.chat-input::placeholder { color: var(--text-tertiary); }
.chat-send {
  width: 40px; height: 40px; border-radius: 50%;
  border: none; background: var(--primary); color: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.chat-send:active { transform: scale(0.94); }
.chat-send.gray { background: #D7DBEA; cursor: default; }
.chat-send svg { width: 19px; height: 19px; }

/* 状态行（提示未完善画像的弱引导） */
.profile-hint {
  margin: 0 18px 6px;
  padding: 7px 12px;
  border-radius: 10px;
  background: var(--warning-light);
  color: #C26A28;
  font-size: 12px; line-height: 1.5;
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
.profile-hint button {
  margin-left: auto;
  border: none; background: none;
  color: var(--primary-dark); font-size: 12px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
}

/* ============================================================
   弹窗：微信一键登录（带隐私协议）
   ============================================================ */
.mask {
  position: absolute; inset: 0; z-index: 300;
  background: rgba(20,24,38,0.5);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .22s ease;
}
.mask.show { opacity: 1; pointer-events: auto; }
.sheet {
  width: 100%;
  background: #fff;
  border-radius: 22px 22px 0 0;
  padding: 10px 24px 26px;
  transform: translateY(100%);
  transition: transform .25s ease;
}
.mask.show .sheet { transform: translateY(0); }
.sheet-handle { width: 42px; height: 4px; border-radius: 2px; background: #E3E6F0; margin: 0 auto 18px; }

.login-title { font-size: 19px; font-weight: 700; text-align: center; margin-bottom: 6px; }
.login-sub { font-size: 13px; color: var(--text-secondary); text-align: center; margin-bottom: 22px; }

.login-avatar {
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--primary-light);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 14px; color: var(--primary);
}
.login-avatar svg { width: 34px; height: 34px; }

.btn-phone {
  width: 100%; height: 50px;
  border: none; border-radius: 25px;
  background: linear-gradient(135deg, #09BB07, #0DAF00);
  color: #fff; font-size: 16px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  cursor: pointer; margin-bottom: 14px;
  box-shadow: 0 8px 18px rgba(9,187,7,0.22);
}
.btn-phone:active { transform: scale(0.98); }
.btn-phone svg { width: 20px; height: 20px; }
.btn-phone.disable { opacity: .5; pointer-events: none; }

.login-agree {
  display: flex; align-items: center; gap: 8px;
  justify-content: center;
  font-size: 12px; color: var(--text-tertiary); margin-bottom: 10px;
}
.login-agree button {
  border: none; background: none; color: var(--primary-dark); font-size: 12px;
  cursor: pointer; padding: 0;
}
.login-other {
  text-align: center; font-size: 13px; color: var(--text-secondary);
  margin-top: 6px;
}
.login-other a { color: var(--text-secondary); text-decoration: none; }

/* ============================================================
   弹窗：补充用户画像（轻量，两必填 + 选填）
   ============================================================ */
.profile-sheet .sheet { padding-bottom: 30px; }
.profile-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.profile-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; }
.form-row { margin-bottom: 16px; }
.form-label { font-size: 13px; color: var(--text-primary); margin-bottom: 8px; display: block; font-weight: 600; }
.form-label .req { color: var(--danger); margin-left: 2px; }
.chip-group { display: flex; flex-wrap: wrap; gap: 9px; }
.field-chip {
  padding: 8px 16px;
  border-radius: 18px;
  border: 1px solid #E5E8F2;
  background: #fff; font-size: 13px; color: var(--text-secondary);
  cursor: pointer;
  transition: all .12s ease;
}
.field-chip.on { background: var(--primary-light); border-color: var(--primary); color: var(--primary-dark); font-weight: 600; }
.field-chip.multi.on { background: var(--primary-light); border-color: var(--primary); color: var(--primary-dark); font-weight: 600; }
.field-input {
  width: 100%; height: 42px;
  border: 1px solid #E5E8F2; border-radius: 12px;
  padding: 0 14px; font-size: 14px; outline: none; color: var(--text-primary);
  background: #FBFBFE;
}
.field-input:focus { border-color: var(--primary); background: #fff; }
.btn-primary {
  width: 100%; height: 48px; border: none; border-radius: 14px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff; font-size: 15px; font-weight: 600;
  cursor: pointer; margin-top: 6px;
  box-shadow: 0 10px 22px rgba(91,114,245,0.25);
}
.btn-primary:active { transform: scale(0.98); }
.btn-primary.disable { opacity: .5; pointer-events: none; }
.profile-other { text-align: center; font-size: 12px; color: var(--text-tertiary); margin-top: 14px; }
.profile-other a { color: var(--text-tertiary); text-decoration: underline; }

/* ============================================================
   完成提示（画像已提交，回到对话）
   ============================================================ */
.done-tip {
  position: absolute; left: 50%; bottom: 120px;
  transform: translateX(-50%) translateY(10px);
  background: rgba(30,33,48,0.92); color: #fff;
  font-size: 12px; padding: 8px 16px; border-radius: 18px;
  opacity: 0; pointer-events: none;
  transition: all .25s ease;
  white-space: nowrap; z-index: 400;
}
.done-tip.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ============================================================
   VIP 福利弹窗（新用户第一次点功能触发，可关闭）
   ============================================================ */
.vip-crown-icon { font-size: 40px; text-align: center; margin-bottom: 8px; }
.vip-box-title { font-size: 19px; font-weight: 800; text-align: center; color: #4A3200; margin-bottom: 6px; }
.vip-box-sub { font-size: 13px; color: var(--text-secondary); text-align: center; margin-bottom: 16px; }
.vip-benefit-item {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--text-primary);
  padding: 8px 0;
  border-bottom: 1px dashed #F0F1F7;
}
.vip-benefit-item:last-child { border-bottom: none; }
.vip-benefit-item .ok { color: var(--success); font-weight: 700; }
.vip-actions { display: flex; gap: 10px; margin-top: 16px; }
.vip-btn {
  flex: 1; height: 46px;
  border: none; border-radius: 14px;
  font-size: 14px; font-weight: 600; cursor: pointer;
}
.vip-btn-secondary { background: #F3F4F8; color: var(--text-secondary); }
.vip-btn-primary {
  background: linear-gradient(135deg, #F5B940 0%, #FFD97A 100%);
  color: #4A3200;
  box-shadow: 0 8px 18px rgba(240,170,48,0.3);
}
.vip-btn-primary:active, .vip-btn-secondary:active { transform: scale(0.98); }

/* 小屏适配 */
@media (max-width: 360px) {
  .ai-top { padding: 30px 14px 0; }
  .chat-scroll { padding-left: 14px; padding-right: 14px; }
  .chat-input-bar { padding-left: 14px; padding-right: 14px; }
  .sheet { padding-left: 18px; padding-right: 18px; }
}
</style>
</head>

            <!-- 视图：品牌闪屏 -->
            <div class="view active" id="view-splash">
              <div class="page splash">
                <div class="splash-brand">
                  <img src="../ui切图/闪屏.png" alt="升本智答品牌" />

            <!-- 视图：首页（AI 对话） -->
            <div class="view" id="view-home">

<script>
/* ============================================================
   登录与画像原型 —— 流程演示脚本
   ============================================================ */

/* 视图切换 */
function showView(id) {
  document.querySelectorAll('.view').forEach(function(v) {
    v.classList.toggle('active', v.id === id);
  });
}

/* ---------- 新用户 VIP 福利（第一次点功能触发，可关；领取后不再弹） ---------- */
var LOGGED = false;          /* 登录态：由总壳 STATE 广播同步 */
var VIP_SHOWN = false;       /* 本次会话已弹过 */
var VIP_CLAIMED = false;     /* 已领取 */
var VIP_PENDING = null;      /* 暂不领取后要继续的动作 */

function openProfile() {
  /* 旧 VIP 福利弹窗已停用：VIP 领取统一由总壳「免费权益」层接管（归属唯一，避免双弹） */
  if (!LOGGED) { ensureLogin(openProfile); return; }
  document.getElementById('profileMask').classList.add('show');
}

/* 「暂不需要」→ 关弹窗，继续原功能 */
function skipVip() {
  document.getElementById('vipMask').classList.remove('show');
  VIP_SHOWN = true;
  var next = VIP_PENDING;
  VIP_PENDING = null;
  if (next) next();
}

/* 「立即领取」→ 跳 VIP 领取层（总壳）或独立打开 VIP 页 */
function takeVip() {
  VIP_SHOWN = true;          /* 领取过 → 本会话不再弹第二次 VIP 福利 */
  var claim = window.parent && window.parent.openVip;
  if (claim) {
    document.getElementById('vipMask').classList.remove('show');
    window.parent.openVip();
    return;
  }
  /* 独立运行时：直接打开 VIP 领取页 */
  document.getElementById('vipMask').classList.remove('show');
  window.location.href = 'VIP领取页.html';
}

/* 手机状态栏时钟（去壳后状态栏在总壳，此处保留以防独立打开） */
(function initStatusbar() {
  var t = document.getElementById('statusTime');
  if (!t) return;
  function tick() {
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    t.textContent = (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m);
  }
  tick();
  setInterval(tick, 30000);
})();

/* 流程：闪屏 → 2.5s → 首页
   在总壳 iframe 内（embedded）→ 跳过自身闪屏，直接进首页（闪屏由总壳统一控制） */
var EMBEDDED = (function() {
  try {
    if (window.parent === window.self) return false;
    /* pathname 是 URL 编码的（%E5%B0%8F...），需 decode 后才能匹配中文文件名 */
    var p;
    try { p = decodeURIComponent(window.parent.location.pathname); } catch(e2) { p = window.parent.location.pathname; }
    return /小程序总壳\.html$/.test(p);
  } catch(e) { return false; }
})();
if (EMBEDDED) {
  showView('view-home');
  /* 嵌入总壳：主动订阅状态（总壳靠 SUBREADY 回发 STATE，错过广播会拿不到登录/VIP 状态） */
  try { window.parent.postMessage({ type: 'SUBREADY' }, '*'); } catch(e) {}
} else {
  setTimeout(function() { showView('view-home'); }, 2500);
}

/* 上报总壳状态中枢（跨 tab 联动） */
function postToShell(type, data) {
  try { window.parent.postMessage({ type: type, data: data || {} }, '*'); } catch(e) {}
}
/* 接收总壳广播的最新状态 */
window.addEventListener('message', function(evt) {
  var d = evt.data;
  if (!d || !d.type) return;
  if (d.type === 'STATE') {
    var s = d.state || {};
    if (typeof s.logged === 'boolean') LOGGED = s.logged;
    if (s.vipClaimed) { VIP_CLAIMED = true; VIP_SHOWN = true; }
    return;
  }
  /* 其他 tab 转发过来的请求（我的页 → 总壳 → 本页） */
  if (d.type === 'REQ_LOGIN') { ensureLogin(); return; }
  if (d.type === 'OPEN_PROFILE') {
    openProfile();
    return;
  }
});

function ensureLogin(next) {
  if (LOGGED) { if (next) next(); return; }
  openAfterLogin = next || null;
  document.getElementById('loginMask').classList.add('show');
}

function syncLoginBtn() {
  var box = document.getElementById('agreeBox');
  var btn = document.querySelector('.btn-phone');
  btn.classList.toggle('disable', !box.checked);
}

function doLogin() {
  var box = document.getElementById('agreeBox');
  if (!box.checked) return;
  LOGGED = true;
  document.getElementById('loginMask').classList.remove('show');
  /* 上报总壳 → 广播到我的/VIP等所有 tab */
  postToShell('LOGGED', { user: { nick: '团团酱', grade: '大三', major: '计算机大类' } });
  var next = openAfterLogin;
  openAfterLogin = null;
  if (next) next();
}
/* 先进后登：暂不登录 → 关弹窗留首页，不拦截 */
function skipLogin() {
  var next = openAfterLogin;
  openAfterLogin = null;
  document.getElementById('loginMask').classList.remove('show');
  if (next) { /* 游客继续用功能（弱提示即可） */ }
}
function closeProfile() {
  document.getElementById('profileMask').classList.remove('show');
}

/* 年级/科目选择（单选） */
document.querySelectorAll('.field-chip').forEach(function(chip) {
  chip.addEventListener('click', function() {
    var group = chip.parentElement;
    group.querySelectorAll('.field-chip').forEach(function(c) { c.classList.remove('on'); });
    chip.classList.add('on');
  });
});

/* 保存画像 */
function doSaveProfile() {
  var school = document.getElementById('schoolInput').value.trim();
  var major  = document.getElementById('majorInput').value.trim();
  var grade  = document.querySelector('#gradeGroup .field-chip.on')
    ? document.querySelector('#gradeGroup .field-chip.on').getAttribute('data-v') : '';
  var subj   = document.querySelector('#subjectGroup .field-chip.on')
    ? document.querySelector('#subjectGroup .field-chip.on').getAttribute('data-v') : '计算机基础';
  closeProfile();
  showDoneTip('画像已保存 ✅');
  /* 上报总壳 → 广播到我的/VIP等所有 tab（画像同步） */
  postToShell('PROFILE', { user: { school: school, major: major, grade: grade, subject: subj } });
}
function showDoneTip(txt) {
  var tip = document.getElementById('doneTip');
  tip.textContent = txt;
  tip.classList.add('show');
  setTimeout(function() { tip.classList.remove('show'); }, 1800);
}

/* 对话：发送/回复模拟 */
function onChatKey(e) {
  if (e.key === 'Enter') sendQuote();
}
function sendQuote() {
  var input = document.getElementById('chatInput');
  var btn = document.getElementById('chatSendBtn');
  var txt = input.value.trim();
  if (!txt) return;
  appendMsg('user', txt);
  input.value = '';
  btn.classList.add('gray');
  setTimeout(function() {
    appendMsg('assistant', getSimAnswer(txt));
    btn.classList.remove('gray');
  }, 700);
}
function appendMsg(role, text) {
  var box = document.getElementById('chatScroll');
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  var avatar = role === 'assistant'
    ? '<div class="msg-avatar">AI</div>'
    : '<div class="msg-avatar">我</div>';
  div.innerHTML = avatar + '<div class="msg-bubble">' + escapeHtml(text) + '</div>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function getSimAnswer(q) {
  if (/专业|跨考/.test(q)) return '统招专升本部分专业允许跨考。计算机大类通常可跨考：软件工程、数据科学与大数据技术、人工智能、网络工程等。是否受限以当年山东招考院专业对照目录为准。\n\n你填了专业更方便我精确回答，可点上方「补全资料」。';
  if (/分数线|多少分/.test(q)) return '分数线按年检索。以 2025 年山东统招专升本为例：计算机类最低投档线约 153 分（具体以招考院公布为准）。你是哪一专业、哪一届？我按你的情况算更准。';
  return '这个问题我还在学习中。您可以在 AI 问答里补充学校 / 专业 / 年级，我答得更准。';
}
</script>
