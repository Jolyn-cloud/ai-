<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>模拟考场</title>
<style>
/* ==== Product Theme：蓝靛 #5B72F5（与题库首页统一，2026-09-02） ====
   模拟考场页：题库首页「模拟考试」入口下钻二级页
   结构：筛选 chip 行 → 试卷卡片列表（全真模拟 / 冲刺模拟 分组）
   数据：试卷进程（未做/已做+正确率），mock 演示期 */
:root{
  --primary: #5B72F5;
  --primary-dark: #4358D7;
  --primary-light: #EEF1FF;
  --brand-mid: #4358D7;
  --brand-teal: #3FA98B;
  --text-primary: #1E2130;
  --text-secondary: #6E778B;
  --text-tertiary: #98A0B2;
  --success: #20A866;
  --warning: #F28B3D;
  --danger: #EF4444;
  --card-radius: 17px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text-primary);
  background-color: #EDEFF7;
  -webkit-overflow-scrolling: touch;
}
* { scrollbar-width: none; }                          /* Firefox */
*::-webkit-scrollbar { display: none; width: 0; height: 0; } /* Chrome/Safari */

/* ===== 筛选 chip 行（标题/退出在小程序栏 appbar） ===== */
.filter-row {
  display: flex; gap: 8px;
  padding: 16px 16px 8px;
  position: relative; z-index: 4;
}
.chip {
  flex-shrink: 0;
  padding: 7px 14px;
  border-radius: 999px;
  background: #fff;
  border: 1px solid #E5E8F0;
  font-size: 12.5px; font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex; align-items: center; gap: 5px;
  transition: all .15s ease;
}
.chip:active { transform: scale(.96); }
.chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.chip .chip-count { font-size: 11px; opacity: .8; }

/* ===== 试卷列表（唯一滚动容器） ===== */
.scroll-area { padding: 4px 16px 32px; }
.paper-group { margin-top: 10px; }
.group-head {
  font-size: 12px; font-weight: 700; color: var(--text-secondary);
  display: flex; align-items: center; gap: 6px;
  margin: 14px 2px 10px;
}
.group-head::before {
  content: ''; width: 3px; height: 12px; border-radius: 2px;
  background: linear-gradient(180deg, var(--primary), var(--brand-teal));
}
.paper-group:first-of-type .group-head { margin-top: 0; }
.paper-list { display: flex; flex-direction: column; gap: 10px; }

/* 试卷卡片 */
.paper-card {
  background: #fff;
  border-radius: 15px 13px 17px 12px;
  padding: 13px 14px;
  box-shadow: 0 1px 2px rgba(38,48,96,.04), 0 6px 16px rgba(91,114,245,.06);
  cursor: pointer;
  border: none; text-align: left; width: 100%;
  display: flex; gap: 12px; align-items: center;
  transition: transform .12s ease, box-shadow .12s ease;
}
.paper-card:active { transform: scale(.97); box-shadow: 0 1px 2px rgba(38,48,96,.04); }
.paper-icon {
  width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
}
.paper-icon.exam { background: linear-gradient(135deg, #5B72F5, #4358D7); }
.paper-icon.sprint { background: linear-gradient(135deg, #722ED1, #9B6BD9); }
.paper-icon svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2; }
.paper-info { flex: 1; min-width: 0; }
.paper-name {
  font-size: 14px; font-weight: 700; color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.paper-name .paper-no { color: #B98A00; }
.paper-meta {
  margin-top: 5px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: 11.5px; color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
}
.paper-meta .pm { display: inline-flex; align-items: center; gap: 3px; }
.paper-meta .pm svg { width: 12px; height: 12px; }
.paper-right { display: flex; align-items: center; flex-shrink: 0; }
.paper-status { font-size: 11px; font-weight: 600; }
.paper-status.empty { color: var(--text-tertiary); }
.paper-status.done { color: var(--success); }
.paper-status.wrong { color: var(--warning); }
.paper-arrow { color: #c3c9d5; font-size: 15px; line-height: 1; margin-left: 6px; }

/* 试卷标题里的「2026届」徽标 */
.paper-badge {
  display: inline-block; font-size: 10px; font-weight: 700;
  padding: 1px 6px; border-radius: 5px; margin-right: 6px; vertical-align: 1px;
}
.paper-badge.exam { background: var(--primary-light); color: var(--primary-dark); }
.paper-badge.sprint { background: #F9F0FF; color: #722ED1; }

/* ===== Toast ===== */
.toast {
  position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%);
  background: rgba(30,33,48,.92); color: #fff;
  padding: 9px 18px; border-radius: 22px; font-size: 13px;
  opacity: 0; transition: opacity .25s ease; z-index: 999;
  pointer-events: none; white-space: nowrap;
}
</style>
</head>
<body>

<div class="filter-row">
  <button class="chip active" data-filter="all" onclick="setFilter('all')">全部</button>
  <button class="chip" data-filter="todo" onclick="setFilter('todo')">
    只看未做 <span class="chip-count" id="cntTodo"></span>
  </button>
  <button class="chip" data-filter="wrong" onclick="setFilter('wrong')">
    只看错题 <span class="chip-count" id="cntWrong"></span>
  </button>
</div>

<div class="scroll-area">
  <div id="paperGroups"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   模拟考场 mock 数据（演示期；v5.0 接真实模拟考卷编排）
   字段口径：
     total   卷面题数
     minutes 限时分钟
     fullScore 卷面满分（山东专升本计算机卷 150）
     done    已做次数（>0 = 做过本卷）
     right   最近一次答对题数
     wrong   最近一次答错题数
     rate    正确率 = right/done 卷内百分比化（演示按已做一次简化）
   ============================================================ */
var GROUPS = [
  { key:'exam',   name:'全真模拟', iconClass:'exam' },
  { key:'sprint', name:'冲刺模拟', iconClass:'sprint' }
];
var PAPERS = [
  { id:'exam1', group:'exam',   no:'卷 01', name:'2026 届全真模拟卷一',  total:80, minutes:100, fullScore:150, done:0,  right:0,  wrong:0,  rate:null },
  { id:'exam2', group:'exam',   no:'卷 02', name:'2026 届全真模拟卷二',  total:80, minutes:100, fullScore:150, done:1,  right:56, wrong:24, rate:70 },
  { id:'exam3', group:'exam',   no:'卷 03', name:'2026 届全真模拟卷三',  total:80, minutes:100, fullScore:150, done:0,  right:0,  wrong:0,  rate:null },
  { id:'sprint1', group:'sprint', no:'卷 01', name:'冲刺模拟卷一', total:40, minutes:45,  fullScore:150, done:1,  right:30, wrong:10, rate:75 },
  { id:'sprint2', group:'sprint', no:'卷 02', name:'冲刺模拟卷二', total:40, minutes:45,  fullScore:150, done:0,  right:0,  wrong:0,  rate:null }
];

var currentFilter = 'all';

/* ===== 渲染 ===== */
function statusHtml(p) {
  if (!p.done || p.right === 0) return '<span class="paper-status empty">未开始</span>';
  var cls = p.rate !== null && p.rate < 60 ? 'wrong' : 'done';
  return '<span class="paper-status ' + cls + '">已做 ' + p.right + '/' + p.total + ' · 正确 ' + p.rate + '%</span>';
}
function metaHtml(p) {
  return '<div class="paper-meta">'
    + '<span class="pm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>' + p.total + '题</span>'
    + '<span class="pm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>' + p.minutes + '分钟</span>'
    + '<span class="pm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"/></svg>满分 ' + p.fullScore + '</span>'
    + '</div>';
}
function render() {
  var box = document.getElementById('paperGroups');
  var html = '';
  GROUPS.forEach(function(g) {
    var list = PAPERS.filter(function(p) {
      if (g.key !== p.group) return false;
      if (currentFilter === 'todo' && (p.done > 0)) return false;
      if (currentFilter === 'wrong' && !(p.done > 0 && p.wrong > 0)) return false;
      return true;
    });
    if (list.length === 0) return;
    html += '<div class="paper-group"><div class="group-head">' + g.name + '</div><div class="paper-list">';
    list.forEach(function(p) {
      html += '<button class="paper-card" onclick="startPaper(\'' + p.id + '\')">'
        + '<div class="paper-icon ' + g.iconClass + '"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg></div>'
        + '<div class="paper-info">'
        +   '<div class="paper-name"><span class="paper-badge ' + g.iconClass + '">' + (g.key === 'exam' ? '全真' : '冲刺') + '</span>' + p.no + ' · ' + p.name + '</div>'
        +   metaHtml(p)
        + '</div>'
        + '<div class="paper-right">' + statusHtml(p) + '<span class="paper-arrow">▸</span></div>'
        + '</button>';
    });
    html += '</div></div>';
  });
  box.innerHTML = html;
  updateChipCounts();
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.chip').forEach(function(c) {
    c.classList.toggle('active', c.dataset.filter === f);
  });
  render();
}
function updateChipCounts() {
  var todo = 0, wrong = 0;
  PAPERS.forEach(function(p) {
    if (p.done === 0) todo++;
    if (p.done > 0 && p.wrong > 0) wrong++;
  });
  document.getElementById('cntTodo').textContent = todo ? '(' + todo + ')' : '';
  document.getElementById('cntWrong').textContent = wrong ? '(' + wrong + ')' : '';
}

/* ===== 进入做题页 =====
   向总壳请求打开做题层，entry=exam，附带卷 id/名字/限时/满分
   总壳 openPractice 接 entry；v5.0 接数据层时按 paperId 取真实考卷题集 */
function startPaper(pid) {
  var p = PAPERS.filter(function(x) { return x.id === pid; })[0];
  if (!p) return;
  try {
    window.parent.postMessage({ type:'REQ_PRACTICE', data:{
      entry:'exam', paperId:p.id, name:p.no + ' · ' + p.name,
      minutes:p.minutes, fullScore:p.fullScore, level:'paper'
    } }, '*');
  } catch(e) {
    showToast('请从总壳进入，开始模拟考试');
  }
}

/* ===== 返回：通知题库首页收起二级层 ===== */
function goBack() {
  try {
    window.parent.postMessage({ type:'CLOSE_CHAPTER' }, '*');
  } catch(e) {
    showToast('请从总壳返回');
  }
}

/* ===== Toast ===== */
var toastTimer = null;
function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.style.opacity = 0; }, 1500);
}

render();
</script>
</body>
</html>
