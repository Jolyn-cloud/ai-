<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>题库 · 占位</title>
<style>
:root{
  --primary: #5B72F5;
  --primary-dark: #4358D7;
  --primary-light: #EEF1FF;
  --text-primary: #202533;
  --text-secondary: #6E778B;
  --text-tertiary: #98A0B2;
  --card-radius: 17px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text-primary);
  background: #F8F9FC;
  -webkit-overflow-scrolling: touch;
}
.content { max-width: 430px; margin: 0 auto; padding: 22px 18px 30px; }

.page-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.page-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; }

/* 顶部统计卡 */
.stat-card {
  background: linear-gradient(135deg, #5572F6 0%, #596CE8 100%);
  border-radius: var(--hero-radius, 22px);
  padding: 18px 20px;
  color: #fff;
  margin-bottom: 18px;
  box-shadow: 0 14px 32px rgba(76,99,221,0.25);
}
.stat-card .stat-row { display: flex; justify-content: space-between; align-items: flex-end; }
.stat-card .stat-label { font-size: 12px; opacity: .85; margin-bottom: 6px; }
.stat-card .stat-num { font-size: 30px; font-weight: 700; line-height: 1; }
.stat-card .stat-extra { display: flex; gap: 18px; margin-top: 14px; }
.stat-card .stat-extra div { font-size: 12px; opacity: .9; }

/* 功能区 grid */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.grid-item {
  background: rgba(255,255,255,0.92);
  border-radius: var(--card-radius);
  padding: 16px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  box-shadow: 0 5px 18px rgba(54,66,108,0.055);
  cursor: pointer;
  border: none;
}
.grid-item .icon {
  width: 42px; height: 42px; border-radius: 13px;
  background: var(--primary-light);
  display: flex; align-items: center; justify-content: center;
  color: var(--primary);
}
.grid-item .icon svg { width: 22px; height: 22px; }
.grid-item .label { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.grid-item .sub { font-size: 11px; color: var(--text-tertiary); }
.grid-item:active { transform: scale(0.97); }

/* 区块标题 */
.section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.section-title::before { content: ''; width: 4px; height: 16px; border-radius: 2px; background: var(--primary); }

/* 错题/收藏列表 */
.list-card {
  background: #fff;
  border-radius: var(--card-radius);
  padding: 4px 16px;
  box-shadow: 0 5px 18px rgba(54,66,108,0.055);
  margin-bottom: 14px;
}
.list-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid #F1F3F9;
  cursor: pointer;
}
.list-row:last-child { border-bottom: none; }
.list-row .txt { font-size: 14px; font-weight: 600; }
.list-row .meta { font-size: 12px; color: var(--text-tertiary); margin-top: 3px; }
.list-row .count { font-size: 13px; color: var(--primary); font-weight: 700; }
.list-row .arrow { color: #C6CADE; }

/* 占位提示 */
.placeholder {
  margin-top: 8px;
  padding: 14px 16px;
  border-radius: 14px;
  background: var(--primary-light);
  color: var(--primary-dark);
  font-size: 13px;
  line-height: 1.7;
}
</style>
</head>
<body>
<div class="content">

  <div class="page-title">题库</div>
  <div class="page-sub">按章节刷题 · 沉淀数据</div>

  <!-- 刷题数据统计 -->
  <div class="stat-card">
    <div class="stat-row">
      <div>
        <div class="stat-label">今日刷题</div>
        <div class="stat-num">0</div>
      </div>
      <div>
        <div class="stat-label">累计正确率</div>
        <div class="stat-num">--%</div>
      </div>
    </div>
    <div class="stat-extra">
      <div>📅 已连续 <b>0</b> 天</div>
      <div>🏆 本周 <b>0</b> 题</div>
    </div>
  </div>

  <!-- 刷题模式（4宫格） -->
  <div class="grid">
    <button class="grid-item">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
      <div class="label">章节刷题</div>
      <div class="sub">按教材章节</div>
    </button>
    <button class="grid-item">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
      <div class="label">每日一练</div>
      <div class="sub">10题/天 打卡</div>
    </button>
    <button class="grid-item">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
      <div class="label">历年真题</div>
      <div class="sub">计时模考</div>
    </button>
    <button class="grid-item">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 12h6"/><path d="M9 16h4"/><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/></svg></div>
      <div class="label">模拟考试</div>
      <div class="sub">全真模拟</div>
    </button>
  </div>

  <!-- 错题/收藏 -->
  <div class="section-title">我的沉淀</div>
  <div class="list-card">
    <div class="list-row">
      <div>
        <div class="txt">全部错题</div>
        <div class="meta">自动收录 + 手动录入</div>
      </div>
      <span class="count">0</span>
      <span class="arrow">›</span>
    </div>
    <div class="list-row">
      <div>
        <div class="txt">收藏本</div>
        <div class="meta">收藏的题目</div>
      </div>
      <span class="count">0</span>
      <span class="arrow">›</span>
    </div>
    <div class="list-row">
      <div>
        <div class="txt">笔记本</div>
        <div class="meta">题目/章节/自由笔记</div>
      </div>
      <span class="arrow">›</span>
    </div>
  </div>

  <!-- 占位说明 -->
  <div class="placeholder">
    ⏳ 题库模块为首期占位。<br />
    章节刷题 / 每日一练 / 真题 / 错题 / 收藏 / 笔记将在二期接入计算机核心考点数据（499 个考点已就绪）。
  </div>

</div>
</body>
</html>
