<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>错题本</title>
<style>
/* ==== Product Theme：蓝靛 #5B72F5（与题库首页统一） ====
   错题本页：题库首页「错题本」入口下钻二级页
   结构：总览卡（攻克率/待攻克/顽固/全部 + 开始重练）→ 筛选 chip → 模块→章节→题目三级列表
   数据：错题进程（待攻克/顽固/已攻克 + 错因标签），mock 演示期
   交互：开始重练/集中攻克/再练 → 做题页(entry=wrong)；详情 → 做题页定位该题 */
:root{
  --primary: #5B72F5;
  --primary-dark: #4358D7;
  --primary-light: #EEF1FF;
  --brand-mid: #4358D7;
  --brand-teal: #3FA98B;
  --accent-grad-end: #62CFA9;
  --text-primary: #1E2130;
  --text-secondary: #6E778B;
  --text-tertiary: #98A0B2;
  --success: #20A866;
  --warning: #F28B3D;
  --danger: #EF4444;
  --card-radius: 17px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
* { scrollbar-width: none; }
*::-webkit-scrollbar { display: none; width: 0; height: 0; }
html, body { width: 100%; height: 100%; }
/* 页面 x 轴锁定：整体不可横向移动，仅筛选行内部左右滑动 */
html, body { overflow-x: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text-primary);
  background-color: #EDEFF7;
  -webkit-overflow-scrolling: touch;
}

/* ===== 总览卡 ===== */
.overview {
  margin: 12px 16px 0;
  border-radius: 18px 15px 20px 14px;
  background: linear-gradient(135deg, #5B72F5 0%, #764BA2 100%);
  color: #fff;
  padding: 16px;
  box-shadow: 0 10px 24px rgba(91,114,245,.24);
}
/* 今日待攻克卡（PM 2026-09-05：从「今日攻克」改为「今日待攻克」；删除「重点推荐」红字标签）：学习行动卡，保持紫蓝渐变视觉语言 */
.today-head { display: flex; align-items: center; justify-content: space-between; }
.today-title { font-size: 15px; font-weight: 700; }
.today-all { font-size: 11.5px; opacity: .78; cursor: pointer; padding: 4px 6px; margin: -4px -6px; }
.today-all:active { opacity: 1; }
.today-body { margin: 14px 0 16px; }
.today-weak-label { font-size: 11px; opacity: .82; margin-bottom: 8px; }
.today-weak-name {
  display: inline-block; font-size: 16px; font-weight: 700;
  padding: 7px 14px; border-radius: 10px;
  background: rgba(255,255,255,.14); box-shadow: 0 0 18px rgba(160,200,255,.18);
}
.today-reason { font-size: 12px; opacity: .9; margin-top: 10px; }
.today-reason b { color: #FFD9A8; font-weight: 600; }
.today-good { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
.today-good-sub { font-size: 12px; opacity: .82; }
.practice-btn {
  width: 100%; height: 42px; border: none; border-radius: 21px;
  background: #fff; color: var(--primary); font-size: 15px; font-weight: 700;
  cursor: pointer; transition: transform .12s ease;
}
.practice-btn:active { transform: scale(.97); }
/* ===== 筛选 chip 行（横向滑动，页面 x 锁定） ===== */
.filter-row {
  display: flex; gap: 8px;
  padding: 12px 20px 4px;   /* PM 2026-09-02：左右 16→20px，与上下卡片对齐且呼吸感更强 */
  position: relative; z-index: 4;
  overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  scroll-snap-type: x proximity;
}
.filter-row::-webkit-scrollbar { display: none; width: 0; height: 0; }
.filter-row .chip { scroll-snap-align: start; }
.chip {
  flex-shrink: 0;
  padding: 7px 14px;
  border-radius: 999px;
  background: #fff;
  border: 1px solid #E5E8F0;
  font-size: 12.5px; font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex; align-items: center; gap: 5px;
  transition: all .15s ease;
}
.chip:active { transform: scale(.96); }
.chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.chip .chip-count { font-size: 11px; opacity: .8; }

/* ===== 列表（唯一滚动容器） ===== */
.scroll-area { padding: 2px 16px 32px; }
.module { margin-top: 10px; }
.module-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 2px 8px; cursor: pointer;
}
.module-head:active { opacity: .7; }
.module-name { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
.module-name .caret { font-size: 10px; color: var(--text-tertiary); transition: transform .18s ease; }
.module.open .module-name .caret { transform: rotate(90deg); }
.module-meta { font-size: 11px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
.module-meta .rate-low { color: var(--danger); font-weight: 600; }

.chapter {
  margin: 0 0 0 8px; padding-left: 11px;
  border-left: 2px solid #E5E8F0;
}
.chapter-head {
  display: flex; justify-content: flex-start; align-items: center;
  padding: 7px 2px; cursor: pointer; font-size: 12.5px;
  color: var(--text-secondary); font-weight: 600;
}
.chapter-head.weak { color: var(--danger); font-weight: 700; }
.chapter-head:active { opacity: .7; }
.q-list { display: none; }
.chapter.open .q-list { display: block; }

/* ===== 1/2/3 级树（对齐收藏本样式，PM 2026-09-07）=====
   1级：模块标题行（16px/800）；2级：白卡行（圆角阴影，14px/600）；3级：考点行（缩进左边线，13px/500）
   meta：1/2级「n道 顽固n个」(=其下顽固3级个数)；3级「n道 顽固」(布尔，仅红色标签) */
.wt-l1 { margin-bottom: 2px; }
.wt-l2-list { display: none; }
.wt-l1.open > .wt-l2-list { display: block; }
.wt-l1-head {
  display: flex; align-items: center; gap: 8px;
  padding: 16px 4px 6px;
  cursor: pointer;
}
.wt-l1-head:active { opacity: .6; }
.wt-l1-head .wt-name { font-size: 16px; font-weight: 800; color: var(--text-primary); }
.wt-l1-head .wt-stub-tag { margin-left: auto; }
.wt-l1-head:not(:has(.wt-stub-tag)) .wt-l1-arrow { margin-left: auto; }
.wt-l1-arrow { font-size: 17px; color: var(--text-tertiary); line-height: 1; transition: transform .18s ease; flex-shrink: 0; }
.wt-l1.open .wt-l1-arrow { transform: rotate(90deg); }
/* 2级：白卡圆角阴影行（与收藏本 l2-row/l2-group 一致） */
.wt-l2-grp { margin: 6px 0; }
.wt-l2 {
  display: flex; align-items: center; gap: 8px;
  background: #fff; border-radius: 12px;
  padding: 12px 14px;
  box-shadow: 0 1px 2px rgba(38,48,96,.04), 0 2px 6px rgba(91,114,245,.05);
}
.wt-l2:active { transform: scale(.995); }
.wt-l2 .wt-name { font-size: 14px; font-weight: 600; color: var(--text-primary); cursor: pointer; }
.wt-l2 .wt-stub-tag { margin-left: auto; }   /* 有顽固时：标签靠右，toggle 紧跟其右 */
.wt-l2:not(:has(.wt-stub-tag)) .wt-l2-toggle { margin-left: auto; }   /* 无顽固时：toggle 靠右 */
.wt-l2-toggle {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--primary);
  border-radius: 6px; cursor: pointer; flex-shrink: 0;
  transition: background .12s ease;
}
.wt-l2-toggle:active { background: var(--primary-light); }
.wt-l2-toggle .caret { transition: transform .2s ease; display: inline-block; }
.wt-l2-grp.open .wt-l2-toggle .caret { transform: rotate(90deg); }
.wt-l3-list { display: none; padding: 2px 0 6px 18px; }
.wt-l2-grp.open .wt-l3-list { display: block; }
/* 3级：缩进左边线，无竖线带卡片；顽固仅标签红 */
.wt-l3 {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px 10px 8px;
  cursor: pointer;
  border-left: 2px solid #EEF0F6;
  margin-left: 4px;
  transition: background .12s ease;
}
.wt-l3:active { background: #F5F6FA; }
.wt-l3-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-tertiary); flex-shrink: 0; }
.wt-l3.stubborn .wt-l3-dot { background: var(--danger); }
.wt-l3-name { font-size: 13px; font-weight: 500; color: var(--text-secondary); }
.wt-l3.stubborn .wt-l3-name { color: var(--danger); }
.wt-l3 .wt-l3-stub { margin-left: auto; }
/* 顽固标签（3级布尔，红色小标签） */
.wt-l3-stub {
  color: var(--danger); font-weight: 700; font-size: 10px;
  background: #FFF1F0; padding: 1px 6px; border-radius: 4px; flex-shrink: 0;
}
/* 1/2级顽固标签（红底圆角，带数字「顽固 n」，n=其下顽固3级个数） */
.wt-stub-tag {
  color: var(--danger); font-weight: 700; font-size: 10px;
  background: #FFF1F0; padding: 1px 6px; border-radius: 4px; flex-shrink: 0;
}
/* meta：各级通用（n道 顽固n个 / n道 顽固） */
.wt-meta {
  font-size: 11px; color: var(--text-tertiary); font-weight: 500;
  font-variant-numeric: tabular-nums; white-space: nowrap; flex-shrink: 0;
}
.wt-card-list { padding: 2px 0 6px 18px; display: flex; flex-direction: column; gap: 8px; }


/* 题目卡 */
.q-card {
  background: #fff;
  border-radius: 13px 11px 15px 10px;
  padding: 12px;
  margin: 8px 0 9px;
  box-shadow: 0 1px 2px rgba(38,48,96,.04), 0 5px 14px rgba(91,114,245,.06);
}
.q-card.stubborn { box-shadow: 0 0 0 1px #FECACA, 0 5px 14px rgba(91,114,245,.06); }
/* 标题行：左=三级标题（章节名）/ 右=错误类型+错次 */
.q-head {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  margin-bottom: 6px;
}
.q-head .q-head-tags {
  display: flex; align-items: center; gap: 5px;
  font-size: 10.5px; color: var(--text-tertiary);
}
.q-path { font-size: 10.5px; color: var(--primary); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-title { font-size: 13px; color: var(--text-primary); line-height: 1.45; margin-bottom: 7px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.q-meta { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--text-tertiary); margin-bottom: 9px; flex-wrap: wrap; }
.q-tag { padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
.q-tag.stubborn { background: #FFF1F0; color: #EF4444; }
.q-tag.confusion { background: #E8F3FF; color: #2F6FED; }
.q-tag.memory { background: #F0FAF5; color: #20A866; }
.q-tag.operation { background: #FFF4E5; color: #F28B3D; }
.q-tag.misread { background: #FFF7E6; color: #B66B0A; }
.q-tag.blind { background: #F3F0FF; color: #7C6BD9; }
.q-btns { display: flex; gap: 8px; }
.q-btn {
  flex: 1; height: 32px;
  border: none; border-radius: 16px;
  font-size: 12.5px; font-weight: 600; cursor: pointer;
  transition: transform .12s ease;
}
.q-btn:active { transform: scale(.96); }
.q-btn.primary { background: linear-gradient(100deg, #7169ED, #62CFA9); color: #fff; }
.q-btn.ghost { background: #F5F6FA; color: var(--text-primary); border: 1px solid #E5E8F0; }
.q-btn.detail { flex: 0 0 58px; }

.empty {
  padding: 48px 20px; text-align: center; color: var(--text-tertiary); font-size: 13px;
}

/* ===== Toast ===== */
.toast {
  position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%);
  background: rgba(30,33,48,.92); color: #fff;
  padding: 9px 18px; border-radius: 22px; font-size: 13px;
  opacity: 0; transition: opacity .25s ease; z-index: 999;
  pointer-events: none; white-space: nowrap;
}

/* ===== 拍照录入入口按钮（右下角悬浮球，主题色 + 线性相机图标，~18px 边距） ===== */
.camera-fab {
  position: fixed; right: 18px; bottom: 18px; z-index: 96;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--primary);
  color: #fff;
  box-shadow: 0 6px 16px rgba(91,114,245,.38);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; border: none; outline: none;
  transition: transform .15s ease;
}
.camera-fab svg { width: 23px; height: 23px; }
.camera-fab:active { transform: scale(.92); }

/* ===== 上传题卡片（图片占位 / 拍照标签） ===== */
.q-img-thumb {
  margin: 4px 0 8px; height: 108px;
  border-radius: 12px; border: 1.5px dashed #C7CEE4;
  background: #F4F6FD;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 12px; color: var(--text-tertiary); gap: 3px;
}
.q-img-thumb span { font-size: 26px; }
.q-img-thumb em { font-style: normal; font-size: 11px; opacity: .75; }
.q-tag.upload { background: #E9F7F3; color: var(--brand-teal); }
/* 上传题结构化 tag（题型/考点） */
.q-tag.type-tag { background: #EEF1FE; color: var(--primary); }
.q-tag.concept-tag { background: #F3F0FF; color: #7C6BD9; }
.q-tag.img-tag { background: #F3F0FF; color: #7C6BD9; cursor: pointer; }
.q-orig-link { font-size: 11px; color: var(--primary); margin-top: 4px; cursor: pointer; }
.q-path-sub { color: var(--text-tertiary); font-weight: 400; }

/* ===== 拍照录入 mask（全屏取景） ===== */
.cam-mask {
  position: fixed; inset: 0; z-index: 1000;
  background: #000;
  display: flex; flex-direction: column;
  color: #fff;
}
.cam-topbar {
  height: 48px; flex-shrink: 0;
  display: flex; align-items: center;
  padding: 0 10px; padding-top: env(safe-area-inset-top);
  font-size: 15px; font-weight: 600;
}
.cam-close { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; padding: 8px 10px; }
.cam-viewport {
  flex: 1; position: relative; overflow: hidden;
  background:
    radial-gradient(circle at center, rgba(255,255,255,.08) 0%, transparent 60%),
    linear-gradient(160deg, #1a2030 0%, #2a3450 55%, #1c2438 100%);
}
.cam-hint {
  position: absolute; left: 0; right: 0; top: 24px; text-align: center;
  opacity: .8; font-weight: 500; font-size: 12.5px;
  letter-spacing: .5px; z-index: 99;
}
.cam-frame {
  position: absolute; left: 50%; top: 46%;
  width: 76%; aspect-ratio: 3 / 4;
  transform: translate(-50%, -50%);
  border: 2px solid rgba(255,255,255,.95);
  border-radius: 14px;
  box-shadow: 0 0 0 999px rgba(0,0,0,.55);
}
.cam-frame::before, .cam-frame::after {
  content: ''; position: absolute; width: 26px; height: 26px;
  border-color: var(--primary); border-style: solid;
}
.cam-frame::before { top: -2px; left: -2px; border-width: 3px 0 0 3px; border-radius: 12px 0 0 0; }
.cam-frame::after { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-radius: 0 0 12px 0; }
.cam-guide {
  position: absolute; left: 0; right: 0; top: 74%; text-align: center;
  font-size: 12.5px; color: rgba(255,255,255,.75); letter-spacing: .5px;
}
.cam-shade { position: absolute; inset: 0; background: rgba(2,6,18,.5); z-index: 98; pointer-events: none; }

.cam-bottombar {
  flex-shrink: 0; padding: 8px 24px 0; padding-bottom: env(safe-area-inset-bottom);
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
/* 第一层：记笔记 / AI搜题 / 录错题 */
.cam-actions { display: flex; gap: 10px; justify-content: center; }
.cam-action {
  display: flex; align-items: center; gap: 5px;
  padding: 8px 16px; border-radius: 999px;
  background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.18);
  color: #fff; font-size: 12.5px; font-weight: 500; cursor: pointer;
}
.cam-action:active { transform: scale(.96); opacity: .85; }
.cam-action svg { width: 15px; height: 15px; }
/* 第二层：相册录入 / 拍照 / 手电筒 */
.cam-tools { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 320px; }
.cam-side {
  width: 60px; display: flex; flex-direction: column; gap: 5px; align-items: center;
  background: none; border: none; cursor: pointer;
  color: rgba(255,255,255,.88); font-size: 11px;
}
.cam-side svg { width: 24px; height: 24px; }
.cam-side:active { opacity: .7; }
.cam-torch { color: rgba(255,255,255,.88); }
.cam-torch.active { color: #FFD666; }
.cam-shutter {
  width: 66px; height: 66px; border-radius: 50%;
  background: #fff; border: 4px solid rgba(255,255,255,.4);
  cursor: pointer; position: relative; flex-shrink: 0;
}
.cam-shutter:active { transform: scale(.94); }

/* ===== OCR 动画 ===== */
.cam-ocr {
  position: absolute; inset: 0; z-index: 1001;
  background: rgba(2,6,18,.82);
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  color: #fff;
}
.cam-ocr.on { display: flex; }
.ocr-ring {
  width: 56px; height: 56px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,.18);
  border-top-color: var(--primary);
  animation: ocrspin 1s linear infinite;
}
@keyframes ocrspin { to { transform: rotate(360deg); } }
.ocr-text { font-size: 14px; opacity: .85; letter-spacing: 1px; }

/* ===== AI 识别结果确认页（结构化，2026-09-03） ===== */
.cam-result {
  position: absolute; inset: 0; z-index: 1002;
  background: #F3F5FB; color: var(--text-primary);
  display: none; flex-direction: column;
}
.cam-result.on { display: flex; }
.result-head {
  height: 56px; flex-shrink: 0; padding: 0 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.result-head .tt { font-size: 16px; font-weight: 700; }
.result-head .rbtn { background:none; border:none; font-size:15px; cursor:pointer; color: var(--text-secondary); }
/* 处于总壳演示时，页内自绘页头交给 appbar 统一承担（独立调试本文件仍保留兜底） */
body.has-appbar .result-head { display: none; }
body.has-appbar .result-body { padding-top: 12px; }
.result-body { flex: 1; overflow-y: auto; padding: 4px 16px 16px; }

.ai-status {
  text-align: center; font-size: 12px; color: var(--text-tertiary);
  padding: 8px 0 10px;
}
.rsc-card {
  background: #fff; border-radius: 14px; padding: 14px;
  margin-bottom: 12px;
  box-shadow: 0 1px 3px rgba(70,90,160,.06);
}
.rsc-img {
  height: 150px; border-radius: 10px; margin-bottom: 8px;
  background: repeating-linear-gradient(45deg, #E9ECF6 0 10px, #F3F5FB 10px 20px);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; color: #B8BEDA;
}
.rsc-img-note { font-size: 11.5px; color: var(--text-tertiary); display: flex; justify-content: space-between; align-items: center; }
.rsc-view-orig { color: var(--primary); font-weight: 600; cursor: pointer; }
.rsc-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.rsc-card-title { font-size: 13px; font-weight: 700; color: var(--text-primary); }
.rsc-ai-badge { font-size: 10.5px; font-weight: 600; color: var(--primary); background: rgba(99,131,246,.1); padding: 3px 8px; border-radius: 999px; }
.rsc-edit-btn { background: none; border: none; font-size: 12.5px; color: var(--primary); font-weight: 600; cursor: pointer; padding: 2px 6px; }
.rsc-ocr-view { font-size: 13.5px; line-height: 1.65; color: var(--text-primary); white-space: pre-wrap; word-break: break-word; min-height: 40px; }
.rsc-ocr-edit { width: 100%; min-height: 96px; resize: vertical; border: 1.5px solid var(--primary); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; line-height: 1.65; font-family: inherit; background: #fff; color: var(--text-primary); outline: none; box-sizing: border-box; }
.rsc-ocr-fail-hint { font-size: 11px; color: #E58A4D; margin-top: 6px; }
.rsc-tags { display: flex; flex-direction: column; gap: 10px; }
.rsc-tag-row { display: flex; align-items: center; gap: 10px; }
.rsc-tag-label { flex-shrink: 0; width: 44px; font-size: 12px; font-weight: 600; color: var(--text-tertiary); }

/* ===== 「我的上传」单点数据源（与拍照搜题页错题录入共用 zsb_wrong_uploads_v1）
   localStorage 空 → seed 预设 U01/U02；非空 → 全量以 localStorage 为准（错题本保存也写回此 key） */
(function initUpLoads() {
  var KEY = 'zsb_wrong_uploads_v1';
  var seed = [
    { qid:'U01', source:'upload', mode:'text', path:'我的上传 → 拍照录入', type:'single', tag:'memory',
      title:'【草稿】下列中断类型中，属于可屏蔽中断的是（ ）。',
      ocr: '下列中断类型中，属于可屏蔽中断的是（ ）。',
      concept:'中断系统', createdAt:'2026-08-28 21:10', wrongCount:1, status:'pending', stubborn:false },
    { qid:'U02', source:'upload', mode:'image', path:'我的上传 → 拍照录入', type:'image', tag:'confusion',
      title:'', img:'', ocr:'', concept:'待归类', createdAt:'2026-08-29 09:40', wrongCount:1, status:'pending', stubborn:false }
  ];
  var loaded = null;
  try { loaded = JSON.parse(localStorage.getItem(KEY) || ''); } catch(e) {}
  if (!loaded || !loaded.length) {
    WRONG_DATA.uploads = seed.slice();
    try { localStorage.setItem(KEY, JSON.stringify(WRONG_DATA.uploads)); } catch(e) {}
  } else {

})();

var TAG_NAME = { confusion:'概念混淆', operation:'操作知识错误', memory:'记忆遗漏', misread:'审题错误', blind:'知识盲区' };

/* 与 localStorage 同步（跨页最终一致）：拍照页/本页均写 zsb_wrong_uploads_v1。
   渲染前调用：以 localStorage 为准整体替换（本页自己的保存都已写回 storage）。 */
function syncUploads() {
  var loaded = null;
  try { loaded = JSON.parse(localStorage.getItem('zsb_wrong_uploads_v1') || ''); } catch(e) {}
  if (loaded && loaded.length) WRONG_DATA.uploads = loaded;
}
var FILTER = 'all';
/* 1/2 级展开态：key 形如 l1_0 / l1_0_l2_1，值 true=展开。收藏本范式（PM 2026-09-07） */
var OPEN_MAP = {};   /* 1级默认展开(!==false)，2级默认折叠(!!false)，我的上传默认收起(===true) */

/* 已移出错题本的 qid 集合（做题页「移出」写 zsb_wrong_removed_v1，持久跨页，PM 2026-09-07） */
function removedQids() {
  var arr = [];
  try { arr = JSON.parse(localStorage.getItem('zsb_wrong_removed_v1') || '[]'); } catch(e) {}
  return arr;
}

/* 便捷遍历：收集所有题目（已剔除「移出」的题目，供统计卡/筛选计数用） */
function allQuestions() {
  var removed = removedQids();
  var arr = [];
  WRONG_DATA.modules.forEach(function(m) {
    m.chapters.forEach(function(c) {
      arr = arr.concat(c.questions.filter(function(q) { return removed.indexOf(q.qid) < 0; }));
    });
  });
  arr = arr.concat(WRONG_DATA.uploads.filter(function(u) { return removed.indexOf(u.qid) < 0; }));
  return arr;
}
/* ===== 渲染总览卡（今日待攻克卡，PM 2026-09-02 重构 / 2026-09-05 改名+去红字） =====
   只重构顶部卡：从数据统计改为学习行动卡（推荐最该练的知识点）。
   stats 仍算（供 chip 计数），但顶部不再显示 ring/数据格。 */
function renderOverview() {
  var qs = allQuestions();
  var s = {
    total: qs.length,
    pending: qs.filter(function(q) { return q.status === 'pending'; }).length,
    stubborn: qs.filter(function(q) { return q.stubborn; }).length,
    solved: qs.filter(function(q) { return q.status === 'solved'; }).length
  };
  WRONG_DATA.stats = s;
  /* 推荐知识点：按 path 第3段（3级考点）聚合 wrongCount，取最高；无顽固则走「状态不错」态 */
  var map = {}, k;
  for (k = 0; k < qs.length; k++) {
    var q = qs[k];
    if (q.status === 'solved') continue;   /* 已攻克不计 */
    var segs = (q.path || '').split(' → ');
    var point = segs.length >= 3 ? segs[2] : (segs[segs.length-1] || '');
    var module = segs.length >= 2 ? segs[0] : '';
    var key = module + ' · ' + point;
    map[key] = (map[key] || 0) + (q.wrongCount || 1);
  }
  var top = null;
  for (var kk in map) { if (!top || map[kk] > top.cnt) top = { name: kk, cnt: map[kk] }; }
  var body = document.getElementById('todayBody');
  if (top && top.cnt >= 2) {
    /* PM 2026-09-05：删除「重点推荐」红字标签，直接给知识点名 + 理由，减少噪音 */
    body.innerHTML = ''
      + '<span class="today-weak-name">' + top.name + '</span>'
      + '<div class="today-reason">你在这个知识点连续错了 <b>' + top.cnt + '</b> 次</div>';
  } else {
    body.innerHTML = ''
      + '<div class="today-good">状态不错 🎉</div>'
      + '<div class="today-good-sub">目前没有反复出错的知识点，继续保持，完成剩余错题巩固</div>';
  }
  updateChipCounts();
}

/* ===== 渲染列表 ===== */
/* 收纳时间降序比较器：取 addedAt（模块题）或 createdAt（上传题），无时间字段退居末尾 */
function byAddedDesc(a, b) {
  var ta = a.addedAt || a.createdAt || '';
  var tb = b.addedAt || b.createdAt || '';
  if (ta === tb) return 0;
  return ta < tb ? 1 : -1; /* 字符串比 YYYY-MM-DD HH:MM 天然有序，降序故 ta<tb 返 1 */
}

function renderList() {

  /* 章节错题：按 path 三段聚成 1级→2级→3级 树，3级下挂卡片（收藏本范式） */
  var tree = buildWrongTree();
  tree.forEach(function(l1, i) {
    var l1Stubborn = 0;   /* 1级顽固数 = 其下所有顽固 3 级个数 */
    l1.l2s.forEach(function(l2) { l2.l3s.forEach(function(l3) { if (l3.stubborn) l1Stubborn++; }); });
    var l1Key = 'l1_' + i;
    var l1Open = OPEN_MAP[l1Key] !== false;   /* 默认展开（露出2级标题），可折叠 */
    html += '<div class="wt-l1' + (l1Open ? ' open' : '') + '">'
      + '<div class="wt-l1-head" onclick="toggleNode(\'' + l1Key + '\')">'
      +   '<span class="wt-name">' + l1.name + '</span>'
      +   '<span class="wt-meta">' + l1.count + ' 道</span>'
      +   (l1Stubborn ? '<span class="wt-stub-tag">顽固 ' + l1Stubborn + '</span>' : '')
      +   '<span class="wt-l1-arrow">›</span>'
      + '</div>'
      + '<div class="wt-l2-list">';
    l1.l2s.forEach(function(l2, j) {
      var l2Stubborn = 0;   /* 2级顽固数 = 其下顽固 3 级个数 */
      l2.l3s.forEach(function(l3) { if (l3.stubborn) l2Stubborn++; });
      var l2Key = l1Key + '_l2_' + j;
      var l2Open = !!OPEN_MAP[l2Key];   /* 2级默认折叠，点击展开显3级+卡片 */
      html += '<div class="wt-l2-grp' + (l2Open ? ' open' : '') + '">'
        +   '<div class="wt-l2">'
        +     '<span class="wt-name" onclick="startPractice(\'sub\',\'' + escapeQuote(l1.name) + '\',\'' + escapeQuote(l2.name) + '\')">' + l2.name + '</span>'
        +     '<span class="wt-meta">' + l2.count + ' 道</span>'
        +     (l2Stubborn ? '<span class="wt-stub-tag">顽固 ' + l2Stubborn + '</span>' : '')
        +     '<span class="wt-l2-toggle" onclick="toggleNode(\'' + l2Key + '\')"><span class="caret">›</span></span>'
        +   '</div>'
        +   '<div class="wt-l3-list">';
      l2.l3s.forEach(function(l3, k) {
        html += '<div class="wt-l3' + (l3.stubborn ? ' stubborn' : '') + '" onclick="startPractice(\'point\',\'' + escapeQuote(l1.name) + '\',\'' + escapeQuote(l2.name) + '\',\'' + escapeQuote(l3.name) + '\')">'
          +   '<span class="wt-l3-dot"></span>'
          +   '<span class="wt-l3-name">' + l3.name + '</span>'
          +   '<span class="wt-meta">' + l3.count + ' 道</span>'
          + (l3.stubborn ? '<span class="wt-l3-stub">顽固</span>' : '')
          + '</div>'
          +   '<div class="wt-card-list">';
        l3.qs.forEach(function(q) { html += qCard(q); });
        html += '</div>';
      });
      html +=   '</div>'   /* wt-l3-list */
        + '</div>';   /* wt-l2-grp */
    });
    html += '</div></div>';   /* wt-l2-list / wt-l1 */
  });
  /* 我的上传区（source=upload）：独立平铺末尾，默认收起 */
  var ups = WRONG_DATA.uploads.filter(function(q) { return passFilter(q); }).sort(byAddedDesc);
  if (ups.length > 0) {
    var upOpen = OPEN_MAP['upload'] === true;   /* 默认收起，点击展开 */
    html += '<div class="wt-l1' + (upOpen ? ' open' : '') + '">'
      + '<div class="wt-l1-head" onclick="toggleNode(\'upload\')">'
      +   '<span class="wt-name">我的上传</span>'
      +   '<span class="wt-meta">' + ups.length + ' 道 · 拍照录入</span>'
      +   '<span class="wt-l1-arrow">›</span>'
      + '</div>'
      + '<div class="wt-l2-list wt-card-list">';
    ups.forEach(function(q) { html += qCard(q); });
    html += '</div></div>';
  }
  box.innerHTML = html || '<div class="empty">当前筛选下暂无错题</div>';
}

/* 按 path 三段聚合 1级→2级→3级→题目 树（仅章节错题，不含上传题）
   3 级顽固判定：该 3 级下题目 wrongCount 之和 ≥ 3 → 顽固（PM 2026-09-07 演示阈值） */
function buildWrongTree() {
  var STUB_THRESHOLD = 3;
  var root = [];
  WRONG_DATA.modules.forEach(function(m) {
    var l1 = null;
    m.chapters.forEach(function(c) {
      c.questions.filter(function(q) { return passFilter(q); }).forEach(function(q) {
        var segs = (q.path || '').split(' → ');
        if (segs.length < 3) return;
        var l1n = segs[0], l2n = segs[1], l3n = segs[2];
        if (!l1 || l1.name !== l1n) {
          l1 = { name: l1n, count: 0, l2s: [] };
          root.push(l1);
        }
        var l2 = null;
        for (var i = 0; i < l1.l2s.length; i++) { if (l1.l2s[i].name === l2n) { l2 = l1.l2s[i]; break; } }
        if (!l2) { l2 = { name: l2n, count: 0, l3s: [] }; l1.l2s.push(l2); }
        var l3 = null;
        for (var j = 0; j < l2.l3s.length; j++) { if (l2.l3s[j].name === l3n) { l3 = l2.l3s[j]; break; } }
        if (!l3) { l3 = { name: l3n, count: 0, wsum: 0, stubborn: false, qs: [] }; l2.l3s.push(l3); }
        l3.qs.push(q);
        l3.count++;
        l3.wsum += (q.wrongCount || 1);
        l2.count++;
        l1.count++;
      });
    });
    if (l1) l1.l2s.forEach(function(l2) { l2.l3s.forEach(function(l3) { l3.stubborn = l3.wsum >= STUB_THRESHOLD; }); });
  });
  return root;
}

/* ===== 左滑删除包裹层（PM 2026-09-06：移植自笔记本，错题卡片通用） ===== */
function swipeWrap(qid, innerHtml) {
  return '<div class="swipe-cell" data-qid="' + qid + '">'
    +   '<div class="swipe-content">' + innerHtml + '</div>'
    +   '<div class="swipe-del" onclick="deleteWrong(\'' + qid + '\')">删除</div>'
    + '</div>';
}

/* 删除错题：上传题同步删 localStorage；章节题删内存（mock 不持久化）。
   只删章节下的错题条目，章节壳保留。 */
function deleteWrong(qid) {
  var isUpload = (qid || '').indexOf('U') === 0;
  var removed = false;
  if (isUpload) {
    WRONG_DATA.uploads = WRONG_DATA.uploads.filter(function(q) {
      if (q.qid === qid) { removed = true; return false; }
      return true;
    });
    if (removed) {
      try { localStorage.setItem('zsb_wrong_uploads_v1', JSON.stringify(WRONG_DATA.uploads)); } catch(e) {}
    }
  } else {
    WRONG_DATA.modules.forEach(function(m) {
      m.chapters.forEach(function(c) {
        var before = c.questions.length;
        c.questions = c.questions.filter(function(q) { return q.qid !== qid; });
        if (c.questions.length < before) removed = true;
      });
    });
  }
  if (removed) {
    closeAllSwipe();
    renderList();
    updateChipCounts();
    showToast('已删除该错题');
  }
}

/* ===== 左滑手势（事件委托，列表容器统一监听；移植自笔记本） ===== */
var SWIPE_OPEN = 72;
var SWIPE_THRESHOLD = 10;
var swipeState = { cell: null, startX: 0, startY: 0, dx: 0, moved: false, opened: false };
function closeAllSwipe(except) {
  document.querySelectorAll('.swipe-content').forEach(function(c) {
    if (c !== except) { c.style.transform = ''; c._opened = false; }
  });
}
(function initSwipe() {
  var wrap = document.getElementById('list');
  if (!wrap) return;
  wrap.addEventListener('touchstart', function(e) {
    if (e.touches.length !== 1) return;
    var cell = e.target.closest('.swipe-cell');
    if (!cell) return;
    var content = cell.querySelector('.swipe-content');
    closeAllSwipe(content);
    swipeState.cell = cell;
    swipeState.startX = e.touches[0].clientX;
    swipeState.startY = e.touches[0].clientY;
    swipeState.dx = 0;
    swipeState.moved = false;
    swipeState.opened = !!content._opened;
    content.style.transition = 'none';
  }, { passive: true });
  wrap.addEventListener('touchmove', function(e) {
    if (!swipeState.cell) return;
    var dx = e.touches[0].clientX - swipeState.startX;
    var dy = e.touches[0].clientY - swipeState.startY;
    if (Math.abs(dy) > Math.abs(dx) && !swipeState.moved) return;
    if (Math.abs(dx) > 4) swipeState.moved = true;
    if (!swipeState.moved) return;
    var content = swipeState.cell.querySelector('.swipe-content');
    var base = swipeState.opened ? -SWIPE_OPEN : 0;
    var x = base + dx;
    if (x > 0) x = 0;
    if (x < -SWIPE_OPEN) x = -SWIPE_OPEN;
    content.style.transform = 'translateX(' + x + 'px)';
    swipeState.dx = x;
  }, { passive: true });
  wrap.addEventListener('touchend', function(e) {
    if (!swipeState.cell) return;
    var cell = swipeState.cell;
    var content = cell.querySelector('.swipe-content');
    content.style.transition = '';
    var dx = swipeState.dx;
    if (swipeState.moved) {
      if (dx < -SWIPE_THRESHOLD) {
        content.style.transform = 'translateX(-' + SWIPE_OPEN + 'px)';
        content._opened = true;
      } else {
        content.style.transform = '';
        content._opened = false;
      }
    }
    swipeState.cell = null;
  }, { passive: true });
})();

function qCard(q) {
  var tagCls = ['confusion','memory','operation','misread','blind'].indexOf(q.tag) >= 0 ? q.tag : 'confusion';
  var action = q.stubborn ? '集中攻克' : '再练';
  /* 标签行：错因 + 错次（不再显示考点标题，因卡片已挂在 3 级考点下） */
  var headTags = '<span class="q-tag ' + tagCls + '">' + (TAG_NAME[q.tag] || '错题') + '</span>'
    + '<span>错 ' + q.wrongCount + ' 次</span>';
  /* 图片题：OCR 未识别的图片占位；文字题有原图则附查看入口 */
  var body = (q.mode === 'image')
    ? '<div class="q-img-thumb" onclick="camAlert(\'查看原图（演示）\')"><span>📷</span>OCR 未识别 <em>点击查看原图</em></div>'
    : '<div class="q-title">' + (q.title || q.ocr) + '</div>'
      + (q.img ? '<div class="q-orig-link" onclick="camAlert(\'查看原图（演示）\')">📷 查看原图</div>' : '');
  return swipeWrap(q.qid, ''
    + '<div class="q-card' + (q.stubborn ? ' stubborn' : '') + '">'
    + '<div class="q-head">'
    +   '<span class="q-head-tags">' + headTags + '</span>'
    + '</div>'
    + body
    + '<div class="q-btns">'
    +   '<button class="q-btn primary" onclick="startPractice(\'' + (q.stubborn ? 'stubborn' : 'qid') + '\',\'' + q.qid + '\')">' + action + '</button>'
    +   '<button class="q-btn detail" onclick="goDetail(\'' + q.qid + '\')">详情</button>'
    + '</div>'
    + '</div>');
}

function passFilter(q) {
  if (removedQids().indexOf(q.qid) >= 0) return false;   /* 移出的题全局剔除（PM 2026-09-07） */
  if (FILTER === 'upload') return q.source === 'upload';
  if (FILTER === 'pending') return q.status === 'pending';
  if (FILTER === 'stubborn') return q.stubborn;
  if (FILTER === 'solved') return q.status === 'solved';
  return true;
}

function updateChipCounts() {

  var pending = qs.filter(function(q) { return q.status === 'pending'; }).length;
  var stubborn = qs.filter(function(q) { return q.stubborn; }).length;

/* ===== 拍照录入 =====
   流程：打开取景 mask → 拍照 → OCR 动画 1s → 成功：AI 打标签 + 可编辑题干 → 保存；
         失败：提示「未识别出文字，已保存为图片」→ 图片占位（qCard 缩略图）。
   AI 标签关键词：概念/特征/区别/原理 → confusion；快捷键/操作/步骤/点击 → operation；
                  记忆/口诀/背诵/顺序 → memory；默认 confusion */

/* 拍照录入模式：capture 错题录入（存错题本）/ search 搜题（存章节刷题「我的上传」） */

/* 记笔记：拍照不识别，直接以图片形式存笔记本（不走 OCR/AI）
   存 zsb_notes_v1，笔记本页后建 */
function takeNote() {
  var imgId = 'camshot_' + Date.now();
  var now = new Date();
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  var createdAt = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate())
    + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
  var item = { nid:'N'+pad(Date.now()%1000000), source:'note', mode:'image',
    img: imgId, ocr:'', title:'', createdAt: createdAt };
  var KEY = 'zsb_notes_v1';
  var arr = [];
  try { arr = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) {}
  arr.unshift(item);
  try { localStorage.setItem(KEY, JSON.stringify(arr)); } catch(e) {}
  var ocr = document.getElementById('camOcr');
  ocr.classList.add('on');
  setTimeout(function() { ocr.classList.remove('on'); }, 600);
  showToast('✓ 已存入笔记本，可在笔记本查看');
}

var TAG_NAME = { confusion:'概念混淆', operation:'操作知识错误', memory:'记忆遗漏', misread:'审题错误', blind:'知识盲区' };
var TYPE_NAME = { single:'单选题', multi:'多选题', judge:'判断题', fill:'填空题', operate:'操作题', short:'简答题', image:'图片题' };
var CONCEPT_CATS = [
  { kw:/操作系统|文件系统|进程|线程|内存|磁盘|死锁|调度/, label:'操作系统' },
  { kw:/网络|IP|域名|TCP|UDP|OSI|协议|浏览器|网址/, label:'计算机网络' },
  { kw:/Word|文档|段落|字体|页眉|页脚|分栏|样式/, label:'Word 文档处理' },
  { kw:/Excel|函数|单元格|公式|工作表|SUM|VLOOKUP|筛选/, label:'Excel 电子表格' },
  { kw:/PPT|PowerPoint|演示文稿|幻灯片|动画|母版/, label:'PowerPoint' },
  { kw:/数据库|SQL|表|查询|主键|范式/, label:'数据库' },
  { kw:/信息安全|病毒|木马|防火墙|加密|黑客/, label:'信息安全' },
  { kw:/人工智能|机器学习|大数据|云计算|物联网|区块链|算法|大模型/, label:'新一代信息技术' },
  { kw:/冯·诺依曼|计算机组成|CPU|存储器|二进制|数制|数据单位/, label:'计算机基础' }
];
function suggestType(text) {
  var t = String(text || '');
  if (/哪些|多选|以下.*几项|多于一项/.test(t)) return 'multi';
  if (/是否正确|对不对|对或错|判断|是否正确说法/.test(t)) return 'judge';
  if (/____|___|______|　_/.test(t)) return 'fill';
  if (/操作|步骤|实践|上机|命令|终端|流程图/.test(t)) return 'operate';
  if (/简述|论述|说明|分析|比较.*异同|为什么/.test(t)) return 'short';
  return 'single';
}
function suggestConcept(text) {
  var t = String(text || '');
  for (var i = 0; i < CONCEPT_CATS.length; i++) {
    if (CONCEPT_CATS[i].kw.test(t)) return CONCEPT_CATS[i].label;
  }
  return '待归类';
}
function suggestTag(text) {
  var t = String(text || '');
  if (/概念|特征|区别|原理|定义|分类|特点/.test(t)) return 'confusion';
  if (/快捷键|操作|步骤|点击|按钮|工具栏|命令|实践/.test(t)) return 'operation';
  if (/记忆|口诀|背诵|顺序|规律/.test(t)) return 'memory';
  if (/审题|看错|漏选|误读|没看清/.test(t)) return 'misread';
  if (/不会|没学过|没见过|超纲|陌生/.test(t)) return 'blind';
  return 'confusion';
}

/* 当前结果页识别态（供 saveUpload 读取） */
var CUR = { ocr:'', type:'single', concept:'待归类', tag:'confusion', imgMode:false, img:'' };

function showResult(ok) {

  document.getElementById('ocrView').style.display = 'block';
  document.getElementById('ocrEditBtn').textContent = '编辑';
  document.getElementById('ocrFailHint').style.display = 'none';

  if (ok) {
    var mockTxt = CAM_MODE === 'search'
      ? '以下选项中，Excel 中可以进行单元格引用的运算符是（ ）。'
      : '下列选项属于文件系统管理功能的是（ ）。';
    CUR.ocr = mockTxt; CUR.imgMode = false;
    document.getElementById('aiStatus').textContent = '✨ AI已识别，请检查后加入';
    document.getElementById('ocrView').textContent = mockTxt;
    document.getElementById('ocrView').style.color = 'var(--text-primary)';
    document.getElementById('resultTxt').value = mockTxt;
    document.getElementById('resultImgWrap').innerHTML = '📷';

    var tKey = suggestType(mockTxt);
    var cLbl = suggestConcept(mockTxt);

    CUR.type = tKey; CUR.concept = cLbl; CUR.tag = tLbl;
    setPill('pillType', TYPE_NAME[tKey]);
    setPill('pillConcept', cLbl);

  } else {
    CUR.ocr = ''; CUR.imgMode = true;
    document.getElementById('aiStatus').textContent = '⚠️ 部分文字未识别，请手动补充';
    document.getElementById('ocrView').textContent = '（未识别出文字，点「编辑」手动输入）';
    document.getElementById('ocrView').style.color = 'var(--text-tertiary)';
    document.getElementById('resultTxt').value = '';
    document.getElementById('resultTxt').placeholder = '点这里手动输入题干…';
    document.getElementById('ocrFailHint').style.display = 'block';
    document.getElementById('resultImgWrap').innerHTML = '📷';
    CUR.type = 'image'; CUR.concept = '待归类'; CUR.tag = 'confusion';
    setPill('pillType', '图片题');
    setPill('pillConcept', '待归类');
    setPill('pillTag', '概念混淆');
  }
}

function setPill(id, label) { document.getElementById(id).textContent = label; }

/* OCR 编辑/完成 切换 */
function toggleOcrEdit() {
  var view = document.getElementById('ocrView');
  var ta = document.getElementById('resultTxt');
  var btn = document.getElementById('ocrEditBtn');
  var editing = ta.style.display === 'none';
  if (editing) {
    ta.value = CUR.ocr;
    ta.style.display = 'block'; view.style.display = 'none';
    btn.textContent = '完成';
    ta.focus();
  } else {
    CUR.ocr = ta.value;
    view.textContent = ta.value || '（空）';
    view.style.color = ta.value ? 'var(--text-primary)' : 'var(--text-tertiary)';
    ta.style.display = 'none'; view.style.display = 'block';
    btn.textContent = '编辑';
    document.getElementById('ocrFailHint').style.display = ta.value ? 'none' : 'block';
  }
}

/* 标签选择器（浮窗滑动列表式）
   - 题型/错因：单级滑动列表
   - 考点：四级级联滑动列表（KP_TREE）
   AI 已预选可纠错 */
var TAG_OPTIONS = {
  type: [
    ['single','单选题'], ['multi','多选题'], ['judge','判断题'], ['fill','填空题'], ['operate','操作题'], ['short','简答题'], ['image','图片题']
  ],
  tag: [
    ['confusion','概念混淆'], ['operation','操作知识错误'], ['memory','记忆遗漏'], ['misread','审题错误'], ['blind','知识盲区']
  ]
};
/* 四级知识树（与拍照搜题/笔记本对齐） */
var KP_TREE = [
  { name:'计算机基础', children:[
    { name:'计算机系统', children:[
      { name:'冯·诺依曼体系', children:['输入输出设备','存储器结构','指令执行'] },
      { name:'总线与接口', children:['总线分类','接口标准'] }
    ]},
    { name:'数制与编码', children:[
      { name:'数制转换', children:['二进制转十进制','十进制转二进制','十六进制'] },
      { name:'字符编码', children:['ASCII 码','汉字编码'] }
    ]}
  ]},
  { name:'操作系统', children:[
    { name:'操作系统基础', children:[
      { name:'操作系统的基本功能', children:['处理器管理','存储管理','文件管理','设备管理'] },
      { name:'操作系统的主要功能', children:['进程调度','内存分配','文件组织'] }
    ]},
    { name:'进程与线程', children:[
      { name:'进程的概念', children:['进程三态','进程控制块'] },
      { name:'线程的概念', children:['线程与进程区别','用户级线程'] }
    ]}
  ]},
  { name:'计算机网络', children:[
    { name:'网络协议', children:[
      { name:'TCP/IP 协议体系', children:['三次握手','四次挥手','TIME_WAIT'] },
      { name:'OSI 参考模型', children:['七层结构','各层功能'] }
    ]},
    { name:'IP 地址', children:[
      { name:'IP 地址与子网掩码', children:['IP 分类','子网划分'] },
      { name:'域名与 DNS', children:['域名结构','DNS 解析'] }
    ]}
  ]},
  { name:'数据库', children:[
    { name:'关系数据库', children:[
      { name:'三级模式结构', children:['外模式','模式','内模式','两级映像'] },
      { name:'关系代数', children:['传统集合运算','专门关系运算'] }
    ]},
    { name:'SQL 语言', children:[
      { name:'SQL 语句分类', children:['DDL','DML','DQL','DCL'] },
      { name:'连接查询', children:['内连接','外连接','笛卡尔积'] }
    ]}
  ]},
  { name:'数据结构', children:[
    { name:'树与图', children:[
      { name:'二叉树的遍历方法', children:['前序遍历','中序遍历','后序遍历','层序遍历'] },
      { name:'图的应用', children:['最短路径','最小生成树'] }
    ]},
    { name:'线性结构', children:[
      { name:'栈与队列的特点', children:['栈后进先出','队列先进先出'] },
      { name:'链表', children:['单链表','循环链表'] }
    ]}
  ]}
];
var PICKER_FIELD = null;
/* 考点级联选择临时态（不直接写 CUR，确认后写） */
var KP_TMP = { l1:'', l2:'', l3:'', l4:'' };
var KP_LEVEL = 1;

function openTagPicker(field) {
  PICKER_FIELD = field;
  if (field === 'concept') {
    /* 考点：四级级联浮窗 */
    KP_TMP = { l1:'', l2:'', l3:'', l4:'' };
    KP_LEVEL = 1;
    renderKpListConcept();
  } else {
    /* 题型/错因：单级滑动列表 */
    renderSingleList(field);
  }
  document.getElementById('tagPickerMask').classList.add('on');
}

/* 单级列表（题型/错因） */
function renderSingleList(field) {
  var opts = TAG_OPTIONS[field];
  var titleMap = { type:'选择题型', tag:'选择错因' };
  var curVal = field === 'type' ? CUR.type : CUR.tag;
  var html = '<div class="kp-picker-head"><span class="kp-picker-title">' + titleMap[field] + '</span></div>'
    + '<div class="kp-path-bar" style="visibility:hidden">&nbsp;</div>'
    + '<div class="kp-list">';
  opts.forEach(function(o) {
    var val = o[0], lbl = o[1];
    var on = (val === curVal) ? ' on' : '';
    html += '<div class="kp-item' + on + '" onclick="pickSingle(\'' + field + '\',\'' + val + '\',\'' + escapeQuote(lbl) + '\')">'
      + '<span>' + lbl + '</span>' + (on ? '<span class="kp-ck">✓</span>' : '') + '</div>';
  });
  html += '</div><button class="kp-picker-done" onclick="confirmTagPicker()">完成</button>';
  document.getElementById('tagPicker').innerHTML = html;
}

function pickSingle(field, val, lbl) {
  if (field === 'type') { CUR.type = val; setPill('pillType', lbl); }
  else { CUR.tag = val; setPill('pillTag', lbl); }
  confirmTagPicker();
}

/* 考点四级级联列表 */
function renderKpListConcept() {
  var levelNames = ['', '一级', '二级', '三级', '四级'];
  var opts = [];
  var curVal = '';
  if (KP_LEVEL === 1) { opts = KP_TREE.map(function(n){ return n.name; }); curVal = KP_TMP.l1; }
  else if (KP_LEVEL === 2) {
    var l1Node = KP_TREE.filter(function(n){ return n.name === KP_TMP.l1; })[0];
    opts = l1Node ? l1Node.children.map(function(n){ return n.name; }) : [];
    curVal = KP_TMP.l2;
  } else if (KP_LEVEL === 3) {
    var l1Node = KP_TREE.filter(function(n){ return n.name === KP_TMP.l1; })[0];
    var l2Node = l1Node ? l1Node.children.filter(function(n){ return n.name === KP_TMP.l2; })[0] : null;
    opts = l2Node ? l2Node.children.map(function(n){ return n.name; }) : [];
    curVal = KP_TMP.l3;
  } else if (KP_LEVEL === 4) {
    var l1Node = KP_TREE.filter(function(n){ return n.name === KP_TMP.l1; })[0];
    var l2Node = l1Node ? l1Node.children.filter(function(n){ return n.name === KP_TMP.l2; })[0] : null;
    var l3Node = l2Node ? l2Node.children.filter(function(n){ return n.name === KP_TMP.l3; })[0] : null;
    opts = l3Node ? l3Node.children : [];
    curVal = KP_TMP.l4;
  }
  var parts = [];
  if (KP_TMP.l1) parts.push(KP_TMP.l1);
  if (KP_TMP.l2) parts.push(KP_TMP.l2);
  if (KP_TMP.l3) parts.push(KP_TMP.l3);
  if (KP_TMP.l4) parts.push(KP_TMP.l4);
  var pathHtml = parts.length
    ? parts.map(function(p){ return '<span class="kp-l">' + p + '</span>'; }).join(' › ')
    : '<span class="kp-empty">未选择（将标记为「待归类」）</span>';

  var html = '<div class="kp-picker-head"><span class="kp-picker-title">选择' + levelNames[KP_LEVEL] + '考点</span><span class="kp-picker-skip" onclick="skipKpConcept()">跳过本级</span></div>'
    + '<div class="kp-path-bar">' + pathHtml + '</div>'
    + '<div class="kp-list">';
  opts.forEach(function(name) {
    var on = (name === curVal) ? ' on' : '';
    html += '<div class="kp-item' + on + '" onclick="pickKpConcept(' + KP_LEVEL + ',\'' + escapeQuote(name) + '\')">'
      + '<span>' + name + '</span>' + (on ? '<span class="kp-ck">✓</span>' : '<span class="kp-next">›</span>') + '</div>';
  });
  if (!opts.length) html += '<div style="padding:24px;text-align:center;color:var(--text-tertiary);font-size:13px;">无更多选项，点「跳过本级」或「完成」</div>';
  html += '</div><button class="kp-picker-done" onclick="confirmTagPicker()">完成</button>';
  document.getElementById('tagPicker').innerHTML = html;
}

function pickKpConcept(level, name) {
  if (level === 1) { KP_TMP.l1 = name; KP_TMP.l2=''; KP_TMP.l3=''; KP_TMP.l4=''; KP_LEVEL = 2; }
  else if (level === 2) { KP_TMP.l2 = name; KP_TMP.l3=''; KP_TMP.l4=''; KP_LEVEL = 3; }
  else if (level === 3) { KP_TMP.l3 = name; KP_TMP.l4=''; KP_LEVEL = 4; }
  else if (level === 4) { KP_TMP.l4 = name; KP_LEVEL = 5; }
  if (KP_LEVEL > 4) { confirmTagPicker(); return; }
  renderKpListConcept();
}

function skipKpConcept() { confirmTagPicker(); }

/* 确认选择：考点把 KP_TMP 派生为 CUR.concept 并回写 pill */
function confirmTagPicker() {
  if (PICKER_FIELD === 'concept') {
    var lbl = KP_TMP.l3 || KP_TMP.l2 || KP_TMP.l1 || '待归类';
    CUR.concept = lbl;
    setPill('pillConcept', lbl);
  }
  closeTagPicker();
}

function escapeQuote(s) { return String(s).replace(/'/g, "\\'"); }

function closeTagPicker() {
  document.getElementById('tagPickerMask').classList.remove('on');
  PICKER_FIELD = null;
}

/* 保存：按当前模式分流
   - 错题录入（capture）→ 错题本 WRONG_DATA.uploads（本地渲染 + localStorage）
   - 搜题（search）→ 章节刷题「我的上传」（localStorage 中转） */
function saveUpload() {
  /* 编辑态未点完成时，先同步 textarea 值 */
  var ta = document.getElementById('resultTxt');
  if (ta.style.display !== 'none') { CUR.ocr = ta.value; }
  var txt = CUR.ocr;
  var mode = txt ? 'text' : 'image';
  var now = new Date();
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  var createdAt = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate())
    + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
  var item = {
    qid: '', source: 'upload',
    mode: mode,
    path: '我的上传 → 拍照录入',
    type: CUR.type,
    title: mode === 'text' ? txt : '',
    img: CUR.img, ocr: txt, tag: CUR.tag,
    concept: CUR.concept,
    createdAt: createdAt, wrongCount: 1, status: 'pending', stubborn: false,
    review: 'pending'
  };
  if (CAM_MODE === 'search') {
    /* 搜题：存章节刷题「我的上传」（qid 前缀 S） */
    var arr = [];
    try { arr = JSON.parse(localStorage.getItem('zsb_share_uploads_v1') || '[]'); } catch(e) {}
    var maxS = 0;
    arr.forEach(function(u) {
      var n = parseInt((u.qid || '').replace('S', ''), 10);
      if (!isNaN(n) && n > maxS) maxS = n;
    });
    item.qid = 'S' + pad(maxS + 1).slice(-2);
    arr.unshift(item);
    try { localStorage.setItem('zsb_share_uploads_v1', JSON.stringify(arr)); } catch(e) {}
    closeCam();
    showToast('✓ 已提交，等待审核通过后计入章节刷题');
    return;
  }
  /* 错题录入：存错题本（qid 前缀 U，数字递增） */
  var maxU = 0;
  (WRONG_DATA.uploads || []).forEach(function(u) {
    var n = parseInt((u.qid || '').replace('U', ''), 10);
    if (!isNaN(n) && n > maxU) maxU = n;
  });
  item.qid = 'U' + pad(maxU + 1).slice(-2);
  if (!WRONG_DATA.uploads) WRONG_DATA.uploads = [];
  WRONG_DATA.uploads.push(item);
  try { localStorage.setItem('zsb_wrong_uploads_v1', JSON.stringify(WRONG_DATA.uploads)); } catch(e) {}
  renderOverview();
  renderList();
  updateChipCounts();
  closeCam();
  showToast('✓ 已提交，等待审核通过后计入错题本');
}

function closeResult() {
  resetCamState();
}

/* ===== 进入做题页 =====
   scope：all 全部重练 / stubborn 顽固集中攻克 / qid 单题再练
   qid：详情定位该题 */
function startPractice(scope, a, b, c) {
  /* scope=qid 单题再练 / stubborn 顽固集中攻克 / sub 二级范围 / point 三级考点范围 / all 全部重练 */
  var data = { entry:'wrong', scope: scope || 'all' };
  var name = '错题本重练';
  if (scope === 'qid') { data.qid = a || ''; name = '单题再练'; }
  else if (scope === 'stubborn') { name = '顽固错题集中攻克'; }
  else if (scope === 'sub') { data.l1 = a||''; data.l2 = b||''; name = (b || a || '错题') + ' · 重练'; }
  else if (scope === 'point') { data.l1 = a||''; data.l2 = b||''; data.l3 = c||''; name = (c || '错题') + ' · 重练'; }
  data.name = name;
  try {
    window.parent.postMessage({ type:'REQ_PRACTICE', data: data }, '*');
  } catch(e) {
    showToast('请从总壳进入，开始错题练习');
  }
}
function goDetail(qid) {
  try {
    window.parent.postMessage({ type:'REQ_PRACTICE', data:{
      entry:'wrong', scope:'qid', qid: qid || '', detail: 1, name:'错题详情'
    } }, '*');
  } catch(e) {
    showToast('请从总壳进入，查看错题详情');
  }
}

/* ===== 返回：通知题库首页收起二级层 ===== */
function goBack() {
  try { window.parent.postMessage({ type:'CLOSE_CHAPTER' }, '*'); }
  catch(e) { showToast('请从总壳返回'); }
}
/* 查看全部薄弱考点（PM 2026-09-02）：入口轻量，暂切「全部」筛选定位错题列表 */
function goAllWeak() {
  setFilter('all');
  document.getElementById('list').scrollIntoView({ behavior: 'smooth' });
}

/* ===== Toast ===== */
var toastTimer = null;
function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.style.opacity = 0; }, 1500);
}

renderOverview();
renderList();

/* 做题页「移出」后同源 storage 事件自动广播 → 本页即时刷新，被移出题立即消失、无需重进（PM 2026-09-07） */
window.addEventListener('storage', function(e) {
  if (e.key === 'zsb_wrong_removed_v1') {
    renderOverview();
    renderList();
  }
});

/* 处于总壳演示（本页嵌在 camLayer iframe，parent 非顶层窗口）→ 页内自绘页头交给 appbar 统一承担。
   注意：不能读 top.document 探测 #appbar——file:// 下各 frame origin=null 会抛 SecurityError 被 catch 吞掉，
   改用 window 层级判定（window 引用比较不触发跨域），独立调试本文件（无嵌套）时仍保留页头兜底 */
try {
  if (window.top && window.parent && window.top !== window.parent) {
    document.body.classList.add('has-appbar');
  }
} catch(e) { /* 极端环境忽略 */ }

/* 监听总壳 appbar 退出（识别结果页态）→ 关结果页回取景 */
window.addEventListener('message', function(evt) {
  var d = evt.data;
  if (d && d.type === 'CAM_BACK') { closeResult(); }
});
</script>
