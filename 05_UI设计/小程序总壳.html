<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>山东专升本小程序 · 总壳</title>
<style>
/* ============================================================
   总壳样式：左手机壳 + 右逻辑说明面板
   （4 tab 在手机壳内，模拟真实小程序；逻辑说明随闪卡视图联动）
   ============================================================ */
:root{
  --primary: #5B72F5;
  --primary-dark: #4358D7;
  --primary-light: #EEF1FF;
  --text-primary: #202533;
  --text-secondary: #6E778B;
  --text-tertiary: #98A0B2;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text-primary);
  background: #EDEFF7;
  display: flex; flex-direction: column;
}

/* ============ 工作台：左手机壳区 + 右逻辑面板 ============ */
.main { flex: 1; min-height: 0; display: flex; align-items: stretch; }

/* 中间：手机壳区 */
.phone-col {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px 16px;
  background:
    radial-gradient(circle at 70% 20%, rgba(91,114,245,0.07) 0%, transparent 50%),
    #EDEFF7;
}

/* 手机壳 */
.phone {
  position: relative;
  flex-shrink: 0;
  width: 390px;
  height: clamp(600px, calc(100vh - 40px), 860px);
  background: #1E2130;
  border-radius: 44px;
  padding: 12px;
  box-shadow:
    0 0 0 1px rgba(30,33,48,0.12),
    0 20px 60px rgba(30,33,48,0.28),
    inset 0 0 0 2px rgba(255,255,255,0.06);
  display: flex; flex-direction: column;
}
.phone-screen {
  flex: 1; min-height: 0;
  border-radius: 33px;
  background: #FFFFFF;
  overflow: hidden;
  position: relative;
}
/* 手机状态栏：时间 / 信号 / 电量 */
.phone-statusbar {
  position: absolute; top: 0; left: 0; right: 0;
  height: 34px; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
  background: linear-gradient(180deg, rgba(255,255,255,0.96) 0%, rgba(255,255,255,0.88) 55%, rgba(255,255,255,0) 100%);
  pointer-events: none;
  font-size: 13px; font-weight: 600; color: #1E2130;
}
.phone-statusbar .status-time { letter-spacing: 0.4px; }
.phone-statusbar .status-icons { display: flex; align-items: center; gap: 8px; }
.phone-statusbar .status-icons svg { width: 16px; height: 12px; color: #1E2130; display: block; }
.phone-statusbar .status-icons .wifi { transform: translateY(1px); }
/* 刘海 */
.phone-notch {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 120px; height: 26px; z-index: 10;
  background: rgba(255,255,255,0.92);
  border-radius: 0 0 16px 16px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}
.phone-notch .speaker { width: 42px; height: 5px; border-radius: 3px; background: rgba(30,33,48,0.2); }
.phone-notch .cam { width: 9px; height: 9px; border-radius: 50%; background: rgba(30,33,48,0.35); }

/* 内容区：4 tab 各自 iframe，切 tab 显隐 */
.content-frame { position: absolute; inset: 0; }
.content-frame iframe {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  border: none;
}
.content-frame iframe.hidden { visibility: hidden; pointer-events: none; }

/* 底部 4 tab（手机壳内） */
.tabbar {
  height: 56px; flex-shrink: 0;
  display: flex;
  background: #FFFFFF;
  border-top: 1px solid #ECEEF6;
}
.tab-item {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px;
  border: none; background: none; cursor: pointer;
  color: var(--text-tertiary);
  font-size: 10px;
  transition: color .15s ease;
}
.tab-item svg { width: 20px; height: 20px; stroke-width: 1.8; }
.tab-item.active { color: var(--primary-dark); font-weight: 600; }
.tab-item.active svg { stroke-width: 2.2; }
/* Home 指示条 */
.home-bar {
  height: 5px; flex-shrink: 0;
  width: 124px; margin: 6px auto 0;
  border-radius: 3px;
  background: rgba(255,255,255,0.7);
  flex-shrink: 0;
}

/* ============ 闪屏层（覆盖手机屏幕） ============ */
.splash-layer {
  position: absolute; inset: 0;
  z-index: 9999;
  background: #F8F9FC;
  border-radius: 33px;
  display: flex; align-items: flex-end; justify-content: center;
  transition: opacity .4s ease;
}
.splash-layer.hide { opacity: 0; pointer-events: none; }
.splash-layer img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

/* ============ VIP 弹层（覆盖内容区） ============ */
.vip-layer {
  position: absolute; inset: 0;
  z-index: 3000;
  background: #fff;
  display: flex; flex-direction: column;
  opacity: 0; pointer-events: none;
  transition: opacity .22s ease;
}
.vip-layer.show { opacity: 1; pointer-events: auto; }
.vip-mini-top {
  height: 50px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  background: #fff;
  border-bottom: 1px solid #F0F1F7;
  font-size: 15px; font-weight: 700;
}
.vip-close {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  width: 28px; height: 28px;
  border: none; border-radius: 8px;
  background: #F2F3F8; color: #6E778B;
  font-size: 14px; line-height: 1;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.vip-close:hover { background: #E8EAF3; }
.vip-layer iframe { flex: 1; min-height: 0; width: 100%; border: none; }

/* ============ 右侧逻辑说明面板 ============ */
.logic-col {
  width: 0;               /* 收起态无宽度 */
  overflow: hidden;
  transition: width .25s ease;
  background: #FBFBFF;
  border-left: 1px solid #ECEFF6;
  display: flex; flex-direction: column;
  flex-shrink: 0;
}
.logic-col.open { width: 460px; }
.logic-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
/* 视图切换胶囊 */
.view-switch {
  flex-shrink: 0;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  padding: 10px 18px;
  background: #FFFFFF;
  border-bottom: 1px solid #ECEFF6;
}
.view-chip {
  padding: 5px 12px; border-radius: 14px;
  border: 1px solid #E3E8F2; background: #F7F9FC;
  font-size: 12px; font-weight: 500; color: var(--text-secondary);
  cursor: pointer; transition: all .15s ease;
  white-space: nowrap;
}
.view-chip:hover { border-color: var(--primary); color: var(--primary-dark); }
.view-chip.active { background: var(--primary); border-color: var(--primary); color: #FFFFFF; font-weight: 600; }
/* 全局通栏：卡片状态标签 */
.logic-global {
  flex-shrink: 0;
  margin: 10px 18px 0;
  padding: 6px 12px;
  background: #FFFFFF;
  border: 1px solid #ECEFF6;
  border-radius: 10px;
  font-size: 12px; line-height: 1;
  color: var(--text-secondary);
}
.g-tab { display: inline-block; font-size: 11px; font-weight: 600; margin-right: 8px; padding: 3px 8px; border-radius: 10px; white-space: nowrap; }
.g-tab.g-ok   { background: #E8F8F0; color: #20A866; }
.g-tab.g-no   { background: #FEECEC; color: #EF4444; }
.g-tab.g-stub { background: #FFF1E6; color: #F28B3D; }
.logic-head {
  flex-shrink: 0;
  height: 46px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 18px;
  border-bottom: 1px solid #ECEFF6;
  background: #FFFFFF;
}
.logic-head .title { font-size: 14px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
.logic-head .close-x { margin-left: auto; border: none; background: none; cursor: pointer; color: var(--text-tertiary); font-size: 18px; line-height: 1; padding: 4px 6px; }
.logic-body {
  flex: 1; min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px 18px 30px;
  scrollbar-width: thin;
}
.logic-body::-webkit-scrollbar { width: 6px; }
.logic-body::-webkit-scrollbar-thumb { background: #DDE1F0; border-radius: 3px; }
.logic-desc { font-size: 13px; line-height: 1.6; color: var(--text-secondary); margin-bottom: 14px; padding: 12px 14px; background: var(--primary-light); border-radius: 12px; }
.logic-sec { margin-bottom: 10px; }
.logic-sec-head { display: flex; align-items: center; gap: 6px; padding: 0; }
.logic-sec-head .num { width: 18px; height: 18px; border-radius: 5px; background: var(--primary); color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.logic-sec-head .sec-name { font-size: 13px; font-weight: 700; }
.logic-sec-body { display: block; padding: 2px 0 0 24px; }
.logic-para { margin: 10px 0 4px; font-size: 12px; font-weight: 700; color: var(--text-secondary); }
.logic-label { display: flex; align-items: flex-start; gap: 6px; font-size: 12.5px; line-height: 1.55; color: var(--text-primary); padding: 4px 0; }
.logic-label .k { flex-shrink: 0; font-weight: 600; color: var(--primary-dark); min-width: 58px; }
.logic-label .v { color: var(--text-primary); }
.logic-note { margin-top: 6px; font-size: 11.5px; color: var(--text-tertiary); background: #F5F6FB; border-radius: 8px; padding: 6px 10px; line-height: 1.5; }
.logic-table { width: 100%; margin: 8px 0; border-collapse: collapse; font-size: 12px; }
.logic-table th, .logic-table td { border: 1px solid #EAEDF6; padding: 6px 8px; text-align: left; vertical-align: top; }
.logic-table th { background: #F8F9FC; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
</style>
</head>
<body>

<div class="main">
  <!-- 左侧：手机壳（内容 iframe + 手机内 tab） -->
  <div class="phone-col">
    <div class="phone">
      <div class="phone-screen">
        <div class="phone-notch"><div class="speaker"></div><div class="cam"></div></div>
        <div class="phone-statusbar">
          <span class="status-time" id="statusTime">9:41</span>
          <span class="status-icons">
            <svg class="wifi" viewBox="0 0 24 24" fill="currentColor"><path d="M12 18.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm0-8c-2.5 0-4.8.9-6.6 2.5l2.2 2.2a6 6 0 0 1 8.8 0l2.2-2.2a9.4 9.4 0 0 0-6.6-2.5zm0-5.4c-4.1 0-7.8 1.6-10.6 4.3l2.3 2.3a11.2 11.2 0 0 1 16.6 0l2.3-2.3A14.2 14.2 0 0 0 12 5.1z"/></svg>
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="10" width="3" height="9" rx="1"/><rect x="7" y="7" width="3" height="12" rx="1"/><rect x="12" y="3" width="3" height="16" rx="1"/><rect x="17" y="6" width="3" height="13" rx="1"/></svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="8" width="18" height="11" rx="2"/><path d="M6 8V6a2 2 0 0 1 2-2h3"/><path d="M20 11h1"/></svg>
          </span>
        </div>
        <!-- 4 tab 内容：切 tab 显隐；懒加载（首次切才设 src） -->
        <div class="content-frame">
          <iframe id="frame-study" src="登录与画像原型.html"></iframe>
          <iframe id="frame-quiz" data-src="题库.html" class="hidden"></iframe>
          <iframe id="frame-flash" data-src="闪卡原型.html" class="hidden"></iframe>
          <iframe id="frame-mine" data-src="我的.html" class="hidden"></iframe>
        </div>

        <!-- 品牌闪屏层（2.5s后隐藏，嵌入时跳过以避免双闪屏） -->
        <div class="splash-layer" id="splashLayer">
          <img src="闪屏.png" alt="升本智答" />
        </div>

        <!-- VIP 弹层（领取VIP时覆盖内容区，绝对定位于手机屏幕内） -->
        <div class="vip-layer" id="vipLayer">
          <div class="vip-mini-top">
            <span>VIP 领取</span>
            <button class="vip-close" id="vipClose" title="关闭">✕</button>
          </div>
          <iframe id="frame-vip" src="VIP领取页.html"></iframe>
        </div>
      </div>
      <nav class="tabbar">
        <button class="tab-item active" data-frame="study" onclick="switchTab('study')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12l10-9 10 9"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
          学习
        </button>
        <button class="tab-item" data-frame="quiz" onclick="switchTab('quiz')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          题库
        </button>
        <button class="tab-item" data-frame="flash" onclick="switchTab('flash')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 9h8M8 13h5"/></svg>
          闪卡
        </button>
        <button class="tab-item" data-frame="mine" onclick="switchTab('mine')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
          我的
        </button>
      </nav>
      <div class="home-bar"></div>
    </div>
  </div>

  <!-- 右侧：闪卡逻辑说明面板（复制自闪卡原型，经 postMessage 联动） -->
  <aside class="logic-col open" id="logicCol">
    <div class="logic-panel">
      <div class="logic-head">
        <div class="title">📋 闪卡逻辑说明</div>
        <button class="close-x" id="logicClose" title="收起/展开">×</button>
      </div>
      <div class="view-switch" id="viewSwitch"></div>
      <div class="logic-global" id="logicGlobal">
        <span class="g-tab g-ok">已记住 · 右滑</span>
        <span class="g-tab g-no">未记住 · 左滑</span>
        <span class="g-tab g-stub">顽固 · 未记住≥3，每日必现</span>
      </div>
      <div class="logic-body" id="logicBody"></div>
    </div>
  </aside>
</div>

<script>
/* ============================================================
   总壳状态中枢：登录/画像/VIP 全局唯一状态源
   ============================================================ */
var STATE = {
  logged: false,
  user: null,          /* {nick, grade, major, school} */
  profile: false,      /* 画像已完善 */
  vipClaimed: false
};

var FRAMES = ['study', 'quiz', 'flash', 'mine', 'vip'];
function allFrames() {
  return FRAMES.map(function(f) { return document.getElementById('frame-' + f); })
    .filter(Boolean);
}

/* 广播最新状态到所有 iframe */
function broadcast() {
  allFrames().forEach(function(f) {
    try { f.contentWindow.postMessage({ type: 'STATE', state: STATE }, '*'); } catch(e) {}
  });
}

/* 子页面上报：LOGGED / PROFILE / VIP */
window.addEventListener('message', function(evt) {
  var d = evt.data;
  if (!d || !d.type) return;
  if (d.type === 'SUBREADY') {
    /* 子页就绪 → 回发当前状态（懒加载 iframe 迟到的场景） */
    broadcast();
    return;
  }
  if (d.type === 'REQ_LOGIN' || d.type === 'OPEN_PROFILE') {
    /* 我的页请求登录/完善资料 → 转发给学习页（登录/画像归属唯一：学习页） */
    var study = document.getElementById('frame-study');
    if (study && study.contentWindow) {
      study.contentWindow.postMessage({ type: d.type }, '*');
    }
    switchTab('study');
    return;
  }
  if (d.type === 'LOGGED') {
    STATE.logged = true;
    if (d.data && d.data.user) STATE.user = d.data.user;
    broadcast();
  } else if (d.type === 'PROFILE') {
    STATE.profile = true;
    if (d.data && d.data.user) STATE.user = Object.assign({}, STATE.user, d.data.user);
    broadcast();
  } else if (d.type === 'VIP') {
    STATE.vipClaimed = true;
    broadcast();
    closeVip();
  } else if (d.type === 'NAV') {
    /* 闪卡视图切换 → 逻辑面板跟随（高亮 + 说明同步） */
    setActivePanel(d.view);
    renderLogicPanel(currentLogicData());
  } else if (d.type === 'POPUP') {
    /* 闪卡弹窗/浮层开关 → 逻辑面板跟随（完成页/settings） */
    if (d.name === 'settings') { settingsOpen = !!d.open; }
    else if (d.name === 'completion') { completionOpen = !!d.open; }
    renderLogicPanel(currentLogicData());
  } else if (d.type === 'REQUEST_NAV') {
    /* 面板视图胶囊 → 转发给闪卡 iframe 跳转 */
    var flash = document.getElementById('frame-flash');
    if (flash && flash.contentWindow) {
      flash.contentWindow.postMessage({ type: 'REQUEST_NAV', view: d.view }, '*');
    }
  }
});

/* 安全提示：caller tab 首次加载后向子页同步一次状态 */
function syncChildState() {
  broadcast();
}

/* ---------- 底部 tab 切换 ---------- */
var TAB_FRAMES = ['study', 'quiz', 'flash', 'mine'];
function switchTab(name) {
  TAB_FRAMES.forEach(function(f) {
    var iframe = document.getElementById('frame-' + f);
    if (iframe) iframe.classList.toggle('hidden', f !== name);
    var tab = document.querySelector('.tab-item[data-frame="' + f + '"]');
    if (tab) tab.classList.toggle('active', f === name);
  });
  /* 首次切入懒加载：切到才设 src，避免4个页面同载 */
  var next = document.getElementById('frame-' + name);
  if (!next.getAttribute('src') && next.getAttribute('data-src')) {
    next.setAttribute('src', next.getAttribute('data-src'));
  }
  /* 切入后同步状态 */
  setTimeout(syncChildState, 150);
  if (name === 'flash') {
    /* 切到闪卡：让 flash iframe 感知当前面板高亮，并校准逻辑说明 */
    var flash = document.getElementById('frame-flash');
    if (flash && flash.contentWindow) {
      flash.contentWindow.postMessage({ type: 'REQUEST_NAV', view: activePanel }, '*');
    }
  }
}

/* ---------- VIP 弹层 ---------- */
var vipLayer = document.getElementById('vipLayer');
function openVip() {
  vipLayer.classList.add('show');
  setTimeout(syncChildState, 150);
}
function closeVip() {
  vipLayer.classList.remove('show');
}
document.getElementById('vipClose').addEventListener('click', closeVip);

/* ---------- 闪屏 2.5s 后隐藏（嵌入小程序总壳时跳过，避免双闪屏） ---------- */
var EMBEDDED = (function() {
  try {
    return window.parent !== window.self &&
      /小程序总壳\.html$/.test(window.parent.location.pathname);
  } catch(e) { return false; }
})();
setTimeout(function() {
  var s = document.getElementById('splashLayer');
  if (s) s.classList.add('hide');
}, EMBEDDED ? 0 : 2500);

/* 各 tab 懒加载完成后再广播一次（保证迟到 iframe 拿到状态） */
window.addEventListener('load', function() { setTimeout(broadcast, 800); });

/* ============================================================
   逻辑说明面板（复制自闪卡原型，随闪卡视图/弹窗 postMessage 联动）
   ============================================================ */
var logicBody = document.getElementById('logicBody');
var viewSwitch = document.getElementById('viewSwitch');
var activePanel = 'view-home';       /* 当前高亮胶囊的视图 */
var settingsOpen = false;            /* 首页设置弹窗开关 */
var completionOpen = false;          /* 完成结算浮层开关 */

var PANELS = {
  'view-home': {
    desc: '首页：考试倒计时 + 章节树 + 学习入口。仅已初始化用户进入（游客引导完成初始化后才可用），考试倒计时为全局统一口径。',
    sections: [
      { num:'1', title:'考试倒计时（Hero 顶部）',
        paras: [
          '锚点：距离最近一届统招专升本考试还有 N 天，N = 当年统考日 − 今日（自然日差）。',
          '考试日期从山东招考院当年公布时间爬取/人工维护，每年更新 1 次，不写入用户画像。'
        ],
        labels: [
          {k:'判断阈值', v:'考试日 ≤ 今日 → 视为过期/待更新'},
          {k:'异常空态', v:'未爬取到或已过期 → 显示「考试日待更新」，不显示负数'}
        ] },
      { num:'2', title:'全部章节（掌握率一览）',
        paras: [

var PANEL_VIEWS = [
  { id: 'view-home',     title: '首页' },
  { id: 'view-single',   title: '单卡模式' },
  { id: 'view-list',     title: '列表模式' },
  { id: 'view-stats',    title: '章节统计' },
  { id: 'view-complete', title: '完成结算页' }
];
/* 面板视图切换胶囊：点胶囊 → 通知闪卡 iframe 跳转（联动） */
PANEL_VIEWS.forEach(function(v) {
  var b = document.createElement('button');
  b.className = 'view-chip';
  b.textContent = v.title;
  b.setAttribute('data-view', v.id);
  b.addEventListener('click', function() {
    setActivePanel(v.id);
    var flash = document.getElementById('frame-flash');
    if (flash && flash.contentWindow) {
      flash.contentWindow.postMessage({ type: 'REQUEST_NAV', view: v.id }, '*');
    }
  });
  viewSwitch.appendChild(b);
});

function setActivePanel(viewId) {
  activePanel = viewId;
  document.querySelectorAll('#viewSwitch .view-chip').forEach(function(chip) {
    chip.classList.toggle('active', chip.getAttribute('data-view') === viewId);
  });
}

function currentLogicData() {
  /* 弹窗/浮层打开时 → 逻辑说明自动切到对应面板，关闭时恢复原视图说明：
     - 完成页浮层 → 完成结算页
     - 首页设置弹窗 → 背诵设置
     优先级：完成页浮层 > 设置弹窗 （与闪卡原型一致） */
  if (completionOpen && PANELS['view-complete']) return PANELS['view-complete'];
  if (settingsOpen && PANELS['view-settings']) return PANELS['view-settings'];
  return PANELS[activePanel] || { desc: '当前视图：' + activePanel, sections: [] };
}

function renderLogicPanel(data) {
  logicBody.innerHTML = '';
  var de = document.createElement('div'); de.className = 'logic-desc'; de.textContent = data.desc || ''; logicBody.appendChild(de);
  (data.sections || []).forEach(function(sec) {
    var card = document.createElement('div'); card.className = 'logic-sec';
    var head = document.createElement('div'); head.className = 'logic-sec-head';
    head.innerHTML = '<span class="num">' + sec.num + '</span><span class="sec-name">' + esc(sec.title) + '</span>';
    card.appendChild(head);
    var body = document.createElement('div'); body.className = 'logic-sec-body';
    (sec.paras || []).forEach(function(t) { var p = document.createElement('div'); p.className = 'logic-para'; p.textContent = t; body.appendChild(p); });
    (sec.labels || []).forEach(function(lb) { var d = document.createElement('div'); d.className = 'logic-label'; d.innerHTML = '<span class="k">' + esc(lb.k) + '</span><span class="v">' + esc(lb.v) + '</span>'; body.appendChild(d); });
    if (sec.table && sec.table.length) {
      var t = document.createElement('table'); t.className = 'logic-table';
      var hr = '<tr>' + (sec.tableHead || ['项','规则']).map(function(h){return '<th>'+esc(h)+'</th>';}).join('') + '</tr>';
      var br = sec.table.map(function(r){ return '<tr>' + r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('') + '</tr>'; }).join('');
      t.innerHTML = hr + br; body.appendChild(t);
    }
    if (sec.table2 && sec.table2.length) {
      var t2 = document.createElement('table'); t2.className = 'logic-table';
      var hr2 = '<tr>' + (sec.tableHead2 || ['项','规则']).map(function(h){return '<th>'+esc(h)+'</th>';}).join('') + '</tr>';
      var br2 = sec.table2.map(function(r){ return '<tr>' + r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('') + '</tr>'; }).join('');
      t2.innerHTML = hr2 + br2; body.appendChild(t2);
    }
    card.appendChild(body);
    logicBody.appendChild(card);
  });
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---------- 逻辑面板开关 ---------- */
var logicCol = document.getElementById('logicCol');
function toggleLogic() {
  logicCol.classList.toggle('open');
}
document.getElementById('logicClose').addEventListener('click', toggleLogic);

/* 初始渲染：默认首页说明 */
setActivePanel('view-home');
renderLogicPanel(currentLogicData());

/* 手机状态栏时钟 */
setInterval(function() {
  var d = new Date();
  var t = document.getElementById('statusTime');
  if (t) t.textContent = (d.getHours() < 10 ? '0' + d.getHours() : d.getHours()) + ':' + (d.getMinutes() < 10 ? '0' + d.getMinutes() : d.getMinutes());
}, 30000);
