<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>VIP 领取</title>
<style>
:root{
  --primary: #5B72F5;
  --primary-dark: #4358D7;
  --primary-light: #EEF1FF;
  --text-primary: #202533;
  --text-secondary: #6E778B;
  --text-tertiary: #98A0B2;
  --success: #20A866;
  --hero-radius: 22px;
  --card-radius: 17px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text-primary);
  background: #F8F9FC;
  -webkit-overflow-scrolling: touch;
}
.content { max-width: 430px; margin: 0 auto; padding: 0 18px 30px; }

/* 顶部品牌区 */
.vip-hero {
  background: linear-gradient(135deg, #FFD97A 0%, #F5B940 100%);
  border-radius: 0 0 26px 26px;
  padding: 30px 20px 26px;
  text-align: center;
  margin: 0 -18px 22px;
  position: relative;
  overflow: hidden;
}
.vip-hero::before {
  content: ''; position: absolute; right: -40px; top: -40px;
  width: 160px; height: 160px; border-radius: 50%;
  background: rgba(255,255,255,0.18);
}
.vip-hero::after {
  content: ''; position: absolute; left: -50px; bottom: -70px;
  width: 180px; height: 180px; border-radius: 50%;
  background: rgba(255,255,255,0.12);
}
.vip-crown { position: relative; z-index: 1; font-size: 44px; margin-bottom: 6px; }
.vip-title { position: relative; z-index: 1; font-size: 24px; font-weight: 800; color: #4A3200; }
.vip-sub { position: relative; z-index: 1; font-size: 13px; color: #7A5200; margin-top: 6px; }

/* 状态区：未登录 / 领取成功 二选一 */
.state-box {
  position: relative; z-index: 1;
  background: #fff; border-radius: var(--hero-radius);
  padding: 26px 20px;
  box-shadow: 0 14px 32px rgba(76,99,221,0.08);
  margin-top: 14px;
  text-align: center;
}
.state-box .st-label { font-size: 13px; color: var(--text-tertiary); margin-bottom: 8px; }
.state-box.hidden { display: none; }

/* 权益对比表 */
.benefits {
  margin-top: 20px;
}
.benefits-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.benefits-title::before { content: ''; width: 4px; height: 16px; border-radius: 2px; background: var(--primary); }
.benefit-row {
  display: flex; align-items: center; justify-content: space-between;
  background: #fff; border-radius: var(--card-radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: 0 5px 18px rgba(54,66,108,0.055);
}
.benefit-row .b-name { font-size: 14px; font-weight: 600; }
.benefit-row .b-desc { font-size: 11px; color: var(--text-tertiary); margin-top: 3px; }
.benefit-row .b-free { font-size: 12px; color: var(--text-tertiary); }
.benefit-row .b-vip { font-size: 13px; color: var(--primary-dark); font-weight: 700; }
.benefit-row .b-free .line { text-decoration: line-through; }

/* 登录按钮 */
.btn-phone {
  width: 100%; height: 50px;
  border: none; border-radius: 25px;
  background: linear-gradient(135deg, #09BB07, #0DAF00);
  color: #fff; font-size: 16px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  cursor: pointer;
  box-shadow: 0 8px 18px rgba(9,187,7,0.22);
}
.btn-phone:active { transform: scale(0.98); }
.btn-phone svg { width: 20px; height: 20px; }
.agree {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 12px; color: var(--text-tertiary); margin: 12px 0 0;
}
.agree a { color: var(--primary-dark); text-decoration: none; }

/* 领取成功态 */
.success-box { padding-top: 4px; }
.success-icon {
  width: 72px; height: 72px; border-radius: 50%;
  background: var(--success); color: #fff;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 12px;
  animation: pop .35s ease;
}
.success-icon svg { width: 36px; height: 36px; }
.success-title { font-size: 19px; font-weight: 700; margin-bottom: 6px; }
.success-sub { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; }
.btn-primary {
  width: 100%; height: 48px; border: none; border-radius: 14px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff; font-size: 15px; font-weight: 600;
  cursor: pointer;
  box-shadow: 0 10px 22px rgba(91,114,245,0.25);
}
@keyframes pop { 0% { transform: scale(.5); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<div class="content">

  <!-- 顶部 VIP 品牌区 -->
  <div class="vip-hero">
    <div class="vip-crown">👑</div>
    <div class="vip-title">新用户专享 VIP</div>
    <div class="vip-sub">登录立即领取，免费体验</div>
  </div>

  <!-- 状态一：未登录 → 微信登录并领取 -->
  <div class="state-box" id="boxLogin">
    <div class="st-label">登录后自动领取，无需支付</div>
    <button class="btn-phone" id="loginBtn" onclick="doLogin()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 4.5a1 1 0 0 0-1.4.2 11 11 0 0 0 0 14.6 1 1 0 1 0 1.5-1.3 9 9 0 0 1 0-12 .9.9 0 0 0-.1-1.5zM16.9 2.7a1 1 0 1 0-1.5 1.3 9 9 0 0 1 0 12l.1.1a1 1 0 0 0 1.7-.7 9 9 0 0 0-.3-2.4 9 9 0 0 0 0-7.6zM10.7 6a1 1 0 0 0-1.4.3 7 7 0 0 0 0 7.5 1 1 0 0 0 1.7-1.1 5 5 0 0 1 0-5.3 1 1 0 0 0-.3-1.4z"/></svg>
      微信一键登录并领取
    </button>
    <div class="agree"><input type="checkbox" id="agreeBox" checked /> <span>已阅读并同意</span> <a href="javascript:void(0)">《用户协议》</a> <span>/</span> <a href="javascript:void(0)">《隐私政策》</a></div>
  </div>

  <!-- 状态二：领取成功 -->
  <div class="state-box success-box hidden" id="boxSuccess">
    <div class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <div class="success-title">领取成功</div>
    <div class="success-sub">VIP 体验已到账<br/>AI答疑、VIP押题等全部权益已解锁</div>
    <button class="btn-primary" onclick="goExperience()">立即体验</button>
  </div>

  <!-- 权益对比 -->
  <div class="benefits">
    <div class="benefits-title">VIP 专属权益</div>
    <div class="benefit-row">
      <div><div class="b-name">AI 答疑</div><div class="b-desc">政策 / 专业 / 分数问题</div></div>
      <div class="b-free"><span class="line">3次/天</span> → <span class="b-vip">无限次</span></div>
    </div>
    <div class="benefit-row">
      <div><div class="b-name">VIP 押题</div><div class="b-desc">高频考点，考前预测</div></div>
      <div class="b-free"><span class="line">不可用</span> → <span class="b-vip">全解锁</span></div>
    </div>
    <div class="benefit-row">
      <div><div class="b-name">视频课程</div><div class="b-desc">考点精讲视频</div></div>
      <div class="b-free"><span class="line">限时试看</span> → <span class="b-vip">完整观看</span></div>
    </div>
    <div class="benefit-row">
      <div><div class="b-name">闪卡</div><div class="b-desc">AI 记忆卡片</div></div>
      <div class="b-free"><span class="line">10张/天</span> → <span class="b-vip">无限制</span></div>
    </div>
  </div>

</div>

<script>
/* ---------- VIP 领取页：登录 → 领取成功 ---------- */
function doLogin() {
  var box = document.getElementById('agreeBox');
  if (!box.checked) { alert('请先同意协议'); return; }
  document.getElementById('boxLogin').classList.add('hidden');
  document.getElementById('boxSuccess').classList.remove('hidden');
  /* 上报总壳：登录 + VIP 已领取（总壳广播到所有 tab） */
  try {
    window.parent.postMessage({ type: 'LOGGED', data: { user: { nick: '团团酱', grade: '大三', major: '计算机大类' } } }, '*');
    window.parent.postMessage({ type: 'VIP' }, '*');
  } catch(e) {}
}
function goExperience() {
  /* 立即体验 → 回到学习 tab */
  try { if (window.parent && window.parent.switchTab) window.parent.switchTab('study'); } catch(e) {}
}
</script>
</body>
</html>
