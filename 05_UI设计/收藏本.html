<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>收藏本</title>
<style>
/* ==== Product Theme：蓝靛 #5B72F5（与题库首页/错题本统一） ====
   收藏本首页（v2.1 删题型筛选+按试卷分组 2026-09-07）
   结构：来源 Tab → 筛选栏（exam/real 显「按章节|按试卷」切换 + 全部练习→）→ 一级章节 → 二级章节（可展开三级）→ 三级考点
   定位：收藏题目的章节索引（非做题页、非题目本身），1/2/3 级均只显题数
   交互：
     - 点一级章节名 → 该一级全部收藏题做题页
     - 点二级展开按钮(∧/∨) → 展开/收起三级考点；点二级章节名 → 该二级全部收藏题做题页
     - 点三级考点 → 该考点全部收藏题做题页
     - 来源 Tab → 联动重算各级题数；exam/real 可切「按章节/按试卷」分组
   做题页对接：复用 REQ_PRACTICE 协议（entry=fav, scope=chap/sub/point/all/paper/papersub/paperpoint） */
:root{
  --primary: #5B72F5;
  --primary-dark: #4358D7;
  --primary-light: #EEF1FF;
  --brand-teal: #3FA98B;
  --text-primary: #1E2130;
  --text-secondary: #6E778B;
  --text-tertiary: #98A0B2;
  --success: #20A866;
  --warning: #F28B3D;
  --danger: #EF4444;
  --card-radius: 17px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
* { scrollbar-width: none; }
*::-webkit-scrollbar { display: none; width: 0; height: 0; }
html, body { width: 100%; height: 100%; overflow-x: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text-primary);
  background-color: #EDEFF7;
  -webkit-overflow-scrolling: touch;
}

.page { display: flex; flex-direction: column; height: 100%; }

/* ===== 来源 Tab ===== */
.src-tabs {
  display: flex; gap: 0;
  padding: 10px 16px 8px;
  background: #fff;
  border-bottom: 1px solid #EEF0F6;
  flex-shrink: 0;
}
.src-tab {
  flex: 1;
  height: 34px;
  border: none; background: none;
  font-size: 13px; font-weight: 600;
  color: var(--text-tertiary);
  cursor: pointer;
  position: relative;
  transition: color .15s ease;
}
.src-tab.active { color: var(--primary); }
.src-tab.active::after {
  content: ''; position: absolute;
  bottom: -9px; left: 50%; transform: translateX(-50%);
  width: 22px; height: 3px; border-radius: 2px;
  background: var(--primary);
}

/* ===== 筛选栏 ===== */
.filter-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  flex-shrink: 0;
}
/* 分组切换 segment（仅 exam/real 来源显示）：按章节 | 按试卷 */
.group-seg {
  display: inline-flex; align-items: center;
  height: 30px; border: 1px solid #E5E8F0; border-radius: 15px;
  background: #fff; padding: 2px; overflow: hidden;
}
.seg-btn {
  height: 26px; padding: 0 12px;
  border: none; background: none; border-radius: 13px;
  font-size: 12.5px; font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background .15s ease, color .15s ease;
}
.seg-btn.active { background: var(--primary); color: #fff; }
.seg-btn:active { opacity: .8; }

.fav-practice {
  display: inline-flex; align-items: center; gap: 3px;
  height: 30px; padding: 0 8px;
  border: none; background: none;
  font-size: 13px; font-weight: 700;
  color: var(--primary);
  cursor: pointer;
  margin-left: auto;   /* exam/real 无分组切换时靠右 */
  transition: opacity .15s ease;
}
.fav-practice:active { opacity: .6; }

/* ===== 列表区 ===== */
.list-wrap {
  flex: 1; overflow-y: auto;
  padding: 4px 16px 24px;
}

/* 一级章节：标题行，可点进做题页 */
.l1-group { margin-bottom: 2px; }
.l1-row {
  display: flex; align-items: center; gap: 8px;
  padding: 16px 4px 6px;
  cursor: pointer;
}
.l1-row:active { opacity: .6; }
.l1-name { font-size: 16px; font-weight: 800; color: var(--text-primary); }
.l1-count { font-size: 11.5px; color: var(--text-tertiary); font-weight: 500; font-variant-numeric: tabular-nums; }
.l1-arrow { font-size: 17px; color: var(--text-tertiary); line-height: 1; margin-left: auto; }

/* 二级章节：行，可点进做题页 + 展开按钮 */
.l2-row {
  display: flex; align-items: center; gap: 8px;
  background: #fff;
  border-radius: 12px;
  padding: 12px 14px;
  margin: 6px 0;
  box-shadow: 0 1px 2px rgba(38,48,96,.04), 0 2px 6px rgba(91,114,245,.05);
  cursor: pointer;
}
.l2-row:active { transform: scale(.995); }
.l2-name { font-size: 14px; font-weight: 600; color: var(--text-primary); flex: 1; }
.l2-count { font-size: 11px; color: var(--text-tertiary); font-weight: 500; font-variant-numeric: tabular-nums; }
.l2-toggle {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--primary);
  border-radius: 6px;
  cursor: pointer;
  flex-shrink: 0;
  transition: background .12s ease;
}
.l2-toggle:active { background: var(--primary-light); }
.l2-toggle .caret { transition: transform .2s ease; display: inline-block; }
.l2-group.open .l2-toggle .caret { transform: rotate(90deg); }

/* 三级考点：展开后显示 */
.l3-list {
  display: none;
  padding: 2px 0 6px 18px;
}
.l2-group.open .l3-list { display: block; }
.l3-row {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px 10px 8px;
  cursor: pointer;
  border-left: 2px solid #EEF0F6;
  margin-left: 4px;
  transition: border-color .12s ease;
}
.l3-row:active { background: #F5F6FA; }
.l3-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-tertiary); flex-shrink: 0; }
.l3-name { font-size: 13px; font-weight: 500; color: var(--text-secondary); flex: 1; }
.l3-count { font-size: 11px; color: var(--text-tertiary); font-weight: 500; font-variant-numeric: tabular-nums; }
.l3-arrow { font-size: 14px; color: var(--text-tertiary); line-height: 1; }

/* ===== 空状态 ===== */
.empty {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 20px;
  text-align: center;
}
.empty-ico {
  font-size: 48px; color: var(--text-tertiary); margin-bottom: 18px;
}
.empty-title { font-size: 15px; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; }
.empty-desc { font-size: 12.5px; color: var(--text-tertiary); line-height: 1.6; margin-bottom: 20px; max-width: 240px; }
.empty-btn {
  display: inline-flex; align-items: center; gap: 3px;
  height: 34px; padding: 0 18px;
  border: 1.5px solid var(--primary); border-radius: 17px;
  background: var(--primary-light);
  font-size: 13px; font-weight: 700;
  color: var(--primary);
  cursor: pointer;
  transition: transform .12s ease;
}
.empty-btn:active { transform: scale(.97); }

/* ===== Toast ===== */
.toast {
  position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
  background: rgba(30,33,48,.88); color: #fff;
  padding: 8px 18px; border-radius: 8px;
  font-size: 12.5px; z-index: 999;
  opacity: 0; transition: opacity .2s ease; pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; }

/* ===== 做题返回提示浮层（有未练闪卡） ===== */
.fav-prompt-mask {
  position: fixed; inset: 0; background: rgba(30,33,48,.45);
  z-index: 1000; display: none; align-items: center; justify-content: center;
}
.fav-prompt-mask.show { display: flex; }
.fav-prompt-card {
  width: 300px; background: #fff; border-radius: 16px;
  padding: 24px 22px 18px; text-align: center;
  box-shadow: 0 12px 40px rgba(30,33,48,.18);
  animation: fp-in .2s ease;
}
@keyframes fp-in { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.fav-prompt-ico { font-size: 32px; margin-bottom: 10px; }
.fav-prompt-title { font-size: 15.5px; font-weight: 700; color: var(--text-primary, #1E2130); margin-bottom: 6px; }
.fav-prompt-desc { font-size: 12.5px; color: var(--text-tertiary, #98A0B2); line-height: 1.5; margin-bottom: 18px; }
.fav-prompt-btns { display: flex; gap: 10px; }
.fav-prompt-btn { flex: 1; padding: 10px 0; border-radius: 10px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; }
.fav-prompt-btn-primary { background: var(--primary, #5B72F5); color: #fff; }
.fav-prompt-btn-primary:active { opacity: .85; }
.fav-prompt-btn-secondary { background: #F3F4F6; color: var(--text-secondary, #6E778B); }
.fav-prompt-btn-secondary:active { opacity: .7; }
</style>
</head>
<body>

<div class="page" id="page">

  <!-- 来源 Tab -->
  <div class="src-tabs" id="srcTabs">
    <button class="src-tab active" data-src="all" onclick="setSrc('all')">全部</button>
    <button class="src-tab" data-src="chapter" onclick="setSrc('chapter')">章节刷题</button>
    <button class="src-tab" data-src="exam" onclick="setSrc('exam')">模拟考试</button>
    <button class="src-tab" data-src="real" onclick="setSrc('real')">历年真题</button>
    <button class="src-tab" data-src="flash" onclick="setSrc('flash')">闪卡</button>
  </div>

  <!-- 筛选栏：左侧分组切换（仅 exam/real 来源显示）+ 右侧全部练习 -->
  <div class="filter-bar">
    <div class="group-seg" id="groupSeg" style="display:none;">
      <button class="seg-btn active" data-gm="chap" onclick="setGroup('chap')">按章节</button>
      <button class="seg-btn" data-gm="paper" onclick="setGroup('paper')">按试卷</button>
    </div>
    <button class="fav-practice" onclick="practiceAll()">全部练习 →</button>
  </div>

  <!-- 列表区 -->
  <div class="list-wrap" id="listWrap"></div>

  <!-- 空状态 -->
  <div class="empty" id="empty" style="display:none;">
    <div class="empty-ico">☆</div>
    <div class="empty-title">还没有收藏题目</div>
    <div class="empty-desc">做题或背闪卡时遇到值得复习的题目，点击收藏，就会出现在这里</div>
    <button class="empty-btn" onclick="goChapter()">去章节刷题 →</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- 做题返回提示：有未练闪卡 -->
<div class="fav-prompt-mask" id="favPromptMask">
  <div class="fav-prompt-card">
    <div class="fav-prompt-ico">📚</div>
    <div class="fav-prompt-title">您还有未完成的闪卡</div>
    <div class="fav-prompt-desc">做题已完成，收藏的闪卡还没背，趁热巩固一下？</div>
    <div class="fav-prompt-btns">
      <button class="fav-prompt-btn fav-prompt-btn-secondary" onclick="dismissFavPrompt()">稍后练</button>
      <button class="fav-prompt-btn fav-prompt-btn-primary" onclick="continueFavFlash()">继续练</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   收藏本 mock 数据（演示期；三级章节树覆盖计算机四模块）
   字段口径：
     qid        题目 id（与做题页 qid 对齐）
     source     来源：chapter 章节刷题 / exam 模拟考试 / real 历年真题 / flash 闪卡
     l1         一级章节名
     l2         二级章节名
     l3         三级考点名
     type       题型：single 单选 / multi 多选 / judge 判断 / fill 填空
   ============================================================ */
var SRC_NAME = { chapter:'章节刷题', exam:'模拟考试', real:'历年真题', flash:'闪卡' };

var FAV_DATA = [
  /* —— 计算机基础 —— */
  { qid:'W01', source:'chapter', l1:'计算机基础', l2:'信息与计算机基础知识', l3:'信息技术概述',     type:'single', collectedAt:'09-03' },
  { qid:'W02', source:'real',     l1:'计算机基础', l2:'信息与计算机基础知识', l3:'计算机的发展',     type:'fill',   collectedAt:'09-02', paper:'2023 山东专升本真题' },
  { qid:'W03', source:'exam',     l1:'计算机基础', l2:'信息与计算机基础知识', l3:'数制与编码',       type:'single', collectedAt:'08-30', paper:'2026 山东专升本全真模拟（一）' },
  { qid:'W04', source:'flash',    l1:'计算机基础', l2:'信息与计算机基础知识', l3:'信息与数据的区别', type:'judge',  collectedAt:'08-28',
    front:'信息是可以直接用于决策的数据。', answer:'错误', analysis:'信息是经过加工处理后对决策有价值的数据，不是所有数据都能直接用于决策。原始数据需经处理、解释后才能成为信息。' },
  { qid:'W01', source:'chapter',  l1:'计算机基础', l2:'操作系统',             l3:'操作系统的基本功能', type:'single', collectedAt:'09-01' },
  { qid:'W02', source:'real',     l1:'计算机基础', l2:'操作系统',             l3:'进程与线程的概念',   type:'fill',   collectedAt:'08-29', paper:'2023 山东专升本真题' },
  { qid:'W03', source:'exam',     l1:'计算机基础', l2:'操作系统',             l3:'文件系统与扩展名',   type:'judge',  collectedAt:'08-27', paper:'2026 山东专升本全真模拟（一）' },
  { qid:'W04', source:'flash',    l1:'计算机基础', l2:'操作系统',             l3:'存储管理方式',       type:'multi',  collectedAt:'08-25',
    front:'下列属于操作系统存储管理方式的有（多选）：\nA. 分页式\nB. 分段式\nC. 段页式\nD. 虚拟内存', answer:'A, B, C, D', analysis:'操作系统存储管理主要有连续分配、分页、分段、段页式四种方式；虚拟内存是存储管理的一种扩展技术，可实现逻辑上扩充内存容量。四种都是常见的存储管理方式。' },

  /* —— 计算机网络 —— */
  { qid:'W05', source:'chapter',  l1:'计算机网络', l2:'网络协议', l3:'TCP/IP 协议体系',    type:'multi',  collectedAt:'09-03' },
  { qid:'W06', source:'real',     l1:'计算机网络', l2:'网络协议', l3:'OSI 参考模型',       type:'single', collectedAt:'08-31', paper:'2022 山东专升本真题' },
  { qid:'W05', source:'exam',     l1:'计算机网络', l2:'IP 地址',  l3:'IP 地址与子网掩码',   type:'judge',  collectedAt:'08-24', paper:'2026 山东专升本全真模拟（二）' },
  { qid:'W06', source:'flash',    l1:'计算机网络', l2:'IP 地址',  l3:'域名与 DNS',          type:'single', collectedAt:'08-20',
    front:'DNS 的主要作用是（单选）：\nA. 分配 IP 地址\nB. 将域名解析为 IP 地址\nC. 路由数据包\nD. 加密网络通信', answer:'B', analysis:'DNS（Domain Name System）的主要功能是将人类易记的域名（如 www.example.com）解析为机器识别的 IP 地址，便于网络通信。IP 分配由 DHCP 负责，路由由路由器负责。' },

  /* —— 数据库 —— */
  { qid:'W06', source:'chapter',  l1:'数据库', l2:'关系数据库', l3:'三级模式结构',    type:'single', collectedAt:'09-02' },
  { qid:'W01', source:'real',     l1:'数据库', l2:'关系数据库', l3:'关系代数运算',    type:'fill',   collectedAt:'08-26', paper:'2023 山东专升本真题' },
  { qid:'W02', source:'flash',    l1:'数据库', l2:'SQL 语言',    l3:'SQL 语句分类',   type:'multi',  collectedAt:'08-22',
    front:'下列属于 DML（数据操纵语言）的语句有（多选）：\nA. SELECT\nB. INSERT\nC. CREATE\nD. UPDATE', answer:'A, B, D', analysis:'DML（Data Manipulation Language）用于操作数据，包含 SELECT、INSERT、UPDATE、DELETE 等。CREATE 属于 DDL（数据定义语言），用于定义表结构，不属于 DML。' },

  /* —— 数据结构 —— */
  { qid:'W03', source:'chapter',  l1:'数据结构', l2:'树与图',   l3:'二叉树的遍历方法', type:'single', collectedAt:'09-01' },
  { qid:'W04', source:'exam',     l1:'数据结构', l2:'线性结构', l3:'栈与队列的特点',   type:'judge',  collectedAt:'08-23', paper:'2026 山东专升本全真模拟（二）' }
];

/* 运行态：mock 内存态（刷新恢复） */
var items = FAV_DATA.map(function(x){ return Object.assign({}, x); });

var SRC = 'all';        /* 来源筛选：all/chapter/exam/real/flash */
var GROUP_MODE = 'chap'; /* 分组模式：chap 按章节 / paper 按试卷（仅 exam/real 有效） */
/* 展开态：key = l1 + '||' + l2（章节模式）或 paper + '||' + l2（试卷模式），value = true */
var OPEN_MAP = {};

/* ===== 来源筛选 ===== */
function setSrc(s) {
  SRC = s;
  document.querySelectorAll('.src-tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.src === s);
  });
  /* 分组切换仅 exam/real 显示；切其他来源时复位为按章节 */
  var showGroup = (s === 'exam' || s === 'real');
  document.getElementById('groupSeg').style.display = showGroup ? '' : 'none';
  if (!showGroup) GROUP_MODE = 'chap';
  renderList();
}

/* ===== 分组切换（PM 2026-09-07：exam/real 可切按章节/按试卷） ===== */
function setGroup(gm) {
  GROUP_MODE = gm;
  document.querySelectorAll('.seg-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.gm === gm);
  });
  renderList();
}

/* ===== 过滤（题型筛选已移除，type 字段保留供做题/闪卡链路用） ===== */
function passFilter(it) {
  if (SRC !== 'all' && it.source !== SRC) return false;
  return true;
}

/* ===== 按 l1 → l2 → l3 聚合成树（保持插入顺序） ===== */
function buildTree() {
  var tree = {};   /* l1 -> { _count, l2s: { l2 -> { _count, l3s: { l3 -> count } } } } */
  var l1Order = [];
  items.filter(passFilter).forEach(function(it) {
    if (!tree[it.l1]) { tree[it.l1] = { _count: 0, l2s: {}, l2Order: [] }; l1Order.push(it.l1); }
    var l1 = tree[it.l1];
    l1._count++;
    if (!l1.l2s[it.l2]) { l1.l2s[it.l2] = { _count: 0, l3s: {}, l3Order: [] }; l1.l2Order.push(it.l2); }
    var l2 = l1.l2s[it.l2];
    l2._count++;
    if (!l2.l3s[it.l3]) { l2.l3s[it.l3] = 0; l2.l3Order.push(it.l3); }
    l2.l3s[it.l3]++;
  });
  return { tree: tree, l1Order: l1Order };
}

/* ===== 按试卷聚合成树（PM 2026-09-07：exam/real 用，卷名 → l2 → l3，不显 l1） ===== */
function buildPaperTree() {
  var tree = {};   /* paper -> { _count, l2s: { l2 -> { _count, l3s: { l3 -> count } } } } */
  var paperOrder = [];
  items.filter(passFilter).forEach(function(it) {
    var paper = it.paper || '未分组';
    if (!tree[paper]) { tree[paper] = { _count: 0, l2s: {}, l2Order: [] }; paperOrder.push(paper); }
    var p = tree[paper];
    p._count++;
    if (!p.l2s[it.l2]) { p.l2s[it.l2] = { _count: 0, l3s: {}, l3Order: [] }; p.l2Order.push(it.l2); }
    var l2 = p.l2s[it.l2];
    l2._count++;
    if (!l2.l3s[it.l3]) { l2.l3s[it.l3] = 0; l2.l3Order.push(it.l3); }
    l2.l3s[it.l3]++;
  });
  return { tree: tree, paperOrder: paperOrder };
}

/* ===== 渲染列表（三级树） ===== */
function renderList() {
  var filtered = items.filter(passFilter);
  var wrap = document.getElementById('listWrap');
  var empty = document.getElementById('empty');

  if (!filtered.length) {
    wrap.style.display = 'none';
    empty.style.display = 'flex';
    return;
  }
  wrap.style.display = 'block';
  empty.style.display = 'none';

  var html = '';
  if (GROUP_MODE === 'paper' && (SRC === 'exam' || SRC === 'real')) {
    /* —— 按试卷分组（PM 2026-09-07）：卷名 → l2 → l3，不显 l1 —— */
    var r = buildPaperTree();
    r.paperOrder.forEach(function(paper) {
      var p = r.tree[paper];
      html += '<div class="l1-group">'
        +   '<div class="l1-row" onclick="goPractice(\'paper\',\'' + esc(paper) + '\',\'\',\'\')">'
        +     '<span class="l1-name">' + paper + '</span>'
        +     '<span class="l1-count">' + p._count + ' 道</span>'
        +     '<span class="l1-arrow">›</span>'
        +   '</div>';
      p.l2Order.forEach(function(l2name) {
        var l2 = p.l2s[l2name];
        var key = paper + '||' + l2name;
        var isOpen = !!OPEN_MAP[key];
        html += '<div class="l2-group' + (isOpen ? ' open' : '') + '">'
          +   '<div class="l2-row">'
          +     '<span class="l2-name" onclick="goPractice(\'papersub\',\'' + esc(paper) + '\',\'' + esc(l2name) + '\',\'\')">' + l2name + '</span>'
          +     '<span class="l2-count">' + l2._count + ' 道</span>'
          +     '<span class="l2-toggle" onclick="toggleL2(\'' + esc(key) + '\')"><span class="caret">›</span></span>'
          +   '</div>'
          +   '<div class="l3-list">';
        l2.l3Order.forEach(function(l3name) {
          html += '<div class="l3-row" onclick="goPractice(\'paperpoint\',\'' + esc(paper) + '\',\'' + esc(l2name) + '\',\'' + esc(l3name) + '\')">'
            +   '<span class="l3-dot"></span>'
            +   '<span class="l3-name">' + l3name + '</span>'
            +   '<span class="l3-count">' + l2.l3s[l3name] + ' 道</span>'
            +   '<span class="l3-arrow">›</span>'
            + '</div>';
        });
        html +=   '</div>'
          +   '</div>';
      });
      html += '</div>';
    });
  } else {
    /* —— 按章节分组：l1 → l2 → l3 —— */
    var r = buildTree();
    r.l1Order.forEach(function(l1name) {
      var l1 = r.tree[l1name];
      html += '<div class="l1-group">'
        +   '<div class="l1-row" onclick="goPractice(\'chap\',\'' + esc(l1name) + '\',\'\',\'\')">'
        +     '<span class="l1-name">' + l1name + '</span>'
        +     '<span class="l1-count">' + l1._count + ' 道</span>'
        +     '<span class="l1-arrow">›</span>'
        +   '</div>';
      l1.l2Order.forEach(function(l2name) {
        var l2 = l1.l2s[l2name];
        var key = l1name + '||' + l2name;
        var isOpen = !!OPEN_MAP[key];
        html += '<div class="l2-group' + (isOpen ? ' open' : '') + '">'
          +   '<div class="l2-row">'
          +     '<span class="l2-name" onclick="goPractice(\'sub\',\'' + esc(l1name) + '\',\'' + esc(l2name) + '\',\'\')">' + l2name + '</span>'
          +     '<span class="l2-count">' + l2._count + ' 道</span>'
          +     '<span class="l2-toggle" onclick="toggleL2(\'' + esc(key) + '\')"><span class="caret">›</span></span>'
          +   '</div>'
          +   '<div class="l3-list">';
        l2.l3Order.forEach(function(l3name) {
          html += '<div class="l3-row" onclick="goPractice(\'point\',\'' + esc(l1name) + '\',\'' + esc(l2name) + '\',\'' + esc(l3name) + '\')">'
            +   '<span class="l3-dot"></span>'
            +   '<span class="l3-name">' + l3name + '</span>'
            +   '<span class="l3-count">' + l2.l3s[l3name] + ' 道</span>'
            +   '<span class="l3-arrow">›</span>'
            + '</div>';
        });
        html +=   '</div>'
          +   '</div>';
      });
      html += '</div>';
    });
  }
  wrap.innerHTML = html;
}

/* 转义单引号（onclick 参数安全） */
function esc(s) {
  return String(s).replace(/'/g, "\\'");
}

/* ===== 二级展开/收起 ===== */
function toggleL2(key) {
  OPEN_MAP[key] = !OPEN_MAP[key];
  /* 局部刷新：重渲染（树态保持 OPEN_MAP） */
  renderList();
}

/* ===== 进入做题页（复用 REQ_PRACTICE；entry=fav, scope=chap/sub/point/all/paper/papersub/paperpoint） ===== */
/* 收藏题做题+闪卡分阶段：做题列表排除 source=flash（闪卡不经做题页填空）；
   若原范围含 flash → 写临时 key 供闪卡原型读取 + 标记总壳 sessionStorage（PM 2026-09-07） */
function goPractice(scope, l1, l2, l3) {
  var list = items.filter(function(it) {
    if (!passFilter(it)) return false;
    if (scope === 'chap')       return it.l1 === l1;
    if (scope === 'sub')        return it.l1 === l1 && it.l2 === l2;
    if (scope === 'point')      return it.l1 === l1 && it.l2 === l2 && it.l3 === l3;
    /* 按试卷模式：l1 参数为 paper 卷名 */
    if (scope === 'paper')      return it.paper === l1;
    if (scope === 'papersub')  return it.paper === l1 && it.l2 === l2;
    if (scope === 'paperpoint')return it.paper === l1 && it.l2 === l2 && it.l3 === l3;
    return false;
  });
  if (!list.length) { showToast('该范围暂无收藏题'); return; }
  stashFlashForLater(list, scope);
  var practiceList = list.filter(function(it){ return it.source !== 'flash'; });
  if (!practiceList.length) { showToast('该范围仅有闪卡，请直接练闪卡'); return; }
  writeFavPractice(practiceList, scope, l1, l2, l3);
  var name = scope === 'chap' ? l1
    : scope === 'sub' ? l2
    : scope === 'point' ? l3
    : scope === 'paper' ? l1
    : scope === 'papersub' ? l2
    : l3;
  try {
    window.parent.postMessage({ type:'REQ_PRACTICE', data:{
      entry:'fav', scope: scope, name: name + ' · 收藏题'
    } }, '*');
  } catch(e) {
    showToast('请从总壳进入，开始练习');
  }
}

/* 全部练习：当前筛选范围 */
function practiceAll() {
  var list = items.filter(passFilter);
  if (!list.length) { showToast('没有可练习的收藏题'); return; }
  stashFlashForLater(list, 'all');
  var practiceList = list.filter(function(it){ return it.source !== 'flash'; });
  /* 随机打乱做题列表（PM 2026-09-07） */
  for (var i = practiceList.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = practiceList[i]; practiceList[i] = practiceList[j]; practiceList[j] = t;
  }
  if (!practiceList.length) { showToast('当前仅有闪卡，请直接练闪卡'); return; }
  writeFavPractice(practiceList, 'all', '', '', '');
  try {
    window.parent.postMessage({ type:'REQ_PRACTICE', data:{
      entry:'fav', scope:'all', name:'收藏题练习'
    } }, '*');
  } catch(e) {
    showToast('请从总壳进入，开始练习');
  }
}

/* 范围内含 flash 时：写临时 key 供闪卡原型读取 + 标记总壳 sessionStorage（做题返回后弹提示） */
function stashFlashForLater(fullList, scope) {
  var flashList = fullList.filter(function(it){ return it.source === 'flash' && it.front; });
  if (!flashList.length) return;
  try {
    localStorage.setItem('zsb_fav_flash_v1', JSON.stringify(flashList.map(function(x){
      return { qid: x.qid, source: x.source, l1: x.l1, l2: x.l2, l3: x.l3, type: x.type,
        front: x.front, answer: x.answer, analysis: x.analysis };
    })));
    /* 待练闪卡标记用本页自身 localStorage：file:// 直开时各 iframe 独立 origin，
       window.top/parent.sessionStorage 跨文档直取被拦截→标记丢失→返回不弹窗（PM 2026-09-07 修） */
    localStorage.setItem('zsb_fav_flash_pending_v1', '1');
  } catch(e) {}
}

/* 写入临时 key，做题页 entry=fav 读取出题 */
function writeFavPractice(list, scope, l1, l2, l3) {
  try {
    localStorage.setItem('zsb_fav_practice_v1', JSON.stringify(list.map(function(x){
      return { qid: x.qid, source: x.source, l1: x.l1, l2: x.l2, l3: x.l3, type: x.type };
    })));
  } catch(e) {}
}

/* ===== 去章节刷题（空状态入口） ===== */
function goChapter() {
  try { window.parent.postMessage({ type:'CLOSE_CHAPTER' }, '*'); } catch(e) {}
}

/* ===== Toast ===== */
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(function(){ t.classList.remove('show'); }, 1600);
}

/* ===== 做题返回提示（有未练闪卡；总壳→题库→收藏本 转发链路） ===== */
window.addEventListener('message', function(e) {
  var d = e.data || {};
  if (d.type === 'FAV_PRACTICE_CLOSED') {
    /* 总壳 closePractice 广播 → 题库转发到此；检查本页标记是否有待练闪卡 */
    var pending = false;
    try { pending = localStorage.getItem('zsb_fav_flash_pending_v1') === '1'; } catch(err) {}
    var hasFlash = false;
    try { hasFlash = !!localStorage.getItem('zsb_fav_flash_v1'); } catch(err) {}
    if (pending && hasFlash) showFavPrompt();
  }
});

function showFavPrompt() {
  document.getElementById('favPromptMask').classList.add('show');
}
function dismissFavPrompt() {
  document.getElementById('favPromptMask').classList.remove('show');
  /* 稍后练：清标记，本次不再弹（PM 2026-09-07） */
  try { localStorage.removeItem('zsb_fav_flash_pending_v1'); } catch(e) {}
  try { localStorage.removeItem('zsb_fav_flash_v1'); } catch(e) {}
}
function continueFavFlash() {
  document.getElementById('favPromptMask').classList.remove('show');
  /* 继续练：跳转闪卡原型读取 flash 题目；清待练标记避免返回时重复弹（flash 数据保留给闪卡原型） */
  try { localStorage.removeItem('zsb_fav_flash_pending_v1'); } catch(e) {}
  try {
    window.parent.postMessage({ type:'REQ_FLASH_FROM_FAV' }, '*');
  } catch(err) {
    /* 降级：直接跳转 */
    window.location.href = '闪卡原型.html?from=fav';
  }
}

/* ===== 初始化 ===== */
renderList();
</script>
