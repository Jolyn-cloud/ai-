<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>收藏本</title>
<style>
/* ==== Product Theme：蓝靛 #5B72F5（与题库首页/错题本统一） ====
   收藏本首页（v2.0 三级树重构 2026-09-05）
   结构：来源 Tab → 筛选栏（全部题型▾ + 全部练习→）→ 一级章节 → 二级章节（可展开三级）→ 三级考点
   定位：收藏题目的章节索引（非做题页、非题目本身），1/2/3 级均只显题数
   交互：
     - 点一级章节名 → 该一级全部收藏题做题页
     - 点二级展开按钮(∧/∨) → 展开/收起三级考点；点二级章节名 → 该二级全部收藏题做题页
     - 点三级考点 → 该考点全部收藏题做题页
     - 来源 Tab / 题型筛选 → 联动重算各级题数
   做题页对接：复用 REQ_PRACTICE 协议（entry=fav, scope=chap/sub/point/all） */
:root{
  --primary: #5B72F5;
  --primary-dark: #4358D7;
  --primary-light: #EEF1FF;
  --brand-teal: #3FA98B;
  --text-primary: #1E2130;
  --text-secondary: #6E778B;
  --text-tertiary: #98A0B2;
  --success: #20A866;
  --warning: #F28B3D;
  --danger: #EF4444;
  --card-radius: 17px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
* { scrollbar-width: none; }
*::-webkit-scrollbar { display: none; width: 0; height: 0; }
html, body { width: 100%; height: 100%; overflow-x: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text-primary);
  background-color: #EDEFF7;
  -webkit-overflow-scrolling: touch;
}

.page { display: flex; flex-direction: column; height: 100%; }

/* ===== 来源 Tab ===== */
.src-tabs {
  display: flex; gap: 0;
  padding: 10px 16px 8px;
  background: #fff;
  border-bottom: 1px solid #EEF0F6;
  flex-shrink: 0;
}
.src-tab {
  flex: 1;
  height: 34px;
  border: none; background: none;
  font-size: 13px; font-weight: 600;
  color: var(--text-tertiary);
  cursor: pointer;
  position: relative;
  transition: color .15s ease;
}
.src-tab.active { color: var(--primary); }
.src-tab.active::after {
  content: ''; position: absolute;
  bottom: -9px; left: 50%; transform: translateX(-50%);
  width: 22px; height: 3px; border-radius: 2px;
  background: var(--primary);
}

/* ===== 筛选栏 ===== */
.filter-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  flex-shrink: 0;
}
.fav-type {
  display: inline-flex; align-items: center; gap: 4px;
  height: 30px; padding: 0 12px;
  border: 1px solid #E5E8F0; border-radius: 15px;
  background: #fff;
  font-size: 12.5px; font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  transition: border-color .15s ease, color .15s ease;
}
.fav-type:active { transform: scale(.97); }
.fav-type.open { border-color: var(--primary); color: var(--primary); }
.fav-type .caret { font-size: 10px; color: var(--text-tertiary); transition: transform .15s ease; }
.fav-type.open .caret { transform: rotate(180deg); color: var(--primary); }

.fav-practice {
  display: inline-flex; align-items: center; gap: 3px;
  height: 30px; padding: 0 8px;
  border: none; background: none;
  font-size: 13px; font-weight: 700;
  color: var(--primary);
  cursor: pointer;
  transition: opacity .15s ease;
}
.fav-practice:active { opacity: .6; }

/* 题型下拉浮层 */
.type-menu {
  position: absolute; top: 44px; left: 16px;
  min-width: 132px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(38,48,96,.14), 0 2px 6px rgba(38,48,96,.06);
  padding: 6px 0;
  display: none; z-index: 50;
  overflow: hidden;
}
.type-menu.open { display: block; }
.type-menu-item {
  padding: 9px 16px;
  font-size: 13px; font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background .12s ease;
}
.type-menu-item:active { background: #F5F6FA; }
.type-menu-item.active { color: var(--primary); font-weight: 700; }
.type-menu-item.active::after { content: ' ✓'; color: var(--primary); }

/* ===== 列表区 ===== */
.list-wrap {
  flex: 1; overflow-y: auto;
  padding: 4px 16px 24px;
}

/* 一级章节：标题行，可点进做题页 */
.l1-group { margin-bottom: 2px; }
.l1-row {
  display: flex; align-items: center; gap: 8px;
  padding: 16px 4px 6px;
  cursor: pointer;
}
.l1-row:active { opacity: .6; }
.l1-name { font-size: 16px; font-weight: 800; color: var(--text-primary); }
.l1-count { font-size: 11.5px; color: var(--text-tertiary); font-weight: 500; font-variant-numeric: tabular-nums; }
.l1-arrow { font-size: 17px; color: var(--text-tertiary); line-height: 1; margin-left: auto; }

/* 二级章节：行，可点进做题页 + 展开按钮 */
.l2-row {
  display: flex; align-items: center; gap: 8px;
  background: #fff;
  border-radius: 12px;
  padding: 12px 14px;
  margin: 6px 0;
  box-shadow: 0 1px 2px rgba(38,48,96,.04), 0 2px 6px rgba(91,114,245,.05);
  cursor: pointer;
}
.l2-row:active { transform: scale(.995); }
.l2-name { font-size: 14px; font-weight: 600; color: var(--text-primary); flex: 1; }
.l2-count { font-size: 11px; color: var(--text-tertiary); font-weight: 500; font-variant-numeric: tabular-nums; }
.l2-toggle {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--primary);
  border-radius: 6px;
  cursor: pointer;
  flex-shrink: 0;
  transition: background .12s ease;
}
.l2-toggle:active { background: var(--primary-light); }
.l2-toggle .caret { transition: transform .2s ease; display: inline-block; }
.l2-group.open .l2-toggle .caret { transform: rotate(90deg); }

/* 三级考点：展开后显示 */
.l3-list {
  display: none;
  padding: 2px 0 6px 18px;
}
.l2-group.open .l3-list { display: block; }
.l3-row {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px 10px 8px;
  cursor: pointer;
  border-left: 2px solid #EEF0F6;
  margin-left: 4px;
  transition: border-color .12s ease;
}
.l3-row:active { background: #F5F6FA; }
.l3-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-tertiary); flex-shrink: 0; }
.l3-name { font-size: 13px; font-weight: 500; color: var(--text-secondary); flex: 1; }
.l3-count { font-size: 11px; color: var(--text-tertiary); font-weight: 500; font-variant-numeric: tabular-nums; }
.l3-arrow { font-size: 14px; color: var(--text-tertiary); line-height: 1; }

/* ===== 空状态 ===== */
.empty {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 20px;
  text-align: center;
}
.empty-ico {
  font-size: 48px; color: var(--text-tertiary); margin-bottom: 18px;
}
.empty-title { font-size: 15px; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; }
.empty-desc { font-size: 12.5px; color: var(--text-tertiary); line-height: 1.6; margin-bottom: 20px; max-width: 240px; }
.empty-btn {
  display: inline-flex; align-items: center; gap: 3px;
  height: 34px; padding: 0 18px;
  border: 1.5px solid var(--primary); border-radius: 17px;
  background: var(--primary-light);
  font-size: 13px; font-weight: 700;
  color: var(--primary);
  cursor: pointer;
  transition: transform .12s ease;
}
.empty-btn:active { transform: scale(.97); }

/* ===== Toast ===== */
.toast {
  position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
  background: rgba(30,33,48,.88); color: #fff;
  padding: 8px 18px; border-radius: 8px;
  font-size: 12.5px; z-index: 999;
  opacity: 0; transition: opacity .2s ease; pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="page" id="page">

  <!-- 来源 Tab -->
  <div class="src-tabs" id="srcTabs">
    <button class="src-tab active" data-src="all" onclick="setSrc('all')">全部</button>
    <button class="src-tab" data-src="chapter" onclick="setSrc('chapter')">章节刷题</button>
    <button class="src-tab" data-src="exam" onclick="setSrc('exam')">模拟考试</button>
    <button class="src-tab" data-src="real" onclick="setSrc('real')">历年真题</button>
    <button class="src-tab" data-src="flash" onclick="setSrc('flash')">闪卡</button>
  </div>

  <!-- 筛选栏 -->
  <div class="filter-bar">
    <button class="fav-type" id="favType" onclick="toggleTypeMenu(event)">全部题型 <span class="caret">▾</span></button>
    <button class="fav-practice" onclick="practiceAll()">全部练习 →</button>
  </div>

  <!-- 题型下拉 -->
  <div class="type-menu" id="typeMenu"></div>

  <!-- 列表区 -->
  <div class="list-wrap" id="listWrap"></div>

  <!-- 空状态 -->
  <div class="empty" id="empty" style="display:none;">
    <div class="empty-ico">☆</div>
    <div class="empty-title">还没有收藏题目</div>
    <div class="empty-desc">做题或背闪卡时遇到值得复习的题目，点击收藏，就会出现在这里</div>
    <button class="empty-btn" onclick="goChapter()">去章节刷题 →</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   收藏本 mock 数据（演示期；三级章节树覆盖计算机四模块）
   字段口径：
     qid        题目 id（与做题页 qid 对齐）
     source     来源：chapter 章节刷题 / exam 模拟考试 / real 历年真题 / flash 闪卡
     l1         一级章节名
     l2         二级章节名
     l3         三级考点名
     type       题型：single 单选 / multi 多选 / judge 判断 / fill 填空
   ============================================================ */
var SRC_NAME = { chapter:'章节刷题', exam:'模拟考试', real:'历年真题', flash:'闪卡' };
var TYPE_NAME = { single:'单选题', multi:'多选题', judge:'判断题', fill:'填空题' };

var FAV_DATA = [
  /* —— 计算机基础 —— */
  { qid:'W01', source:'chapter', l1:'计算机基础', l2:'信息与计算机基础知识', l3:'信息技术概述',     type:'single', collectedAt:'09-03' },
  { qid:'W02', source:'real',     l1:'计算机基础', l2:'信息与计算机基础知识', l3:'计算机的发展',     type:'fill',   collectedAt:'09-02' },
  { qid:'W03', source:'exam',     l1:'计算机基础', l2:'信息与计算机基础知识', l3:'数制与编码',       type:'single', collectedAt:'08-30' },
  { qid:'W04', source:'flash',    l1:'计算机基础', l2:'信息与计算机基础知识', l3:'信息与数据的区别', type:'judge',  collectedAt:'08-28' },
  { qid:'W01', source:'chapter',  l1:'计算机基础', l2:'操作系统',             l3:'操作系统的基本功能', type:'single', collectedAt:'09-01' },
  { qid:'W02', source:'real',     l1:'计算机基础', l2:'操作系统',             l3:'进程与线程的概念',   type:'fill',   collectedAt:'08-29' },
  { qid:'W03', source:'exam',     l1:'计算机基础', l2:'操作系统',             l3:'文件系统与扩展名',   type:'judge',  collectedAt:'08-27' },
  { qid:'W04', source:'flash',    l1:'计算机基础', l2:'操作系统',             l3:'存储管理方式',       type:'multi',  collectedAt:'08-25' },

  /* —— 计算机网络 —— */
  { qid:'W05', source:'chapter',  l1:'计算机网络', l2:'网络协议', l3:'TCP/IP 协议体系',    type:'multi',  collectedAt:'09-03' },
  { qid:'W06', source:'real',     l1:'计算机网络', l2:'网络协议', l3:'OSI 参考模型',       type:'single', collectedAt:'08-31' },
  { qid:'W05', source:'exam',     l1:'计算机网络', l2:'IP 地址',  l3:'IP 地址与子网掩码',   type:'judge',  collectedAt:'08-24' },
  { qid:'W06', source:'flash',    l1:'计算机网络', l2:'IP 地址',  l3:'域名与 DNS',          type:'single', collectedAt:'08-20' },

  /* —— 数据库 —— */
  { qid:'W06', source:'chapter',  l1:'数据库', l2:'关系数据库', l3:'三级模式结构',    type:'single', collectedAt:'09-02' },
  { qid:'W01', source:'real',     l1:'数据库', l2:'关系数据库', l3:'关系代数运算',    type:'fill',   collectedAt:'08-26' },
  { qid:'W02', source:'flash',    l1:'数据库', l2:'SQL 语言',    l3:'SQL 语句分类',   type:'multi',  collectedAt:'08-22' },

  /* —— 数据结构 —— */
  { qid:'W03', source:'chapter',  l1:'数据结构', l2:'树与图',   l3:'二叉树的遍历方法', type:'single', collectedAt:'09-01' },
  { qid:'W04', source:'exam',     l1:'数据结构', l2:'线性结构', l3:'栈与队列的特点',   type:'judge',  collectedAt:'08-23' }
];

/* 运行态：mock 内存态（刷新恢复） */
var items = FAV_DATA.map(function(x){ return Object.assign({}, x); });

var SRC = 'all';        /* 来源筛选：all/chapter/exam/real/flash */
var TYPE = 'all';       /* 题型筛选 */
/* 展开态：key = l1 + '||' + l2，value = true */
var OPEN_MAP = {};

/* ===== 来源筛选 ===== */
function setSrc(s) {
  SRC = s;
  document.querySelectorAll('.src-tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.src === s);
  });
  renderList();
}

/* ===== 题型下拉 ===== */
function toggleTypeMenu(e) {
  if (e) e.stopPropagation();
  var m = document.getElementById('typeMenu');
  var b = document.getElementById('favType');
  m.classList.toggle('open');
  b.classList.toggle('open', m.classList.contains('open'));
}
function setType(t) {
  TYPE = t;
  document.getElementById('favType').firstChild.textContent = (t === 'all' ? '全部题型' : TYPE_NAME[t]) + ' ';
  document.getElementById('typeMenu').classList.remove('open');
  document.getElementById('favType').classList.remove('open');
  renderList();
}
function buildTypeMenu() {
  var types = ['all','single','multi','judge','fill'];
  var html = types.map(function(t) {
    return '<div class="type-menu-item' + (TYPE === t ? ' active' : '') + '" onclick="setType(\'' + t + '\')">'
      + (t === 'all' ? '全部题型' : TYPE_NAME[t]) + '</div>';
  }).join('');
  document.getElementById('typeMenu').innerHTML = html;
}

/* ===== 过滤 ===== */
function passFilter(it) {
  if (SRC !== 'all' && it.source !== SRC) return false;
  if (TYPE !== 'all' && it.type !== TYPE) return false;
  return true;
}

/* ===== 按 l1 → l2 → l3 聚合成树（保持插入顺序） ===== */
function buildTree() {
  var tree = {};   /* l1 -> { _count, l2s: { l2 -> { _count, l3s: { l3 -> count } } } } */
  var l1Order = [];
  items.filter(passFilter).forEach(function(it) {
    if (!tree[it.l1]) { tree[it.l1] = { _count: 0, l2s: {}, l2Order: [] }; l1Order.push(it.l1); }
    var l1 = tree[it.l1];
    l1._count++;
    if (!l1.l2s[it.l2]) { l1.l2s[it.l2] = { _count: 0, l3s: {}, l3Order: [] }; l1.l2Order.push(it.l2); }
    var l2 = l1.l2s[it.l2];
    l2._count++;
    if (!l2.l3s[it.l3]) { l2.l3s[it.l3] = 0; l2.l3Order.push(it.l3); }
    l2.l3s[it.l3]++;
  });
  return { tree: tree, l1Order: l1Order };
}

/* ===== 渲染列表（三级树） ===== */
function renderList() {
  var filtered = items.filter(passFilter);
  var wrap = document.getElementById('listWrap');
  var empty = document.getElementById('empty');

  if (!filtered.length) {
    wrap.style.display = 'none';
    empty.style.display = 'flex';
    return;
  }
  wrap.style.display = 'block';
  empty.style.display = 'none';

  var r = buildTree();
  var html = '';
  r.l1Order.forEach(function(l1name) {
    var l1 = r.tree[l1name];
    html += '<div class="l1-group">'
      +   '<div class="l1-row" onclick="goPractice(\'chap\',\'' + esc(l1name) + '\',\'\',\'\')">'
      +     '<span class="l1-name">' + l1name + '</span>'
      +     '<span class="l1-count">' + l1._count + ' 道收藏</span>'
      +     '<span class="l1-arrow">›</span>'
      +   '</div>';
    l1.l2Order.forEach(function(l2name) {
      var l2 = l1.l2s[l2name];
      var key = l1name + '||' + l2name;
      var isOpen = !!OPEN_MAP[key];
      html += '<div class="l2-group' + (isOpen ? ' open' : '') + '">'
        +   '<div class="l2-row">'
        +     '<span class="l2-name" onclick="goPractice(\'sub\',\'' + esc(l1name) + '\',\'' + esc(l2name) + '\',\'\')">' + l2name + '</span>'
        +     '<span class="l2-count">' + l2._count + ' 道收藏</span>'
        +     '<span class="l2-toggle" onclick="toggleL2(\'' + esc(key) + '\')"><span class="caret">›</span></span>'
        +   '</div>'
        +   '<div class="l3-list">';
      l2.l3Order.forEach(function(l3name) {
        html += '<div class="l3-row" onclick="goPractice(\'point\',\'' + esc(l1name) + '\',\'' + esc(l2name) + '\',\'' + esc(l3name) + '\')">'
          +   '<span class="l3-dot"></span>'
          +   '<span class="l3-name">' + l3name + '</span>'
          +   '<span class="l3-count">' + l2.l3s[l3name] + ' 道</span>'
          +   '<span class="l3-arrow">›</span>'
          + '</div>';
      });
      html +=   '</div>'
        +   '</div>';
    });
    html += '</div>';
  });
  wrap.innerHTML = html;
}

/* 转义单引号（onclick 参数安全） */
function esc(s) {
  return String(s).replace(/'/g, "\\'");
}

/* ===== 二级展开/收起 ===== */
function toggleL2(key) {
  OPEN_MAP[key] = !OPEN_MAP[key];
  /* 局部刷新：重渲染（树态保持 OPEN_MAP） */
  renderList();
}

/* ===== 进入做题页（复用 REQ_PRACTICE；entry=fav, scope=chap/sub/point/all） ===== */
function goPractice(scope, l1, l2, l3) {
  var list = items.filter(function(it) {
    if (!passFilter(it)) return false;
    if (scope === 'chap')  return it.l1 === l1;
    if (scope === 'sub')   return it.l1 === l1 && it.l2 === l2;
    if (scope === 'point') return it.l1 === l1 && it.l2 === l2 && it.l3 === l3;
    return false;
  });
  if (!list.length) { showToast('该范围暂无收藏题'); return; }
  writeFavPractice(list, scope, l1, l2, l3);
  var name = scope === 'chap' ? l1 : (scope === 'sub' ? l2 : l3);
  try {
    window.parent.postMessage({ type:'REQ_PRACTICE', data:{
      entry:'fav', scope: scope, name: name + ' · 收藏题'
    } }, '*');
  } catch(e) {
    showToast('请从总壳进入，开始练习');
  }
}

/* 全部练习：当前筛选范围 */
function practiceAll() {
  var list = items.filter(passFilter);
  if (!list.length) { showToast('没有可练习的收藏题'); return; }
  writeFavPractice(list, 'all', '', '', '');
  try {
    window.parent.postMessage({ type:'REQ_PRACTICE', data:{
      entry:'fav', scope:'all', name:'收藏题练习'
    } }, '*');
  } catch(e) {
    showToast('请从总壳进入，开始练习');
  }
}

/* 写入临时 key，做题页 entry=fav 读取出题 */
function writeFavPractice(list, scope, l1, l2, l3) {
  try {
    localStorage.setItem('zsb_fav_practice_v1', JSON.stringify(list.map(function(x){
      return { qid: x.qid, source: x.source, l1: x.l1, l2: x.l2, l3: x.l3, type: x.type };
    })));
  } catch(e) {}
}

/* ===== 去章节刷题（空状态入口） ===== */
function goChapter() {
  try { window.parent.postMessage({ type:'CLOSE_CHAPTER' }, '*'); } catch(e) {}
}

/* ===== Toast ===== */
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(function(){ t.classList.remove('show'); }, 1600);
}

/* ===== 点外部收起题型下拉 ===== */
document.addEventListener('click', function(e) {
  var m = document.getElementById('typeMenu');
  var b = document.getElementById('favType');
  if (m.classList.contains('open') && !m.contains(e.target) && e.target !== b && !b.contains(e.target)) {
    m.classList.remove('open');
    b.classList.remove('open');
  }
});

/* ===== 初始化 ===== */
buildTypeMenu();
renderList();
</script>
