<title>做题页 · 统一做题</title>
<style>
/* ============================================================
   统一做题页（题库做题唯一页面）
   入口：?entry=today(今日学习) | wrong(错题本) | chapter(章节练习)
   模式：做题=全部答完交卷统一显示答案解析；背题=每答一题立即显示答案解析
   题型：单选/多选/判断/填空/操作/分析/综合运用/简答（操作/分析/综合运用=一个题干答多个子题）
   ============================================================ */
:root{
  --primary:#5B72F5; --primary-dark:#4358D7; --primary-light:#EEF1FF;
  --text-primary:#1E2130; --text-secondary:#6E778B; --text-tertiary:#98A0B2;
  --success:#20A866; --danger:#EF4444; --warning:#F28B3D;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; }
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#F6F7FB; color:var(--text-primary);
  display:flex; flex-direction:column;
  height:100%; overflow:hidden;             /* body 不滚，由内部 question-area 统一滚动 */
}

/* ===== 顶部导航：模式切换左 / 计时中 / 答题卡右 ===== */
.practice-nav{
  flex-shrink:0; height:52px;
  position:relative;                 /* 给 .nav-timer absolute 提供定位基准，否则跑到 viewport 中央 */
  display:flex; align-items:center; gap:10px;
  padding:0 12px; background:#fff;
  border-bottom:1px solid #F0F1F6;
}
/* .nav-back 已删（2026-08-31）：内部退出按钮由总壳 appbar 接管，避免重复 */
.mode-switch{ display:flex; background:#F0F1F6; border-radius:18px; padding:3px; gap:2px; }
.mode-btn{
  padding:7px 18px; font-size:13px; border-radius:14px; border:none;
  background:none; color:var(--text-secondary); cursor:pointer; font-weight:500;
  line-height:1; transition:all .15s ease;
}
.mode-btn.active{ background:#fff; color:var(--primary); font-weight:700; box-shadow:0 1px 4px rgba(0,0,0,.12); }
/* 顶部计时：水平居中、不加重、字号小、灰色——弱化存在感，避免给学生压力（PM 2026-09-02：居中）。
   练习类（非考试）已隐藏（见 startTimer），考试模式显示剩余倒计时 */
.nav-timer{
  position:absolute; left:50%; transform:translateX(-50%);
  font-size:11px; font-weight:400; color:var(--text-tertiary);
  font-variant-numeric: tabular-nums;
  letter-spacing:.3px;
}
/* 右侧答题卡入口 */
.nav-sheet-btn{
  margin-left:auto;
  display:flex; align-items:center; gap:4px;
  border:none; background:none; cursor:pointer;
  color:var(--text-secondary); font-size:12px; font-weight:500;
  padding:6px 10px; border-radius:10px;
  transition: background .15s ease, color .15s ease;
}
.nav-sheet-btn:active{ background:#F0F1F6; color:var(--primary-dark); }
.nav-sheet-btn svg{ width:16px; height:16px; }

/* ===== 进度条 ===== */
.progress-wrap{ padding:6px 16px 10px; background:#fff; border-bottom:1px solid #F0F1F6; flex-shrink:0; }
.progress-top{ display:flex; justify-content:space-between; font-size:12px; color:var(--text-secondary); margin-bottom:5px; }
.progress-top .q-num{ color:var(--primary); font-weight:600; }
.progress-top .q-pos{ color:var(--text-tertiary); }
.progress-top .q-pos #navProgress{ color:var(--primary); font-weight:600; }
.progress-bar{ height:3px; background:#EDEFF3; border-radius:2px; overflow:hidden; }
.progress-fill{ height:100%; background:linear-gradient(90deg,var(--primary),#62CFA9); border-radius:2px; transition:width .2s; }

/* ===== 题型规则页（PM 2026-09-02）：每题型首题前虚拟页，左滑进题 ===== */
.rule-page{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:40px 28px; text-align:center; background:#fff;
}
.rule-badge{
  font-size:12px; font-weight:700; color:#fff; background:linear-gradient(135deg,var(--primary),#62CFA9);
  padding:5px 14px; border-radius:999px; margin-bottom:18px; letter-spacing:1px;
}
.rule-type{ font-size:22px; font-weight:800; color:var(--text-primary); margin-bottom:14px; }
.rule-score{
  font-size:13px; color:var(--text-secondary); background:#F5F6FA; border-radius:8px;
  padding:7px 14px; margin-bottom:22px; font-variant-numeric:tabular-nums;
}
.rule-req{
  font-size:14px; line-height:1.85; color:#555; max-width:280px; margin-bottom:36px;
}
.rule-swipe-hint{
  font-size:12px; color:var(--text-tertiary); display:flex; align-items:center; gap:6px;
}
.rule-swipe-hint svg{ width:16px; height:16px; stroke:var(--text-tertiary); fill:none; stroke-width:2; }

/* ===== 标签区 ===== */
.tag-area{ display:flex; gap:6px; padding:8px 16px; flex-wrap:wrap; flex-shrink:0; background:#fff; }
.tag{ font-size:11px; padding:3px 9px; border-radius:6px; white-space:nowrap; }
.tag.type{ background:var(--primary-light); color:var(--primary-dark); }
.tag.concept{ background:#F9F0FF; color:#722ED1; }
.tag.difficulty{ background:#FFF7E6; color:#FA8C16; }
/* 考点级顽固：考点标签底色强化为顽固红（2026-09-02 PM：顽固仅考点级标注在考点上） */
.tag.concept.stub{ background:#FFF1F0; color:#CF1322; }
.tag.concept .point-stub{ color:#CF1322; font-weight:700; }

/* ===== 题目区（独立滚动，承载题干→选项→反馈→解析，PM 2026-08-31） ===== */
.question-area{ flex:1; overflow-y:auto; background:#fff; -webkit-overflow-scrolling:touch; }
.stem-wrap{ padding:12px 16px 10px; }
.stem{ font-size:15px; line-height:1.7; color:#333; }
.options{ padding:0 16px 12px; display:flex; flex-direction:column; gap:8px; }
.option{
  display:flex; align-items:flex-start; gap:10px;
  padding:10px 12px; border:1.5px solid #E8EAF1; border-radius:10px;
  cursor:pointer; font-size:14px; color:#333; line-height:1.5; transition:all .12s;
}
.option:active{ transform:scale(.99); }
.option .radio, .option .checkbox{
  width:18px; height:18px; flex-shrink:0; margin-top:1px;
  display:flex; align-items:center; justify-content:center;
  border:2px solid #C9CEDA; background:#fff;
}
.option .radio{ border-radius:50%; }
.option .checkbox{ border-radius:4px; }
.option.selected{ border-color:var(--primary); background:var(--primary-light); }
.option.selected .radio{ border-color:var(--primary); background:var(--primary); }
.option.selected .radio::after{ content:""; width:6px; height:6px; border-radius:50%; background:#fff; }
.option.selected .checkbox{ border-color:var(--primary); background:var(--primary); }
.option.selected .checkbox::after{ content:"✓"; color:#fff; font-size:12px; font-weight:bold; }
.option.correct{ border-color:var(--success); background:#F0FBF4; color:#1F7A4D; }
.option.correct .radio, .option.correct .checkbox{ border-color:var(--success); background:var(--success); }
.option.correct .radio::after{ content:""; width:6px; height:6px; border-radius:50%; background:#fff; }
.option.correct .checkbox::after{ content:"✓"; color:#fff; font-size:12px; font-weight:bold; }
.option.wrong{ border-color:var(--danger); background:#FFF0F0; color:#C0392B; }
.option.wrong .radio, .option.wrong .checkbox{ border-color:var(--danger); background:var(--danger); }
/* 选项文本占满中间，标签贴右 */
.option .opt-body{ flex:1; min-width:0; }
/* ===== 选项标签：易错（红）/ 易漏选（橙）—— 数据埋点统计口径，v5.0 接数据层 =====
   - hot-wrong：该选项为错选项 + 埋点高频错选 → 标「易错」（刺眼红）
   - hot-miss ：该选项为正确项 + 埋点高频漏选 → 标「易漏选」（醒目橙）
   同一选项互斥（错选项不可能是正确项），优先级：易错 > 易漏选 */
.opt-flag{
  flex-shrink:0; align-self:center;
  font-size:10px; font-weight:700; line-height:1;
  padding:3px 7px; border-radius:8px;
  letter-spacing:.3px; white-space:nowrap;
}
.opt-flag.hot-wrong{ background:#EF4444; color:#fff; box-shadow:0 2px 6px rgba(239,68,68,.3); }
.opt-flag.hot-miss { background:#F28B3D; color:#fff; box-shadow:0 2px 6px rgba(242,139,61,.3); }
.option.wrong .radio::after{ content:"×"; color:#fff; font-size:11px; font-weight:bold; }
.option.wrong .checkbox::after{ content:"×"; color:#fff; font-size:12px; font-weight:bold; }
.option.answer{ border-color:var(--success); background:#F0FBF4; }
.opt-label{ font-weight:600; margin-right:4px; }
/* 填空 */
.fill-wrap{ padding:0 16px 12px; }
.fill-input{
  width:100%; height:44px; border:1.5px solid #E8EAF1; border-radius:10px;
  padding:0 14px; font-size:14px; outline:none; background:#fff; color:#333;
}
.fill-input:focus{ border-color:var(--primary); }
.fill-input.correct{ border-color:var(--success); background:#F0FBF4; color:#1F7A4D; }
.fill-input.wrong{ border-color:var(--danger); background:#FFF0F0; color:#C0392B; }
.fill-input.committed{ border-color:var(--primary); background:#F2F5FF; color:#333; }   /* 回车确认态：蓝色回显 */
/* 填空/简答/多选 轻按钮（2026-09-02 PM：输入框下方右侧、无底色主色小字文字链；2026-09-05 多选题同款） */
.fill-wrap, .essay-wrap{ display:flex; flex-direction:column; align-items:stretch; }   /* 输入框全宽 */
.fill-submit, .essay-submit, .multi-submit{
  display:inline-flex; align-items:center; gap:1px;
  padding:4px 6px; border:none; background:none;
  color:var(--primary); font-size:12px; font-weight:500; cursor:pointer;
  opacity:.82; transition:opacity .12s ease;
}
.fill-submit, .essay-submit{ align-self:flex-end; margin-top:8px; }   /* 填空/简答：输入框下方右对齐 */
.fill-submit:active, .essay-submit:active, .multi-submit:active{ opacity:.55; }
.fill-submit:disabled, .essay-submit:disabled, .multi-submit:disabled{ opacity:.35; cursor:default; }
/* 多选轻按钮容器（选项列表下方右对齐；-12px 抵消 .options 底部 12px padding，使按钮距末选项约 8px 与填空一致） */
.multi-bar{ display:flex; justify-content:flex-end; padding:8px 16px 12px; margin-top:-12px; }
/* 简答 */
.essay-wrap{ padding:0 16px 12px; }
.essay-textarea{
  width:100%; min-height:90px; border:1.5px solid #E8EAF1; border-radius:10px;
  padding:10px 12px; font-size:14px; font-family:inherit; outline:none;
  resize:vertical; background:#fff; color:#333; line-height:1.6;
}
.essay-textarea:focus{ border-color:var(--primary); }
.essay-textarea.committed{ border-color:var(--primary); background:#F2F5FF; color:#333; }   /* 回车确认态 */

/* ===== 解析区 ===== */
.analysis-area{ background:#F5F6FA; padding:0 12px 16px; flex-shrink:0; display:none; }
.analysis-area.show{ display:block; }
.analysis-card{ background:#fff; border-radius:12px; padding:14px; margin-bottom:10px; }
.analysis-card .card-title{ font-size:14px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
.analysis-card .card-title .ico{
  width:22px; height:22px; border-radius:6px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; line-height:1;
}
.analysis-card .card-title .seq{
  font-size:11px; font-weight:600; color:var(--text-tertiary);
  background:#F0F1F6; border-radius:6px; padding:2px 7px; margin-left:auto;
}
.answer-line{ font-size:14px; font-weight:700; color:var(--success); margin-bottom:8px; }
.answer-line.wrong-ans{ color:var(--danger); }
.analysis-text{ font-size:13px; color:#555; line-height:1.7; }
.analysis-text b{ color:#333; }
/* 操作题逐子题解析卡片（PM 2026-09-02：一个操作题=多道小题，各自给解析） */
.op-sub-anas{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
.sub-ana{ background:#FAFBFF; border:1px solid #EDEFF6; border-radius:10px; padding:10px 12px; }
.sub-ana-head{ font-size:12px; font-weight:700; color:var(--primary); margin-bottom:4px; }
.sub-ana-stem{ font-size:13px; color:#333; line-height:1.6; margin-bottom:6px; }
.sub-ana-detail{ font-size:12px; color:#667; line-height:1.65; }
/* 解析图片占位：表示该解析可能带图片（流程图/截图），接真实题源后替换 */
.analysis-img-placeholder{
  margin-top:10px; height:120px; border-radius:10px;
  border:1.5px dashed #D3D9EC; background:#FAFBFD;
  display:flex; align-items:center; justify-content:center; gap:6px;
  font-size:12px; color:var(--text-tertiary);
}
.step-list{ font-size:13px; color:#666; line-height:1.8; margin-top:8px; padding-top:8px; border-top:1px dashed #EDEFF3; }

/* ===== 解析区（PM 2026-08-31 拍板：删系统判断节 + 不显序号） =====
   1 答题结果 / 2 解析 → 视频解析（紧随解析下方，VIP解锁观看占位，PM 2026-09-02）
   3 考点对比 / 4 举一反三 / 5 我的笔记 / 6 答题时间·耗时分析
   （相关知识点卡已于 2026-09-01 删除）
   注：ico-2/verdict-* 为系统判断节遗留样式，已不用（PM 2026-08-31 删） */
.ana-sec{ background:#fff; border-radius:12px; padding:14px; margin-bottom:10px; }
.ana-sec .sec-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.ana-sec .sec-head .ico{
  width:22px; height:22px; border-radius:7px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; line-height:1;
}
.ana-sec .sec-head .ico svg{ width:14px; height:14px; }
.ana-sec .sec-head .name{ font-size:14px; font-weight:700; color:var(--text-primary); }
.ana-sec .sec-head .seq{
  font-size:11px; font-weight:600; color:var(--text-tertiary);
  background:#F0F1F6; border-radius:6px; padding:2px 7px; margin-left:auto;
}
.ana-sec .sec-body{ font-size:13px; color:#555; line-height:1.7; }
.ana-sec .sec-body b{ color:#333; }
/* 节图标配色 */
.ico-1{ background:linear-gradient(135deg,#EF4444,#F87171); color:#fff; }      /* 答题结果 红 */
.ico-2{ background:linear-gradient(135deg,#5B72F5,#4358D7); color:#fff; }      /* 系统判断 蓝 */
.ico-3{ background:linear-gradient(135deg,#3FA98B,#5BC29B); color:#fff; }     /* 解析 绿 */
.ico-4{ background:linear-gradient(135deg,#F28B3D,#FBA460); color:#fff; }      /* 考点对比 橙 */
.ico-5{ background:linear-gradient(135deg,#722ED1,#9B6BD9); color:#fff; }     /* 举一反三 紫 */
.ico-6{ background:linear-gradient(135deg,#FA8C16,#FFA940); color:#fff; }      /* 我的笔记 黄橙 */
.ico-8{ background:linear-gradient(135deg,#5B72F5,#3FA98B); color:#fff; }      /* 视频解析 蓝绿 */
.ico-9{ background:linear-gradient(135deg,#8A90A8,#B0B6CA); color:#fff; }     /* 答题时间 灰 */

/* ===== 错题本专用：诊断卡 + 统计卡（entry=wrong 解析区） ===== */
.diag-card{
  background:linear-gradient(135deg,#E8F3FF 0%,#D6E9FF 100%);
  border-radius:12px; padding:13px 14px; margin-bottom:10px;
}
.diag-title{ font-size:13px; font-weight:700; color:#2F6FED; margin-bottom:6px; }
.diag-desc{ font-size:12px; color:#3B5B9E; line-height:1.6; margin-bottom:9px; }
.diag-actions{ display:flex; flex-wrap:wrap; gap:7px; }
.diag-btn{
  padding:5px 11px; border-radius:14px; font-size:11.5px; font-weight:600;
  border:1px solid #BBD6F5; background:#fff; color:#2F6FED; cursor:pointer;
  transition:all .15s ease;
}
.diag-btn:active{ transform:scale(.96); }
.diag-btn{ position:relative; }
/* AI 预选态：虚线描边+浅底，区别于用户确认的实心 active 态 */
.diag-btn.ai-suggest{ background:#F0F6FF; border-color:#7BA8F5; border-style:dashed; }
/* AI 小角标：右上角，不占按钮内文宽度 */
.diag-ai-badge{
  position:absolute; top:-6px; right:-6px;
  background:linear-gradient(135deg,#7C6BD9,#9D8EE8);
  color:#fff; font-size:8px; font-weight:700; line-height:1;
  padding:2px 4px; border-radius:6px; letter-spacing:.3px;
  pointer-events:none;
}
.diag-btn.active .diag-ai-badge{ background:#fff; color:#2F6FED; }
.diag-btn.active{ background:#2F6FED; color:#fff; border-color:#2F6FED; }

/* 错题统计卡 */
.wrong-stats-card{ background:#fff; border-radius:12px; padding:13px 14px; margin-bottom:10px; }
.wrong-stats-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.wrong-stats-grid .ws-item{ display:flex; flex-direction:column; gap:2px; }
.ws-label{ font-size:11px; color:var(--text-tertiary); }
.ws-value{ font-size:14px; font-weight:700; color:var(--text-primary); }
.ws-value.green{ color:var(--success); }
.ws-value.red{ color:var(--danger); }
.ws-value.blue{ color:var(--primary); }
.wrong-count-row{ margin-top:9px; padding-top:9px; border-top:1px dashed #EDEFF3; display:flex; gap:12px; font-size:12px; color:#666; }
.wrong-count-row .ok{ color:var(--success); font-weight:700; }
.wrong-count-row .fail{ color:var(--danger); font-weight:700; }

/* 错题本结果：逐题明细 */
.result-panel-lg{ max-height:86vh; overflow-y:auto; }
.result-detail{ text-align:left; margin:10px 0 4px; border-top:1px solid #F0F1F6; padding-top:10px; }
.result-detail .rd-title{ font-size:12px; font-weight:700; color:var(--text-secondary); margin-bottom:6px; }
.result-detail-item{ display:flex; align-items:center; gap:7px; padding:6px 0; border-bottom:1px dashed #F0F1F6; font-size:12px; }
.result-detail-item:last-child{ border-bottom:none; }
.rd-status{ width:18px; height:18px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; }
.rd-status.correct{ background:#E8F8F0; color:#20A866; }
.rd-status.wrong{ background:#FEECEC; color:#EF4444; }
.rd-status.skip{ background:#F1F2F7; color:#98A0B2; }
.rd-q{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#333; }
.rd-tag{ font-size:9.5px; padding:1px 5px; border-radius:4px; font-weight:600; flex-shrink:0; }
.rd-tag.mastery{ background:#E8F8F0; color:#1F7A4D; }
.rd-tag.stubborn{ background:#FFF1F0; color:#EF4444; }
.result-btns.wrong3{ gap:6px; }
.result-btns.wrong3 .result-btn{ padding:0 4px; font-size:13px; }

/* 系统判断：标签行 */
.verdict-tags{ display:flex; flex-wrap:wrap; gap:8px; }
.verdict-tag{
  font-size:11px; font-weight:600; padding:3px 9px; border-radius:8px;
  display:flex; align-items:center; gap:4px;
}
.verdict-tag.right{ background:#E8F8F0; color:#1F7A4D; }
.verdict-tag.wrong{ background:#FEECEC; color:#C0392B; }
.verdict-tag.partial{ background:#FFF7E6; color:#B66B0A; }

/* 考点对比：左右双栏 */
.compare-box{ display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:stretch; }
.compare-col{
  border:1px solid #EEF0F6; border-radius:10px; padding:10px 12px;
  background:#FBFCFE;
}
.compare-col .col-t{ font-size:11px; font-weight:600; color:var(--text-tertiary); margin-bottom:6px; }
.compare-col .col-name{ font-size:13px; font-weight:700; color:var(--text-primary); margin-bottom:6px; }
.compare-col .col-list{ font-size:12px; color:#666; line-height:1.8; }
.compare-col .col-list li{ list-style:none; padding-left:14px; position:relative; }
.compare-col .col-list li::before{ content:'·'; position:absolute; left:4px; color:var(--primary); font-weight:700; }
.compare-col.is-cur{ border-color:var(--primary); background:var(--primary-light); }
.compare-col.is-cur .col-name{ color:var(--primary-dark); }
.compare-mid{
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:600; color:var(--text-tertiary);
}
.compare-mid svg{ width:18px; height:18px; }

/* 举一反三：变式题卡 */
.variant-card{
  border:1px solid #EEF0F6; border-radius:10px; padding:12px; margin-bottom:8px;
  cursor:pointer; transition:transform .12s ease, border-color .15s;
}
.variant-card:active{ transform:scale(.99); border-color:var(--primary); }
.variant-card .v-stem{ font-size:13px; color:#333; line-height:1.6; margin-bottom:6px; }
.variant-card .v-meta{ font-size:11px; color:var(--text-tertiary); display:flex; gap:10px; }
.variant-card .v-meta .v-type{ color:var(--primary-dark); background:var(--primary-light); border-radius:6px; padding:1px 6px; }

/* 我的笔记：可编辑 textarea + 状态 */
.note-ta{
  width:100%; min-height:64px; padding:10px 12px; box-sizing:border-box;
  border:1px solid #E3E8F2; border-radius:10px; background:#FBFBFE;
  font-size:13px; color:var(--text-primary); line-height:1.5;
  font-family:inherit; outline:none; resize:vertical;
  transition:border-color .15s;
}
.note-ta:focus{ border-color:var(--primary); background:#fff; }
.note-empty{ font-size:12px; color:var(--text-tertiary); padding:8px 0; }
.note-save-row{ display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
.note-hint{ font-size:11px; color:var(--text-tertiary); }
.note-save-btn{
  border:none; background:var(--primary-light); color:var(--primary-dark);
  font-size:12px; font-weight:600; padding:5px 14px; border-radius:8px; cursor:pointer;
}
.note-save-btn:active{ background:var(--primary); color:#fff; }
/* 拍照入口：并入保存行左侧（轻文字钮） */
.note-cam-link{
  display:inline-flex; align-items:center; gap:3px; cursor:pointer;
  border:none; background:none; padding:2px 0;
  color:var(--primary); font-size:12px; font-weight:600; opacity:.85;
}
.note-cam-link:active{ opacity:.55; }
/* 已关联拍照笔记：图片占位格反显（最多1张） */
.note-photo-thumb{
  margin-top:8px; display:flex; align-items:center; gap:8px;
  font-size:11.5px; color:var(--text-secondary); background:#F7F8FF;
  border:1px dashed #C9D1F5; border-radius:8px; padding:8px 10px;
}
.note-photo-thumb-img{
  width:40px; height:40px; border-radius:6px; flex-shrink:0;
  background:linear-gradient(135deg,#E8F3FF,#F0FAF5);
  display:flex; align-items:center; justify-content:center;
  font-size:18px; color:var(--primary);
}
.note-photo-link{ color:var(--primary); font-weight:600; cursor:pointer; margin-left:auto; }
/* 拍照回跳后高亮笔记卡 */
@keyframes noteFlash {
  0%{ box-shadow:0 0 0 0 rgba(91,114,245,.5); border-color:var(--primary); }
  60%{ box-shadow:0 0 0 6px rgba(91,114,245,0); border-color:var(--primary); }
  100%{ box-shadow:0 0 0 0 rgba(91,114,245,0); border-color:#E5E8F0; }
}
.note-flash{ animation:noteFlash 1.6s ease-out 1; }

/* 视频解析：视频名称 + VIP 解锁占位符（16:9 占位，居中 VIP解锁观看） */
.vitem{ margin-bottom:10px; }
.vitem:last-child{ margin-bottom:0; }
.vitem-name{ font-size:13px; font-weight:600; color:var(--text-primary); margin-bottom:6px; }
.vitem-ph{
  position:relative; width:100%; height:0; padding-bottom:56.25%;
  border-radius:10px; overflow:hidden; cursor:pointer;
  background:linear-gradient(160deg,#262B3E,#31384F);
}
.vitem-ph:active{ opacity:.9; }
.vitem-ph-in{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;
  color:#E9C46A; font-size:13px; font-weight:700; letter-spacing:1px;
}
.vitem-ph-in svg{ width:20px; height:20px; opacity:.9; }

/* 答题时间·耗时分析：双行 */
.timing-row{ display:flex; gap:10px; margin-bottom:8px; }
.timing-cell{
  flex:1; border:1px solid #EEF0F6; border-radius:10px; padding:10px 12px; background:#FBFCFE;
}
.timing-cell .t-lbl{ font-size:11px; color:var(--text-tertiary); margin-bottom:4px; }
.timing-cell .t-val{ font-size:18px; font-weight:700; color:var(--text-primary); font-variant-numeric:tabular-nums; }
.timing-cell .t-sub{ font-size:11px; color:var(--text-secondary); margin-top:2px; }
.timing-bar-wrap{ margin-top:10px; }
.timing-bar-t{ display:flex; justify-content:space-between; font-size:11px; color:var(--text-tertiary); margin-bottom:5px; }
.timing-bar{ height:6px; background:#EDEFF3; border-radius:3px; overflow:hidden; }
.timing-bar-fill{ height:100%; background:linear-gradient(90deg,var(--primary),#62CFA9); border-radius:3px; transition:width .3s; }

/* ===== 底部操作栏：收藏 / 标记 / 分享 + 交卷 ===== */
.bottom-bar{
  flex-shrink:0; display:flex; align-items:center; gap:6px;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
  background:#fff; border-top:1px solid #F0F1F6;
}
.tool-btn{
  flex:1; height:46px; border:none; background:none; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  border-radius:10px; color:var(--text-secondary); transition:background .12s;
}
.tool-btn:active{ background:#F0F1F6; }
.tool-btn .ico{ font-size:17px; line-height:1; }
.tool-btn .lbl{ font-size:10px; }
.tool-btn.on{ color:var(--primary); }
.tool-btn.on .ico{ color:#FA8C16; }
.btn-submit{
  flex:0 0 92px; height:44px; border:none; border-radius:22px;
  background:linear-gradient(100deg,#7169ED,#62CFA9); color:#fff;
  font-size:14px; font-weight:600; cursor:pointer;
  box-shadow:0 8px 18px rgba(91,114,245,.22); transition:transform .12s;
}
.btn-submit:active{ transform:scale(.97); }

/* ===== 页面轻提示（收藏/标记/分享反馈） ===== */
.practice-toast{
  position:fixed; top:64px; left:50%; transform:translateX(-50%);
  background:rgba(22,27,46,.82); color:#fff; padding:9px 16px; border-radius:8px;
  font-size:12px; z-index:200; opacity:0; pointer-events:none;
  transition:opacity .25s; max-width:86%; white-space:nowrap;
}
.practice-toast.show{ opacity:1; }

/* ===== 分享弹窗（自动生成分享卡片，分享至朋友圈） ===== */
.share-mask{
  position:fixed; inset:0; background:rgba(22,27,46,.5);
  display:none; align-items:center; justify-content:center; z-index:180;
}
.share-mask.show{ display:flex; }
.share-panel{ width:82%; max-width:320px; text-align:center; }
.share-card{
  background:#fff; border-radius:16px; padding:20px 18px; margin-bottom:12px;
  box-shadow:0 16px 40px rgba(22,27,46,.18); text-align:left;
}
.share-brand{
  display:inline-block; font-size:11px; font-weight:700; color:#fff;
  background:linear-gradient(100deg,#7169ED,#62CFA9); border-radius:99px; padding:3px 10px; margin-bottom:10px;
}
.share-qnum{ font-size:11px; color:var(--text-secondary); margin-bottom:8px; }
.share-stem{ font-size:14px; color:#333; line-height:1.7; margin-bottom:10px; }
.share-answer{ font-size:13px; font-weight:700; color:var(--success); }
.share-desc{ font-size:11px; color:#fff; opacity:.9; margin-bottom:12px; }
.share-btn{
  width:100%; height:44px; border:none; border-radius:22px;
  background:linear-gradient(100deg,#7169ED,#62CFA9); color:#fff;
  font-size:14px; font-weight:600; cursor:pointer; margin-bottom:8px;
}
.share-cancel{
  width:100%; height:42px; border:none; border-radius:21px;
  background:rgba(255,255,255,.92); color:var(--text-secondary);
  font-size:13px; font-weight:600; cursor:pointer;
}
/* 已标记标签 */
.tag.marked{ background:#FFF7E6; color:#FA8C16; font-weight:600; }

/* ===== 操作/分析/综合运用题：题干区 + 可拖拽分界线 + 子题作答区（上下分屏，PM 2026-09-02） ===== */
.op-wrap{ display:flex; flex-direction:column; height:100%; min-height:0; }
.op-stem-pane{
  overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 16px;
  display:flex; flex-direction:column; gap:12px;
  background:#fff;
}
.op-stem-pane .op-stem-text{ font-size:15px; line-height:1.8; color:#333; }
/* 题干区顶部标签行（已删：题型/考点/难度顶部 tagArea 已有，不重复） */
.op-stem-pane .op-desc{
  font-size:13px; color:#667; background:#F7F8FF; border-left:3px solid var(--primary);
  padding:8px 12px; border-radius:0 8px 8px 0; line-height:1.6;
}
.op-img{
  min-height:140px; border-radius:12px;
  background:linear-gradient(135deg,#EEF1FF,#E4FBF5);
  border:1px dashed #B9C4F0;
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px;
  color:#5B72F5; font-size:13px;
}
.op-img .op-img-ico{ font-size:32px; }
/* 可拖拽分界线 */
.op-divider{
  flex-shrink:0; position:relative; height:16px;
  display:flex; align-items:center; justify-content:center;
  background:#F6F7FB; border-top:1px solid #F0F1F6; border-bottom:1px solid #F0F1F6;
  cursor:row-resize; user-select:none; touch-action:none;
}
.op-divider .op-grip{
  width:36px; height:5px; border-radius:3px; background:#C9CEDA;
}
.op-divider:active .op-grip{ background:var(--primary); }
.op-dragging, .op-dragging *{ user-select:none !important; -webkit-user-select:none !important; }
/* 解析态分屏：不占满、分界线隐藏、题干区与作答区取自然高度，把空间留给下方解析区 */
.op-wrap.reveal{ height:auto !important; }
.op-wrap.reveal .op-divider{ display:none; }
.op-wrap.reveal .op-stem-pane{ max-height:42vh; }   /* 题干过长时限高可滚，不挤占解析区 */
.op-wrap.reveal .op-answer-pane{ flex:0 0 auto; overflow:visible; }
/* 子题作答区：上=横向小题导航；下=当前子题内容+底部切换钮 */
.op-answer-pane{ flex:1; min-height:0; display:flex; flex-direction:column; background:#fff; }
.op-tabs{
  flex-shrink:0; display:flex; gap:8px;
  padding:10px 14px; overflow-x:auto; -webkit-overflow-scrolling:touch;
  border-bottom:1px solid #F0F1F6;
}
.op-tab{
  flex-shrink:0; min-width:52px; padding:7px 10px; border-radius:9px;
  background:#F5F6FA; color:var(--text-secondary);
  font-size:12px; font-weight:600; text-align:center;
  cursor:pointer; white-space:nowrap; transition:all .12s;
  border:1.5px solid transparent;
}
.op-tab.active{ background:var(--primary-light); color:var(--primary); border-color:var(--primary); }
/* 子题 tab 只做选中态（PM 2026-09-05：删对错/完成变色与 ✓/✗/— 标志） */
.op-answer-scroll{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 16px 8px; }
.op-sub-stem{ font-size:14px; line-height:1.7; color:#333; margin-bottom:12px; }



/* ===== 交卷确认弹窗 ===== */
.modal-mask{ position:fixed; inset:0; background:rgba(22,27,46,.45); display:none; align-items:center; justify-content:center; z-index:100; }
.modal-mask.show{ display:flex; }
.modal-panel{ width:78%; max-width:320px; background:#fff; border-radius:16px; padding:22px 18px; text-align:center; }
.modal-title{ font-size:16px; font-weight:700; margin-bottom:8px; }
.modal-desc{ font-size:13px; color:var(--text-secondary); line-height:1.6; margin-bottom:18px; }
.modal-btns{ display:flex; gap:10px; }
.modal-btn{ flex:1; height:42px; border:none; border-radius:21px; font-size:14px; font-weight:600; cursor:pointer; }
.modal-btn.cancel{ background:#F5F6FA; color:var(--text-secondary); }
.modal-btn.ok{ background:linear-gradient(100deg,#7169ED,#62CFA9); color:#fff; }

/* ===== 反馈入口：选项下方居中，不显眼 ===== */
.feedback-entry{
  padding:6px 16px 14px; background:#fff; text-align:center; flex-shrink:0;
}
.feedback-link{
  border:none; background:none; cursor:pointer;
  font-size:11px; color:var(--text-tertiary); line-height:1;
  padding:4px 8px; border-radius:6px;
  text-decoration:underline; text-decoration-color:rgba(152,160,178,.4); text-underline-offset:3px;
  transition:color .15s ease;
}
.feedback-link:active{ color:var(--primary); }

/* ===== 反馈浮窗（bottom sheet：遮罩 + 底部上滑面板，圆角顶 + 拖拽横条；题目/解析两独立实例） ===== */
.fb-mask{
  position:fixed; inset:0; background:rgba(22,27,46,.45); z-index:115;
  display:flex; align-items:flex-end; justify-content:center;
  opacity:0; visibility:hidden; transition:opacity .22s ease, visibility .22s;
}
.fb-mask.show{ opacity:1; visibility:visible; }
.fb-panel{
  width:100%; max-width:520px; background:#fff;
  border-radius:18px 18px 0 0; padding:8px 16px 22px;
  max-height:74%; display:flex; flex-direction:column;
  transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,.35,1);
}
.fb-mask.show .fb-panel{ transform:translateY(0); }
.fb-grab{
  width:42px; height:4px; border-radius:2px; background:#E3E6F0;
  margin:0 auto 12px; flex-shrink:0;
}
.fb-head{
  display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-shrink:0;
}
.fb-title{ font-size:16px; font-weight:700; color:var(--text-primary); }
.fb-close{
  width:28px; height:28px; border:none; background:none; cursor:pointer;
  color:var(--text-tertiary); font-size:22px; line-height:1; border-radius:50%;
  display:flex; align-items:center; justify-content:center; padding:0;
}
.fb-close:active{ background:#F0F1F6; }
.fb-body{ overflow-y:auto; flex:1; }
.feedback-sec{ margin-bottom:14px; }
.feedback-sec-t{
  font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:8px;
}
.feedback-sec-t .req{ color:var(--danger); margin-left:2px; }
/* 错误类型多选（chips 流式排列） */
.feedback-opts{ display:flex; flex-wrap:wrap; gap:8px; }
.fb-chip{
  padding:6px 12px; border-radius:14px; border:1px solid #E3E8F2;
  background:#F7F9FC; color:var(--text-secondary);
  font-size:12px; cursor:pointer; transition:all .12s ease;
}
.fb-chip.on{
  background:var(--primary-light); border-color:var(--primary); color:var(--primary-dark); font-weight:600;
}
.feedback-ta{
  width:100%; min-height:74px; padding:10px 12px; box-sizing:border-box;
  border:1px solid #E3E8F2; border-radius:10px; background:#FBFBFE;
  font-size:13px; color:var(--text-primary); line-height:1.5;
  font-family:inherit; outline:none; resize:none;
  transition:border-color .15s ease;
}
.feedback-ta:focus{ border-color:var(--primary); background:#fff; }
.fb-actions{
  display:flex; gap:10px; margin-top:12px; flex-shrink:0;
}
.fb-btn{
  flex:1; height:42px; border:none; border-radius:21px;
  font-size:14px; font-weight:600; cursor:pointer;
}
.fb-btn.cancel{ background:#F5F6FA; color:var(--text-secondary); }
.fb-btn.ok{ background:linear-gradient(100deg,#7169ED,#62CFA9); color:#fff; }
/* 解析反馈入口：解析卡底部小字（与题目入口同款弱视觉） */
.feedback-link.analysis-fb{ margin-top:10px; padding:4px 0; text-align:left; }

/* ===== 答题卡：上滑遮罩浮窗 ===== */
.sheet-mask{
  position:fixed; inset:0; background:rgba(22,27,46,.45); z-index:110;
  opacity:0; visibility:hidden; transition:opacity .22s ease, visibility .22s;
}
.sheet-mask.show{ opacity:1; visibility:visible; }
.sheet-panel{
  position:absolute; left:0; right:0; bottom:0;
  background:#fff; border-radius:18px 18px 0 0;
  padding:14px 16px 22px;
  max-height:70%; display:flex; flex-direction:column;
  transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,.35,1);
}
.sheet-mask.show .sheet-panel{ transform:translateY(0); }
.sheet-grab{
  width:42px; height:4px; border-radius:2px; background:#E3E6F0;
  margin:0 auto 14px;
}
.sheet-head{
  display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;
}
.sheet-title{ font-size:15px; font-weight:700; color:var(--text-primary); }
.sheet-close{
  width:28px; height:28px; border:none; background:none; cursor:pointer;
  color:var(--text-tertiary); font-size:22px; line-height:1; border-radius:50%;
  display:flex; align-items:center; justify-content:center; padding:0;
}
.sheet-close:active{ background:#F0F1F6; }
/* 图例：未交卷=作答态（当前题/已答/未答/已标记）；交卷后=判定态（当前题/答对/答对一半/答错/未答/已标记） */
.sheet-legend{
  display:grid; grid-template-columns:1fr 1fr; column-gap:14px; row-gap:7px;
  padding:8px 4px 12px; border-bottom:1px solid #F0F1F6;
  font-size:11px; color:var(--text-secondary);
}
.sheet-legend .lg{ display:flex; align-items:center; gap:5px; }
/* 已答（未交卷时显示，填充普蓝，与交卷后作答无关，仅表示已作答） */
.sheet-legend .lg-done i{ background:var(--primary); }
.sheet-legend .lg i{
  width:14px; height:14px; border-radius:4px; display:inline-block; flex-shrink:0;
  border:1px solid transparent;
}
/* 判定态专属标签：作答态隐藏，交卷后显示（答对一半/答错） */
.sheet-legend .lg-verdict-only{ display:none; }
/* 交卷后排两行三列：当前题/答对/答对一半 + 答错/未答/已标记 */
.sheet-legend.verdict{ grid-template-columns:repeat(3, 1fr); }
.sheet-legend.verdict .lg-verdict-only{ display:flex; }
.sheet-legend .lg-half i{ background:#F59E0B; }
.sheet-legend .lg-wrong i{ background:#E4573D; }
.sheet-legend .lg-todo i{ background:#fff; border-color:#C9CEDA; }
.sheet-legend .lg-mark i{ background:#FFF7E6; border-color:#FA8C16; position:relative; }
.sheet-legend .lg-current i{
  background:#fff; border:1.5px solid var(--primary);
  box-shadow:0 0 0 1.5px var(--primary-light);
}
.sheet-legend .lg-mark i::after{
  content:''; position:absolute; right:1px; top:1px; width:5px; height:5px; border-radius:50%; background:#FA8C16;
}
/* 题号网格 */
.sheet-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(46px, 1fr));
  gap:10px; padding:14px 4px 6px; overflow-y:auto;
}
/* 考试卷答题卡题型分区（PM 2026-09-02）：规则块占满整行，section 内格子继承网格
   2026-09-02 PM：轻量化——字号缩小、字色减淡，弱化视觉存在感 */
.sheet-rule{
  grid-column:1 / -1;
  margin:8px 0 0; padding:5px 8px;
  background:#F7F8FB; border-radius:6px; border-left:2px solid #D5D9E6;
  display:flex; flex-direction:column; gap:1px;
}
.sheet-rule:first-child{ margin-top:0; }
.sheet-rule-line{ font-size:11px; font-weight:500; color:var(--text-secondary); }
.sheet-rule-hint{ font-size:10px; color:var(--text-tertiary); }
/* 答题卡底部：确认交卷按钮（网格滚动区之外，常驻） */
.sheet-submit{
  flex-shrink:0; margin-top:10px; padding-top:10px; border-top:1px solid #F0F1F6;
}
.sheet-submit-btn{
  width:100%; height:46px; border:none; border-radius:23px;
  background:linear-gradient(100deg,var(--primary),var(--primary-dark)); color:#fff;
  font-size:15px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:6px;
  box-shadow:0 6px 16px rgba(91,114,245,.28);
  transition:transform .12s ease, opacity .15s ease;
}
.sheet-submit-btn:active{ transform:scale(.98); opacity:.92; }
.sheet-submit-btn svg{ width:18px; height:18px; }
.sheet-submit-tip{ margin-top:6px; text-align:center; font-size:11px; color:var(--text-tertiary); }
.sheet-cell{
  position:relative;
  aspect-ratio:1; border-radius:10px; border:1.5px solid #C9CEDA;
  background:#fff; color:var(--text-primary);
  font-size:14px; font-weight:600;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:transform .12s ease, border-color .15s, background .15s;
}
.sheet-cell:active{ transform:scale(.94); }

/* ---------- 判题 ---------- */
function checkAnswer(q, ans) {
  if (ans === undefined || ans === null || ans === '') return null;   /* 未答 */
  if (q.type === 'multi') {
    if (!Array.isArray(ans) || ans.length === 0) return null;
    return q.answer.slice().sort().join(',') === ans.slice().sort().join(',');
  }
  if (q.type === 'fill') {
    var v = String(ans).trim();
    if (!v) return null;
    return q.keywords.some(function(k) { return v.indexOf(k) >= 0; });
  }
  if (q.type === 'operation') {
    var any = false, all = true;
    for (var i = 0; i < q.sub.length; i++) {
      var sa = ans && ans[i];
      if (sa === undefined || sa === null || sa === '') return null;  /* 有子题未答 */
      any = true;
      if (!checkAnswer(q.sub[i], sa)) all = false;
    }
    return any ? all : null;
  }
  if (q.type === 'essay') return true;   /* 简答演示：作答即完成 */
  return ans === q.answer;
}
function getAnswered(q, ans) {
  if (ans === undefined || ans === null) return false;
  if (Array.isArray(ans)) return ans.length > 0;
  if (typeof ans === 'object') {
    for (var k in ans) if (ans[k] !== undefined && ans[k] !== null && ans[k] !== '') return true;
    return false;
  }
  return String(ans).trim() !== '';
}
function countAnswered() {
  var n = 0;
  for (var i = 0; i < total; i++) if (getAnswered(QUESTIONS[i], answers[i])) n++;
  return n;
}
/* 判题分类（答题卡图例用）：返回 'correct' 答对 / 'half' 答对一半 / 'wrong' 答错 / 'none' 未答
   口径：多选题 全选正确项=答对；选了错项=答错；选对部分未选全=答对一半；未答=none。
   其余题型（单选/判断/填空/操作/简答）只有 对/错/未答。 */
function classifyResult(q, ans) {
  var r = checkAnswer(q, ans);
  if (r === null) return 'none';
  if (r === true) return 'correct';
  if (q.type !== 'multi') return 'wrong';
  /* 多选题答错：可能部分对/含错项，分「半对（选对部分未选全）」与「答错（选了错项）」 */
  var sel = (ans || []).slice().sort();
  var correct = (q.answer || []).slice().sort();
  var hasWrong = sel.some(function(s) { return correct.indexOf(s) < 0; });
  return hasWrong ? 'wrong' : 'half';
}

/* ---------- 答案文本 ---------- */
function formatAnswer(q) {
  if (q.type === 'operation') return q.sub.map(function(s,i){ return '第'+(i+1)+'小题：'+formatAnswer(s); }).join('　');
  if (q.type === 'fill' || q.type === 'essay') return q.fill;
  if (q.type === 'multi') return q.answer.map(function(i){ return LETTERS[i]; }).join('、');
  if (q.type === 'judge') return q.options[q.answer];
  return LETTERS[q.answer];
}
function formatUserAnswer(q, ans) {
  if (q.type === 'operation') return q.sub.map(function(s,i){ return '第'+(i+1)+'小题：'+formatUserAnswer(s, ans ? ans[i] : undefined); }).join('　');
  if (q.type === 'fill' || q.type === 'essay') return ans || '未答';
  if (q.type === 'multi') {
    if (!Array.isArray(ans) || ans.length === 0) return '未答';
    return ans.map(function(i){ return LETTERS[i]; }).join('、');
  }
  if (q.type === 'judge') return ans === undefined ? '未答' : q.options[ans];
  return ans === undefined ? '未答' : LETTERS[ans];
}

  /* 常规题面：恢复顶部进度条与底部操作按钮（题型规范页由 renderRulePage 隐藏，PM 2026-09-05） */

  var bbQ = document.getElementById('bottomBar'); if (bbQ) bbQ.style.display = '';
  /* 考试卷规则页拦截：pendingRule 命中 → 渲染规则页后直接返回（PM 2026-09-02） */
  if (IS_EXAM_PAPER && !submitted && pendingRule) {
    if (renderRulePage(pendingRule)) { updateBottomBar(); return; }
  }
  /* 非规则页：恢复反馈入口显示（规则页曾隐藏，PM 2026-09-02） */
  var fbEntry = document.querySelector('.feedback-entry');
  if (fbEntry) fbEntry.style.display = '';
  var q = QUESTIONS[idx];
  /* 背题模式下填空/简答：解析需点「轻提交」确认后才显示（打字即弹已改，PM 2026-09-02）；
     多选（2026-09-05）：作答即显示解析，未作答也可点「查看解析」主动展开（reviewed 记录）；
     其它题型保持已答即显示解析 */
  var studyReveal = (q.type === 'fill' || q.type === 'essay') ? !!reviewed[idx]
    : (q.type === 'multi') ? (getAnswered(q, answers[idx]) || !!reviewed[idx])
    : getAnswered(q, answers[idx]);
  var reveal = submitted || (MODE === 'study' && studyReveal);

  /* 标签（2026-09-02 PM：顽固仅考点级——考点顽固标注在考点标签上，考题不再单独标顽固） */
  var tags = '<span class="tag type">' + (TYPE_NAME[q.type] || '题目') + '</span>'
    + '<span class="tag concept' + (isStubbornPoint(q.concept) ? ' stub' : '') + '">📍 ' + (q.concept || '')
    + (isStubbornPoint(q.concept) ? ' <b class="point-stub">· 顽固</b>' : '') + '</span>'
    + '<span class="tag difficulty">难度:' + q.difficulty + '</span>';
  if (marked[idx]) tags += '<span class="tag marked">已标记</span>';
  document.getElementById('tagArea').innerHTML = tags;

  /* 题目主体：操作类题型题干由 renderOperation 的背景/浮窗统一管理（避免重复渲染）
     题号由进度条「第X题 X/Y」表达，题干前不再重复绝对题号（PM 2026-09-06 全题型统一） */
  var qNumPrefix = '';
  var html = (OP_TYPES.indexOf(q.type) < 0)
    ? '<div class="stem-wrap"><div class="stem">' + qNumPrefix + q.stem + '</div></div>'
    : '';
  html += renderBody(q, answers[idx], reveal);

  /* 解析 */
  var aa = document.getElementById('analysisArea');
  aa.innerHTML = renderAnalysis(q, answers[idx], reveal);
  aa.classList.toggle('show', reveal);

  document.getElementById('qaBody').innerHTML = html;
  /* 进度行（PM 2026-09-02）：考试卷=当前题型内进度（题型名+第X题+题内/本大题数），
     非考试卷=整卷进度（第X题+X/total） */
  var sec = sectionInfo(idx);
  if (sec) {
    document.getElementById('qNum').textContent = sec.typeName + ' 第 ' + (sec.offset+1) + ' 题';
    document.getElementById('navProgress').textContent = (sec.offset+1) + '/' + sec.count;
    document.getElementById('progressFill').style.width = ((sec.offset+1)/sec.count*100) + '%';
  } else {
    document.getElementById('qNum').textContent = '第 ' + (idx+1) + ' 题';
    document.getElementById('navProgress').textContent = (idx+1) + '/' + total;
    document.getElementById('progressFill').style.width = ((idx+1)/total*100) + '%';
  }
  updateBottomBar();
  /* 操作题分屏：渲染后按容器实测高度校准（拖拽/切换子题后也会重建渲染）；
     解析态同样调用以切换 reveal 布局（不占满、分界线隐藏） */
  if (OP_TYPES.indexOf(q.type) >= 0) {
    applyOpLayout();
    if (!('_opInited' in window)) { window._opInited = 1; setTimeout(function(){ applyOpLayout(); }, 60); }
  }
  /* 答题卡开着时实时刷新已答/标记状态（否则关闭时状态会过期） */
  if (document.getElementById('sheetMask').classList.contains('show')) renderSheet();
}

function renderBody(q, ans, reveal) {
  if (q.type === 'single' || q.type === 'judge') return renderOptions(q, ans, reveal);
  if (q.type === 'multi') {
    /* 多选题轻按钮（PM 2026-09-05 对齐填空轻提交）：选项下方右对齐常驻（解析前）。
       做题模式=「下一题」（作答后跳下一题）；背题模式=「查看解析」（未作答可主动展开解析） */
    var multiBtn = reveal ? '' : '<div class="multi-bar"><button class="multi-submit" id="multiSubmit" onclick="submitMultiAnswer()"><span>' + ((MODE === 'study') ? '查看解析' : '下一题') + '</span> &#8250;</button></div>';
    return renderOptions(q, ans, reveal) + multiBtn;
  }
  if (q.type === 'fill') {
    var cls = reveal ? (checkAnswer(q, ans) ? ' correct' : (ans ? ' wrong' : '')) : (committed[idx] ? ' committed' : '');
    var dis = reveal ? ' disabled' : '';
    var fillBtn = reveal ? '' : '<button class="fill-submit" id="fillSubmit" onclick="submitTextAnswer()"><span>' + ((MODE === 'study') ? '查看解析' : '下一题') + '</span> &#8250;</button>';
    return '<div class="fill-wrap">'
      + '<input class="fill-input' + cls + '" id="fillInput" value="' + (ans || '') + '" placeholder="请输入答案…"'
      + ' oninput="onFillInput(this.value)" onkeydown="onTextKeydown(event)"' + dis + '>'
      + fillBtn
      + '</div>';
  }
  if (q.type === 'operation') return renderOperation(q, ans, reveal);
  if (q.type === 'essay') {
    var clsE = reveal ? (checkAnswer(q, ans) ? ' correct' : (ans ? ' wrong' : '')) : (committed[idx] ? ' committed' : '');
    var dfe = reveal ? ' disabled' : '';
    var essayBtn = reveal ? '' : '<button class="essay-submit" id="fillSubmit" onclick="submitTextAnswer()"><span>' + ((MODE === 'study') ? '查看解析' : '下一题') + '</span> &#8250;</button>';
    return '<div class="essay-wrap">'
      + '<textarea class="essay-textarea' + clsE + '" placeholder="请输入你的作答…" oninput="onEssayInput(this.value)" onkeydown="onTextKeydown(event)"' + dfe + '>' + (ans || '') + '</textarea>'
      + essayBtn
      + '</div>';
  }
  return '';
}
function renderOptions(q, ans, reveal) {
  var isMulti = q.type === 'multi';
  var correctArr = isMulti ? q.answer : [q.answer];
  var selArr = isMulti ? (ans || []) : (ans === undefined || ans === null ? [] : [ans]);
  var html = '<div class="options">';
  q.options.forEach(function(opt, i) {
    var cls = '';
    if (reveal) {
      if (correctArr.indexOf(i) >= 0) cls = ' correct';
      else if (selArr.indexOf(i) >= 0) cls = ' wrong';
    } else if (selArr.indexOf(i) >= 0) cls = ' selected';
    /* 易错/易漏选标签：仅答案出现后显示（交卷 / 背题已答），答题期间不显示，避免泄露正误；
       互斥，易错优先（数据来源 = 埋点统计；演示期手写模拟） */
    var flagHtml = '';
    if (reveal) {
      if (q.hotWrong !== undefined && q.hotWrong === i) {
        flagHtml = '<span class="opt-flag hot-wrong">易错</span>';
      } else if (q.hotMiss !== undefined) {
        var missArr = Array.isArray(q.hotMiss) ? q.hotMiss : [q.hotMiss];
        if (missArr.indexOf(i) >= 0) flagHtml = '<span class="opt-flag hot-miss">易漏选</span>';
      }
    }
    html += '<div class="option' + cls + '" onclick="onSelectOption(' + i + ')">'
      + '<span class="' + (isMulti ? 'checkbox' : 'radio') + '"></span>'
      + '<span class="opt-body"><span class="opt-label">' + LETTERS[i] + '.</span>' + opt + '</span>'
      + flagHtml
      + '</div>';
  });
  return html + '</div>';
}
function renderOperation(q, ans, reveal) {
  /* 上下分屏：题干阅读区 + 可拖拽分界线 + 子题作答区（PM 2026-09-02）
     作答态与解析态同结构；解析态下子题作答组件带对错着色、输入禁用、tab 切换同步解析区（单题解析） */
  /* ---------- 上下分屏：题干阅读区 + 可拖拽分界线 + 子题作答区（PM 2026-09-02） ---------- */
  /* ① 题干区（默认 40% 顶，独立滚动；题型/考点/难度标签已在顶部 tagArea，不重复） */
  var stemPane = '<div class="op-stem-pane">'
    + '<div class="op-stem-text">' + q.stem + '</div>'
    + '<div class="op-desc">请根据上方要求完成全部子题，作答结果会合并判分。</div>'
    + '<div class="op-img"><span class="op-img-ico">🖼️</span><span>材料/截图占位图</span></div>'
    + '</div>';
  /* ② 拖拽分界线 */
  var divider = '<div class="op-divider" onpointerdown="opDividerPointerDown(event)" onpointermove="opDividerPointerMove(event)" onpointerup="opDividerPointerUp()" onpointercancel="opDividerPointerUp()">'
    + '<div class="op-grip"></div>'
    + '</div>';
  /* 子题 tab：只做选中态（PM 2026-09-05：不做对错/完成变色，不加 ✓/✗/— 标志）；
     子题号用带圈数字 ①②③…（PM 2026-09-05） */
  var CIRC = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
  var tabs = '<div class="op-tabs">';
  for (var t = 0; t < q.sub.length; t++) {
    var tabCls = 'op-tab' + (t === opSubIdx ? ' active' : '');
    tabs += '<div class="' + tabCls + '" onclick="opJumpSub(' + t + ')">第 ' + (CIRC[t] || (t+1)) + ' 题</div>';
  }
  tabs += '</div>';
  var sub = q.sub[opSubIdx];
  var subAns = ans ? ans[opSubIdx] : undefined;
  var content;
  if (sub.type === 'single' || sub.type === 'judge') content = renderSubOptions(sub, subAns, reveal, opSubIdx);
  else if (sub.type === 'fill') content = renderSubFill(sub, subAns, reveal, opSubIdx);
  else content = '<div class="op-sub-stem">' + sub.stem + '</div>';
  /* 子题切换只用横向 tab（2026-09-02 PM：不要底部上一题/下一题按钮） */
  var answerPane = '<div class="op-answer-pane">' + tabs
    + '<div class="op-answer-scroll">'
    + '<div class="op-sub-stem">' + sub.stem + '</div>'
    + content
    + '</div>'
    + '</div>';
  return '<div class="op-wrap">' + stemPane + divider + answerPane + '</div>';
}
/* 子题填空输入（分屏作答区内） */
function renderSubFill(sub, subAns, reveal, subIdx) {
  var cls = reveal ? (checkAnswer(sub, subAns) ? ' correct' : (subAns ? ' wrong' : '')) : '';
  return '<input class="fill-input' + cls + '" value="' + (subAns || '') + '" placeholder="请输入答案…" oninput="onSubFillInput(' + subIdx + ',this.value)"' + (reveal ? ' disabled' : '') + '>';
}
function renderSubOptions(sub, subAns, reveal, subIdx) {
  var sel = subAns === undefined || subAns === null ? -1 : subAns;
  var html = '<div class="options">';
  sub.options.forEach(function(opt, i) {
    var cls = '';
    if (reveal) {
      if (sub.answer === i) cls = ' correct';
      else if (sel === i) cls = ' wrong';
    } else if (sel === i) cls = ' selected';
    html += '<div class="option' + cls + '" onclick="onSubSelect(' + subIdx + ',' + i + ')">'
      + '<span class="radio"></span><span><span class="opt-label">' + LETTERS[i] + '.</span>' + opt + '</span></div>';
  });
  return html + '</div>';
}
/* ---------- 错题本：诊断卡 + 统计卡（entry=wrong 专用；PM 2026-09 拍板） ---------- */
var DIAG_KEY = 'zsb_wrong_diag_v1';
function loadDiag() { try { return JSON.parse(localStorage.getItem(DIAG_KEY) || '{}'); } catch(e) { return {}; } }
function renderWrongDiag(q) {
  var id = q.qid || (ENTRY + '-' + idx);
  var cur = loadDiag()[id] || '';
  /* AI 错因建议（演示 mock）：题目带 aiReason 用之，否则按已有 tag 兜底，再否则建议概念混淆。
     演示阶段前端直接给值，标「AI 已识别」范式，不做真接口（PM 2026-09-07 拍板） */
  var aiK = q.aiReason || q.tag || 'confusion';
  /* 5 类 key 与错题本首页 TAG_NAME 对齐：misread 审题 / blind 盲区 / confusion 概念混淆 / memory 记忆遗漏 / operation 操作知识错误 */
  var opts = [
    { k:'misread', label:'审题错误' },
    { k:'blind', label:'知识盲区' },
    { k:'confusion', label:'概念混淆' },
    { k:'memory', label:'记忆遗漏' },
    { k:'operation', label:'操作知识错误' }
  ];
  var btns = '';
  opts.forEach(function(o) {
    var isAi = (o.k === aiK);                       /* 本项是 AI 建议的 */
    var isCur = (o.k === cur);                     /* 用户已手选的 */
    var cls = 'diag-btn';
    if (isCur) cls += ' active';                   /* 用户选中 → 实心高亮，盖过 AI 态 */
    else if (isAi && !cur) cls += ' ai-suggest';   /* 无手选 → AI 建议项预选高亮 */
    var badge = isAi ? '<span class="diag-ai-badge">AI</span>' : '';
    btns += '<button class="' + cls + '" data-k="' + o.k + '" onclick="setDiag(this)">' + o.label + badge + '</button>';
  });
  return '<div class="diag-card">'
    + '<div class="diag-title">💡 这次为什么错了？</div>'
    + '<div class="diag-desc">AI 已依据解析预判错因，可直接确认或改选。</div>'
    + '<div class="diag-actions">' + btns + '</div>'
    + '</div>';
}
function setDiag(btn) {
  var q = QUESTIONS[idx] || {};
  var id = q.qid || (ENTRY + '-' + idx);
  var k = btn.getAttribute('data-k');
  var diag = loadDiag();
  if (diag[id] === k) delete diag[id];
  else diag[id] = k;
  try { localStorage.setItem(DIAG_KEY, JSON.stringify(diag)); } catch(e) {}
  var cur = diag[id] || '';
  var btns = btn.parentElement.querySelectorAll('.diag-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('active', btns[i].getAttribute('data-k') === cur);
  }
  showToast('已标记错因，同类题重点巩固');
}
function renderWrongStats(q) {
  var st = q.stats || { avgSec: 50, avgRate: 50, okCount: 1, failCount: 1 };
  var diff = q.difficulty || '中';
  var diffStar = (diff === '高') ? '★★★' : ((diff === '低') ? '★' : '★★');
  return '<div class="wrong-stats-card">'
    + '<div class="sec-head"><span class="ico ico-9">⏱</span><span class="name">本题统计</span></div>'
    + '<div class="wrong-stats-grid">'
    +   '<div class="ws-item"><span class="ws-label">我的答题时间</span><span class="ws-value blue">' + fmtMMSS(finalSec || 0) + '</span></div>'
    +   '<div class="ws-item"><span class="ws-label">全站平均耗时</span><span class="ws-value">' + st.avgSec + '秒</span></div>'
    +   '<div class="ws-item"><span class="ws-label">全站正确率</span><span class="ws-value ' + (st.avgRate >= 60 ? 'green' : 'red') + '">' + st.avgRate + '%</span></div>'
    +   '<div class="ws-item"><span class="ws-label">本题难度</span><span class="ws-value">' + diffStar + ' ' + diff + '</span></div>'
    + '</div>'
    + '<div class="wrong-count-row">'
    +   '<span>本题你作答：</span><span class="ok">✅ 对 ' + st.okCount + ' 次</span><span class="fail">❌ 错 ' + st.failCount + ' 次</span>'
    + '</div>'
    + '</div>';
}
function stripHtml(s) {
  return String(s || '').replace(/<[^>]+>/g, '').replace(/_{2,}/g, '____');
}

/* ---------- 解析区（PM 2026-08-31 拍板：删系统判断节 + 不显序号） ----------
   1 答题结果 / 2 解析 → 视频解析（紧随解析下方，VIP解锁观看占位，PM 2026-09-02）
   3 考点对比 / 4 举一反三 / 5 我的笔记 / 6 答题时间·耗时分析
   每题独立组装；演示期视频/对比/举一反三 mock，笔记本地存，耗时接会话计时。
   相关知识点卡已于 2026-09-01 删除 */
function renderAnalysis(q, ans, reveal) {
  if (!reveal) return '';
  var correct = checkAnswer(q, ans);
  var html = '';
  var isOp = q.type === 'operation';

  /* ① 答题结果（操作题：按当前 tab 子题显示对错+你的答案+正确答案，tab 切换同步；PM 2026-09-02） */
  var resultLine;
  if (isOp) {
    var s = q.sub[opSubIdx] || q.sub[0];
    var si = opSubIdx;
    var sok = checkAnswer(s, ans ? ans[si] : undefined);
    var subUserAns = formatUserAnswer(s, ans ? ans[si] : undefined);
    var subRightAns = formatAnswer(s);
    if (sok === true) resultLine = '<div class="answer-line">✅ 回答正确　你的答案：' + subUserAns + '　正确答案：' + subRightAns + '</div>';
    else if (sok === false) resultLine = '<div class="answer-line wrong-ans">❌ 回答错误　你的答案：' + subUserAns + '　正确答案：' + subRightAns + '</div>';
    else resultLine = '<div class="answer-line">正确答案：' + subRightAns + '</div>';
  } else if (correct === true) resultLine = '<div class="answer-line">✅ 回答正确　正确答案：' + formatAnswer(q) + '</div>';
  else if (correct === false) resultLine = '<div class="answer-line wrong-ans">❌ 回答错误　你的答案：' + formatUserAnswer(q, ans) + '　正确答案：' + formatAnswer(q) + '</div>';
  else resultLine = '<div class="answer-line">正确答案：' + formatAnswer(q) + '</div>';
  html += '<div class="ana-sec">'
    + '<div class="sec-head"><span class="ico ico-1">✓</span><span class="name">答题结果</span></div>'
    + resultLine + '</div>';

  /* 错因卡：答错即显，不限做题入口（PM 拍板）；操作题任一子题答错即显；错题本入口恒显（含答对后可确认已掌握） */
  var diagAnswered = getAnswered(q, ans);
  var diagShow = (diagAnswered && correct === false)
    || (isOp && diagAnswered && q.sub && q.sub.some(function(s, si){ return checkAnswer(s, ans ? ans[si] : undefined) === false; }))
    || ENTRY === 'wrong';
  if (diagShow) html += renderWrongDiag(q);
  /* 错题本入口额外：本题统计卡 */
  if (ENTRY === 'wrong') html += renderWrongStats(q);

  /* ② 解析（答案解析 + 解题步骤，原③；系统判断节已删 PM 2026-08-31）
     · 部分解析带图片（流程图/截图），文字下方显示图片占位，接真实题源后替换为实际图
     · 操作题（PM 2026-09-02 拍板）：分屏单题解析——只渲染当前 tab 选中子题（opSubIdx）的
       答案+你的答案+该子题详解，tab 切换子题时与题目区同步；不再平铺全部子题、无整题总评 */
  var steps = (q.steps && q.steps.length) ? '<div class="step-list">解题步骤：<br>' + q.steps.join('<br>') + '</div>' : '';
  var opSubs = '';
  if (isOp && q.sub) {
    var s = q.sub[opSubIdx] || q.sub[0];
    var i = opSubIdx;
    var ok = checkAnswer(s, ans ? ans[i] : undefined);
    var icon = ok === true ? '✅' : (ok === false ? '❌' : '—');
    /* PM 2026-09-02：答案+你的答案已上移到第①节答题结果，本块只留题干+详解，避免重复 */
    opSubs = '<div class="sub-ana">'
      + '<div class="sub-ana-head">' + icon + ' 第 ' + (i+1) + ' 题' + (s.type === 'fill' ? '（填空）' : '') + '</div>'
      + '<div class="sub-ana-stem">' + s.stem + '</div>'
      + '<div class="sub-ana-detail">' + (s.analysis || '') + '</div>'
      + '</div>';
  }
  html += '<div class="ana-sec">'
    + '<div class="sec-head"><span class="ico ico-3">📖</span><span class="name">解析</span></div>'
    + (opSubs ? '<div class="op-sub-anas">' + opSubs + '</div>' : '<div class="analysis-text">' + q.analysis + '</div>')
    + '<div class="analysis-img-placeholder"><span>🖼️</span>图片解析（流程图 / 截图）</div>'
    + (isOp ? '' : steps)
    + '<div class="feedback-link analysis-fb" onclick="openFeedback(\'analysis\')">解析有误？反馈</div>'
    + '</div>';

  /* 视频解析 — mock（紧跟解析区块下方） */
  var vids = q.videos || mockVideos(q);
  html += renderVideos(vids);

  /* ④ 考点对比（相似考点对照，如四大特征 vs 四大功能）— mock */
  var compare = q.compare || mockCompare(q);
  html += renderCompare(compare);

  /* ⑤ 举一反三（同类变式题）— mock */
  var variants = q.variants || mockVariants(q);
  html += renderVariants(variants);

  /* ⑥ 我的笔记（本地存 localStorage，按题 id） */
  html += renderNote(q);

  /* ⑨ 答题时间·耗时分析（接会话计时） */
  html += renderTiming(q);

  return html;
}

/* ---------- 答题交互 ---------- */
function canEdit() {
  if (submitted) return false;
  var q = QUESTIONS[idx];
  /* 填空/简答/多选：背题下看了解析（reviewed）或已作答即锁定，未看可编辑
     （填空/简答回车确认后仍可改文字；多选未作答可点「查看解析」主动展开） */
  if (MODE === 'study') {
    if (!q) return true;
    if (q.type === 'fill' || q.type === 'essay') return !reviewed[idx];
    if (q.type === 'multi') return !reviewed[idx] && !getAnswered(q, answers[idx]);
    return !getAnswered(q, answers[idx]);
  }
  return true;
}
function onSelectOption(optIndex) {
  if (!canEdit()) return;
  var q = QUESTIONS[idx];
  if (q.type === 'multi') {
    var arr = answers[idx] || [];
    var i = arr.indexOf(optIndex);
    if (i >= 0) arr.splice(i, 1); else arr.push(optIndex);
    answers[idx] = arr;
  } else {
    answers[idx] = optIndex;
  }
  renderQuestion();
  scheduleAutoNext();   /* 单选/判断作答后 0.5s 自动进下一题（多选不触发） */
}
function onFillInput(v) {
  if (!canEdit()) return;
  answers[idx] = v;
  /* 输入中不重渲染（避免丢焦点/锁死）；确认态在回车/轻提交时由 confirmTextAnswer() 统一重建 */
}
function onEssayInput(v) {
  if (!canEdit()) return;
  answers[idx] = v;
}
/* 填空/简答：回车=确认写回（文字回显+蓝色确认态）；其它键交还给输入框（简答多行用 Shift+Enter） */
function onTextKeydown(e) {
  if (!canEdit()) return;
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    confirmTextAnswer();
  }
}
/* 填空/简答：确认答案并回显。背题→锁定输入，做题→保持可编辑继续改 */
function confirmTextAnswer() {
  if (!canEdit()) return;
  var q = QUESTIONS[idx];
  if (!q || (q.type !== 'fill' && q.type !== 'essay')) return;
  var v = (answers[idx] || '').toString().trim();
  if (!v) { showToast('请先填写答案'); return; }
  committed[idx] = true;
  renderQuestion();   /* 重建输入框显示确认态；输入值来自 answers[idx] */
}
/* 填空/简答：轻提交按钮。背题→显示解析（reviewed）；做题→下一步（打开解析或直接下一题） */
function submitTextAnswer() {
  if (!canEdit()) return;
  var q = QUESTIONS[idx];
  if (!q || (q.type !== 'fill' && q.type !== 'essay')) return;
  var v = (answers[idx] || '').toString().trim();
  if (!v) { showToast('请先填写答案'); return; }
  committed[idx] = true;
  if (MODE === 'study') {
    /* 背题：显示答案解析 */
    reviewed[idx] = true;
    renderQuestion();
  } else {
    /* 做题：轻提交 = 下一道题（最后一题则留在本题） */
    if (idx < total - 1) { idx++; resetOp(true); renderQuestion(); }
    else if (!submitted) showToast('已是最后一题，可交卷');
  }
}
/* 多选：轻按钮（PM 2026-09-05 对齐填空轻提交）。
   背题→点「查看解析」主动展开解析（reviewed）；做题→作答后点「下一题」跳下一题，未作答拦截提示 */
function submitMultiAnswer() {
  if (!canEdit()) return;
  var q = QUESTIONS[idx];
  if (!q || q.type !== 'multi') return;
  if (MODE === 'study') {
    /* 背题：展开解析（已作答会自动展开；此处覆盖未作答主动查看） */
    reviewed[idx] = true;
    renderQuestion();
  } else {
    /* 做题：轻提交 = 下一道题（未作答拦截，仿填空「请先填写答案」） */
    var arr = answers[idx];
    if (!Array.isArray(arr) || arr.length === 0) { showToast('请先选择答案'); return; }
    if (idx < total - 1) { idx++; resetOp(true); renderQuestion(); }
    else if (!submitted) showToast('已是最后一题，可交卷');
  }
}
function onSubSelect(subIdx, optIdx) {
  if (!canEdit()) return;
  var ans = answers[idx] || {};
  ans[subIdx] = optIdx;
  answers[idx] = ans;
  renderQuestion();
  scheduleAutoNext();   /* 操作/分析/综合运用子题答完（全答）后 0.5s 自动 */
}
function onSubFillInput(subIdx, v) {
  if (!canEdit()) return;
  var ans = answers[idx] || {};
  ans[subIdx] = v;
  answers[idx] = ans;
  if (MODE === 'study') renderQuestion();
  scheduleAutoNext();
}

/* 题型规则页触发（PM 2026-09-02）：进入某题型首题（sec.offset===0）且该题型未看过规则页 → 设 pendingRule。
   首题型（bigNo=1）进卷时也触发（初始化处单独调用）。已交卷/非考试卷不触发 */
function enterRuleIfNeeded() {
  if (!IS_EXAM_PAPER || submitted) { pendingRule = null; return; }
  var sec = sectionInfo(idx);
  if (sec && sec.offset === 0) {
    if (!seenRule[sec.bigNo]) { pendingRule = sec.bigNo; }
    else { pendingRule = null; }
  } else {
    pendingRule = null;
  }
}
/* 从规则页进入首题：清 pendingRule、记 seenRule，停在当前 idx 渲染题目 */
function leaveRulePage() {
  if (!pendingRule) return false;
  seenRule[pendingRule] = true;
  pendingRule = null;
  renderQuestion();
  return true;
}
function updateBottomBar() {

/* 答题卡点「确认交卷」→ 收卡并提交出成绩（自动交卷/正常交卷统一走此） */
function submitFromSheet() {

/* ---------- 答题计时（会话级；进入即起，交卷即停，结果页记录耗时） ----------
   模式：
     exam 模拟考 / real 真题卷（IS_PAPER）→ 考试倒计时：navTimer 显示【剩余时间 MM:SS】
       从 LIMIT_SEC（卷限时分钟×60）倒扣，到 0 自动交卷（doSubmit）。
     非考试（练习/错题/章节）→ 累计用时：从 startAt 起算，交卷后定格。
   v5.0 接数据层时，finalSec 作为「本次做题耗时」字段一并上报。 */
var startAt = Date.now();
var timerId = null;
var finalSec = null;          /* 交卷时定格秒数（非考试模式） */
var endAt = null;             /* 考试模式：交卷截止时间戳（=startAt + 限时） */
var AUTO_SUBMIT_DONE = false; /* 防止自动交卷重复触发 */
var LIMIT_MIN = IS_PAPER ? ((PAPER_META && PAPER_META.minutes) || 100) : 0;
var LIMIT_SEC = LIMIT_MIN * 60;
if (IS_PAPER && LIMIT_SEC > 0) {
  endAt = startAt + LIMIT_SEC * 1000;
}
function fmtMMSS(sec) {
  if (sec < 0) sec = 0;
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}
function tickTimer() {
  var el = document.getElementById('navTimer');
  if (!el) return;
  var sec;
  if (IS_PAPER && endAt && !submitted) {
    sec = Math.max(0, Math.round((endAt - Date.now()) / 1000));   /* 剩余秒 */
    /* 到点自动交卷 */
    if (sec === 0 && !AUTO_SUBMIT_DONE && !submitted) {
      AUTO_SUBMIT_DONE = true;
      closeSheet();            /* 答题卡开着时先收起，避免盖在成绩结果上 */
      doSubmit();
      return;
    }
  } else {
    sec = (finalSec !== null) ? finalSec : Math.floor((Date.now() - startAt) / 1000);
  }
  el.textContent = fmtMMSS(sec);
  var tip = document.getElementById('navTimer');
  if (tip) tip.title = IS_PAPER ? '剩余时间' : '本次答题用时';
}
function startTimer() {
  if (timerId) return;
  timerId = setInterval(tickTimer, 1000);
  tickTimer();
  /* 练习类（非考试）不显示计时：navTimer 仅考试模式展示剩余倒计时。
     后台仍在计时，结果页/报告的「本次用时」照常取 finalSec。 */
  var nt = document.getElementById('navTimer');
  if (nt) nt.style.display = IS_PAPER ? '' : 'none';
}
function stopTimer() {
  /* 交卷定格：考试模式剩余时间已归零（navTimer 展示剩余），statTime 用【实际用时】 */
  if (finalSec === null) finalSec = Math.floor((Date.now() - startAt) / 1000);
  if (timerId) { clearInterval(timerId); timerId = null; }
  tickTimer();
}

/* ---------- 答题卡（已答/未答/已标记 三态 + 点题号跳转） ---------- */

     判定态开启条件：做题模式交卷后 / 背题模式直接进入——每答一题立即在答题卡标记答对/答错/答对一半（PM 2026-09-05） */
  var verdict = submitted || MODE === 'study';

  /* 单格渲染：cls 类名 + 卷内绝对题号（点击跳题不变） */
  function cellHtml(i) {

    if (verdict) {

      stat[c]++;
      if (isMark) stat.mark++;
      if (c === 'none' && types.indexOf(TYPE_NAME[QUESTIONS[i].type]) < 0) types.push(TYPE_NAME[QUESTIONS[i].type]);
      var cellCls = (c === 'correct') ? 'done' : (c === 'none' ? 'todo' : c);
      var cls = 'sheet-cell ' + cellCls;
      if (isMark) cls += ' mark';
      if (i === idx) cls += ' current';
      return '<button class="' + cls + '" onclick="jumpTo(' + i + ')" aria-label="第' + (i+1) + '题">' + (i+1) + '</button>';
    } else {
      var answered = getAnswered(QUESTIONS[i], answers[i]);
      stat[answered ? 'correct' : 'none']++;   /* 交卷前 correct 槽位存「已答」计数（lgRight 显示已答） */
      if (isMark) stat.mark++;
      if (!answered && types.indexOf(TYPE_NAME[QUESTIONS[i].type]) < 0) types.push(TYPE_NAME[QUESTIONS[i].type]);
      cls = 'sheet-cell ' + (answered ? 'answered' : 'todo');
      if (isMark) cls += ' mark';
      if (i === idx) cls += ' current';
      return '<button class="' + cls + '" onclick="jumpTo(' + i + ')" aria-label="第' + (i+1) + '题">' + (i+1) + '</button>';
    }
  }
  /* 考试卷：按题型分段渲染，每段前插规则块（占满整行）；格子按卷内绝对题号连续排布在网格中（PM 2026-09-02） */
  if (IS_EXAM_PAPER) {
    var secs = examSections();
    secs.forEach(function(sec) {
      html += sheetRuleBlock(sec);
      for (var i = sec.start; i <= sec.end; i++) html += cellHtml(i);
    });
  } else {
    /* 非考试卷：平铺格子，不分区 */
    for (var i = 0; i < total; i++) html += cellHtml(i);
  }
  grid.innerHTML = html;
  document.getElementById('lgRight').textContent = stat.correct;
  document.getElementById('lgHalf').textContent = stat.half;
  document.getElementById('lgWrong').textContent = stat.wrong;
  document.getElementById('lgTodo').textContent = stat.none;
  document.getElementById('lgMark').textContent = stat.mark;
  /* 交卷按钮提示：未答则列题型，全答显提示 */
  var tip = document.getElementById('sheetSubmitTip');
  if (tip) tip.textContent = stat.none > 0
    ? ('未答 ' + stat.none + ' 道：' + types.join('、'))
    : '已全部作答，确认交卷';
}
function jumpTo(i) {
  if (i < 0 || i >= total) return;
  clearAutoNext();
  idx = i;
  resetOp(true);
  enterRuleIfNeeded();   /* 跳到未看规则的首题型 → 先停规则页（PM 2026-09-02） */
  renderQuestion();
  closeSheet();
}

function doSubmit() {
  hideSubmit();
  submitted = true;
  stopTimer();
  if (IS_PAPER) {
    /* 考试模式（模拟考场/历年真题）：交卷 → 上报成绩报告（i壳 REQ_REPORT → 报告层），
       报告页「查看解析/薄弱点分析」再进做题页解析 */
    var r = buildReport();
    try { window.parent.postMessage({ type: 'REQ_REPORT', data: r }, '*'); } catch(e) {}
    return;
  }
  /* 练习类（今日/章节/错题本/我的上传）：交卷 → 直接进入解析（不再弹成绩弹窗） */
  idx = 0;
  renderQuestion();
  reviewAnswers();
}
/* 考试报告数据：对齐成绩报告页字段契约（paperId/type/name/minutes/fullScore/usedSec/score/rank/beat/sheet/typeStats/label/submitTime） */
function buildReport() {
  var right = 0, wrong = 0, skip = 0, i;
  var sheet = [];
  for (i = 0; i < total; i++) {
    var c = classifyResult(QUESTIONS[i], answers[i]);
    if (c === 'correct') { right++; sheet.push(1); }
    else if (c === 'wrong' || c === 'half') { wrong++; sheet.push(0); }
    else { skip++; sheet.push(-1); }
  }
  /* 题型概况：按 TYPE_NAME 归类 */
  var tmap = {};
  for (i = 0; i < total; i++) {
    var tn = TYPE_NAME[QUESTIONS[i].type] || '题目';
    if (!tmap[tn]) tmap[tn] = { name: tn, right: 0, total: 0 };
    tmap[tn].total++;
    if (classifyResult(QUESTIONS[i], answers[i]) === 'correct') tmap[tn].right++;
  }
  var names = Object.keys(tmap);
  return {
    paperId: PAPER_ID,
    type: (ENTRY === 'real') ? 'real' : (ENTRY === 'trial' ? 'trial' : 'exam'),
    name: (PAPER_META && PAPER_META.name) || TITLE,
    minutes: (PAPER_META && PAPER_META.minutes) || 0,
    fullScore: (PAPER_META && PAPER_META.fullScore) || 150,
    submitTime: (function(){ var d = new Date(); function p(n){ return (n<10?'0':'')+n; } return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); })(),
    usedSec: (finalSec !== null) ? finalSec : Math.floor((Date.now() - startAt) / 1000),
    score: calcPaperScore(),
    rank: '--', beat: '--',
    sheet: sheet,
    typeStats: names.map(function(n){ return tmap[n]; }),
    label: (ENTRY === 'real') ? '本次真题考试' : (ENTRY === 'trial' ? '本次体验卷' : '本次模拟考试'),
    right, wrong, skip
  };
}
/* 逐题分值累加（考试模式）：答对得该题分值，答错/未答 0 分 */
function calcPaperScore() {
  var score = 0;
  for (var i = 0; i < total; i++) {
    if (checkAnswer(QUESTIONS[i], answers[i]) === true) {
      score += (QUESTIONS[i].score || 0);
    }
  }
  return score;
}
/* 错题本：再练本次答错的题（含未答）；全对则提示。
   交卷后直接进解析，resultMask 已废弃；此函数保留（入口未用则无副作用） */
function redoWrong() {
  var wrongQs = [];
  for (var i = 0; i < total; i++) {
    if (checkAnswer(QUESTIONS[i], answers[i]) !== true) wrongQs.push(QUESTIONS[i]);
  }
  if (wrongQs.length === 0) { showToast('全部攻克，太棒了！'); return; }
  QUESTIONS = wrongQs;
  total = QUESTIONS.length;
  answers = {};
  idx = 0;
  submitted = false;
  committed = {};
  reviewed = {};
  resetOp(true);
  renderQuestion();
}
function reviewAnswers() {
  idx = 0;
  renderQuestion();
}

/* ---------- 题目/解析反馈（bottom sheet 浮窗，错误类型多选 + 补充说明，提交同步后台管理端） ----------
   两独立浮窗：#fbModalQuestion（题目）/ #fbModalAnalysis（解析），各自只显示对应错误类型组。
   数据契约（v5.0 接后台反馈管理模块）：
   { type:'QUESTION_FEEDBACK', questionId: 当前题id, entry: ENTRY, feedbackType:'题目'|'解析',
     errorTypes:[...], detail:'...', ts:Date.now() }
   演示期：本地 console + Toast；真实接入由总壳 postMessage 转发或直接调 API。 */
var FB_ACTIVE = null;             /* 当前打开浮窗类型：'question'|'analysis' */
var FB_TYPES = [];                /* 当前选中错误类型（含"_t":'题目'|'解析' 隐藏维度会串，改用两套独立数组） */
var FB_TYPES_Q = [];
var FB_TYPES_A = [];

function fbModal(id) { return document.getElementById(id); }

function openFeedback(kind) {
  kind = kind || 'question';
  FB_ACTIVE = kind;
  var modalId = (kind === 'question') ? 'fbModalQuestion' : 'fbModalAnalysis';
  var optsId  = (kind === 'question') ? 'fbOptsQ'  : 'fbOptsA';
  var textId  = (kind === 'question') ? 'fbTextQ'  : 'fbTextA';
  /* 重置该浮窗已选 chip 与文本 */
  var chips = document.querySelectorAll('#' + optsId + ' .fb-chip');
  for (var i = 0; i < chips.length; i++) chips[i].classList.remove('on');
  var ta = document.getElementById(textId);
  if (ta) ta.value = '';
  var store = (kind === 'question') ? FB_TYPES_Q : FB_TYPES_A;
  store.length = 0;
  fbModal(modalId).classList.add('show');
}
function closeFeedback() {
  if (FB_ACTIVE === 'analysis') fbModal('fbModalAnalysis').classList.remove('show');
  else fbModal('fbModalQuestion').classList.remove('show');
}
function toggleFb(el) {
  var k = el.getAttribute('data-k');
  var store = (FB_ACTIVE === 'analysis') ? FB_TYPES_A : FB_TYPES_Q;
  var i = store.indexOf(k);
  if (i >= 0) { store.splice(i, 1); el.classList.remove('on'); }
  else { store.push(k); el.classList.add('on'); }
}
function submitFeedback() {
  var store = (FB_ACTIVE === 'analysis') ? FB_TYPES_A : FB_TYPES_Q;
  if (store.length === 0) {
    showToast('请至少选择一种错误类型');
    return;
  }
  var textId = (FB_ACTIVE === 'analysis') ? 'fbTextA' : 'fbTextQ';
  var detail = (document.getElementById(textId).value || '').trim();
  var q = QUESTIONS[idx] || {};
  var payload = {
    type: 'QUESTION_FEEDBACK',
    questionId: q.id || (ENTRY + '-' + idx),   /* v5.0 接题库真实 id */
    entry: ENTRY,
    feedbackType: (FB_ACTIVE === 'analysis') ? '解析' : '题目',
    chapter: q.chapter || '',
    concept: q.concept || '',
    errorTypes: store.slice(),
    detail: detail,
    ts: Date.now()
  };
  /* 演示：打印 + 转发总壳；v5.0 改为真实 API */
  try { console.log('[QUESTION_FEEDBACK]', payload); } catch(e) {}
  try { window.parent.postMessage(payload, '*'); } catch(e) {}
  closeFeedback();
  showToast('已反馈，谢谢');
}

/* ---------- 关闭（通知总壳收起做题层） ---------- */
function closePractice() {
  try { window.parent.postMessage({ type: 'CLOSE_PRACTICE' }, '*'); } catch(e) {}
  try { if (window.parent === window.self) { window.location.reload(); } } catch(e) {}
}

/* ---------- 手势：右→左下一题 / 左→右上一题。
   操作/分析/综合运用题为分屏模式：横向手势仍翻整题（tab 切换子题）。
   分屏内部滚动是纵向的（dx<dy 直接忽略），与横向翻题天然不冲突 ---------- */
var _px = null, _py = null;
var qAreaEl = document.getElementById('questionArea');
qAreaEl.addEventListener('pointerdown', function(e){ _px = e.clientX; _py = e.clientY; });
qAreaEl.addEventListener('pointerup', function(e){
  if (_px === null) return;
  var dx = e.clientX - _px, dy = e.clientY - _py;
  _px = null; _py = null;
  /* 全局手势：横向滑动翻整题（操作题同样适用） */
  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
  /* 规则页：左滑进首题（leaveRulePage），右滑无操作（规则页是题型入口，不回退） */
  if (pendingRule) { if (dx < 0) leaveRulePage(); return; }
  if (dx < 0) nextQuestion(); else prevQuestion();
});

/* ---------- 操作类题型分屏切换 ---------- */
function resetOp(entering) {
  opSubIdx = 0;
  /* 进入/切换操作题：分界线复位到默认比例。此刻 op-wrap 可能尚在旧题渲染中，
     applyOpLayout 实际是渲染后调用；这里只更新 opRatio 变量，布局由渲染后的 applyOpLayout 生效 */
  if (entering) opRatio = 0.4;
}
/* 子题切换：点击横向 tab（PM 2026-09-02：无上一题/下一题按钮） */
function opJumpSub(i) {
  if (i < 0 || i >= QUESTIONS[idx].sub.length || i === opSubIdx) return;
  opSubIdx = i; opScrollTabs(); renderQuestion();
}
function opScrollTabs() {
  var t = document.querySelector('.op-tabs');
  if (!t || !t.children[opSubIdx]) return;
  t.children[opSubIdx].scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
}
/* 分界线拖拽：题干区占比 25%~65% 钳制（pointer capture 保证移出分界条后仍跟随）
   PM 2026-09-05 方向修正：手指上滑(dy<0)→题干变矮、分隔线随手上移、下方作答区增大（原实现反向） */
var _opDrag = null;
function opDividerPointerDown(e) {
  if (_opDrag) return;
  if (e.cancelable) e.preventDefault();
  _opDrag = { startY: e.clientY, startRatio: opRatio };
  document.body.classList.add('op-dragging');
  try { e.target.closest('.op-divider').setPointerCapture(e.pointerId); } catch(err) {}
}
function opDividerPointerMove(e) {
  if (!_opDrag) return;
  var qArea = document.getElementById('questionArea');
  var areaH = (qArea ? qArea.clientHeight : window.innerHeight) || 600;
  var ratio = _opDrag.startRatio + (e.clientY - _opDrag.startY) / areaH;
  if (ratio < OP_RATIO_MIN) ratio = OP_RATIO_MIN;
  if (ratio > OP_RATIO_MAX) ratio = OP_RATIO_MAX;
  applyOpRatio(ratio);
}
function opDividerPointerUp() {
  if (!_opDrag) return;
  _opDrag = null;
  document.body.classList.remove('op-dragging');
}
/* 操作题子题全答判定（每题都有作答值才视为完成，区别于 getAnswered 的任一已答） */
function opAllAnswered(q, ans) {
  if (!q || !q.sub || !q.sub.length) return false;
  var a = ans || {};
  for (var i = 0; i < q.sub.length; i++) {
    var v = a[i];
    if (v === undefined || v === null || v === '') return false;
  }
  return true;
}
function applyOpRatio(ratio) {
  if (ratio < OP_RATIO_MIN) ratio = OP_RATIO_MIN;
  if (ratio > OP_RATIO_MAX) ratio = OP_RATIO_MAX;
  opRatio = ratio;
  applyOpLayout();
}
function applyOpLayout() {
  var wrap = document.querySelector('.op-wrap');
  if (!wrap) return;
  var q = QUESTIONS[idx];
  var reveal = submitted || (MODE === 'study' && (q && (q.type === 'fill' || q.type === 'essay') ? !!reviewed[idx] : getAnswered(q, answers[idx])));
  /* 解析态：分屏不占满、取自然高度，把空间留给下方解析区；分界线隐藏不可拖 */
  if (reveal) {
    wrap.style.height = '';
    wrap.classList.add('reveal');
    var stem = wrap.querySelector('.op-stem-pane');
    var ap = wrap.querySelector('.op-answer-pane');
    if (stem) stem.style.height = '';
    if (ap) { ap.style.flex = ''; ap.style.overflow = ''; }
    return;
  }
  wrap.classList.remove('reveal');
  var qArea = document.getElementById('questionArea');
  var areaH = qArea ? qArea.clientHeight : window.innerHeight;
  /* 底部 feedback-entry 占约 36px，分屏高度让出，避免外层触发滚动 */
  wrap.style.height = Math.max(120, areaH - 36) + 'px';
  var stem = wrap.querySelector('.op-stem-pane');
  var answerPane = wrap.querySelector('.op-answer-pane');
  if (stem) stem.style.height = Math.round(wrap.offsetHeight * opRatio) + 'px';
  if (answerPane) answerPane.style.flex = '1 1 0';
  if (answerPane) answerPane.style.overflow = 'hidden';
}

/* ---------- 0.5s 自动跳转（仅做题模式 + 单选/判断/操作/分析/综合运用） ---------- */
var autoTimer = null;
function clearAutoNext() {
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
}
function scheduleAutoNext() {
  clearAutoNext();
  if (MODE !== 'exam' || submitted) return;
  var q = QUESTIONS[idx];
  if (['single','judge','operation','analysis','comprehensive'].indexOf(q.type) < 0) return;  /* 多选/填空/简答用手势 */
  if (idx >= total - 1) return;               /* 最后一题不自动跳 */
  if (q.type === 'operation') { if (!opAllAnswered(q, answers[idx])) return; }   /* 操作题需全部子题答完 */
  else if (!getAnswered(q, answers[idx])) return;
  autoTimer = setTimeout(function(){ autoTimer = null; nextQuestion(); }, 500);
}

/* ---------- 收藏 / 标记 / 分享 ---------- */
function toggleFav() {
  fav[idx] = !fav[idx];
  updateBottomBar();
  showToast(fav[idx] ? '已收藏至收藏夹' : '已取消收藏');
}
function toggleMark() {
  marked[idx] = !marked[idx];
  renderQuestion();          /* 刷新 tag 区【已标记】 */
  showToast(marked[idx] ? '已标记，题目标签显示【已标记】' : '已取消标记');
}
function openShare() {
  var q = QUESTIONS[idx];
  var card = '<div class="share-brand">升本智答</div>'
    + '<div class="share-qnum">第 ' + (idx+1) + ' 题 · ' + (TYPE_NAME[q.type] || '题目') + '</div>'
    + '<div class="share-stem">' + q.stem + '</div>'
    + '<div class="share-answer">答案：' + formatAnswer(q) + '</div>';
  document.getElementById('shareCard').innerHTML = card;
  document.getElementById('shareMask').classList.add('show');
}
function doShare() {
  closeShare();
  showToast('已生成分享卡片，可分享至朋友圈');
}
function closeShare() {
  document.getElementById('shareMask').classList.remove('show');
}

/* ---------- 页面轻提示 ---------- */
var toastTimer2 = null;
function showToast(msg) {
  var t = document.getElementById('practiceToast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer2);
  toastTimer2 = setTimeout(function(){ t.classList.remove('show'); }, 1500);
}

/* ---------- 报告页跳解析：收到 ENTER_REVIEW → 进入解析态并定位该题 ----------
   来源：成绩报告页「查看解析」/答题卡点击 → 总壳 REPORT_REVIEW → 打开做题页 → 就绪后送 ENTER_REVIEW。
   复用现有解析能力：submitted=true（解析态）+ jumpTo(q)（定位+渲染）。不改 URL 入口。 */
window.addEventListener('message', function(evt) {
  var d = evt.data;
  if (!d || !d.type) return;
  if (d.type === 'ENTER_REVIEW') {
    submitted = true;
    hideSubmit();
    stopTimer();
    /* 钳制到卷面题量范围：报告页答题卡题量可能大于做题页 mock 卷（演示期数据契约独立），越界回第 1 题 */
    var q = (d.data && typeof d.data.q === 'number') ? d.data.q : 0;
    if (q < 0 || q >= total) q = 0;
    jumpTo(q);
    /* 拍照笔记回跳：定位到「我的笔记」卡片并加短暂高亮（PM 2026-09-05） */
    if (d.data && d.data.focusNote) {
      setTimeout(function() {
        var sec = document.getElementById('noteSec');
        if (sec) {
          sec.scrollIntoView({ behavior:'smooth', block:'center' });
          sec.classList.add('note-flash');
          setTimeout(function() { sec.classList.remove('note-flash'); }, 1700);
        }
      }, 350);
    }
  }
});

/* ---------- 初始化 ---------- */
/* 考试卷（模拟考场/历年真题）：隐藏「做题/背题」切换，MODE 锁 exam（PM 2026-09-02） */
if (IS_EXAM_PAPER) {
  var ms = document.getElementById('modeSwitch');
  if (ms) ms.style.display = 'none';
}
startTimer();              /* 进入即起表（会话级计时；练习类在后台计时不显示 UI） */
enterRuleIfNeeded();       /* 考试卷进卷首题型先停规则页（PM 2026-09-02） */
renderQuestion();
</script>
</body>
</html>
