<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>闪卡 · 单卡模式</title>

<style>
  /* ============================================================
     Design Token（与 05_UI设计/设计Token.md 对齐）
     ============================================================ */
  :root{
    --primary: #5B72F5;
    --primary-dark: #4358D7;
    --primary-light: #EEF1FF;

    --text-primary: #202533;
    --text-secondary: #6E778B;
    --text-tertiary: #98A0B2;

    --success: #20A866;
    --success-light: #E8F8F0;
    --warning: #F28B3D;
    --warning-light: #FFF1E6;
    --danger: #EF4444;
    --danger-light: #FEECEC;

    --card-radius: 17px;
    --hero-radius: 22px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text-primary);
    background: #F8F9FC;
  }
  body { display: flex; justify-content: center; overflow: hidden; }

  /* ========================= 页面 =========================
     与首页共用淡紫梦幻背景图，保持小程序视觉基调统一 */
  .page {
    position: relative;
    width: 100%; max-width: 430px;
    height: 100vh;
    overflow: hidden;
    display: flex; flex-direction: column;
    background: url('bg-flashcard-home.png') center top / cover no-repeat;
    background-color: #F8F9FC;
  }

  /* ========================= 手机壳：桌面端固定手机比例居中 ========================= */
  @media (min-width: 481px) {
    html, body { height: 100%; overflow: hidden; }
    body {
      align-items: center;
      background: linear-gradient(150deg, #E3E5F1 0%, #ECEEF6 55%, #E6E8F2 100%);
    }
    .page {
      width: 390px;
      height: min(844px, calc(100vh - 44px));
      border-radius: 34px;
      box-shadow:
        0 0 0 9px #1E2130,
        0 0 0 11px rgba(255,255,255,0.65),
        0 30px 80px rgba(30,33,48,0.38);
    }
  }

  /* 底部白色渐隐遮罩 */
  .bottom-mask {
    position: absolute;
    z-index: 1;
    left: 0; right: 0;
    top: 360px; bottom: 0;
    pointer-events: none;
    background: linear-gradient(180deg,
      rgba(248,249,252,0) 0%,
      rgba(248,249,252,0.55) 18%,
      rgba(248,249,252,0.92) 44%,
      #F8F9FC 100%);
  }

  /* ========================= 内容 ========================= */
  .content {
    position: relative; z-index: 2;
    flex: 1; min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    display: flex; flex-direction: column;
    padding: 48px 18px 0;
  }
  .content::-webkit-scrollbar { display: none; }

  /* ========================= 顶栏 ========================= */
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .exit-btn {
    width: 36px; height: 36px; border: none;
    border-radius: 12px;
    background: rgba(255,255,255,0.8);
    box-shadow: 0 2px 8px rgba(54,66,108,0.06);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: transform .1s ease;
  }
  .exit-btn:active { transform: scale(0.92); }
  .exit-btn svg { width: 20px; height: 20px; stroke: var(--text-secondary); }

  .progress-info {
    display: flex; align-items: center; gap: 3px;
    font-size: 14px; color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    flex: 1; justify-content: center;
    white-space: nowrap;
  }
  .progress-info strong { color: var(--primary); font-size: 18px; font-weight: 700; }
  .progress-info .total { color: var(--text-tertiary); }

  .mode-tag {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 12px; border-radius: 20px;
    background: rgba(91,114,245,0.2);
    color: var(--primary-dark); font-size: 12px; font-weight: 700;
    box-shadow: inset 0 0 0 1px rgba(91,114,245,0.22);
    flex-shrink: 0;
  }
  .mode-tag svg { width: 14px; height: 14px; stroke: var(--primary-dark); }

  .top-right {
    display: flex; align-items: center; gap: 7px;
    flex-shrink: 0;
  }
  .switch-btn {
    display: flex; align-items: center; gap: 4px;
    height: 32px; padding: 0 11px;
    border: none; border-radius: 20px;
    background: rgba(255,255,255,0.85);
    color: var(--text-secondary);
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(54,66,108,0.06);
    transition: transform .1s ease;
    white-space: nowrap;
  }
  .switch-btn:active { transform: scale(0.94); }
  .switch-btn svg { width: 13px; height: 13px; stroke: var(--primary); }

  /* ========================= 进度条 ========================= */
  .progress-track {
    width: 100%; height: 4px; border-radius: 10px;
    background: rgba(91,114,245,0.12);
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-fill {
    width: 0%; height: 100%; border-radius: inherit;
    background: linear-gradient(90deg, #5872F5, #6377F2);
    transition: width .4s cubic-bezier(.22,.61,.36,1);
  }

  /* ========================= 卡片区 ========================= */
  .card-area {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    perspective: 1600px;
    min-height: 360px;
  }
  .card-stack {
    position: relative;
    width: 100%; max-width: 340px;
    height: 440px;
  }

  /* 背景卡片（堆叠效果） */
  .card-behind {
    position: absolute; inset: 0;
    border-radius: var(--card-radius);
    background: rgba(255,255,255,0.6);
    box-shadow: 0 4px 14px rgba(54,66,108,0.04);
    pointer-events: none;
  }
  .card-behind-1 { transform: scale(0.96) translateY(7px); opacity: 0.55; }
  .card-behind-2 { transform: scale(0.92) translateY(14px); opacity: 0.3; }

  /* 3D 卡片容器 */
  .card-3d {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
    will-change: transform;
    z-index: 10;
    cursor: pointer;
  }
  .card-3d.flipped { transform: rotateY(180deg); }
  .card-3d.dragging { transition: none; cursor: grabbing; }
  .card-3d.commit-right {
    transform: translateX(150%) rotateY(180deg) rotateZ(22deg) !important;
    opacity: 0;
    transition: transform .4s ease, opacity .4s ease;
  }
  .card-3d.commit-left {
    transform: translateX(-150%) rotateY(180deg) rotateZ(-22deg) !important;
    opacity: 0;
    transition: transform .4s ease, opacity .4s ease;
  }
  /* 正面导航飞出：与 commit 动画节奏一致（不标记，仅切换卡片） */
  .card-3d.nav-out-right {
    transform: translateX(150%) rotateZ(18deg) !important;
    opacity: 0;
    transition: transform .4s ease, opacity .4s ease;
  }
  .card-3d.nav-out-left {
    transform: translateX(-150%) rotateZ(-18deg) !important;
    opacity: 0;
    transition: transform .4s ease, opacity .4s ease;
  }

  /* 卡片面 */
  .card-face {
    position: absolute; inset: 0;
    border-radius: var(--card-radius);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
    display: flex; flex-direction: column;
    background: linear-gradient(160deg, #FFFFFF 0%, #FAFBFE 100%);
    box-shadow: 0 14px 36px rgba(54,66,108,0.1), 0 2px 8px rgba(54,66,108,0.04);
  }
  .card-back { transform: rotateY(180deg); }

  /* 顽固卡面：橙色强调边框（inset 阴影模拟，避免裁剪） + 极浅橙色晕染
     正反两面共用，翻卡后效果一致；白底为主，明显但不刺眼 */
  .card-face.card-stubborn {
    background:
      linear-gradient(108deg, rgba(255,241,230,0.55) 0%, rgba(255,241,230,0) 42%, #FFFFFF 100%),
      linear-gradient(160deg, #FFFFFF 0%, #FAFBFE 100%);
    box-shadow:
      inset 0 0 0 1.5px #F5A05A,
      0 14px 36px rgba(242,139,61,0.12),
      0 2px 8px rgba(242,139,61,0.06);
  }

  /* 卡片标签区（题型标签，左对齐） */
  .card-tags {
    display: flex; flex-direction: column; align-items: flex-start;
    gap: 7px;
    padding: 18px 18px 0;
  }

  /* 题型标签（一级-二级） */
  .card-tag {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 11px; border-radius: 8px;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 10.5px; font-weight: 600;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-tag svg { width: 12px; height: 12px; stroke: var(--primary); flex-shrink: 0; }
  .tag-sep { color: rgba(91,114,245,0.45); font-weight: 500; margin: 0 1px; }
  .tag-sub { color: #7C66E8; font-weight: 650; }

  /* 卡片内容区 */
  .card-content {
    flex: 1;
    padding: 18px 22px 8px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .card-content::-webkit-scrollbar { width: 3px; }
  .card-content::-webkit-scrollbar-thumb { background: rgba(91,114,245,0.2); border-radius: 10px; }

  .card-label {
    font-size: 11px; font-weight: 600;
    color: var(--text-tertiary);
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .card-question {
    font-size: 19px; font-weight: 650;
    color: var(--text-primary);
    line-height: 1.55;
  }
  .card-question-sm {
    font-size: 15px; font-weight: 650;
    color: var(--text-primary);
    line-height: 1.5;
    margin-bottom: 14px;
  }

  /* 填空题：视觉空位与答案高亮 */
  .cloze-blank {
    display: inline-block;
    min-width: 56px;
    height: 1.15em;
    border-bottom: 2px solid var(--primary);
    margin: 0 3px;
    vertical-align: bottom;
  }
  .cloze-fill {
    display: inline-block;
    min-width: 44px;
    color: var(--success);
    font-weight: 700;
    border-bottom: 2px solid var(--success);
    margin: 0 3px;
    padding: 0 4px;
    text-align: center;
  }
  .card-answer {
    font-size: 16px; font-weight: 600;
    color: var(--success);
    line-height: 1.6;
    margin-bottom: 16px;
  }
  .card-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, #E8EAF3, transparent);
    margin-bottom: 16px;
  }
  .card-analysis-label {
    font-size: 12px; font-weight: 600;
    color: var(--text-tertiary);
    margin-bottom: 6px;
  }
  .card-analysis {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.7;
  }

  /* 卡片底部提示 */
  .card-footer {
    padding: 0 22px 18px;
    display: flex; align-items: center; justify-content: center;
    gap: 8px;
    color: var(--text-tertiary);
    font-size: 12px;
  }
  .card-footer svg { width: 14px; height: 14px; stroke: var(--text-tertiary); }

  /* 翻转提示动画 */
  .flip-hint {
    display: flex; align-items: center; gap: 6px;
    animation: pulse-hint 2.5s ease-in-out infinite;
  }
  @keyframes pulse-hint {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* 滑动反馈遮罩 */
  .swipe-overlay {
    position: absolute; inset: 0;
    border-radius: var(--card-radius);
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s ease;
    z-index: 20;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .swipe-overlay.right {
    background: linear-gradient(135deg, rgba(32,168,102,0.12), rgba(32,168,102,0.06));
    border: 2.5px solid rgba(32,168,102,0.35);
  }
  .swipe-overlay.left {
    background: linear-gradient(135deg, rgba(239,68,68,0.12), rgba(239,68,68,0.06));
    border: 2.5px solid rgba(239,68,68,0.35);
  }
  /* 正面导航反馈（未翻转：左滑上一张 / 右滑下一张，蓝色系与标记操作区分） */
  .swipe-overlay.front-right {
    background: linear-gradient(135deg, rgba(91,114,245,0.12), rgba(91,114,245,0.06));
    border: 2.5px solid rgba(91,114,245,0.35);
  }
  .swipe-overlay.front-left {
    background: linear-gradient(135deg, rgba(91,114,245,0.12), rgba(91,114,245,0.06));
    border: 2.5px solid rgba(91,114,245,0.35);
  }
  .swipe-overlay.front-right .swipe-label { color: var(--primary); }
  .swipe-overlay.front-left .swipe-label { color: var(--primary); }
  .swipe-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 24px; font-weight: 700;
  }
  .swipe-overlay.right .swipe-label { color: var(--success); }
  .swipe-overlay.left .swipe-label { color: var(--danger); }
  .swipe-label svg { width: 30px; height: 30px; }

  /* ========================= 上一张 / 下一张导航 ========================= */
  .prev-nav {
    display: flex; justify-content: center;
    gap: 10px;
    margin-top: 2px;
  }
  .prev-btn {
    display: inline-flex; align-items: center; gap: 5px;
    height: 32px; padding: 0 15px;
    border: none; border-radius: 16px;
    background: rgba(255,255,255,0.85);
    color: var(--text-secondary);
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(54,66,108,0.06);
    transition: transform .1s ease, opacity .2s ease;
  }
  .prev-btn:active:not(:disabled) { transform: scale(0.94); }
  .prev-btn:disabled { opacity: 0.3; cursor: default; }
  .prev-btn svg { width: 15px; height: 15px; stroke: var(--text-secondary); }

  /* ========================= 底部统计条 ========================= */
  .bottom-stats {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
    padding-bottom: 16px;
  }
  .bs-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 13px;
    border-radius: 20px;
    background: rgba(255,255,255,0.85);
    box-shadow: 0 2px 8px rgba(54,66,108,0.05);
    font-size: 12px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }
  .bs-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .bs-remembered .bs-dot { background: var(--success); }
  .bs-forgot .bs-dot { background: var(--danger); }
  .bs-stubborn .bs-dot { background: var(--warning); }
  .bs-item strong { font-size: 14px; font-weight: 700; }
  .bs-remembered strong { color: var(--success); }
  .bs-forgot strong { color: var(--danger); }
  .bs-stubborn strong { color: var(--warning); }

  /* ========================= 完成结算页 ========================= */
  .completion {
    position: absolute; inset: 0; z-index: 100;
    background: linear-gradient(180deg, #E7EFFF 0%, #F8F9FC 100%);
    display: none;
    flex-direction: column;
    padding: 0;
  }
  .completion.show { display: flex; }
  .completion-scroll {
    flex: 1; min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 34px 20px 22px;
  }
  .completion-scroll::-webkit-scrollbar { display: none; }

  /* 顶部 hero */
  .completion-hero { text-align: center; margin-bottom: 22px; }
  .completion-emoji {
    width: 64px; height: 64px; margin: 0 auto 12px;
    border-radius: 50%;
    background: linear-gradient(135deg, #5B72F5, #6B5FE8);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 28px rgba(91,114,245,0.28);
    font-size: 30px;
  }
  .completion-title { font-size: 24px; font-weight: 750; margin-bottom: 6px; }
  .completion-subtitle { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

  /* 核心指标卡：环形图 + 三指标 */
  .completion-summary {
    background: rgba(255,255,255,0.95);
    border-radius: 18px;
    padding: 18px 16px 16px;
    box-shadow: 0 6px 18px rgba(54,66,108,0.05);
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 18px;
  }
  .ring-wrap {
    position: relative;
    width: 92px; height: 92px;
    flex-shrink: 0;
  }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: #E8EAF3; stroke-width: 8; }
  .ring-fill { fill: none; stroke: url(#ringGradient); stroke-width: 8; stroke-linecap: round;
    transition: stroke-dashoffset 1s cubic-bezier(.22,.61,.36,1);
  }
  .ring-text {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .ring-pct { font-size: 22px; font-weight: 800; color: var(--primary); line-height: 1; }
  .ring-label { font-size: 10px; color: var(--text-tertiary); margin-top: 2px; }
  .summary-bars { flex: 1; display: flex; flex-direction: column; gap: 11px; }
  .summary-row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; color: var(--text-secondary);
  }
  .summary-row strong { font-size: 18px; font-weight: 750; color: var(--text-primary); }
  .summary-row .s-total strong { color: var(--primary); }
  .summary-row .s-ok strong { color: var(--success); }
  .summary-row .s-bad strong { color: var(--danger); }

  /* 通用卡片区 */
  .comp-section {
    background: rgba(255,255,255,0.95);
    border-radius: 18px;
    padding: 16px 16px 14px;
    box-shadow: 0 6px 18px rgba(54,66,108,0.05);
    margin-bottom: 14px;
  }
  .comp-section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 13px;
  }
  .comp-section-title {
    display: flex; align-items: center; gap: 7px;
    font-size: 15px; font-weight: 700; color: var(--text-primary);
  }
  .comp-section-title svg { width: 17px; height: 17px; }
  .comp-section-extra { font-size: 12px; color: var(--text-tertiary); }

  /* 薄弱知识点 TOP5 */
  .weak-list { display: flex; flex-direction: column; gap: 11px; }
  .weak-item { display: flex; align-items: center; gap: 10px; }
  .weak-rank {
    width: 20px; height: 20px; border-radius: 6px;
    background: var(--primary-light); color: var(--primary);
    font-size: 11px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .weak-rank.top { background: #FEECEC; color: #EF4444; }
  .weak-info { flex: 1; min-width: 0; }
  .weak-name { font-size: 13px; font-weight: 650; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .weak-path { font-size: 10.5px; color: var(--text-tertiary); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .weak-bar { width: 64px; height: 5px; border-radius: 10px; background: #F3F4F6; overflow: hidden; flex-shrink: 0; }
  .weak-bar-fill { height: 100%; border-radius: inherit; background: var(--danger); }
  .weak-count { width: 42px; text-align: right; font-size: 12px; font-weight: 700; color: var(--danger); flex-shrink: 0; }

  /* 章节掌握度分布 */
  .chapter-dist-list { display: flex; flex-direction: column; gap: 10px; }
  .chapter-dist-item { display: flex; align-items: center; gap: 10px; }
  .chapter-dist-name { width: 78px; font-size: 12px; color: var(--text-primary); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chapter-dist-bar { flex: 1; height: 10px; border-radius: 10px; background: #F3F4F6; overflow: hidden; display: flex; }
  .cdb-ok { height: 100%; background: linear-gradient(90deg, #34D399, #20A866); }
  .cdb-bad { height: 100%; background: linear-gradient(90deg, #FCA5A5, #EF4444); }
  .chapter-dist-pct { width: 34px; text-align: right; font-size: 12px; font-weight: 700; color: var(--text-secondary); }
  .chapter-dist-total { width: 28px; text-align: right; font-size: 11px; color: var(--text-tertiary); }

  /* 背诵效率分析 */
  .efficiency-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .eff-item { text-align: center; }
  .eff-icon { width: 36px; height: 36px; margin: 0 auto 7px; border-radius: 10px; background: var(--primary-light); display: flex; align-items: center; justify-content: center; }
  .eff-icon svg { width: 18px; height: 18px; stroke: var(--primary); }
  .eff-value { font-size: 15px; font-weight: 800; color: var(--text-primary); }
  .eff-value.up { color: var(--success); }
  .eff-value.down { color: var(--danger); }
  .eff-label { font-size: 10.5px; color: var(--text-tertiary); margin-top: 2px; }

  /* 巩固 CTA */
  .comp-cta {
    background: linear-gradient(135deg, #FF9F43 0%, #F28B3D 100%);
    border-radius: 18px;
    padding: 16px 18px;
    color: white;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    box-shadow: 0 10px 24px rgba(242,139,61,0.22);
  }
  .comp-cta-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .comp-cta-desc { font-size: 12px; color: rgba(255,255,255,0.9); line-height: 1.4; }
  .comp-cta-btn {
    flex-shrink: 0;
    height: 34px; padding: 0 14px;
    border: none; border-radius: 17px;
    background: rgba(255,255,255,0.95);
    color: #F28B3D; font-size: 13px; font-weight: 700;
    cursor: pointer;
    transition: transform .1s ease;
  }
  .comp-cta-btn:active { transform: scale(0.95); }

  /* 底部操作 */
  .completion-actions {
    display: flex; gap: 10px;
    padding: 12px 20px 22px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(6px);
  }
  .comp-btn {
    flex: 1; height: 46px; border: none; border-radius: 14px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    transition: transform .1s ease;
  }
  .comp-btn:active { transform: scale(0.97); }
  .comp-btn-primary { background: var(--primary); color: white; box-shadow: 0 8px 20px rgba(91,114,245,0.25); }
  .comp-btn-secondary { background: rgba(255,255,255,0.95); color: var(--text-secondary); border: 1px solid rgba(91,114,245,0.12); }

  /* 顽固卡右上角角标：放在 .card-3d 层（父级无 overflow，可骑跨边线溢出）
     正反各一个：stub-front 正面可见，stub-back 反转后背面可见
     翻卡时 .card-3d 整体 rotateY(180deg)，两角标随之翻转，各只显示对应面
     stub-front 用 right 定位；stub-back 用 left 定位（翻转后镜像到右侧） */
  .stub-mark {
    position: absolute;
    top: -8px;
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--warning-light);
    color: var(--warning);
    line-height: 1;
    border: 1.5px solid #F5A05A;
    box-shadow: 0 2px 5px rgba(242,139,61,0.22);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    z-index: 20;
  }
  .stub-front { right: 12px; }
  .stub-back { left: 12px; transform: rotateY(180deg); }
  .stub-mark svg {
    width: 12px; height: 12px;
    stroke: var(--warning);
    flex-shrink: 0;
  }

  /* ========================= 退出弹窗 ========================= */
  .modal-overlay {
    position: absolute; inset: 0; z-index: 200;
    background: rgba(20,25,40,0.4);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center; justify-content: center;
    padding: 0 40px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    width: 100%; max-width: 300px;
    background: white; border-radius: 18px;
    padding: 28px 24px 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  .modal-title { font-size: 17px; font-weight: 700; text-align: center; margin-bottom: 8px; }
  .modal-desc { font-size: 13px; color: var(--text-secondary); text-align: center; line-height: 1.6; margin-bottom: 20px; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-btn { flex: 1; height: 42px; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .modal-btn-cancel { background: #F3F4F6; color: var(--text-secondary); }
  .modal-btn-confirm { background: var(--danger); color: white; }

  /* 摇晃提示（未翻转时尝试滑动） */
  @keyframes shake-warn {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px) rotateY(0deg); }
    40% { transform: translateX(6px) rotateY(0deg); }
    60% { transform: translateX(-4px) rotateY(0deg); }
    80% { transform: translateX(4px) rotateY(0deg); }
  }
  .card-3d.shake-warn { animation: shake-warn 0.35s ease; }

  /* 小屏适配 */
  @media (max-width: 360px) {
    .content { padding-left: 15px; padding-right: 15px; }
    .card-stack { max-width: 300px; height: 420px; }
    .card-question { font-size: 17px; }
  }
</style>

<script src="闪卡题库.js"></script>
<script>

/* ============================================================
   共享状态（数据源：闪卡题库.js）
   baseState = 完整当日状态；state = 当前过滤视图（按章节/题型过滤）
   标记一律写回 baseState 再保存，过滤视图即时刷新
   ============================================================
   带 URL 参数（从首页章节/考点跳入）时：baseState 用全卡池构建队列，
   保证任意考点都能刷到全部题目；无参数（首页"开始学习"进入）走当日抽样队列。
   两套队列的标记各自独立，互不污染。
*/
var activeFilter = filterFromUrl();
var baseState;
if (activeFilter.chapter || activeFilter.sub || activeFilter.topic || activeFilter.point) {
  /* 全卡池状态：queue = 全部 CARDS，marked 复用当日已标记（同 key 同步） */
  var _today = loadState();
  baseState = {
    date: _today.date,
    quota: CARDS.length,
    queue: buildFullQueue(),
    marked: _today.marked
  };
} else {
  baseState = loadState();
}
var filteredQueue = [];
var state = filterState(baseState, activeFilter);  /* 当前过滤视图（标记写回 baseState） */

/* 过滤视图刷新：按 URL 的 chapter/sub/topic/point 过滤队列 */
function refreshFilter() {
  state = filterState(baseState, activeFilter);
  filteredQueue = state.queue;
}
refreshFilter();
var currentCard = null;   // 当前展示的卡（过滤队列中第一张未标记）
var isFlipped = false;
var isAnimating = false;
var dragStart = null;
var dragOffsetX = 0;
var mouseDown = false;
var hasMoved = false;
var touchStarted = false;
var SWIPE_THRESHOLD = 80;
var EDGE_THRESHOLD = 170;   // 卡片拖到侧边（移出卡片区约 50%）立即判定，无需松手
var autoCommitted = false;  // 侧边已自动提交标记，防止重复提交
var frontDrag = false;      // 正面（未翻转）导航拖拽中：左滑上一张 / 右滑下一张
var historyStack = [];      // 「上一张」撤销栈：记录每次标记的 { key, result, prevForgotCount }
var historyRecorded = false; // 本次成果是否已写入历史（防止重复记录）

/* 同一天、同张数的成果只记录一次（持久化，防止刷新/重进后重复写入） */
var RESULT_RECORDED_KEY = 'flashCardResultRecorded_v1';
function isResultRecordedToday(done) {
  try { return localStorage.getItem(RESULT_RECORDED_KEY) === todayStr() + '#' + done; } catch (e) { return false; }
}
function markResultRecordedToday(done) {
  try { localStorage.setItem(RESULT_RECORDED_KEY, todayStr() + '#' + done); } catch (e) {}
}
function clearResultRecorded() {
  try { localStorage.removeItem(RESULT_RECORDED_KEY); } catch (e) {}
}

/* 当前过滤条件下的查询串（模式切换时透传） */
function filterQuery() {
  var p = [];
  if (activeFilter.chapter) p.push('chapter=' + encodeURIComponent(activeFilter.chapter));
  if (activeFilter.sub) p.push('sub=' + encodeURIComponent(activeFilter.sub));
  if (activeFilter.topic) p.push('topic=' + encodeURIComponent(activeFilter.topic));
  if (activeFilter.point) p.push('point=' + encodeURIComponent(activeFilter.point));
  return p.length ? '?' + p.join('&') : '';
}

/* 查找下一张未标记的卡（基于过滤队列，写回 baseState） */
function findNextPending() {
  for (var i = 0; i < filteredQueue.length; i++) {
    if (!baseState.marked[filteredQueue[i].key]) return filteredQueue[i];
  }
  return null;
}

/* 查找当前卡之后第一张未标记的卡（「下一张」跳过不标记，无则返回 null） */
function findNextPendingAfter(card) {
  if (!card) return null;
  var idx = -1;
  for (var i = 0; i < filteredQueue.length; i++) {
    if (filteredQueue[i].key === card.key) { idx = i; break; }
  }
  if (idx < 0) return null;
  for (var j = idx + 1; j < filteredQueue.length; j++) {
    if (!baseState.marked[filteredQueue[j].key]) return filteredQueue[j];
  }
  return null;
}

/* 正面导航位移：边界方向阻尼（无上一张仍左滑 / 无下一张仍右滑 → 移动量打 2.5 折） */
function frontNavDx(dx) {
  if (dx < 0 && historyStack.length === 0) return dx * 0.25;
  if (dx > 0 && !findNextPendingAfter(currentCard)) return dx * 0.25;
  return dx;
}

/* 隐藏滑动遮罩 */
function hideOverlays() {
  var oR = document.getElementById('overlayRight');
  var oL = document.getElementById('overlayLeft');
  if (oR) oR.style.opacity = 0;
  if (oL) oL.style.opacity = 0;
}

/* 卡片回弹归位 */
function bounceCard(card) {
  if (!card) return;
  card.style.transform = '';
  hideOverlays();
}

/* 边界摇晃提示（重启动画实现连续触发） */
function shakeWarn(card) {
  if (!card) return;
  card.classList.remove('shake-warn');
  void card.offsetWidth; /* 强制重排，重启动画 */
  card.classList.add('shake-warn');
  setTimeout(function() { card.classList.remove('shake-warn'); }, 400);
}

/* 滑动遮罩文案：背面=已记住/未记住（标记），正面=下一张/上一张（导航） */
var SVG_OK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
var SVG_X = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
var SVG_ARROW_R = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
var SVG_ARROW_L = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>';
function refreshOverlayLabels() {
  var oR = document.getElementById('overlayRight');
  var oL = document.getElementById('overlayLeft');
  if (!oR || !oL) return;
  if (isFlipped) {
    oR.className = 'swipe-overlay right';
    oL.className = 'swipe-overlay left';
    oR.querySelector('.swipe-label').innerHTML = SVG_OK + '已记住';
    oL.querySelector('.swipe-label').innerHTML = SVG_X + '未记住';
  } else {
    oR.className = 'swipe-overlay front-right';
    oL.className = 'swipe-overlay front-left';
    oR.querySelector('.swipe-label').innerHTML = SVG_ARROW_R + '下一张';
    oL.querySelector('.swipe-label').innerHTML = SVG_ARROW_L + '上一张';
  }
}

/* ============================================================
   初始化
   ============================================================ */
function init() {
  if (!getSessionStart()) startSession();
  isFlipped = false;
  isAnimating = false;
  historyStack = [];

  /* 已刷达到总数（配额）→ 直接进入学习成果页
     （未记住副本可能仍在队列中，不再继续出现） */
  var initStats = calcStats(state);
  if (initStats.total > 0 && initStats.done >= initStats.total) {
    showCompletion();
    updateProgress();
    updateBottomStats();
    updatePrevBtn();
    updateNextBtn();
    return;
  }

  currentCard = findNextPending();

  document.getElementById('completionScreen').classList.remove('show');
  renderCard();
  updateProgress();
  updateBottomStats();
  updatePrevBtn();
  updateNextBtn();
}

/* ============================================================
   渲染卡片
   ============================================================ */
function renderCard(overrideCard) {
  var stack = document.getElementById('cardStack');

  if (overrideCard) {
    currentCard = overrideCard;
  } else {
    currentCard = findNextPending();
  }
  if (!currentCard) {
    showCompletion();
    return;
  }

  var card = currentCard;
  var isStubborn = isStubbornCard(state, card.id);

  /* 剩余未标记张数（不含当前，用于背景堆叠 + 底部提示） */
  var remaining = 0;
  for (var r = 0; r < state.queue.length; r++) {
    var rit = state.queue[r];
    if (!state.marked[rit.key] && rit.key !== card.key) remaining++;
  }

  isFlipped = false;

  /* 背景堆叠卡片 */
  var behindHtml = '';
  if (remaining >= 2) {
    behindHtml = '<div class="card-behind card-behind-2"></div><div class="card-behind card-behind-1"></div>';
  } else if (remaining >= 1) {
    behindHtml = '<div class="card-behind card-behind-1"></div>';
  }

  /* 卡片标签区：题型（一级-二级），左对齐 */
  var tagHtml = '<div class="card-tags">' +

    '<span class="tag-sep">-</span>' +
    '<span class="tag-sub">' + card.sub + '</span>' +

    '</div>';

  /* 顽固卡右上角角标：放在 .card-3d 层（父级无 overflow，可溢出骑跨边线）
     正反各一个，靠 backface-visibility 翻卡时只显示当前面 */
  var stubbornFront = isStubborn ? '<span class="stub-mark stub-front" title="顽固卡：今日多次未记住，重点复习">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>' : '';
  var stubbornBack = isStubborn ? '<span class="stub-mark stub-back" title="顽固卡：今日多次未记住，重点复习">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>' : '';

  /* 活跃卡片 HTML */
  var activeHtml = '<div class="card-3d' + (isStubborn ? ' card-3d-stubborn' : '') + '" id="activeCard">' +
    stubbornFront + stubbornBack +
    /* 滑动反馈遮罩（背面） */
    '<div class="swipe-overlay right" id="overlayRight">' +
      '<div class="swipe-label"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M20 6L9 17l-5-5"/></svg>已记住</div></div>' +
    '<div class="swipe-overlay left" id="overlayLeft">' +
      '<div class="swipe-label"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M18 6L6 18M6 6l12 12"/></svg>未记住</div></div>' +

    /* 正面（问题） */
    '<div class="card-face card-front' + (isStubborn ? ' card-stubborn' : '') + '">' +
      tagHtml +
      '<div class="card-content">' +
        '<div class="card-label">问题</div>' +
        '<div class="card-question">' + clozeHtml(card.question) + '</div>' +
      '</div>' +
      '<div class="card-footer">' +
        '<div class="flip-hint">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M3 12a9 3 0 0 0 18 0 9 3 0 0 0-18 0z"/>' +
          '<path d="M3 12v6a9 3 0 0 0 18 0v-6"/>' +

    '<div class="card-face card-back' + (isStubborn ? ' card-stubborn' : '') + '">' +
      tagHtml +

        '<div class="card-label">问题</div>' +
        '<div class="card-question-sm">' + clozeHtml(card.question, card.answer) + '</div>' +
        '<div class="card-label" style="color:var(--success);">答案</div>' +
        '<div class="card-answer">' + card.answer + '</div>' +
        '<div class="card-divider"></div>' +
        '<div class="card-analysis-label">解析</div>' +
        '<div class="card-analysis">' + card.analysis + '</div>' +
      '</div>' +
      '<div class="card-footer">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--danger)">' +
        '<path d="M19 12H5M12 19l-7-7 7-7"/></svg>' +
        '<span style="color:var(--danger);font-weight:600;">左滑未记住</span>' +
        '<span style="color:var(--text-tertiary);">|</span>' +
        '<span style="color:var(--success);font-weight:600;">右滑已记住</span>' +
        '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--success)">' +
        '<path d="M5 12h14M12 5l7 7-7 7"/></svg>' +
      '</div>' +
    '</div>' +
  '</div>';

  stack.innerHTML = behindHtml + activeHtml;

  isFlipped = false;
  bindCardEvents();
  refreshOverlayLabels();
}

/* ============================================================
   绑定卡片事件
   ============================================================ */
function bindCardEvents() {
  var card = document.getElementById('activeCard');
  if (!card) return;

  /* 点击翻转 */
  card.addEventListener('click', onCardTap);

  /* 触摸滑动 */
  card.addEventListener('touchstart', onTouchStart, { passive: false });
  card.addEventListener('touchmove', onTouchMove, { passive: false });
  card.addEventListener('touchend', onTouchEnd);

  /* 鼠标滑动（桌面调试） */
  card.addEventListener('mousedown', onMouseDown);
}

/* ============================================================
   点击/轻触 翻转
   ============================================================ */
function onCardTap(e) {
  if (isAnimating) return;
  if (hasMoved) { hasMoved = false; return; }
  if (touchStarted) return; // 触摸设备由 touchend 处理

  flipCard();
}

/* ============================================================
   翻转卡片
   ============================================================ */
function flipCard() {
  if (isAnimating) return;
  var card = document.getElementById('activeCard');
  if (!card) return;

  isFlipped = !isFlipped;
  card.classList.toggle('flipped', isFlipped);
  refreshOverlayLabels();
}

/* ============================================================
   触摸滑动处理
   ============================================================ */
function onTouchStart(e) {
  if (isAnimating) return;
  touchStarted = true;
  hasMoved = false;
  autoCommitted = false;
  frontDrag = false;

  /* 正反两面都记录起点：
     - 背面（已翻转）：立即进入拖拽（阻止页面滚动）
     - 正面（未翻转）：先记录，等 touchmove 判定水平意图后再进入导航拖拽，
       期间不阻止默认行为，保证轻点翻转与垂直滚动不受影响 */
  var touch = e.touches[0];
  dragStart = { x: touch.clientX, y: touch.clientY };
  dragOffsetX = 0;

  if (isFlipped) {
    e.preventDefault();
    var card = document.getElementById('activeCard');
    if (card) card.classList.add('dragging');
  }
}

function onTouchMove(e) {
  if (!dragStart || isAnimating) return;

  var touch = e.touches[0];
  var dx = touch.clientX - dragStart.x;
  var dy = touch.clientY - dragStart.y;

  if (Math.abs(dx) > 5 || Math.abs(dy) > 5) hasMoved = true;

  var card = document.getElementById('activeCard');
  if (!card) return;

  /* 背面拖拽：标记操作（原逻辑不变） */
  if (isFlipped) {
    dragOffsetX = dx;

    var rotateZ = dx * 0.05;
    card.style.transform = 'translateX(' + dx + 'px) rotateY(180deg) rotateZ(' + rotateZ + 'deg)';

    updateOverlays(dx);
    e.preventDefault();

    /* 拖到侧边：立即判定，无需松手 */
    if (!autoCommitted && Math.abs(dx) >= EDGE_THRESHOLD) {
      autoCommitted = true;
      dragStart = null;
      commitCard(dx > 0 ? 'remembered' : 'forgot');
    }
    return;
  }

  /* 正面（未翻转）：水平意图判定（|dx|>8 且明显大于 |dy|）→ 进入导航拖拽 */
  if (!frontDrag) {
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      frontDrag = true;
      card.classList.add('dragging');
      refreshOverlayLabels();
    } else {
      return; /* 垂直滚动或未达阈值：不处理，不阻止默认行为 */
    }
  }

  e.preventDefault();
  dragOffsetX = dx;
  var fdx = frontNavDx(dx); /* 边界方向阻尼 */
  card.style.transform = 'translateX(' + fdx + 'px) rotateZ(' + (fdx * 0.05) + 'deg)';
  updateOverlays(fdx);
}

function onTouchEnd(e) {
  if (!dragStart) {
    touchStarted = false;
    return;
  }

  /* 正面轻触（未产生拖拽）：交给 click → onCardTap 翻转，避免双重翻转 */
  if (!frontDrag && !isFlipped) {
    dragStart = null;
    dragOffsetX = 0;
    touchStarted = false;
    return;
  }

  handleDragEnd();
  touchStarted = false;
}

/* ============================================================
   鼠标滑动处理（桌面调试）
   ============================================================ */
function onMouseDown(e) {
  if (isAnimating) return;
  if (touchStarted) return;

  /* 正反两面都记录起点（桌面无滚动冲突，直接进入拖拽判定） */
  mouseDown = true;
  dragStart = { x: e.clientX, y: e.clientY };
  dragOffsetX = 0;
  hasMoved = false;
  autoCommitted = false;
  frontDrag = false;

  e.preventDefault(); /* 阻止文字选中，不影响 click 触发 */
}

function onMouseMove(e) {
  if (!mouseDown || !dragStart || isAnimating) return;

  var dx = e.clientX - dragStart.x;
  if (Math.abs(dx) > 5) hasMoved = true;

  var card = document.getElementById('activeCard');
  if (!card) return;

  /* 背面拖拽：标记操作（原逻辑不变） */
  if (isFlipped) {
    dragOffsetX = dx;
    card.classList.add('dragging');

    var rotateZ = dx * 0.05;
    card.style.transform = 'translateX(' + dx + 'px) rotateY(180deg) rotateZ(' + rotateZ + 'deg)';

    updateOverlays(dx);

    /* 拖到侧边：立即判定，无需松手 */
    if (!autoCommitted && Math.abs(dx) >= EDGE_THRESHOLD) {
      autoCommitted = true;
      dragStart = null;
      commitCard(dx > 0 ? 'remembered' : 'forgot');
    }
    return;
  }

  /* 正面导航拖拽（未翻转）：左滑上一张 / 右滑下一张 */
  if (!frontDrag) {
    if (Math.abs(dx) <= 5) return;
    frontDrag = true;
    card.classList.add('dragging');
    refreshOverlayLabels();
  }

  dragOffsetX = dx;
  var fdx = frontNavDx(dx); /* 边界方向阻尼 */
  card.style.transform = 'translateX(' + fdx + 'px) rotateZ(' + (fdx * 0.05) + 'deg)';
  updateOverlays(fdx);
}

function onMouseUp(e) {
  if (!mouseDown) return;
  mouseDown = false;
  handleDragEnd();
}

/* 全局鼠标事件（拖动可能移出卡片范围） */
document.addEventListener('mousemove', onMouseMove);
document.addEventListener('mouseup', onMouseUp);

/* ============================================================
   更新滑动遮罩
   ============================================================ */
function updateOverlays(dx) {
  var overlayRight = document.getElementById('overlayRight');
  var overlayLeft = document.getElementById('overlayLeft');

  if (dx > 0) {
    overlayRight.style.opacity = Math.min(dx / SWIPE_THRESHOLD, 1) * 0.9;
    overlayLeft.style.opacity = 0;
  } else if (dx < 0) {
    overlayLeft.style.opacity = Math.min(-dx / SWIPE_THRESHOLD, 1) * 0.9;
    overlayRight.style.opacity = 0;
  } else {
    overlayRight.style.opacity = 0;
    overlayLeft.style.opacity = 0;
  }
}

/* ============================================================
   拖动结束处理
   ============================================================ */
function handleDragEnd() {
  if (!dragStart) return;
  /* 侧边已自动提交，松手时不再重复判定 */
  if (autoCommitted) { dragStart = null; dragOffsetX = 0; frontDrag = false; return; }

  var card = document.getElementById('activeCard');
  if (!card) { dragStart = null; return; }

  card.classList.remove('dragging');

  var dx = dragOffsetX;
  dragStart = null;
  dragOffsetX = 0;

  /* 正面导航拖拽：左滑上一张 / 右滑下一张（不标记，跳过的卡之后仍会出现） */
  if (frontDrag && !isFlipped) {
    frontDrag = false;
    if (dx < -SWIPE_THRESHOLD) {
      if (historyStack.length > 0) {
        goPrev();
      } else {
        bounceCard(card);
        shakeWarn(card); /* 已是第一张：回弹 + 摇晃提示 */
      }
    } else if (dx > SWIPE_THRESHOLD) {
      if (findNextPendingAfter(currentCard)) {
        goNext();
      } else {
        bounceCard(card);
        shakeWarn(card); /* 已是最后一张待答卡：回弹 + 摇晃提示 */
      }
    } else {
      bounceCard(card); /* 未达阈值：回弹 */
    }
    return;
  }

  frontDrag = false;

  if (Math.abs(dx) > SWIPE_THRESHOLD) {
    if (dx > 0) {
      commitCard('remembered');
    } else {
      commitCard('forgot');
    }
  } else {
    /* 回弹 */
    bounceCard(card);
  }
}

/* ============================================================
   提交卡片判定
   ============================================================ */
function commitCard(result) {
  isAnimating = true;
  var card = document.getElementById('activeCard');
  if (card) card.classList.remove('dragging');

  var cardData = currentCard;
  if (!cardData) { isAnimating = false; return; }

  if (baseState.marked[cardData.key]) { isAnimating = false; return; } // 防重复标记

  if (result === 'remembered') {
    if (card) card.classList.add('commit-right');
  } else {
    if (card) card.classList.add('commit-left');
  }

  /* 记录历史用于「上一张」撤销 */
  var prevFC = 0;
  var cardEl = findCard(baseState, cardData.key);
  if (cardEl) prevFC = cardEl.forgotCount || 0;
  historyStack.push({ key: cardData.key, result: result, prevForgotCount: prevFC });

  /* 走共享数据层：标记 + 未记住副本塞回队尾（当天重现） */
  markCard(baseState, cardData.key, result);
  saveState(baseState);
  refreshFilter();  // 未记住产生的副本需要进入过滤视图

  dragStart = null;
  dragOffsetX = 0;
  updateProgress();
  updateBottomStats();

  /* 等飞出动画结束后：已刷达到总数 → 学习成果页；否则渲染下一张 */
  setTimeout(function() {
    isAnimating = false;
    var st = calcStats(state);
    if (st.total > 0 && st.done >= st.total) {
      showCompletion();
    } else {
      currentCard = findNextPending();
      renderCard();
    }
    updatePrevBtn();
    updateNextBtn();
  }, 400);
}

/* ============================================================
   更新进度
   ============================================================ */
function updateProgress() {
  var stats = calcStats(state);
  document.getElementById('doneCount').textContent = stats.done;
  document.getElementById('totalCount').textContent = ' / ' + stats.total;

  /* 进度条：done / total */
  var pct = stats.total ? Math.min(stats.done / stats.total * 100, 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

/* ============================================================
   刷新底部统计条（已记住 / 未记住 / 顽固）
   ============================================================ */
function updateBottomStats() {
  var stats = calcStats(state);
  document.getElementById('bsRemembered').textContent = stats.remembered;
  document.getElementById('bsForgot').textContent = stats.forgot;
  document.getElementById('bsStubborn').textContent = stats.stubborn;
}

/* ============================================================
   上一张：撤销最近一次标记，回到上一张卡重新作答（含飞出过渡动画）
   ============================================================ */
function goPrev() {
  if (isAnimating) return;
  if (historyStack.length === 0) {
    /* 已是第一张：回弹 + 摇晃提示 */
    var cur = document.getElementById('activeCard');
    bounceCard(cur);
    shakeWarn(cur);
    return;
  }

  var last = historyStack.pop();
  var key = last.key;

  /* 撤销标记 */
  delete baseState.marked[key];

  /* 如果当时是「未记住」，还需撤销 markCard 新增的副本和 forgotCount 累加 */
  if (last.result === 'forgot') {
    var card = findCard(baseState, key);
    if (card) {
      /* 找到该 id 下 round 最大的卡（即 markCard 塞回队尾的副本），移除 */
      var maxRound = 1, dupIdx = -1;
      for (var i = baseState.queue.length - 1; i >= 0; i--) {
        var q = baseState.queue[i];
        if (q.id === card.id && (q.round || 1) > maxRound) {
          maxRound = q.round || 1;
          dupIdx = i;
        }
      }
      if (dupIdx >= 0 && maxRound > 1) {
        baseState.queue.splice(dupIdx, 1);
      }
      /* 恢复 forgotCount 到标记前的值 */
      for (var j = 0; j < baseState.queue.length; j++) {
        if (baseState.queue[j].id === card.id) {
          baseState.queue[j].forgotCount = last.prevForgotCount;
        }
      }
    }
  }

  saveState(baseState);
  refreshFilter();
  historyRecorded = false;   // 撤销后重新完成允许重新记录
  clearResultRecorded();

  /* 渲染该卡（未标记状态，可重新作答）：与翻页一致的飞出过渡 */
  var prevCard = findCard(baseState, key);
  isAnimating = true;
  var cardEl = document.getElementById('activeCard');
  if (cardEl) {
    cardEl.classList.remove('dragging');
    cardEl.style.transform = '';
    hideOverlays();
    cardEl.classList.add('nav-out-left');
  }

  setTimeout(function() {
    isAnimating = false;
    if (prevCard) {
      isFlipped = false;
      document.getElementById('completionScreen').classList.remove('show');
      renderCard(prevCard);
      updateProgress();
      updateBottomStats();
      updatePrevBtn();
      updateNextBtn();
    } else {
      init();
    }
  }, 400);
}

/* ============================================================
   下一张：跳过当前卡（不标记），切换到之后第一张未标记的卡
   被跳过的卡仍保留在待答队列中，之后还会重新出现
   ============================================================ */
function goNext() {
  if (isAnimating) return;
  var next = findNextPendingAfter(currentCard);
  if (!next) {
    /* 已是最后一张待答卡：回弹 + 摇晃提示 */
    var cur = document.getElementById('activeCard');
    bounceCard(cur);
    shakeWarn(cur);
    return;
  }

  isAnimating = true;
  var cardEl = document.getElementById('activeCard');
  if (cardEl) {
    cardEl.classList.remove('dragging');
    cardEl.style.transform = '';
    hideOverlays();
    cardEl.classList.add('nav-out-right');
  }

  setTimeout(function() {
    isAnimating = false;
    isFlipped = false;
    renderCard(next);
    updateProgress();
    updateBottomStats();
    updatePrevBtn();
    updateNextBtn();
  }, 400);
}

/* 更新「上一张」按钮可用状态 */
function updatePrevBtn() {
  var btn = document.getElementById('prevBtn');
  if (btn) btn.disabled = historyStack.length === 0;
}

/* 更新「下一张」按钮可用状态（后面没有待答卡时置灰） */
function updateNextBtn() {
  var btn = document.getElementById('nextBtn');
  if (btn) btn.disabled = !findNextPendingAfter(currentCard);
}

/* ============================================================
   完成结算页
   ============================================================ */
function showCompletion() {
  var stats = calcStats(state);
  var elapsed = getSessionElapsed();
  var done = stats.done;
  var accuracy = done > 0 ? Math.round(stats.remembered / done * 100) : 0;
  var speedSec = done > 0 ? Math.round(elapsed / done) : 0;
  var lastH = getLastHistory();

  /* 1. Hero 区域：动态标题 + 范围 */
  var emoji = '\uD83D\uDCDA', title = '再加把劲！';
  if (accuracy >= 80) { emoji = '\uD83C\uDF89'; title = '不错哦！'; }
  else if (accuracy >= 60) { emoji = '\uD83D\uDCAA'; title = '继续加油！'; }
  document.getElementById('compEmoji').textContent = emoji;
  document.getElementById('compTitle').textContent = title;
  document.getElementById('compSubtitle').textContent = getRangeText();

  /* 2. 环形图 + 核心指标 */
  document.getElementById('sumTotal').textContent = stats.total;
  document.getElementById('sumRemembered').textContent = stats.remembered;
  document.getElementById('sumForgot').textContent = stats.forgot;
  document.getElementById('ringPct').textContent = accuracy + '%';

  var ring = document.getElementById('ringFill');
  if (ring) {
    ring.style.strokeDashoffset = '251.33';
    setTimeout(function() {
      ring.style.strokeDashoffset = (251.33 * (1 - accuracy / 100)).toFixed(2);
    }, 200);
  }

  /* 3. 薄弱知识点 TOP5 */
  var weakPoints = getWeakPoints(state, 5);
  var weakEl = document.getElementById('weakList');
  if (weakPoints.length === 0) {
    weakEl.innerHTML = '<div style="text-align:center;padding:16px 0;color:var(--text-tertiary);font-size:13px;">\u672C\u8F6E\u5168\u90E8\u638C\u63E1\uFF0C\u6682\u65E0\u8584\u5F31\u70B9 \uD83C\uDF89</div>';
  } else {
    var maxWrong = 1;
    for (var i = 0; i < weakPoints.length; i++) {
      if (weakPoints[i].wrong > maxWrong) maxWrong = weakPoints[i].wrong;
    }
    var weakHtml = '';
    for (var w = 0; w < weakPoints.length; w++) {
      var wp = weakPoints[w];
      var pct = Math.round(wp.wrong / maxWrong * 100);
      weakHtml += '<div class="weak-item">' +
        '<div class="weak-rank' + (w === 0 ? ' top' : '') + '">' + (w + 1) + '</div>' +
        '<div class="weak-info">' +
          '<div class="weak-name">' + esc(wp.name) + '</div>' +
          '<div class="weak-path">' + esc(wp.chapter) + (wp.sub ? ' \u00B7 ' + esc(wp.sub) : '') + '</div>' +
        '</div>' +
        '<div class="weak-bar"><div class="weak-bar-fill" style="width:' + pct + '%;"></div></div>' +
        '<div class="weak-count">' + wp.wrong + '\u6B21</div>' +
      '</div>';
    }
    weakEl.innerHTML = weakHtml;
  }

  /* 4. 章节掌握度分布 */
  var dist = getChapterDistribution(state);
  var distEl = document.getElementById('chapterDistList');
  if (dist.length === 0) {
    distEl.innerHTML = '<div style="text-align:center;padding:12px 0;color:var(--text-tertiary);font-size:13px;">\u6682\u65E0\u6570\u636E</div>';
  } else {
    var distHtml = '';
    for (var d = 0; d < dist.length; d++) {
      var ch = dist[d];
      var okPct = ch.total > 0 ? Math.round(ch.remembered / ch.total * 100) : 0;
      var okWidth = ch.total > 0 ? (ch.remembered / ch.total * 100) : 0;
      var badWidth = ch.total > 0 ? (ch.forgot / ch.total * 100) : 0;
      distHtml += '<div class="chapter-dist-item">' +
        '<div class="chapter-dist-name">' + esc(ch.name) + '</div>' +
        '<div class="chapter-dist-bar">' +
          '<div class="cdb-ok" style="width:' + okWidth.toFixed(1) + '%;"></div>' +
          '<div class="cdb-bad" style="width:' + badWidth.toFixed(1) + '%;"></div>' +
        '</div>' +
        '<div class="chapter-dist-pct">' + okPct + '%</div>' +
        '<div class="chapter-dist-total">' + ch.total + '\u5F20</div>' +
      '</div>';
    }
    distEl.innerHTML = distHtml;
  }

  /* 5. 效率分析 */
  document.getElementById('effTime').textContent = formatDuration(elapsed);
  document.getElementById('effSpeed').textContent = speedSec + 's/\u5F20';

  var compareEl = document.getElementById('effCompare');
  compareEl.className = 'eff-value';
  if (lastH && lastH.speedSec && speedSec > 0) {
    var diff = lastH.speedSec - speedSec;
    if (diff > 0) {
      var pct = Math.round(diff / lastH.speedSec * 100);
      compareEl.textContent = '\u2191' + pct + '%';
      compareEl.className = 'eff-value up';
    } else if (diff < 0) {
      var pct2 = Math.round(-diff / lastH.speedSec * 100);
      compareEl.textContent = '\u2193' + pct2 + '%';
      compareEl.className = 'eff-value down';
    } else {
      compareEl.textContent = '\u6301\u5E73';
    }
  } else {
    compareEl.textContent = '\u9996\u6B21';
  }

  /* 6. 底部按钮：若有章节过滤，增加「继续下一章」 */
  var actionsEl = document.getElementById('completionActions');
  var actionsHtml = '<button class="comp-btn comp-btn-secondary" onclick="goHome()">\u8FD4\u56DE\u9996\u9875</button>';
  if (activeFilter.chapter) {
    actionsHtml += '<button class="comp-btn comp-btn-secondary" onclick="goNextChapter()">\u4E0B\u4E00\u7AE0</button>';
  }
  actionsHtml += '<button class="comp-btn comp-btn-primary" onclick="restart()">\u518D\u80CC\u4E00\u8F6E</button>';
  actionsEl.innerHTML = actionsHtml;

  /* 7. 记录历史 + 清除计时（同轮成果只记录一次，刷新/重进不重复） */
  if (!historyRecorded && !isResultRecordedToday(done)) {
    recordHistory({
      date: todayStr(),
      remembered: stats.remembered,
      forgot: stats.forgot,
      total: done,
      accuracy: accuracy,
      elapsedSec: elapsed,
      speedSec: speedSec
    });
    historyRecorded = true;
    markResultRecordedToday(done);
  }
  clearSessionStart();

  document.getElementById('completionScreen').classList.add('show');
}

/* 获取当前过滤范围文本 */
function getRangeText() {
  if (activeFilter.point) return activeFilter.chapter + ' \u00B7 ' + activeFilter.sub + ' \u00B7 ' + activeFilter.topic + ' \u00B7 ' + activeFilter.point;
  if (activeFilter.topic) return activeFilter.chapter + ' \u00B7 ' + activeFilter.sub + ' \u00B7 ' + activeFilter.topic;
  if (activeFilter.sub) return activeFilter.chapter + ' \u00B7 ' + activeFilter.sub;
  if (activeFilter.chapter) return activeFilter.chapter;
  return '\u5168\u90E8\u7AE0\u8282';
}

/* 格式化时长（秒 → M:SS） */
function formatDuration(sec) {
  var m = Math.floor(sec / 60);
  var s = sec % 60;
  return m + ':' + ('0' + s).slice(-2);
}

/* 巩固薄弱点：跳转列表模式并过滤到最薄弱章节 */
function goToPractice() {
  var dist = getChapterDistribution(state);
  var weakest = null;
  for (var i = 0; i < dist.length; i++) {
    if (!weakest || dist[i].forgot > weakest.forgot) weakest = dist[i];
  }
  if (weakest && weakest.forgot > 0) {
    window.location.href = '\u95EA\u5361\u5217\u8868\u6A21\u5F0F.html?chapter=' + encodeURIComponent(weakest.name);
  } else {
    window.location.href = '\u95EA\u5361\u5217\u8868\u6A21\u5F0F.html' + filterQuery();
  }
}

/* 继续下一章 */
function goNextChapter() {
  var chapters = [], seen = {};
  for (var i = 0; i < CARDS.length; i++) {
    var ch = CARDS[i].chapter;
    if (!seen[ch]) { seen[ch] = true; chapters.push(ch); }
  }
  var idx = chapters.indexOf(activeFilter.chapter);
  if (idx >= 0 && idx < chapters.length - 1) {
    window.location.href = '\u95EA\u5361\u5355\u5361\u6A21\u5F0F.html?chapter=' + encodeURIComponent(chapters[idx + 1]);
  } else if (chapters.length > 0) {
    window.location.href = '\u95EA\u5361\u5355\u5361\u6A21\u5F0F.html?chapter=' + encodeURIComponent(chapters[0]);
  }
}

/* ============================================================
   导航
   ============================================================ */
function goHome() {
  window.location.href = '闪卡首页.html';
}

function goList() {
  window.location.href = '闪卡列表模式.html' + filterQuery();
}

function closeExitModal() {
  document.getElementById('exitModal').classList.remove('show');
}

function restart() {
  clearSessionStart();
  historyRecorded = false;  // 新一轮允许重新记录历史
  clearResultRecorded();
  baseState = newState();   // 生成全新当天状态（跨天 forgotCount 保留在卡片上）
  saveState(baseState);
  refreshFilter();
  init();
}

/* ============================================================
   按钮事件绑定
   ============================================================ */
document.getElementById('exitBtn').addEventListener('click', function() {
  document.getElementById('exitModal').classList.add('show');
});

document.getElementById('switchBtn').addEventListener('click', goList);

document.getElementById('prevBtn').addEventListener('click', goPrev);

document.getElementById('nextBtn').addEventListener('click', goNext);

document.getElementById('ctaPracticeBtn').addEventListener('click', goToPractice);

/* ============================================================
   启动
   ============================================================ */
init();
</script>
</body>
