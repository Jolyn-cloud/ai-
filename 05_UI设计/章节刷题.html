<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>章节刷题</title>
<style>
/* ==== Product Theme：蓝靛 #5B72F5（与题库首页统一，2026-08-31） ====
   章节刷题页：题库首页「章节刷题」入口下钻二级页
   结构：顶栏（返回+标题）→ 筛选 chip 行 → 章节卡片列表（四级手风琴）
   交互：一二级展开下钻 / 三级整行展开四级+右「再刷」按钮 / 四级整行点击直接刷
   数据：刷题指标（已做/正确率/错题/未做），与闪卡章节页（记忆度）口径分离
   图标：10 章各一色渐变（题库首页 entry-icon 调子另出一套，不复用闪卡） */
:root{
  --primary: #5B72F5;
  --primary-dark: #4358D7;
  --primary-light: #EEF1FF;
  --brand-mid: #4358D7;
  --brand-teal: #3FA98B;
  --accent-grad-end: #62CFA9;
  --text-primary: #1E2130;
  --text-secondary: #6E778B;
  --text-tertiary: #98A0B2;
  --success: #20A866;
  --success-light: #E8F8F0;
  --warning: #F28B3D;
  --warning-light: #FFF1E6;
  --danger: #EF4444;
  --danger-light: #FEECEC;
  --card-radius: 17px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text-primary);
  background-color: #EDEFF7;
  display: flex; flex-direction: column; height: 100%; overflow: hidden;
  -webkit-overflow-scrolling: touch;
}

/* ===== 顶栏（二级页：返回 + 标题） ===== */
.topbar {
  flex-shrink: 0;
  height: 52px;
  display: flex; align-items: center;
  padding: 0 12px;
  background: #fff;
  border-bottom: 1px solid #EEF0F6;
  position: relative; z-index: 5;
}
.back-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: transparent; cursor: pointer;
  color: var(--text-primary);
}
.back-btn:active { opacity: .5; }
.back-btn svg { width: 22px; height: 22px; }
.topbar-title {
  position: absolute; left: 50%; transform: translateX(-50%);
  font-size: 17px; font-weight: 700; color: var(--text-primary);
}

/* ===== 筛选 chip 行 ===== */
.filter-row {
  flex-shrink: 0;
  display: flex; gap: 8px;
  padding: 12px 16px 8px;
  background: #EDEFF7;
  position: relative; z-index: 4;
}
.chip {
  flex-shrink: 0;
  padding: 7px 14px;
  border-radius: 999px;
  background: #fff;
  border: 1px solid #E5E8F0;
  font-size: 12.5px; font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex; align-items: center; gap: 5px;
  transition: all .15s ease;
}
.chip:active { transform: scale(.96); }
.chip.active {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.chip svg { width: 13px; height: 13px; }
.chip .chip-count { font-size: 11px; opacity: .8; }

/* ===== 章节列表（唯一滚动容器） ===== */
.scroll-area {
  flex: 1; overflow-y: auto;
  padding: 4px 16px 32px;
  -webkit-overflow-scrolling: touch;
}

/* ===== 一级：章卡片 ===== */
.chapter-list { display: flex; flex-direction: column; gap: 10px; }
.chapter-card {
  background: #fff;
  border-radius: var(--card-radius);
  padding: 14px 15px;
  box-shadow: 0 1px 2px rgba(38,48,96,.04), 0 6px 16px rgba(91,114,245,.06);
}
.chapter-head { cursor: pointer; }
.chapter-head:active { opacity: .75; }
.chapter-main { display: flex; align-items: center; gap: 12px; }

/* 章图标：10 章各一色渐变（另出一套，不复用闪卡单色） */
.chapter-icon {
  width: 40px; height: 40px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 12px;
}
.chapter-icon svg { width: 21px; height: 21px; stroke: #fff; fill: none; stroke-width: 2; }
.ici-1 { background: linear-gradient(135deg, #5B72F5, #4358D7); }   /* 信息与计算机基础 蓝靛 */
.ici-2 { background: linear-gradient(135deg, #722ED1, #9B6BD9); }   /* 计算思维 紫 */
.ici-3 { background: linear-gradient(135deg, #13C2C2, #36CFC9); }  /* 操作系统 青 */
.ici-4 { background: linear-gradient(135deg, #1677FF, #4096FF); }  /* Word 蓝 */
.ici-5 { background: linear-gradient(135deg, #20A866, #52C41A); }  /* Excel 绿 */
.ici-6 { background: linear-gradient(135deg, #F28B3D, #FFA940); }  /* PowerPoint 橙 */
.ici-7 { background: linear-gradient(135deg, #5B72F5, #3FA98B); }  /* 数据库 蓝绿 */
.ici-8 { background: linear-gradient(135deg, #2F54EB, #597EF7); }  /* 网络 靛蓝 */
.ici-9 { background: linear-gradient(135deg, #EF4444, #F87171); } /* 信息安全 红 */
.ici-10{ background: linear-gradient(135deg, #FA541C, #FF7A45); }  /* 新一代技术 橙红 */

.chapter-info { min-width: 0; flex: 1; }
.chapter-name {
  font-size: 15px; font-weight: 700; color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chapter-data {
  margin-top: 5px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: 11.5px; color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
}
.cd-done strong { color: var(--text-secondary); font-weight: 600; }
.cd-rate { color: var(--primary); font-weight: 700; }
.cd-rate.low { color: var(--danger); }
.cd-rate.mid { color: var(--warning); }
.cd-rate.high { color: var(--success); }
.cd-wrong {
  color: var(--warning);
  background: var(--warning-light);
  padding: 1px 6px; border-radius: 5px; font-size: 10.5px; font-weight: 600;
}
.cd-todo { color: var(--text-tertiary); }
.cd-todo strong { color: var(--text-secondary); font-weight: 600; }

.chapter-right { display: flex; align-items: center; flex-shrink: 0; }
.chapter-rate-big {
  font-size: 17px; font-weight: 800;
  font-variant-numeric: tabular-nums;
  margin-right: 6px;
}
.arrow {
  color: #8b93a4; font-size: 16px; line-height: 1;
  transition: transform .25s ease;
}
.chapter-card.open .arrow { transform: rotate(90deg); }

/* 一级进度条 */
.chapter-progress {
  margin: 10px 0 0 52px;
  height: 3px; border-radius: 10px;
  background: #E7EAF3; overflow: hidden;
}
.chapter-progress-inner {
  width: 0; height: 100%; border-radius: inherit;
  background: linear-gradient(90deg, var(--primary), var(--brand-teal));
  transition: width .9s cubic-bezier(.22,.61,.36,1);
}

/* ===== 二级：节（手风琴展开） ===== */
.sub-list { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
.chapter-card.open .sub-list { max-height: 9999px; }   /* 展开态用大值，子级撑高不被卡 */
.sub-inner { padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.sub-container {
  background: #FAFBFF;
  border: 1px solid rgba(91,114,245,.06);
  border-radius: 12px;
  padding: 11px 12px;
}
.sub-item {
  display: flex; align-items: center;
  padding: 3px 0; cursor: pointer;
  border-radius: 0; background: transparent;
  transition: background .12s ease;
}
.sub-item:active { background: rgba(91,114,245,.04); }
.sub-dot {
  width: 6px; height: 6px; margin-right: 11px;
  border-radius: 50%; background: var(--primary); flex-shrink: 0;
}
.sub-title {
  flex: 1; min-width: 0;
  font-size: 13px; font-weight: 600; color: var(--primary-dark);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sub-right {
  display: flex; align-items: baseline; gap: 8px; flex-shrink: 0;
  font-size: 11.5px; font-variant-numeric: tabular-nums;
}
.sr-rate { font-weight: 700; }
.sr-rate.low { color: var(--danger); }
.sr-rate.mid { color: var(--warning); }
.sr-rate.high { color: var(--success); }
.sub-arrow {
  margin-left: 3px; color: #c3c9d5; font-size: 15px; line-height: 1;
  transition: transform .25s ease;
}
.sub-item.open-l2 .sub-arrow { transform: rotate(90deg); }
/* 二级进度条 */
.sub-progress {
  margin: 6px 0 2px 17px; height: 2px; border-radius: 10px;
  background: #EEF0F7; overflow: hidden;
}
.sub-progress-inner {
  width: 0; height: 100%; border-radius: inherit;
  background: rgba(91,114,245,.40);
  transition: width .9s cubic-bezier(.22,.61,.36,1);
}

/* ===== 三级：主题 ===== */
.l3-list { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
/* l3-list 是 sub-item 的后续兄弟（同在 sub-container 内），用兄弟选择器命中 */
.sub-item.open-l2 ~ .l3-list { max-height: 9999px; }
.l3-inner { padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.l3-block {
  border: 1px solid rgba(91,114,245,.08);
  border-radius: 10px; background: #fff;
  padding: 9px 10px;
}
.l3-item {
  display: flex; align-items: center;
  padding: 3px 2px; cursor: pointer;
  transition: background .12s ease;
}
.l3-item:active { background: rgba(91,114,245,.04); }
.l3-arrow {
  width: 13px; height: 13px; margin-right: 7px;
  color: var(--primary); font-size: 13px; font-weight: 600; line-height: 1;
  flex-shrink: 0; transition: transform .2s ease;
}
.l3-item.open .l3-arrow { transform: rotate(90deg); }
.l3-title {
  flex: 1; min-width: 0;
  font-size: 12.5px; font-weight: 600; color: var(--primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.l3-right {
  display: flex; align-items: baseline; gap: 7px; flex-shrink: 0;
  font-size: 11px; color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
}
.l3-rate { font-weight: 700; }
.l3-rate.low { color: var(--danger); }
.l3-rate.mid { color: var(--warning); }
.l3-rate.high { color: var(--success); }
.l3-todo { color: var(--text-secondary); font-weight: 600; }
/* 「再刷」按钮：三级整行展开四级，按钮进做题页 */
.rebtn {
  margin-left: 8px; flex-shrink: 0;
  padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--primary);
  background: var(--primary-light);
  color: var(--primary-dark);
  font-size: 11px; font-weight: 700; cursor: pointer;
  transition: all .12s ease;
}
.rebtn:active { transform: scale(.95); background: var(--primary); color: #fff; }
.rebtn.todo { background: var(--primary); color: #fff; border-color: var(--primary); }

/* ===== 四级：考点 ===== */
.l4-list { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
/* l4-list 是 l3-item 的后续兄弟（同在 l3-block 内），用兄弟选择器命中 */
.l3-item.open ~ .l4-list { max-height: 9999px; }
.l4-inner { margin: 0 0 0 12px; padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.l4-item {
  display: flex; align-items: center;
  height: 40px; padding: 0 11px; cursor: pointer;
  border: 1px solid rgba(103,116,141,.12);
  border-radius: 8px; background: #fff;
  transition: background .12s ease;
}
.l4-item:active { background: rgba(91,114,245,.04); }
.l4-dot {
  width: 7px; height: 7px; margin-right: 10px;
  border-radius: 50%; background: #C7CDD9; flex-shrink: 0;
}
.l4-dot.done-low { background: var(--danger); }
.l4-dot.done-mid { background: var(--warning); }
.l4-dot.done-high { background: var(--success); }
.l4-title {
  flex: 1; min-width: 0;
  font-size: 11.5px; font-weight: 500; color: #68748D;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.l4-right {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  font-size: 10.5px; font-variant-numeric: tabular-nums; color: var(--text-tertiary);
}
.l4-rate { font-weight: 700; }
.l4-rate.low { color: var(--danger); }
.l4-rate.mid { color: var(--warning); }
.l4-rate.high { color: var(--success); }
.l4-todo { color: var(--warning); font-weight: 600; }

/* ===== 空态（整章未做过） ===== */
.chapter-card.fresh .chapter-rate-big { color: var(--text-tertiary); font-size: 12px; font-weight: 600; }
.chapter-card.fresh .chapter-progress { display: none; }
.fresh-tag {
  font-size: 10.5px; color: var(--primary); font-weight: 600;
  background: var(--primary-light); padding: 2px 8px; border-radius: 6px;
}

/* ===== Toast ===== */
.toast {
  position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%);
  background: rgba(30,33,48,.92); color: #fff;
  padding: 9px 18px; border-radius: 22px; font-size: 13px;
  opacity: 0; transition: opacity .25s ease; z-index: 999;
  pointer-events: none; white-space: nowrap;
}
</style>
</head>
<body>

<!-- 顶栏 -->
<div class="topbar">
  <button class="back-btn" onclick="goBack()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div class="topbar-title">章节刷题</div>
</div>

<!-- 筛选 chip 行 -->
<div class="filter-row">
  <button class="chip active" data-filter="all" onclick="setFilter('all')">全部</button>
  <button class="chip" data-filter="todo" onclick="setFilter('todo')">
    只看未做 <span class="chip-count" id="cntTodo"></span>
  </button>
  <button class="chip" data-filter="wrong" onclick="setFilter('wrong')">
    只看错题 <span class="chip-count" id="cntWrong"></span>
  </button>

<!-- 章节列表 -->
<div class="scroll-area">

</div>

<div class="toast" id="toast"></div>

     wrong   答错题数（done=right+wrong+空答，演示简化 wrong=done-right）

/* ===== 计算与格式 ===== */
function rateOf(done, right){ return done ? Math.round(right/done*100) : null; }
function rateClass(r){ if(r===null) return ''; return r<60?'low':(r<80?'mid':'high'); }
function rateText(r){ return r===null ? '未做' : r+'%'; }
function todoOf(total, done){ return total - done; }

/* 汇总下级指标（父级聚合用） */
function aggregate(items){
  var t=0,d=0,r=0,w=0;
  items.forEach(function(it){
    t+=it.total; d+=it.done; r+=it.right; w+=it.wrong;
    if(it.level3) { var s=aggregate(it.level3); }
    if(it.level4) { var s2=aggregate(it.level4); }
  });
  return {total:t, done:d, right:r, wrong:w};
}

/* ===== 渲染 ===== */
var currentFilter = 'all';

function renderChapters(){
  var list = document.getElementById('chapterList');
  var html = '';
  CHAPTERS.forEach(function(ch, idx){
    var r = rateOf(ch.done, ch.right);
    var rc = rateClass(r);
    var todo = todoOf(ch.total, ch.done);
    var fresh = ch.fresh || ch.done===0;
    // 筛选：只看未做 → 隐藏 done>=total 的章；只看错题 → 隐藏 wrong=0 的章（按章级聚合判断）
    if(currentFilter==='todo' && todo===0) return;
    if(currentFilter==='wrong' && ch.wrong===0) return;

    html += '<div class="chapter-card'+(fresh?' fresh':'')+'" data-cid="'+ch.id+'">';
    html += '<div class="chapter-head" onclick="toggleChapter(this)">';
    html += '<div class="chapter-main">';
    html += '<div class="chapter-icon '+ch.ici+'"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[ch.icon]||'')+'</svg></div>';
    html += '<div class="chapter-info">';
    html += '<div class="chapter-name">'+ch.name+'</div>';
    html += '<div class="chapter-data">';
    html += '<span class="cd-done">已做 <strong>'+ch.done+'/'+ch.total+'</strong></span>';
    if(fresh){
      html += '<span class="fresh-tag">未练习</span>';
    } else {
      html += '<span class="cd-rate '+rc+'">正确 '+rateText(r)+'</span>';
      if(ch.wrong>0) html += '<span class="cd-wrong">错 '+ch.wrong+'</span>';
      if(todo>0) html += '<span class="cd-todo">未做 <strong>'+todo+'</strong></span>';
    }
    html += '</div>'; // chapter-data
    html += '</div>'; // chapter-info
    html += '<div class="chapter-right">';
    if(fresh){
      html += '<span class="chapter-rate-big">未做</span>';
    } else {
      html += '<span class="chapter-rate-big '+rc+'">'+r+'%</span>';
    }
    html += '<span class="arrow">▸</span>';
    html += '</div>'; // chapter-right
    html += '</div>'; // chapter-main
    if(!fresh){
      var pct = Math.round(ch.done/ch.total*100);
      html += '<div class="chapter-progress"><div class="chapter-progress-inner" style="width:'+pct+'%"></div></div>';
    }
    html += '</div>'; // chapter-head
    // 二级
    html += '<div class="sub-list"><div class="sub-inner">';
    ch.subs.forEach(function(sub){
      var sr = rateOf(sub.done, sub.right);
      var src = rateClass(sr);
      var stodo = todoOf(sub.total, sub.done);
      var sfresh = sub.done===0;
      html += '<div class="sub-container">';
      html += '<div class="sub-item" onclick="toggleSub(this)">';
      html += '<div class="sub-dot"></div>';
      html += '<div class="sub-title">'+sub.name+'</div>';
      html += '<div class="sub-right">';
      if(sfresh){
        html += '<span class="sr-rate" style="color:var(--text-tertiary)">未做</span>';
      } else {
        html += '<span class="sr-rate '+src+'">'+sr+'%</span>';
      }
      html += '<span class="sub-arrow">▸</span>';
      html += '</div>';
      html += '</div>'; // sub-item
      // 二级进度条
      if(!sfresh){
        var spct = Math.round(sub.done/sub.total*100);
        html += '<div class="sub-progress"><div class="sub-progress-inner" style="width:'+spct+'%"></div></div>';
      }
      // 三级
      html += '<div class="l3-list"><div class="l3-inner">';
      sub.level3.forEach(function(l3){
        var l3r = rateOf(l3.done, l3.right);
        var l3c = rateClass(l3r);
        var l3todo = todoOf(l3.total, l3.done);
        var l3fresh = l3.done===0;
        html += '<div class="l3-block">';
        html += '<div class="l3-item" onclick="toggleL3(this)">';
        html += '<span class="l3-arrow">▸</span>';
        html += '<span class="l3-title">'+l3.name+'</span>';
        html += '<span class="l3-right">';
        if(l3fresh){
          html += '<span class="l3-todo">未做 '+l3todo+'</span>';
        } else {
          html += '<span>已做 '+l3.done+'/'+l3.total+'</span>';
          html += '<span class="l3-rate '+l3c+'">正确 '+l3r+'%</span>';
          if(l3todo>0) html += '<span class="l3-todo">未做 '+l3todo+'</span>';
        }
        html += '</span>';
        // 「再刷」按钮：点击进做题页刷该主题
        var rebtnClass = l3fresh ? 'rebtn todo' : 'rebtn';
        var rebtnText = l3fresh ? '开始刷' : '再刷';
        html += '<button class="'+rebtnClass+'" onclick="event.stopPropagation();goQuiz(\'l3\','+ch.id+',\''+escapeName(l3.name)+'\')">'+rebtnText+'</button>';
        html += '</div>'; // l3-item
        // 四级
        html += '<div class="l4-list"><div class="l4-inner">';
        l3.level4.forEach(function(l4){
          var l4r = rateOf(l4.done, l4.right);
          var l4c = rateClass(l4r);
          var l4fresh = l4.done===0;
          var dotClass = l4fresh ? '' : ('done-'+l4c);
          html += '<div class="l4-item" onclick="goQuiz(\'l4\','+ch.id+',\''+escapeName(l4.name)+'\')">';
          html += '<span class="l4-dot '+dotClass+'"></span>';
          html += '<span class="l4-title">'+l4.name+'</span>';
          html += '<span class="l4-right">';
          if(l4fresh){
            html += '<span class="l4-todo">'+l4.total+'题·未做</span>';
          } else {
            html += '<span>'+l4.total+'题</span>';
            html += '<span class="l4-rate '+l4c+'">正确 '+l4r+'%</span>';
          }
          html += '</span>';
          html += '</div>'; // l4-item
        });
        html += '</div></div>'; // l4-inner / l4-list
        html += '</div>'; // l3-block
      });
      html += '</div></div>'; // l3-inner / l3-list
      html += '</div>'; // sub-container
    });
    html += '</div></div>'; // sub-inner / sub-list
    html += '</div>'; // chapter-card
  });
  list.innerHTML = html;
  updateChipCounts();
}

function escapeName(s){ return s.replace(/'/g,"\\'"); }

/* ===== 展开/收起（CSS class 控 max-height，展开态 9999px 不被父级卡，嵌套级联自动） ===== */
function toggleChapter(head){
  head.parentNode.classList.toggle('open');
}
function toggleSub(item){
  /* sub-item 与 l3-list 同为 sub-container 子级；在 sub-item 上 toggle，CSS 用兄弟选择器命中 l3-list */
  item.classList.toggle('open-l2');
}
function toggleL3(item){
  /* l4-list 是 l3-item 的兄弟（同在 l3-block 内）；l3-item.toggle .open */
  item.classList.toggle('open');
}

/* ===== 筛选 ===== */
function setFilter(f){
  currentFilter = f;
  document.querySelectorAll('.chip').forEach(function(c){
    c.classList.toggle('active', c.dataset.filter===f);
  });
  renderChapters();
}
function updateChipCounts(){
  var todoChap = 0, wrongChap = 0;
  CHAPTERS.forEach(function(ch){
    if(todoOf(ch.total, ch.done)>0) todoChap++;
    if(ch.wrong>0) wrongChap++;
  });
  document.getElementById('cntTodo').textContent = todoChap? '('+todoChap+')' : '';
  document.getElementById('cntWrong').textContent = wrongChap? '('+wrongChap+')' : '';
}

/* ===== 进入做题页 =====
   向总壳请求打开做题层，entry=chapter，附带选中的层级路径（章id+考点名）
   总壳 openPractice 接 entry；做题页 v5.0 接数据层时按路径取题 */
function goQuiz(level, cid, name){
  try {
    window.parent.postMessage({ type:'REQ_PRACTICE', data:{ entry:'chapter', level:level, cid:cid, name:name } }, '*');
  } catch(e){
    showToast('请从总壳进入开始刷题');
  }
}

/* ===== 返回：通知题库首页收起章节层（保留展开状态） ===== */
function goBack(){
  try {
    window.parent.postMessage({ type:'CLOSE_CHAPTER' }, '*');
  } catch(e){
    showToast('请从总壳返回');
  }
}

/* ===== Toast ===== */
var toastTimer = null;
function showToast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.style.opacity = 0; }, 1500);
}

/* ===== 初始化 ===== */
renderChapters();
</script>
</body>
</html>
