<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>章节刷题</title>
<style>
/* ==== Product Theme：蓝靛 #5B72F5（与题库首页统一，2026-08-31） ====
   章节刷题页：题库首页「章节刷题」入口下钻二级页
   结构：左侧一级章导航（16-18%宽，短名，独立滚动） + 右侧当前章四级内容
   交互：二级/三级手风琴单开（同级只允许一个展开）；二级展开同时显示三四级；切一级自动重置
   数据：刷题指标（已做/正确率/错题/未做），与闪卡章节页（记忆度）口径分离
   图标：10 章各一色渐变（题库首页 entry-icon 调子另出一套，不复用闪卡） */
:root{
  --primary: #5B72F5;
  --primary-dark: #4358D7;
  --primary-light: #EEF1FF;
  --brand-mid: #4358D7;
  --brand-teal: #3FA98B;
  --accent-grad-end: #62CFA9;
  --text-primary: #1E2130;
  --text-secondary: #6E778B;
  --text-tertiary: #98A0B2;
  --success: #20A866;
  --success-light: #E8F8F0;
  --warning: #F28B3D;
  --warning-light: #FFF1E6;
  --danger: #EF4444;
  --danger-light: #FEECEC;
  --card-radius: 17px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; scrollbar-width: none; }
*::-webkit-scrollbar { display: none; width: 0; height: 0; } /* 全页隐藏滚动条但保留滚动（PM 2026-09-02 拍板） */
html, body { width: 100%; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text-primary);
  background-color: #EDEFF7;
  display: flex; flex-direction: column; height: 100%; overflow: hidden;
  -webkit-overflow-scrolling: touch;
}

/* ===== 左右分栏主体（页面内无顶栏，标题/退出在小程序栏 appbar；顶部留小程序栏间距） ===== */
.split-body {
  flex: 1; display: flex;
  padding: 8px 0 0;
  min-height: 0;
  overflow: hidden;
}

/* ===== 左侧：一级章节导航 + 我的上传（宽 16-18%，短名，独立滚，无数据/进度） ===== */
.lv-nav {
  width: 18%; min-width: 76px;
  flex-shrink: 0;
  background: #fff;
  border-radius: 0 14px 14px 0;
  overflow-y: auto; overflow-x: hidden;   /* 左栏独立滚动 */
  padding: 6px 0 14px;
}
.lv-nav-inner { display: flex; flex-direction: column; }
.lv-item {
  position: relative;
  padding: 14px 9px;
  font-size: 12px; font-weight: 600; line-height: 1.4;
  color: var(--text-secondary);
  text-align: center;
  cursor: pointer;
  -webkit-user-select: none; user-select: none;
  transition: background .15s ease, color .15s ease;
}
.lv-item:active { background: var(--primary-light); }
.lv-item.active {
  background: #EDEFF7;
  color: var(--primary-dark);
  font-weight: 800;
}
/* 选中态左侧色条 */
.lv-item.active::before {
  content: ''; position: absolute; left: 0; top: 8px; bottom: 8px;
  width: 3.5px; border-radius: 0 4px 4px 0;
  background: var(--primary);
}
/* 我的上传：左栏底部独立入口，与章节分隔线隔开
   无图标，文字短名槽位；选中态样式复用 .lv-item.active */
.lv-divider {
  height: 1px; margin: 8px 14px; background: #EEF0F7;
}
.lv-upload {
  display: flex; align-items: center; justify-content: center;
  gap: 6px;
  margin: 2px 10px;
  padding: 12px 8px;
  font-size: 12px; font-weight: 600; color: var(--text-secondary);
  border-radius: 10px;
  cursor: pointer;
  transition: background .15s ease;
  -webkit-user-select: none; user-select: none;
}
.lv-upload:active { background: #F2F3F8; }
.lv-upload svg {
  width: 14px; height: 14px;
  fill: none; stroke: currentColor; stroke-width: 2;
}
.lv-upload.active { background: var(--primary-light); color: var(--primary-dark); font-weight: 700; }

/* ===== 右侧：当前章内容（独立滚动 + 展开动效） ===== */
.lv-content {
  flex: 1; min-width: 0;
  overflow-y: auto; overflow-x: hidden;
  height: 100%;
  padding: 8px 12px 24px;
  background: #EDEFF7;
}
.base-card {
  background: #fff;
  border-radius: var(--card-radius);
  box-shadow: 0 1px 2px rgba(38,48,96,.04), 0 6px 16px rgba(91,114,245,.06);
  padding: 14px 15px;
}

/* ===== 章头部：全名+数据+展开/收起 ===== */
.ch-head { border-bottom: 1px solid #F0F1F7; }
.ch-title-row { display: flex; align-items: center; gap: 10px; }
.ch-name {
  flex: 1; min-width: 0;
  font-size: 16px; font-weight: 800; color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  cursor: pointer;   /* PM 2026-09-02：点章名直接进章级答题（与二/三/四级标题一致） */
}
.ch-name:hover { color: var(--primary); }
.ch-collapse {
  flex-shrink: 0;
  font-size: 11px; font-weight: 600; color: var(--primary);
  background: var(--primary-light);
  border-radius: 999px; padding: 5px 11px;
  cursor: pointer;
  transition: background .15s ease;
}
.ch-collapse:active { background: rgba(91,114,245,.18); }
.ch-metrics {
  margin-top: 9px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  font-size: 11.5px; color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
}
/* 考题标签数字统一主题蓝（PM 2026-09-05）：已做/正确率/错 的数值用主色，前缀说明文字保持弱灰 */
.ch-metrics .m-done strong, .ch-metrics .m-rate b, .ch-metrics .m-wrong strong { color: var(--primary); font-weight: 800; }
.ch-metrics .fresh-tag {
  font-size: 10.5px; color: var(--primary); font-weight: 700;
  background: var(--primary-light); padding: 2px 8px; border-radius: 6px;
}
/* 章进度条（未做整章不显示） */
.ch-progress { margin-top: 10px; height: 4px; border-radius: 10px; background: #E7EAF3; overflow: hidden; }
.ch-progress-inner {
  width: 0; height: 100%; border-radius: inherit;
  background: linear-gradient(90deg, var(--primary), var(--brand-teal));
  transition: width .9s cubic-bezier(.22,.61,.36,1);
}

/* ===== 二级：节 ===== */
.ch-body { padding-top: 10px; display: flex; flex-direction: column; }
.sub-row {
  display: flex; align-items: center; gap: 9px;
  min-height: 48px;
  margin-bottom: 8px;
  padding: 0 12px;
  border: 1px solid rgba(103,116,141,.12);
  border-radius: 12px;
  background: #fff;
  transition: background .12s ease;
  box-shadow: 0 1px 2px rgba(38,48,96,.03);
}
.sub-row:active { background: rgba(91,114,245,.045); }
/* 二级行标题前原主题蓝圆点已改为浅灰上下展开箭头（PM 2026-09-05） */
.sub-title {
  flex: 1; min-width: 0;
  font-size: 13px; font-weight: 600; color: var(--primary-dark);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  cursor: pointer;   /* 点标题 → 进二级刷题 */
}
.sub-rate { font-size: 11px; font-weight: 600; color: var(--text-tertiary); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.sub-rate b { color: var(--primary); font-weight: 800; }   /* 正确率数值主题蓝 */
/* 二级行首展开按钮（PM 2026-09-05：唯一展开入口，浅灰上下箭头，独立热区） */
.sub-arrow {
  flex-shrink: 0;
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: #B9C0CE;  /* 淡灰，弱化 */
  cursor: pointer;
  transition: color .15s ease;
}
.sub-arrow:hover { color: var(--primary); }
.sub-arrow:active { color: var(--primary-dark); }
/* 有任一二级展开时，未展开的二级压缩距+与展开卡连排（无展开二级不相连时各自有下圆角） */
.sub-row.flat { margin-bottom: 0; border-radius: 12px 12px 0 0; border-bottom-color: #F0F1F7; }

/* ===== 三级 + 四级：二级展开后同时出现（三级行+四级考点列表同卡片） ===== */
.lv3-root {
  display: none;
  margin-bottom: 8px;
  border: 1px solid rgba(91,114,245,.10);
  border-radius: 0 0 12px 12px;
  background: #fff;
  padding: 10px 10px 8px;
}
.sub-row.open + .lv3-root { display: block; }   /* 二级展开 → 同级随后卡片显示三四级 */
.lv3-list { display: flex; flex-direction: column; }
.lv3-row {
  display: flex; align-items: center; gap: 7px;
  min-height: 34px;   /* 2026-09-02 PM：三级行距压缩，行更紧凑 */
  padding: 0 9px;
  border-radius: 10px;
  transition: background .12s ease;
}
.lv3-row:active { background: rgba(91,114,245,.05); }
/* 三级行左侧展开按钮（轻量：无底色小灰箭头，独立热区） */
.lv3-row .pick {
  flex-shrink: 0;
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #B9C0CE;  /* 淡灰，弱化 */
  cursor: pointer;
  transition: color .15s ease;
}
.lv3-row .pick:hover { color: var(--primary); }
.lv3-row .pick:active { color: var(--primary-dark); }
.lv3-row.open .pick { transform: none; }   /* 收起/展开用 ⌃/▸ 符号切换，不旋转 */
.lv3-title {
  flex: 1; min-width: 0;
  font-size: 12.5px; font-weight: 600; color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  cursor: pointer;   /* 点标题 → 进三级刷题 */
}
.lv3-meta { flex-shrink: 0; display: flex; align-items: baseline; gap: 5px; font-size: 10.5px; font-variant-numeric: tabular-nums; color: var(--text-tertiary); }
.lv3-meta .m-done { color: var(--primary); font-weight: 800; }   /* 已做 X/Y 数字主题蓝 */
.lv3-meta .m-rate b { color: var(--primary); font-weight: 800; }   /* 正确率数值主题蓝 */
.lv3-meta .m-stubborn {
  color: #CF1322; font-weight: 800; font-size: 10px;
  background: #FFF1F0; padding: 2px 6px; border-radius: 5px;
}

/* 四级：考点列表（无展开，整行点击即刷） */
.lv4-list { display: flex; flex-direction: column; gap: 6px; }
.lv4-list.hidden { display: none; }
.lv4-row {
  display: flex; align-items: center; gap: 7px;
  height: 38px;
  padding: 0 11px;
  border: 1px solid rgba(103,116,141,.12);
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
  transition: background .12s ease;
}
.lv4-row:active { background: rgba(91,114,245,.045); }
/* 四级无箭头：整行点击即刷（PM 2026-09-02 拍板取消） */
.lv4-title {
  flex: 1; min-width: 0;
  font-size: 11.5px; font-weight: 500; color: #68748D;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lv4-meta { flex-shrink: 0; display: flex; align-items: center; gap: 8px; font-size: 10.5px; font-variant-numeric: tabular-nums; color: var(--text-tertiary); }
.lv4-meta .m-total { color: var(--text-tertiary); }
.lv4-meta .m-ok { color: var(--success); font-weight: 800; font-size: 11px; }
.lv4-meta .m-no { color: var(--danger); font-weight: 800; font-size: 11px; }

/* ===== 我的上传（搜题导入） ===== */
.upload-section { border-top: 1px solid #F0F1F7; margin-top: 14px; padding-top: 12px; }
.upload-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.upload-title { font-size: 14px; font-weight: 700; }
.upload-tip { font-size: 11px; color: var(--text-tertiary); }
.up-card {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 11px 0;
  border-top: 1px solid #F0F1F7;
}
.up-card:first-of-type { border-top: none; }
.up-thumb {
  width: 44px; height: 44px; border-radius: 9px; flex-shrink: 0;
  background: #F3F5FC; border: 1px dashed #C7CEE4;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-tertiary); font-size: 18px;
}
.up-thumb.has-img { border-style: solid; border-color: #C7CEE4; background: linear-gradient(135deg, #E9ECF6, #F3F5FC); color: var(--primary); }
.up-thumb.has-img svg { width: 22px; height: 22px; }
.up-body { flex: 1; min-width: 0; }
.up-title {
  font-size: 12.5px; line-height: 1.45; font-weight: 500;
  color: var(--text-primary);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.up-ocr-tip { font-size: 11px; color: var(--text-tertiary); font-weight: 500; }
.up-meta { margin-top: 5px; display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--text-tertiary); }
.up-meta .tag-pill { font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 600; background: #E9F7F3; color: var(--brand-teal); }
/* 题型标签：蓝系，传达「题库类型」而非来源/概念 */
.up-meta .tag-pill.type { background: #E8F3FF; color: #2F6FED; }
.up-meta .tag-pill.img-tag { background: #F3F0FF; color: #7C6BD9; cursor: pointer; }
.up-btn {
  flex-shrink: 0; height: 28px; padding: 0 13px; border-radius: 14px;
  background: var(--primary); color: #fff; border: none;
  font-size: 11.5px; font-weight: 600; cursor: pointer;
}
.up-btn:active { transform: scale(.95); }

/* ===== Toast ===== */
.toast {
  position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%);
  background: rgba(30,33,48,.92); color: #fff;
  padding: 9px 18px; border-radius: 22px; font-size: 13px;
  opacity: 0; transition: opacity .25s ease; z-index: 999;
  pointer-events: none; white-space: nowrap;
}
</style>
</head>

<!-- 左右分栏：左侧一级章节导航 + 右侧当前章四级内容（标题/退出在小程序栏 appbar） -->
<div class="split-body">
  <!-- 一级导航：短名，独立滚动，无数据/进度 -->
  <nav class="lv-nav" id="lvNav"></nav>

  <!-- 右侧当前章内容 -->
  <div class="lv-content" id="lvContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   章节刷题数据（mock，演示期）
   结构与闪卡 CHAPTERS 对齐：章 subs[] → 节 level3[] → 主题 level4[] → 考点
   字段口径（刷题场景，与闪卡记忆度分离）：
     total   该级总题数
     done    已做题数
     right   答对题数（算正确率 = right/done）
     wrong   答错题数（done=right+wrong+空答，演示简化 wrong=done-right）
     todo    未做题数 = total - done
     rate    正确率 = done? right/done : null
   考题标签数字统一主题蓝（PM 2026-09-05），未做显示「未做」灰态
   ============================================================ */

/* ===== 「我的上传」搜题数据（source=upload）
   预设 U01 演示；错题本页面搜题模式保存的题目经 localStorage 中转，
   页面加载时读取合并（key: zsb_share_uploads_v1，qid 前缀 S）。
   点击「去刷」→ 进做题页 entry=upload，qid 定位该题 */
var SHARE_DATA = {
  uploads: [
    { qid:'U01', source:'upload', mode:'text', path:'我的上传 → 拍照录入', type:'single',
      title:'以下选项中，Excel 中可以进行单元格引用的运算符是（ ）。',
      tag:'operation', concept:'Excel 电子表格', createdAt:'2026-08-31 15:20' }
  ]
};
(function(){
  try {
    var arr = JSON.parse(localStorage.getItem('zsb_share_uploads_v1') || '[]');
    if (arr.length) SHARE_DATA.uploads = arr.concat(SHARE_DATA.uploads);
  } catch(e) {}
})();
/* 渲染前重读 localStorage 合并（跨页最终一致）：拍照搜题页保存后本页能立即看到。
   以 localStorage 为准 + 保留 seed（U01 演示）；按 qid 去重防止重复渲染 */
function syncUploads() {
  try {
    var arr = JSON.parse(localStorage.getItem('zsb_share_uploads_v1') || '[]');
    if (arr.length) {
      var seed = SHARE_DATA.uploads.filter(function(u) {
        return arr.every(function(a) { return a.qid !== u.qid; });
      });
      SHARE_DATA.uploads = arr.concat(seed);
    }
  } catch(e) {}
}

var CHAPTERS = [

      { name:"信息与信息技术概述", total:24, done:20, right:16, wrong:4,

              { name:"信息技术", total:4, done:4, right:3, wrong:1 },
              { name:"信息社会", total:4, done:3, right:3, wrong:0 },
              { name:"计算机文化", total:4, done:3, right:2, wrong:1 },

            ]}
        ]},

            ]},
          { name:"计算机的应用领域及发展趋势", total:10, done:7, right:5, wrong:2,
            level4:[
              { name:"计算机的应用领域", total:5, done:4, right:3, wrong:1 },

            ]}
        ]},
      { name:"计算机数制与编码概述", total:36, done:28, right:20, wrong:8,

          { name:"数制及其转换", total:12, done:10, right:7, wrong:3,

function rateOf(done, right){ return done ? Math.round(right/done*100) : null; }
function rateText(r){ return r===null ? '未做' : r+'%'; }
function todoOf(total, done){ return total - done; }

/* 汇总下级指标（父级聚合用） */
function aggregate(items){
  var t=0,d=0,r=0,w=0;
  items.forEach(function(it){
    t+=it.total; d+=it.done; r+=it.right; w+=it.wrong;
    if(it.level3) { var s=aggregate(it.level3); }
    if(it.level4) { var s2=aggregate(it.level4); }
  });
  return {total:t, done:d, right:r, wrong:w};
}

/* ===== 渲染 ===== */
var currentChapter = 0;              // 当前一级章节 index（初始第 1 章）
var showUpload = false;              // 当前是否处于「我的上传」视图（左栏底部入口）
/* 手风琴展开状态（同级只允许一个展开，见核心交互规则）：
   openSub：当前章内展开的二级 index（null=全部收起）
   openL3：该二级下展开的三级 index（null=全部收起）
   二级点击 → 二/三/四级同时出现；三级点击 → 四级 */
var openSub = null, openL3 = null;

/* 左侧一级章节短名映射（左栏只放短名+图标，不放数据/进度） */
function shortName(name){
  var map = {
    '信息与计算机基础知识':'信计', '计算思维':'计思', '操作系统（Windows 10）':'Win10',
    '文档处理（Word 2016）':'Word2016', '电子表格处理（Excel 2016）':'Excel2016',
    '演示文稿制作（PowerPoint 2016）':'PPT', '数据库技术':'数据库', '计算机网络与信息检索':'网络检索',
    '信息安全与社会责任':'信息安全', '新一代信息技术':'信息技术'
  };
  return map[name] || name;
}

/* ===== 左侧导航（独立滚动）：一级章节短名 + 底部「我的上传」入口 ===== */
function renderNav(){
  var nav = document.getElementById('lvNav');
  var html = '<div class="lv-nav-inner">';
  CHAPTERS.forEach(function(ch, idx){
    /* 左栏只展示文字短名（无图标，规格：不要在左侧展示题量/正确率/进度）；当前选中高亮 */
    html += '<div class="lv-item'+(idx===currentChapter && !showUpload?' active':'')+'"'
      + ' data-cix="'+idx+'" onclick="switchChapter('+idx+')">'
      + '<span>'+shortName(ch.name)+'</span>'
      + '</div>';
  });
  /* 我的上传：左栏底部独立入口（分隔线隔开），点击右侧切到上传列表 */
  html += '<div class="lv-divider"></div>'
    + '<div class="lv-upload'+(showUpload?' active':'')+'" onclick="switchUpload()">'
    + '<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="5 12 12 5 19 12"/></svg>'
    + '<span>我的上传</span>'
    + '</div>';
  html += '</div>';
  nav.innerHTML = html;
}

/* ===== 切换一级章节：重置开合状态，右侧重渲染 ===== */
function switchChapter(idx){
  showUpload = false;
  currentChapter = idx;
  openSub = null; openL3 = null;
  renderNav();
  renderContent();
  document.getElementById('lvContent').scrollTop = 0;
}

/* ===== 我的上传视图：左栏底部入口点击 → 右侧切到上传题列表 ===== */
function switchUpload(){
  showUpload = true;
  renderNav();
  renderUpload();
  document.getElementById('lvContent').scrollTop = 0;
}

function renderUpload(){
  var box = document.getElementById('lvContent');
  syncUploads();
  var ups = SHARE_DATA.uploads || [];
  var html = '<div class="base-card ch-head">'
    + '<div class="ch-title-row"><span class="ch-name">我的上传</span></div>'
    + '<div class="ch-metrics"><span class="m-done">共 <strong>'+ups.length+'</strong> 道</span></div>'
    + '</div>';
  if(ups.length){
    html += '<div class="base-card" style="margin-top:10px;padding:6px 15px 10px;">';
    ups.forEach(function(q){ html += uploadCard(q); });
    html += '</div>';
  } else {
    html += '<div class="base-card" style="text-align:center;color:var(--text-tertiary);font-size:12.5px;padding:28px 0;">'
      + '暂无上传题目<br>在拍照搜题中保存题目后会出现在这里</div>';
  }
  box.innerHTML = html;
}

/* ===== 右侧当前章四级内容 ===== */
function renderContent(){
  var box = document.getElementById('lvContent');
  var ch = CHAPTERS[currentChapter];
  if(!ch){ box.innerHTML = ''; return; }

  var r = rateOf(ch.done, ch.right);
  var fresh = ch.fresh || ch.done===0;
  var html = '';

  /* 章头部：全名（点进章级答题）+ 数据 + 展开/收起 + 进度条 */
  html += '<div class="base-card ch-head">';
  html += '<div class="ch-title-row">'
    + '<span class="ch-name" onclick="goQuiz(\'l1\','+ch.id+',\''+escapeName(ch.name)+'\')" title="开始本章练习">'+ch.name+'</span>'
    + '<span class="ch-collapse" onclick="collapseAll()">'+(openSub===null?'展开':'收起')+'</span>'
    + '</div>';
  html += '<div class="ch-metrics">';
  html += '<span class="m-done">已做 <strong>'+ch.done+'/'+ch.total+'</strong></span>';
  if(fresh){
    html += '<span class="fresh-tag">未练习</span>';
  } else {
    html += '<span class="m-rate">正确率 <b>'+r+'%</b></span>';
    if(ch.wrong>0) html += '<span class="m-wrong">错 <strong>'+ch.wrong+'</strong></span>';
  }
  html += '</div>';
  if(!fresh){
    var pct = Math.round(ch.done/ch.total*100);
    html += '<div class="ch-progress"><div class="ch-progress-inner" style="width:'+pct+'%"></div></div>';
  }
  html += '</div>'; // ch-head

  /* 二级 → 三级 → 四级（手风琴单开）
     二级：点标题→进练习；点行首上下箭头（唯一展开入口）→ 展开，三级+四级同时出现
     三级：点标题→进练习；点左侧▸ → 展开四级考点
     展开二级默认展开第一个三级（联动出四级，见核心交互） */
  html += '<div class="base-card ch-body">';
  var openingIndex = (openSub!==null);   // 当前章是否有任一二级展开中（用来让未展开二级 flat 连排）
  ch.subs.forEach(function(sub, si){
    var sr = rateOf(sub.done, sub.right);
    var sfresh = sub.done===0;
    var isOpen = (openSub===si);
    /* 二级行：标题点击 → 进二级练习；行首上下箭头（唯一展开入口）→ 展开三级+四级（PM 2026-09-05） */
    html += '<div class="sub-row' + (isOpen?' open':'') + (openingIndex?' flat':'') + '">'
      + '<span class="sub-arrow" onclick="toggleSub('+si+')">'+(isOpen?'⌃':'⌄')+'</span>'
      + '<span class="sub-title" onclick="goQuiz(\'l2\','+ch.id+',\''+escapeName(sub.name)+'\')">'+sub.name+'</span>'
      + (sfresh ? '<span class="sub-rate void">未做</span>'
                : '<span class="sub-rate">正确率 <b>'+sr+'%</b></span>')
      + '</div>';

    /* 展开态卡片：三级列表 + 四级考点（同时出现） */
    html += '<div class="lv3-root">';
    html += '<div class="lv3-list">';
    sub.level3.forEach(function(l3, li){
      var l3r = rateOf(l3.done, l3.right);
      var l3fresh = l3.done===0;
      var l3Stubborn = !l3fresh && l3.total>0 && (l3.wrong/l3.total>=0.5);
      var isL3Open = (openL3===li);
      /* 三级行：标题点击 → 进三级练习；左侧展开箭头 → 展开/收起四级（单开） */
      html += '<div class="lv3-row'+(isL3Open?' open':'')+'">'
        + '<span class="pick" onclick="toggleL3('+si+','+li+')">'+(isL3Open?'⌃':'▸')+'</span>'
        + '<span class="lv3-title" onclick="goQuiz(\'l3\','+ch.id+',\''+escapeName(l3.name)+'\')">'+l3.name+'</span>'
        + '<span class="lv3-meta">'
        + (l3fresh ? '<span>未做</span>'
                   : '<span class="m-done">'+l3.done+'/'+l3.total+'</span>'
                      + '<span class="m-rate">正确率 <b>'+l3r+'%</b></span>')
        + (l3Stubborn ? '<span class="m-stubborn">顽固</span>' : '')
        + '</span>'
        + '</div>';

      /* 四级考点：整行点击直接刷；不再继续展开；四级不再标顽固（2026-09-02 PM：顽固仅考点级=三级标题） */
      html += '<div class="lv4-list'+(isL3Open?'':' hidden')+'">';
      l3.level4.forEach(function(l4){
        var l4fresh = l4.done===0;
        html += '<div class="lv4-row" onclick="goQuiz(\'l4\','+ch.id+',\''+escapeName(l4.name)+'\')">'
          + '<span class="lv4-title">'+l4.name+'</span>'
          + '<span class="lv4-meta">'
          + (l4fresh ? '<span class="m-total">'+l4.total+'题·未做</span>'
                     : (l4.right>0 ? '<span class="m-ok">✔ '+l4.right+'</span>' : '')
                        + (l4.wrong>0 ? '<span class="m-no">✖ '+l4.wrong+'</span>' : ''))
          + '</span>'
          + '</div>';
      });
      html += '</div>'; // lv4-list
    });
    html += '</div></div>'; // lv3-list / lv3-root
  });
  html += '</div>'; // ch-body
  box.innerHTML = html;
}

/* ===== 手风琴单开（核心交互规则：同级只允许一个展开） =====
   二级：同一章下同时只展开一个二级 → 展开该二下的三级+四级
   三级：同一二级下同时只展开一个三级 → 展开该三下的四级
   切一级章节时 openSub/openL3 全重置（见 switchChapter）
   PM 拍板：展开二级默认展开它的第一个三级（连带四级），保证「三级和四级同时出现」 */
function toggleSub(si){
  openSub = (openSub===si) ? null : si;   // 再点已展开项 → 收起
  if(openSub!==null){
    /* 展开二级默认展开第一个三级（只要有三级） */
    var ch = CHAPTERS[currentChapter];
    var sub = ch && ch.subs[si];
    openL3 = (sub && sub.level3 && sub.level3.length) ? 0 : null;
  } else {
    openL3 = null;
  }
  renderContent();
}
function toggleL3(si, li){
  if(openSub!==si) openSub = si;
  openL3 = (openL3===li) ? null : li;
  renderContent();
}
/* 章头「展开/收起」：全部展开（二级单开=第0个二级，联动其第一个三级） 或 全部收起 */
function collapseAll(){
  if(openSub===null){
    openSub = 0;
    var ch = CHAPTERS[currentChapter];
    openL3 = (ch && ch.subs[0] && ch.subs[0].level3 && ch.subs[0].level3.length) ? 0 : null;
  } else {
    openSub = null; openL3 = null;
  }
  renderContent();
}

/* 「我的上传」卡片渲染：meta 显示题型；关联原图缩略（PM 2026-09-03） */
var TYPE_NAME = { single:'单选', multi:'多选', judge:'判断', fill:'填空', image:'图片题' };
function uploadCard(q) {
  var hasImg = !!q.img;
  var body = (q.mode === 'image')
    ? '<div class="up-ocr-tip">OCR 未识别 · 图片题</div>'
    : '<div class="up-title">' + (q.title || '') + '</div>';
  var type = TYPE_NAME[q.type] || '单选';
  var metaHtml = '<span class="tag-pill type">' + type + '</span>'
    + (hasImg ? '<span class="tag-pill img-tag" onclick="event.stopPropagation();alert(\'查看原图（演示）\')">📷 原图</span>' : '');
  return '<div class="up-card" data-qid="' + q.qid + '">'
    + '<div class="up-thumb' + (hasImg ? ' has-img' : '') + '">'
    + (hasImg ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>' : (q.mode === 'image' ? '📷' : '📄'))
    + '</div>'
    + '<div class="up-body">' + body
    +   '<div class="up-meta">' + metaHtml + '</div>'
    + '</div>'
    + '<button class="up-btn" onclick="goUpload(\'' + q.qid + '\')">去刷</button>'
    + '</div>';
}

function escapeName(s){ return s.replace(/'/g,"\\'"); }

/* ===== 搜题导入题：去刷 ===== */
function goUpload(qid){
  try {
    window.parent.postMessage({ type:'REQ_PRACTICE', data:{ entry:'upload', qid: qid || '', name:'我的上传 · 已搜题目' } }, '*');
  } catch(e){
    showToast('请从总壳进入，开始刷题');
  }
}

/* ===== 进入做题页 =====
   向总壳请求打开做题层，entry=chapter，附带选中的层级路径（章id+考点名）
   总壳 openPractice 接 entry；做题页 v5.0 接数据层时按路径取题 */
function goQuiz(level, cid, name){
  try {
    window.parent.postMessage({ type:'REQ_PRACTICE', data:{ entry:'chapter', level:level, cid:cid, name:name } }, '*');
  } catch(e){
    showToast('请从总壳进入开始刷题');
  }
}

/* ===== 返回：通知题库首页收起章节层（保留展开状态） ===== */
function goBack(){
  try {
    window.parent.postMessage({ type:'CLOSE_CHAPTER' }, '*');
  } catch(e){
    showToast('请从总壳返回');
  }
}

/* ===== Toast ===== */
var toastTimer = null;
function showToast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.style.opacity = 0; }, 1500);
}

/* ===== 初始化 ===== */
renderNav();
renderContent();
</script>
