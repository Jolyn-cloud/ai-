<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>章节统计 - 专升本学习</title>

<style>
  :root{
    --primary: #5B72F5;
    --primary-dark: #4358D7;
    --primary-light: #EEF1FF;

    --bg-top: #E7EFFF;
    --bg-middle: #F3F4FF;
    --bg-bottom: #F8F9FC;

    --text-primary: #202533;
    --text-secondary: #6E778B;
    --text-tertiary: #98A0B2;

    --success: #20A866;
    --danger: #EF4444;
    --warning: #F28B3D;

    --card-radius: 17px;
    --hero-radius: 22px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: var(--text-primary);
    background: var(--bg-bottom);
  }

  body { display: flex; justify-content: center; }

  /* ========================= 页面 =========================
     章节统计页使用独立的淡紫渐变背景（不使用统一背景图） */
  .page {
    position: relative;
    width: 100%;
    max-width: 430px;
    height: 100vh;
    overflow: hidden;
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, #E9E7F8 0%, #EDEBFA 30%, #F2F1FB 65%, #F5F5FC 100%);
    background-color: #F5F5FC;
  }

  /* ========================= 手机壳：桌面端固定手机比例居中 ========================= */
  @media (min-width: 481px) {
    html, body { height: 100%; overflow: hidden; }
    body {
      align-items: center;
      background: linear-gradient(150deg, #E3E5F1 0%, #ECEEF6 55%, #E6E8F2 100%);
    }
    .page {
      width: 390px;
      height: min(844px, calc(100vh - 44px));
      border-radius: 34px;
      box-shadow:
        0 0 0 9px #1E2130,
        0 0 0 11px rgba(255,255,255,0.65),
        0 30px 80px rgba(30,33,48,0.38);
    }
  }

  .content {
    position: relative;
    z-index: 2;
    flex: 1; min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 0 18px 34px;
  }
  .content::-webkit-scrollbar { display: none; }

  /* ========================= 顶部导航 ========================= */
  .navbar {
    padding-top: 48px;
    padding-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .back-btn {
    width: 36px; height: 36px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.75);
    box-shadow: 0 2px 8px rgba(54,66,108,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform .1s ease;
  }
  .back-btn:active { transform: scale(.92); }
  .back-btn svg { width: 20px; height: 20px; stroke: var(--text-primary); }
  .nav-title {
    flex: 1;
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ========================= 章节头部卡片 ========================= */
  .chapter-hero {
    margin-top: 6px;
    padding: 20px 18px 18px;
    border-radius: var(--hero-radius);
    background: linear-gradient(135deg, #5572F6 0%, #6178F4 50%, #596CE8 100%);
    box-shadow: 0 14px 32px rgba(76,99,221,0.22);
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .chapter-hero::before {
    content: ""; position: absolute;
    width: 240px; height: 240px;
    top: -130px; right: -50px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.13), rgba(255,255,255,0));
  }
  .chapter-hero > * { position: relative; z-index: 1; }

  .hero-head {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .hero-icon {
    width: 54px; height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    background: rgba(255,255,255,0.18);
    flex-shrink: 0;
  }
  .hero-icon svg { width: 28px; height: 28px; stroke: #fff; }
  .hero-name {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.3;
  }
  .hero-meta {
    margin-top: 5px;
    font-size: 13px;
    color: rgba(255,255,255,0.82);
  }

  .hero-stats {
    margin-top: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .hero-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .hero-cell { text-align: center; }
  .hero-cell .num {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .hero-cell .label {
    margin-top: 2px;
    font-size: 11px;
    color: rgba(255,255,255,0.75);
  }
  .hero-pct {
    font-size: 32px;
    font-weight: 750;
    font-variant-numeric: tabular-nums;
  }

  .hero-progress {
    margin-top: 14px;
    height: 6px;
    border-radius: 10px;
    background: rgba(255,255,255,0.25);
    overflow: hidden;
  }
  .hero-progress-inner {
    height: 100%;
    border-radius: inherit;
    background: rgba(255,255,255,0.95);
    transition: width 1s cubic-bezier(.22,.61,.36,1);
  }

  /* ========================= 树形列表 ========================= */
  .tree-section { margin-top: 22px; }
  .section-title-wrap {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 12px;
  }
  .section-line {
    width: 4px; height: 22px;
    border-radius: 10px;
    background: var(--primary);
  }
  .section-title { font-size: 18px; font-weight: 700; }

  .tree-card {
    border-radius: var(--card-radius);
    background: rgba(255,255,255,0.92);
    box-shadow: 0 5px 18px rgba(54,66,108,0.055);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    overflow: hidden;
  }

  /* ---------- 二级 ---------- */
  .sub2 {
    border-bottom: 1px solid #f1f2f6;
  }
  .sub2:last-child { border-bottom: none; }
  .sub2-head {
    display: flex;
    align-items: center;
    padding: 14px 15px;
    cursor: pointer;
    transition: background .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .sub2-head:active { background: rgba(91,114,245,0.05); }
  .sub2-arrow {
    width: 18px; height: 18px;
    margin-right: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary);
    font-size: 13px;
    transition: transform .25s ease;
    flex-shrink: 0;
  }
  .sub2.open .sub2-arrow { transform: rotate(90deg); }
  .sub2-icon {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--primary);
    margin-right: 11px;
    flex-shrink: 0;
  }
  .sub2-title {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    font-weight: 650;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sub2-right {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-shrink: 0;
    font-size: 12px;
    color: var(--text-tertiary);
    font-variant-numeric: tabular-nums;
  }
  .sub2-right strong { color: var(--success); font-weight: 600; }
  .sub2-right .pct { color: var(--primary); font-weight: 700; }

  /* 可点击标题（进入闪卡） */
  .node-title {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: color .15s ease;
  }
  .node-title:active { color: var(--primary); }
  .sub2-title.node-title:hover,
  .sub3-title.node-title:hover,
  .sub4-title.node-title:hover { color: var(--primary); }
  .sub4.node-title { cursor: pointer; }
  .sub4.node-title:active { background: rgba(91,114,245,0.05); }

  /* ---------- 三级容器 ---------- */
  .sub3-list {
    max-height: 0;
    overflow: hidden;
    transition: max-height .35s ease;
    background: #f9faff;
  }
  .sub2.open .sub3-list { max-height: 3000px; }

  .sub3 {
    border-bottom: 1px solid #f1f2f6;
  }
  .sub3:last-child { border-bottom: none; }
  .sub3-head {
    display: flex;
    align-items: center;
    padding: 12px 15px 12px 44px;
    cursor: pointer;
    transition: background .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .sub3-head:active { background: rgba(91,114,245,0.05); }
  .sub3-arrow {
    width: 16px; height: 16px;
    margin-right: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary);
    font-size: 12px;
    transition: transform .25s ease;
    flex-shrink: 0;
  }
  .sub3.open .sub3-arrow { transform: rotate(90deg); }
  .sub3-title {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sub3-right {
    display: flex;
    align-items: baseline;
    gap: 9px;
    flex-shrink: 0;
    font-size: 12px;
    color: var(--text-tertiary);
    font-variant-numeric: tabular-nums;
  }
  .sub3-right strong { color: var(--success); font-weight: 600; }

  /* ---------- 四级容器 ---------- */
  .sub4-list {
    max-height: 0;
    overflow: hidden;
    transition: max-height .3s ease;
  }
  .sub3.open .sub4-list { max-height: 2000px; }

  .sub4 {
    display: flex;
    align-items: center;
    padding: 11px 15px 11px 70px;
    border-bottom: 1px solid #f1f2f6;
  }
  .sub4:last-child { border-bottom: none; }
  .sub4-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #c8cfdf;
    margin-right: 10px;
    flex-shrink: 0;
  }
  .sub4-title {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sub4-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .sub4-count { color: var(--text-tertiary); }
  .sub4-right span { display: inline-flex; align-items: center; gap: 2px; }
  .sub4-right .ok { color: var(--success); }
  .sub4-right .bad { color: var(--danger); }
  .sub4-right .ok::before, .sub4-right .bad::before {
    content: "";
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    margin-right: 2px;
  }
  .sub4-right .ok::before { background: var(--success); }
  .sub4-right .bad::before { background: var(--danger); }

  /* ---------- 空状态 ---------- */
  .empty-state {
    padding: 34px 20px;
    text-align: center;
    color: var(--text-tertiary);
    font-size: 13px;
  }

  /* ========================= 手机适配 ========================= */
  @media (max-width: 360px) {
    .content { padding-left: 15px; padding-right: 15px; }
    .hero-name { font-size: 18px; }
    .hero-pct { font-size: 28px; }
    .sub2-head { padding: 13px 13px; }
    .sub3-head { padding-left: 38px; }
    .sub4 { padding-left: 60px; }
  }
</style>
</head>

<body>
<div class="page">
  <main class="content">
    <nav class="navbar">
      <button class="back-btn" onclick="history.back()" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <div class="nav-title" id="navTitle">章节统计</div>
    </nav>

    <section class="chapter-hero" id="chapterHero" onclick="goFlash('chapter')" style="cursor:pointer" title="点击开始该章节闪卡">
      <div class="hero-head">
        <div class="hero-icon" id="heroIcon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>
          </svg>
        </div>
        <div>
          <div class="hero-name" id="heroName">--</div>
          <div class="hero-meta" id="heroMeta">--</div>
        </div>
      </div>
      <div class="hero-stats">
        <div class="hero-left">
          <div class="hero-cell"><div class="num" id="heroTotal">0</div><div class="label">总卡片</div></div>
          <div class="hero-cell"><div class="num" id="heroRight">0</div><div class="label">已记住</div></div>
          <div class="hero-cell"><div class="num" id="heroWrong">0</div><div class="label">未记住</div></div>
        </div>
        <div class="hero-pct" id="heroPct">0%</div>
      </div>
      <div class="hero-progress"><div class="hero-progress-inner" id="heroFill" style="width:0%"></div></div>
    </section>

    <section class="tree-section">
      <div class="section-title-wrap">
        <div class="section-line"></div>
        <div class="section-title">章节掌握详情</div>
      </div>
      <div class="tree-card" id="treeCard">
        <div class="empty-state">加载中…</div>
      </div>
    </section>
  </main>
</div>

<script src="闪卡题库.js"></script>
<script>
/* ============================================================
   章节统计页：一级 → 二级 → 三级 topic → 四级 point
   点击二级展开三级，点击三级展开四级，四级显示「N张 ✓对 ✕错」
   ============================================================ */

/* 演示树：信息与计算机基础知识（与首页 CHAPTERS[0] 名称一致） */
const DEMO_TREES = {
  '信息与计算机基础知识': {
    subs: {
      '计算机概述': {
        topics: {
          '计算机的发展与分类': {
            points: {
              'ENIAC诞生年份': { total: 8, right: 6, wrong: 2 },
              '计算机发展四代划分': { total: 12, right: 8, wrong: 4 },
              '电子管计算机': { total: 6, right: 5, wrong: 1 },
              '计算机分类（规模）': { total: 10, right: 7, wrong: 3 }
            }
          },
          '计算机的特点与应用': {
            points: {
              '计算机主要特点': { total: 8, right: 6, wrong: 2 },
              '计算机辅助设计CAD': { total: 6, right: 5, wrong: 1 },
              '计算机辅助制造CAM': { total: 6, right: 4, wrong: 2 },
              'CIMS集成制造系统': { total: 4, right: 2, wrong: 2 }
            }
          }
        }
      },
      '计算机系统组成': {
        topics: {
          '硬件系统': {
            points: {
              'CPU 组成与功能': { total: 10, right: 7, wrong: 3 },
              '存储器分类': { total: 8, right: 5, wrong: 3 }
            }
          },
          '软件系统': {
            points: {
              '系统软件与应用软件': { total: 8, right: 6, wrong: 2 }
            }
          }
        }
      }
    }
  }
};

function getParam(name) {
  var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
  return m ? decodeURIComponent(m[1]) : '';
}

function fmt(n) {
  return Number.isFinite(n) ? n.toLocaleString('en-US') : '0';
}

function safeNum(v) { return Number.isFinite(+v) ? +v : 0; }

function rollUp(node) {
  /* 从四级向上汇总 total/right/wrong */
  node.total = safeNum(node.total);
  node.right = safeNum(node.right);
  node.wrong = safeNum(node.wrong);
  if (node.points) {
    for (var p in node.points) {
      var pn = node.points[p];
      pn.total = safeNum(pn.total); pn.right = safeNum(pn.right); pn.wrong = safeNum(pn.wrong);
      node.total += pn.total; node.right += pn.right; node.wrong += pn.wrong;
    }
  }
  if (node.topics) {
    for (var t in node.topics) {
      rollUp(node.topics[t]);
      node.total += node.topics[t].total;
      node.right += node.topics[t].right;
      node.wrong += node.topics[t].wrong;
    }
  }
  if (node.subs) {
    for (var s in node.subs) {
      rollUp(node.subs[s]);
      node.total += node.subs[s].total;
      node.right += node.subs[s].right;
      node.wrong += node.subs[s].wrong;
    }
  }
  return node;
}

function mergeReal(tree, stats) {
  if (!tree || !stats) return tree;
  if (stats.total) {
    tree.total = safeNum(tree.total) + stats.total;
    tree.right = safeNum(tree.right) + stats.right;
    tree.wrong = safeNum(tree.wrong) + stats.wrong;
  }
  for (var subName in stats.subs) {
    var stat = stats.subs[subName];
    if (tree.subs[subName]) {
      /* 演示树已存在该二级：仅把真实答题数覆盖到对应四级，保留演示结构 */
      mergeNode(tree.subs[subName], stat);
    } else {
      /* 演示树没有该二级：直接追加真实聚合结构 */
      tree.subs[subName] = {
        total: stat.total, right: stat.right, wrong: stat.wrong,
        topics: {}
      };
      for (var topicName in stat.topics) {
        var t = stat.topics[topicName];
        tree.subs[subName].topics[topicName] = {
          total: t.total, right: t.right, wrong: t.wrong,
          points: {}
        };
        for (var pointName in t.points) {
          var p = t.points[pointName];
          tree.subs[subName].topics[topicName].points[pointName] = {
            total: p.total, right: p.right, wrong: p.wrong
          };
        }
      }
    }
  }
  return tree;
}

function mergeNode(node, stat) {
  if (!node || !stat) return;
  for (var topicName in stat.topics) {
    var topicStat = stat.topics[topicName];
    if (!node.topics[topicName]) continue;
    var topicNode = node.topics[topicName];
    for (var pointName in topicStat.points) {
      var pointStat = topicStat.points[pointName];
      if (!topicNode.points[pointName]) continue;
      var pointNode = topicNode.points[pointName];
      pointNode.total = pointStat.total;
      pointNode.right = pointStat.right;
      pointNode.wrong = pointStat.wrong;
    }
  }
}

function buildTreeFromStats(stats) {
  var tree = { total: stats.total, right: stats.right, wrong: stats.wrong, subs: {} };
  for (var subName in stats.subs) {
    var sub = stats.subs[subName];
    tree.subs[subName] = { total: sub.total, right: sub.right, wrong: sub.wrong, topics: {} };
    for (var topicName in sub.topics) {
      var topic = sub.topics[topicName];
      tree.subs[subName].topics[topicName] = { total: topic.total, right: topic.right, wrong: topic.wrong, points: {} };
      for (var pointName in topic.points) {
        var point = topic.points[pointName];
        tree.subs[subName].topics[topicName].points[pointName] = {
          total: point.total, right: point.right, wrong: point.wrong
        };
      }
    }
  }
  return tree;
}

function pct(right, total) {
  return total > 0 ? Math.round(right / total * 100) : 0;
}

function arrowSvg() {
  return '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
}

var pageChapter = '';

function buildFlashUrl(params) {
  var p = [];
  if (params.chapter) p.push('chapter=' + encodeURIComponent(params.chapter));
  if (params.sub) p.push('sub=' + encodeURIComponent(params.sub));
  if (params.topic) p.push('topic=' + encodeURIComponent(params.topic));
  if (params.point) p.push('point=' + encodeURIComponent(params.point));
  return '闪卡单卡模式.html' + (p.length ? '?' + p.join('&') : '');
}

function goFlash(level, sub, topic, point) {
  var params = { chapter: pageChapter };
  if (level === 'sub') params.sub = sub;
  if (level === 'topic') { params.sub = sub; params.topic = topic; }
  if (level === 'point') { params.sub = sub; params.topic = topic; params.point = point; }
  window.location.href = buildFlashUrl(params);
}

function toggleArrow(el) {
  var node = el.parentElement;
  node.classList.toggle('open');
}

function renderTree(tree) {
  rollUp(tree);
  var html = '';
  for (var subName in tree.subs) {
    var sub = tree.subs[subName];
    html += '<div class="sub2">'
      + '<div class="sub2-head">'
      +   '<div class="sub2-arrow" onclick="toggleArrow(this)">' + arrowSvg() + '</div>'
      +   '<div class="sub2-icon"></div>'
      +   '<div class="sub2-title node-title" onclick="goFlash(\'sub\',\'' + subName + '\'); event.stopPropagation();">' + subName + '</div>'
      +   '<div class="sub2-right">'
      +     '<span><strong>' + fmt(sub.right) + '</strong>/' + fmt(sub.total) + '</span>'
      +     '<span class="pct">' + pct(sub.right, sub.total) + '%</span>'
      +   '</div>'
      + '</div>'
      + '<div class="sub3-list">';

    for (var topicName in sub.topics) {
      var topic = sub.topics[topicName];
      html += '<div class="sub3">'
        + '<div class="sub3-head">'
        +   '<div class="sub3-arrow" onclick="toggleArrow(this)">' + arrowSvg() + '</div>'
        +   '<div class="sub3-title node-title" onclick="goFlash(\'topic\',\'' + subName + '\',\'' + topicName + '\'); event.stopPropagation();">' + topicName + '</div>'
        +   '<div class="sub3-right"><span><strong>' + fmt(topic.right) + '</strong>/' + fmt(topic.total) + '</span></div>'
        + '</div>'
        + '<div class="sub4-list">';

      for (var pointName in topic.points) {
        var point = topic.points[pointName];
        html += '<div class="sub4 node-title" onclick="goFlash(\'point\',\'' + subName + '\',\'' + topicName + '\',\'' + pointName + '\')">'
          +   '<div class="sub4-dot"></div>'
          +   '<div class="sub4-title">' + pointName + '</div>'
          +   '<div class="sub4-right">'
          +     '<span class="sub4-count">' + point.total + '张</span>'
          +     '<span class="ok">' + point.right + '</span>'
          +     '<span class="bad">' + point.wrong + '</span>'
          +   '</div>'
          + '</div>';
      }

      html += '</div></div>';
    }

    html += '</div></div>';
  }
  return html || '<div class="empty-state">该章节暂无知识点数据</div>';
}

function toggle(el, cls) {
  var node = el.parentElement;
  node.classList.toggle('open');
}

function loadPage() {
  var chapterName = getParam('chapter') || '信息与计算机基础知识';
  pageChapter = chapterName;
  var state = loadState();
  var stats = getChapterStats(state, chapterName);

  /* 构建树：优先用演示树，再叠加真实答题统计 */
  var tree;
  if (DEMO_TREES[chapterName]) {
    tree = JSON.parse(JSON.stringify(DEMO_TREES[chapterName]));
    mergeReal(tree, stats);
  } else {
    tree = buildTreeFromStats(stats);
  }

  /* 标题 & 头部统计 */
  document.getElementById('navTitle').textContent = chapterName;
  document.getElementById('heroName').textContent = chapterName;
  document.getElementById('heroMeta').textContent = fmt(tree.total) + ' 张 · 已记住 ' + fmt(tree.right) + ' · 未记住 ' + fmt(tree.wrong);
  document.getElementById('heroTotal').textContent = fmt(tree.total);
  document.getElementById('heroRight').textContent = fmt(tree.right);
  document.getElementById('heroWrong').textContent = fmt(tree.wrong);
  var p = pct(tree.right, tree.total);
  document.getElementById('heroPct').textContent = p + '%';
  document.getElementById('heroFill').style.width = p + '%';

  /* 树 */
  document.getElementById('treeCard').innerHTML = renderTree(tree);

  /* 默认展开第一个二级 */
  var firstSub2 = document.querySelector('.sub2');
  if (firstSub2) firstSub2.classList.add('open');
}

loadPage();
</script>
</body>
</html>
