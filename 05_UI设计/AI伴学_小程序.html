<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>山东专升本小程序 · 总壳</title>
<style>
/* ============================================================
   总壳样式：左手机壳 + 右逻辑说明面板
   （小程序框架在手机壳内：状态栏 → 小程序栏 → 功能页 → tabBar；逻辑说明随闪卡视图联动）
   ============================================================ */
:root{
  --primary: #5B72F5;
  --primary-dark: #4358D7;
  --primary-light: #EEF1FF;
  --text-primary: #202533;
  --text-secondary: #6E778B;
  --text-tertiary: #98A0B2;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text-primary);
  background: #EDEFF7;
  display: flex; flex-direction: column;
}

/* ============ 工作台：左手机壳区 + 右逻辑面板 ============ */
.main { flex: 1; min-height: 0; display: flex; align-items: stretch; }

/* 中间：手机壳区 */
.phone-col {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px 16px;
  background:
    radial-gradient(circle at 70% 20%, rgba(91,114,245,0.07) 0%, transparent 50%),
    #EDEFF7;
}

/* 手机壳 */
.phone {
  position: relative;
  flex-shrink: 0;
  width: 390px;
  height: clamp(600px, calc(100vh - 40px), 860px);
  background: #1E2130;
  border-radius: 44px;
  padding: 12px;
  box-shadow:
    0 0 0 1px rgba(30,33,48,0.12),
    0 20px 60px rgba(30,33,48,0.28),
    inset 0 0 0 2px rgba(255,255,255,0.06);
  display: flex; flex-direction: column;
}
.phone-screen {
  flex: 1; min-height: 0;
  border-radius: 33px;
  background: #FFFFFF;
  overflow: hidden;
  position: relative;
}
/* 手机状态栏：时间 / 信号 / 电量 */
.phone-statusbar {
  position: absolute; top: 0; left: 0; right: 0;
  height: 34px; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
  background: linear-gradient(180deg, rgba(255,255,255,0.96) 0%, rgba(255,255,255,0.88) 55%, rgba(255,255,255,0) 100%);
  pointer-events: none;
  font-size: 13px; font-weight: 600; color: #1E2130;
}
.phone-statusbar .status-time { letter-spacing: 0.4px; }
.phone-statusbar .status-icons { display: flex; align-items: center; gap: 8px; }
.phone-statusbar .status-icons svg { width: 16px; height: 12px; color: #1E2130; display: block; }
.phone-statusbar .status-icons .wifi { transform: translateY(1px); }

/* 小程序自带标题栏：状态栏下一行 · 固定不随内容滚动 · 显示当前 tab 标题 + 退出按钮 */
.phone-appbar {
  position: absolute; top: 34px; left: 0; right: 0;
  height: 44px; z-index: 500;
  display: flex; align-items: center; justify-content: center;
  background: #FFFFFF;
}
.phone-appbar .appbar-title {
  font-size: 16px; font-weight: 600; color: #1E2130;
  letter-spacing: 0.3px;
}
/* 退出按钮：演示用小程序铬，无产品逻辑 */
.appbar-exit {
  position: absolute; left: 14px;
  display: flex; align-items: center; gap: 4px;
  border: none; background: none;
  cursor: default; pointer-events: none;
  font-size: 13px; font-weight: 600; color: #6E778B;
  padding: 6px 8px; border-radius: 8px;
}
.appbar-exit svg { width: 16px; height: 16px; }
.phone-appbar.hidden { visibility: hidden; pointer-events: none; }
/* 刘海 */
.phone-notch {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 120px; height: 26px; z-index: 10;
  background: rgba(255,255,255,0.92);
  border-radius: 0 0 16px 16px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}
.phone-notch .speaker { width: 42px; height: 5px; border-radius: 3px; background: rgba(30,33,48,0.2); }
.phone-notch .cam { width: 9px; height: 9px; border-radius: 50%; background: rgba(30,33,48,0.35); }

/* 内容区：顶部让出状态栏(34)+小程序栏(44)=78，底部让出小程序 tabBar(56) */
.content-frame { position: absolute; top: 78px; left: 0; right: 0; bottom: 56px; }
.content-frame iframe {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  border: none;
}
.content-frame iframe.hidden { visibility: hidden; pointer-events: none; }

/* 小程序 tabBar：在白屏内、功能页之下（不属于手机壳） */
.tabbar {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 56px; z-index: 400;
  display: flex;
  background: #FFFFFF;
  border-top: 1px solid #ECEEF6;
}
.tab-item {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px;
  border: none; background: none; cursor: pointer;
  color: var(--text-tertiary);
  font-size: 10px;
  transition: color .15s ease;
}
.tab-item svg {
  width: 22px; height: 20px;
  stroke-width: 1.8;
  stroke: currentColor;
  fill: none;
}
.tab-item.active { color: var(--primary); font-weight: 600; }
/* Home 指示条 */
.home-bar {
  height: 5px; flex-shrink: 0;
  width: 124px; margin: 6px auto 0;
  border-radius: 3px;
  background: rgba(255,255,255,0.7);
  flex-shrink: 0;
}

/* ============ 闪屏层（覆盖手机屏幕） ============ */
.splash-layer {
  position: absolute; inset: 0;
  z-index: 9999;
  background: #F8F9FC;
  border-radius: 33px;
  display: flex; align-items: flex-end; justify-content: center;
  transition: opacity .4s ease;
}
.splash-layer.hide { opacity: 0; pointer-events: none; }
.splash-layer img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

/* ============ 专属福利弹层（切功能 tab 触发；判据=未领取+会话未关；领取→登录→VIP到账） ============
   视觉：紫偏绿主题 · 不规则福利卡片 · 白鹭SVG占位 · 可交互纯HTML弹窗 */
.vip-modal {
  position: absolute; inset: 0;
  z-index: 3500;
  background: rgba(22, 27, 46, 0.32);
  display: flex; align-items: center; justify-content: center;
  padding: 0 28px;
  opacity: 0; visibility: hidden;
  transition: opacity .3s ease;
}
.vip-modal.show { opacity: 1; visibility: visible; }

/* 柔和环境光：卡片四周紫绿光晕 */
.vip-modal::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(440px 300px at 22% 22%, rgba(91,114,245,0.16) 0%, transparent 62%),
    radial-gradient(430px 320px at 82% 78%, rgba(52,188,156,0.15) 0%, transparent 62%);
  pointer-events: none;
}

/* 不规则福利卡片：四角不同程度圆角 + 轻微外凸 + 悬浮 */
.vip-card {
  position: relative;
  width: 100%;
  max-width: 318px;
  padding: 26px 24px 24px;
  background: linear-gradient(180deg, #FFFFFF 0%, #FBFBFE 100%);
  border-radius: 26px 22px 30px 20px;             /* 四角不同程度 */
  box-shadow:
    0 30px 70px rgba(38, 48, 96, 0.22),
    0 0 0 1px rgba(255,255,255,0.7) inset,
    0 0 34px rgba(104, 126, 244, 0.18),
    0 0 44px rgba(52, 188, 156, 0.10);
  transform: translateY(14px) scale(0.96);
  transition: transform .32s cubic-bezier(.2,.7,.3,1), opacity .3s ease;
  opacity: 0;
}
.vip-modal.show .vip-card { transform: translateY(0) scale(1); opacity: 1; }

/* 白鹭（SVG 占位）：右上角自卡片后方探出 */
.vip-logo {
  position: absolute;
  right: -6px; top: -26px;
  width: 92px; height: 78px;
  color: #5B72F5;
  filter: drop-shadow(0 4px 10px rgba(91,114,245,0.28));
  z-index: 0;
  opacity: .92;
}

/* 关闭按钮：浅灰 弱化 小尺寸 大热区 */
.vip-close-x {
  position: absolute;
  right: 4px; top: 4px;
  width: 38px; height: 38px;
  border: none; background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #A5ACBE;
  z-index: 3;
  border-radius: 50%;
}
.vip-close-x svg { width: 16px; height: 16px; stroke-width: 2.2; }
.vip-close-x:hover { color: #6E778B; background: #F0F1F7; }

/* 顶部标签 */
.vip-flag {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 700; letter-spacing: .4px;
  color: #4358D7;
  background: linear-gradient(120deg, #EEF1FF, #E4FBF5);
  border: 1px solid rgba(91,114,245,0.18);
  border-radius: 99px;
  padding: 5px 12px;
  margin-bottom: 12px;
}
.vip-flag::before { content: '✦'; font-size: 10px; }

/* 主标题 / 副标题 */
.vip-title { font-size: 22px; font-weight: 800; letter-spacing: -.4px; color: #202533; margin-bottom: 7px; }
.vip-flag-wrap { display: flex; align-items: center; justify-content: space-between; }

.vip-sub { font-size: 13px; color: #6E778B; line-height: 1.6; margin-bottom: 18px; max-width: 84%; }

/* 三权益：小图标 + 简短文字 */
.vip-benefits {
  display: flex; flex-direction: column; gap: 10px;
  margin-bottom: 20px;
}
.vip-benefit {
  display: flex; align-items: center; gap: 12px;
  background: #F7F8FC;
  border: 1px solid rgba(91,114,245,0.07);
  border-radius: 15px 13px 16px 12px;
  padding: 11px 13px;
}
.vip-benefit-ico {
  width: 38px; height: 38px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 12px 10px 13px 10px;
  color: #fff;
}
.vip-benefit:nth-child(1) .vip-benefit-ico { background: linear-gradient(135deg, #5B72F5, #7B8DFF); box-shadow: 0 6px 14px rgba(91,114,245,.3); }
.vip-benefit:nth-child(2) .vip-benefit-ico { background: linear-gradient(135deg, #3FA97F, #5BC29B); box-shadow: 0 6px 14px rgba(63,169,127,.28); }
.vip-benefit:nth-child(3) .vip-benefit-ico { background: linear-gradient(135deg, #6B7CF0, #4E5ED6); box-shadow: 0 6px 14px rgba(78,94,214,.28); }
.vip-benefit-ico svg { width: 21px; height: 21px; }
.vip-benefit-name { font-size: 14px; font-weight: 700; color: #202533; }
.vip-benefit-desc { font-size: 12px; color: #8A92A6; margin-top: 2px; }

/* 主按钮：紫→绿渐变 CTA */
.vip-cta {
  width: 82%; height: 48px;
  margin: 0 auto;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  border: none; border-radius: 99px;
  background: linear-gradient(100deg, #5B72F5 0%, #4358D7 46%, #3FA98B 100%);
  color: #fff; font-size: 16px; font-weight: 700;
  letter-spacing: .3px;
  cursor: pointer;
  box-shadow: 0 12px 26px rgba(91,114,245,.34), 0 0 18px rgba(63,169,139,.24);
  transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.vip-cta:active { transform: scale(.97); box-shadow: 0 6px 14px rgba(91,114,245,.28); filter: brightness(.97); }

/* 收起动画：领取时缩小 + 渐隐 */
.vip-card.leave {
  transform: scale(.82) translateY(2px);
  opacity: 0;
  transition: transform .22s cubic-bezier(.4,0,.7,1), opacity .22s ease;
}
.vip-modal.leave { opacity: 0; transition: opacity .2s ease; }

/* ============ 登录 Bottom Sheet（底部上浮，领取专属权益后触发） ============ */
.vip-login-modal {
  position: absolute; inset: 0;
  z-index: 3600;               /* 高于 VIP 福利弹窗 */
  display: flex; align-items: flex-end;   /* 底部贴合 */
  opacity: 0; visibility: hidden;
  transition: opacity .3s ease;
}
.vip-login-modal.show { opacity: 1; visibility: visible; }

.vip-login-overlay {
  position: absolute; inset: 0;
  background: rgba(22, 27, 46, 0.34);
}
.vip-login-sheet {
  position: relative;
  width: 100%;
  background: #FFFFFF;
  border-radius: 30px 30px 0 0;        /* 顶部圆角 */
  padding: 26px 24px calc(26px + env(safe-area-inset-bottom, 0px));
  box-sizing: border-box;
  transform: translateY(100%);
  transition: transform .32s cubic-bezier(.2,.7,.3,1);   /* 上浮 */
  box-shadow: 0 -10px 40px rgba(38,48,96,0.10);
}
.vip-login-modal.show .vip-login-sheet { transform: translateY(0); }

.vip-login-close {
  position: absolute; right: 14px; top: 12px;
  width: 40px; height: 40px;             /* 热区满足 40px */
  border: none; background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #9A9EAE; border-radius: 50%;
  font-size: 22px; line-height: 1; padding: 0;
}
.vip-login-close:hover { color: #6E778B; background: #F0F1F7; }
.vip-login-close:active { background: #ECEDF3; }

.vip-login-logo {
  width: 44px; height: 44px;
  margin: 0 auto 10px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 14px 12px 15px 11px;
  background: linear-gradient(135deg, #5B72F5, #3FA98B);
  color: #fff;
  box-shadow: 0 8px 18px rgba(91,114,245,0.28);
}
.vip-login-logo svg { width: 26px; height: 26px; }

.vip-login-title {
  font-size: 21px; font-weight: 700; color: #25283A;
  text-align: center; margin-bottom: 6px;
}
.vip-login-desc {
  font-size: 13px; color: #8D92A6;
  text-align: center; line-height: 1.6; margin-bottom: 22px;
}

.vip-login-button {
  width: 100%; height: 48px;
  border: none; border-radius: 15px;
  background: linear-gradient(100deg, #7169ED 0%, #62CFA9 100%);
  color: #fff; font-size: 15px; font-weight: 600;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
  box-shadow: 0 10px 22px rgba(113,105,237,0.28);
}
.vip-login-button:active { transform: scale(.98); filter: brightness(.97); box-shadow: 0 5px 12px rgba(113,105,237,.24); }

.vip-login-privacy {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  font-size: 12px; color: #9A9EAE;
  margin-top: 16px; cursor: pointer;
}
.vip-login-privacy input[type="checkbox"] {
  width: 16px; height: 16px; accent-color: #5B72F5; cursor: pointer;
  margin: 0;
}
.vip-login-privacy a {
  color: #5B72F5; text-decoration: none; font-weight: 600;
  cursor: pointer;
}
.vip-login-privacy a:hover { text-decoration: underline; }

.vip-login-tip {
  min-height: 18px;
  font-size: 12px; color: #E5573F;
  text-align: center; margin-top: 8px;
  opacity: 0; transition: opacity .2s ease;;
}
.vip-login-tip.show { opacity: 1; }

/* ============ 登录成功轻量提示（Toast）：登录成功 → 短暂出现 → 自动消失 ============
   视觉：半透明白 · 紫绿渐变光晕 · 轻阴影 · 圆角14-16px · 紧凑 · 无皇冠/关闭/大卡片 */
.vip-success-toast {
  position: absolute; left: 50%; bottom: calc(79px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  min-width: 264px; width: min(288px, calc(100% - 48px));
  min-height: 48px; box-sizing: border-box;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 0 20px;
  background: rgba(255, 255, 255, 0.92);
  border-radius: 15px;
  z-index: 4000;
  opacity: 0; pointer-events: none;
  filter: drop-shadow(0 6px 18px rgba(38, 42, 58, 0.14));
  backdrop-filter: blur(6px);
  overflow: hidden;
  transition: opacity .25s ease, transform .25s ease;
}
/* 柔和紫绿渐变光晕 */
.vip-success-toast::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(130px 46px at 18% 50%, rgba(113,105,237,0.10) 0%, transparent 70%),
    radial-gradient(120px 42px at 82% 50%, rgba(98,207,169,0.12) 0%, transparent 70%);
  pointer-events: none;
}
.vip-success-icon {
  flex-shrink: 0;
  width: 20px; height: 20px; border-radius: 50%;
  background: linear-gradient(135deg, #7169ED 0%, #62CFA9 100%);
  color: #FFFFFF;
  font-size: 13px; font-weight: 700; line-height: 20px;
  text-align: center;
}
.vip-success-text {
  font-size: 14px; font-weight: 600; color: #25283A;
  letter-spacing: 0.2px; white-space: nowrap;
}
/* 出现：opacity 0→1 + translateY(8px)→0 */
.vip-success-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
/* 隐藏态（非 show）：translateY(8px) */
.vip-success-toast { transform: translateX(-50%) translateY(8px); }
/* 消失：由 JS 移除 .show 触发 opacity 1→0 + Y 0→4px */
.vip-success-toast.hiding {
  opacity: 0;
  transform: translateX(-50%) translateY(4px);
}
/* VIP 领取页全屏层：默认隐藏，仅「VIP 领取」触发时铺满手机屏幕 */
.vip-layer {
  position: absolute; inset: 0;
  z-index: 3000;
  background: #FFFFFF;
  display: flex; flex-direction: column;
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .22s ease;
}
.vip-layer.show { opacity: 1; visibility: visible; pointer-events: auto; }
.vip-layer iframe { flex: 1; min-height: 0; width: 100%; border: none; }

/* ============ 右侧逻辑说明面板 ============ */
.logic-col {
  width: 0;               /* 收起态无宽度 */
  overflow: hidden;
  transition: width .25s ease;
  background: #FBFBFF;
  border-left: 1px solid #ECEFF6;
  display: flex; flex-direction: column;
  flex-shrink: 0;
}
.logic-col.open { width: 460px; }
.logic-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
/* 视图切换胶囊 */
.view-switch {
  flex-shrink: 0;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  padding: 10px 18px;
  background: #FFFFFF;
  border-bottom: 1px solid #ECEFF6;
}
.view-chip {
  padding: 5px 12px; border-radius: 14px;
  border: 1px solid #E3E8F2; background: #F7F9FC;
  font-size: 12px; font-weight: 500; color: var(--text-secondary);
  cursor: pointer; transition: all .15s ease;
  white-space: nowrap;
}
.view-chip:hover { border-color: var(--primary); color: var(--primary-dark); }
.view-chip.active { background: var(--primary); border-color: var(--primary); color: #FFFFFF; font-weight: 600; }
/* 全局通栏：卡片状态标签 */
.logic-global {
  flex-shrink: 0;
  margin: 10px 18px 0;
  padding: 6px 12px;
  background: #FFFFFF;
  border: 1px solid #ECEFF6;
  border-radius: 10px;
  font-size: 12px; line-height: 1;
  color: var(--text-secondary);
}
.g-tab { display: inline-block; font-size: 11px; font-weight: 600; margin-right: 8px; padding: 3px 8px; border-radius: 10px; white-space: nowrap; }
.g-tab.g-ok   { background: #E8F8F0; color: #20A866; }
.g-tab.g-no   { background: #FEECEC; color: #EF4444; }
.g-tab.g-stub { background: #FFF1E6; color: #F28B3D; }
.logic-head {
  flex-shrink: 0;
  height: 46px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 18px;
  border-bottom: 1px solid #ECEFF6;
  background: #FFFFFF;
}
.logic-head .title { font-size: 14px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
.logic-head .close-x { margin-left: auto; border: none; background: none; cursor: pointer; color: var(--text-tertiary); font-size: 18px; line-height: 1; padding: 4px 6px; }
.logic-body {
  flex: 1; min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px 18px 30px;
  scrollbar-width: thin;
}
.logic-body::-webkit-scrollbar { width: 6px; }
.logic-body::-webkit-scrollbar-thumb { background: #DDE1F0; border-radius: 3px; }
.logic-desc { font-size: 13px; line-height: 1.6; color: var(--text-secondary); margin-bottom: 14px; padding: 12px 14px; background: var(--primary-light); border-radius: 12px; }
.logic-sec { margin-bottom: 10px; }
.logic-sec-head { display: flex; align-items: center; gap: 6px; padding: 0; }
.logic-sec-head .num { width: 18px; height: 18px; border-radius: 5px; background: var(--primary); color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.logic-sec-head .sec-name { font-size: 13px; font-weight: 700; }
.logic-sec-body { display: block; padding: 2px 0 0 24px; }
.logic-para { margin: 10px 0 4px; font-size: 12px; font-weight: 700; color: var(--text-secondary); }
.logic-label { display: flex; align-items: flex-start; gap: 6px; font-size: 12.5px; line-height: 1.55; color: var(--text-primary); padding: 4px 0; }
.logic-label .k { flex-shrink: 0; font-weight: 600; color: var(--primary-dark); min-width: 58px; }
.logic-label .v { color: var(--text-primary); }
.logic-note { margin-top: 6px; font-size: 11.5px; color: var(--text-tertiary); background: #F5F6FB; border-radius: 8px; padding: 6px 10px; line-height: 1.5; }
.logic-table { width: 100%; margin: 8px 0; border-collapse: collapse; font-size: 12px; }
.logic-table th, .logic-table td { border: 1px solid #EAEDF6; padding: 6px 8px; text-align: left; vertical-align: top; }
.logic-table th { background: #F8F9FC; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
</style>
</head>

<script>
/* ============================================================
   总壳状态中枢：登录/画像/VIP 全局唯一状态源
   ============================================================ */
var STATE = (function() {
  /* 持久化恢复：localStorage 里存的登录/画像/VIP 状态，刷新/重开后保持（PM 拍板：全部持久化） */
  var STORAGE_KEY = 'zsb_state_v1';
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch(e) {}
  return {
    logged: !!(saved && saved.logged),
    user: (saved && saved.user) || null,          /* {nick, grade, major, school} */
    vipClaimed: !!(saved && saved.vipClaimed),
    /* 画像三态：none(未填)/partial(部分)/done(齐全)；旧 profile=true 视为 done */
    profileLevel: (saved && saved.profileLevel) || 'none'
  };
})();

/* 持久化：STATE 每次变更后写 localStorage（broadcast 统一出口触发） */
function persist() {
  try { localStorage.setItem('zsb_state_v1', JSON.stringify(STATE)); } catch(e) {}
}

/* 画像完整度：school+major+grade 齐全 → done；有任意一项 → partial；否则 none */
function calcProfileLevel(user) {
  var u = user || {};
  var hasAny = u.school || u.major || u.grade;
  var hasAll = u.school && u.major && u.grade;
  if (hasAll) return 'done';
  if (hasAny) return 'partial';
  return 'none';
}

var FRAMES = ['study', 'quiz', 'flash', 'mine', 'vip'];
function allFrames() {
  return FRAMES.map(function(f) { return document.getElementById('frame-' + f); })
    .filter(Boolean);
}

/* 广播最新状态到所有 iframe（先持久化再广播：登录/画像/VIP 任何变更统一落盘） */
function broadcast() {
  persist();
  allFrames().forEach(function(f) {
    try { f.contentWindow.postMessage({ type: 'STATE', state: STATE }, '*'); } catch(e) {}
  });
}

/* 子页面上报：LOGGED / PROFILE / VIP */
window.addEventListener('message', function(evt) {
  var d = evt.data;
  if (!d || !d.type) return;
  if (d.type === 'SUBREADY') {
    /* 子页就绪 → 回发当前状态（懒加载 iframe 迟到的场景） */
    broadcast();
    return;
  }
  if (d.type === 'REQ_LOGIN') {
    /* 登录归属唯一：总壳登录 Sheet（A）；任何页请求登录 → 由总壳弹登录，不转发学习页
       来源随请求透传，决定登录成功后 toast 文案与 VIP 是否到账 */
    openLoginSheet(d.data && d.data.from);
    return;
  }
  if (d.type === 'OPEN_PROFILE') {
    /* 画像采集归属唯一：学习页 */
    var study = document.getElementById('frame-study');
    if (study && study.contentWindow) {
      study.contentWindow.postMessage({ type: 'OPEN_PROFILE' }, '*');
    }
    switchTab('study');
    return;
  }
  if (d.type === 'LOGGED') {
    STATE.logged = true;
    if (d.data && d.data.user) STATE.user = d.data.user;
    broadcast();
    /* 从权益图点「领取权益」进入的登录 → 登录成功即 VIP 到账（本次会话不再弹权益） */
    if (benefitUsing) {
      benefitUsing = false;
      benefitClosed = true;          /* 已经营过 → 不再弹 */
      STATE.vipClaimed = true;
      broadcast();
    }
  } else if (d.type === 'PROFILE') {
    if (d.data && d.data.user) STATE.user = Object.assign({}, STATE.user, d.data.user);
    STATE.profileLevel = calcProfileLevel(STATE.user);
    broadcast();
  } else if (d.type === 'VIP') {
    STATE.vipClaimed = true;
    broadcast();
    closeVip();
  } else if (d.type === 'NAV') {
    /* 闪卡视图切换 → 逻辑面板跟随（高亮 + 说明同步） */
    setActivePanel(d.view);
    renderLogicPanel(currentLogicData());
  } else if (d.type === 'POPUP') {
    /* 闪卡弹窗/浮层开关 → 逻辑面板跟随（完成页/settings） */
    if (d.name === 'settings') { settingsOpen = !!d.open; }
    else if (d.name === 'completion') { completionOpen = !!d.open; }
    renderLogicPanel(currentLogicData());
  } else if (d.type === 'REQUEST_NAV') {
    /* 面板视图胶囊 → 转发给闪卡 iframe 跳转 */
    var flash = document.getElementById('frame-flash');
    if (flash && flash.contentWindow) {
      flash.contentWindow.postMessage({ type: 'REQUEST_NAV', view: d.view }, '*');
    }
  }
});

/* 安全提示：caller tab 首次加载后向子页同步一次状态 */
function syncChildState() {
  broadcast();
}

/* ---------- 底部 tab 切换 ---------- */
var TAB_NAMES = { study: '学习', quiz: '题库', flash: '闪卡', mine: '我的' };
var TAB_FRAMES = ['study', 'quiz', 'flash', 'mine'];
function updateAppbar(name) {
  var title = document.getElementById('appbarTitle');
  if (title) title.textContent = (TAB_NAMES[name] || '');
}
function switchTab(name) {
  updateAppbar(name);
  updateLogicForTab(name);
  /* 切到功能 tab（非学习）→ 触发 openBenefit（判据=未领取+会话展示/关闭过不弹，非“首次进入”；登录与否都弹，规则①） */
  if (name !== 'study') openBenefit();
  TAB_FRAMES.forEach(function(f) {
    var iframe = document.getElementById('frame-' + f);
    if (iframe) iframe.classList.toggle('hidden', f !== name);
    var tab = document.querySelector('.tab-item[data-frame="' + f + '"]');
    if (tab) tab.classList.toggle('active', f === name);
  });
  /* 首次切入懒加载：切到才设 src，避免4个页面同载 */
  var next = document.getElementById('frame-' + name);
  if (!next.getAttribute('src') && next.getAttribute('data-src')) {
    next.setAttribute('src', next.getAttribute('data-src'));
  }
  /* 切入后同步状态 */
  setTimeout(syncChildState, 150);
  if (name === 'flash') {
    /* 切到闪卡：让 flash iframe 感知当前面板高亮，并校准逻辑说明 */
    var flash = document.getElementById('frame-flash');
    if (flash && flash.contentWindow) {
      flash.contentWindow.postMessage({ type: 'REQUEST_NAV', view: activePanel }, '*');
    }
  }
}

/* 小程序顶栏「退出」仅为演示铬，无点击逻辑 */

/* ---------- VIP 弹层 ---------- */
var vipLayer = document.getElementById('vipLayer');
function openVip() {
  vipLayer.classList.add('show');
  setTimeout(syncChildState, 150);
}
function closeVip() {
  vipLayer.classList.remove('show');
}

/* ---------- 免费权益弹层（切功能 tab 触发；判据=未领取+会话未关；领取→登录→VIP到账） ---------- */
var benefitMask  = document.getElementById('benefitMask');
var benefitCard  = document.getElementById('benefitCard');
var benefitClosed = false;   /* 本次会话已关过（点X / 点图外）→ 不再弹 */
var benefitUsing  = false;   /* 正在走「领取→登录」链路中 */
var benefitShown  = false;   /* 本次会话已展示过（含领取中）→ 不再主动弹 */

function openBenefit() {
  if (STATE.vipClaimed || benefitClosed || benefitShown) return;
  benefitShown = true;
  benefitMask.classList.add('show');
}
function hideBenefit() {
  benefitMask.classList.remove('show');
}
/* 点领取权益：卡片缩小消失 → 已登录直接到账 / 未登录弹登录 Sheet */
function claimBenefit() {
  benefitUsing = true;      /* 标记：本次领取（登录后到账 / 已登录直接到账） */
  benefitCard.classList.add('leave');
  benefitMask.classList.add('leave');
  setTimeout(function() {
    benefitCard.classList.remove('leave');
    benefitMask.classList.remove('leave');
    hideBenefit();           /* VIP 福利弹窗隐藏 */
    if (STATE.logged) {
      /* 已登录：无需登录 → 直接 VIP 到账 + 轻量提示 */
      benefitUsing = false;
      benefitClosed = true;         /* 已到账 → 本次会话不再弹权益 */
      STATE.vipClaimed = true;
      broadcast();
      showToastText('领取成功，VIP权益已到账');
    } else {
      openLoginSheet('benefit');    /* 权益线：底部上浮登录弹窗（登录成功自动到账） */
    }
  }, 230);
}
/* 事件绑定 */
document.getElementById('benefitClose').addEventListener('click', function() {
  benefitClosed = true;
  hideBenefit();
});
benefitMask.addEventListener('click', function(e) {
  if (e.target === benefitMask) {   /* 点图外遮罩 */
    benefitClosed = true;
    hideBenefit();
  }
});
document.getElementById('benefitCta').addEventListener('click', claimBenefit);

/* ---------- 登录 Bottom Sheet（领取专属权益后底部上浮） ---------- */
var loginSheet   = document.getElementById('loginSheet');
var loginClose   = document.getElementById('loginClose');
var loginButton  = document.getElementById('loginButton');
var loginAgree   = document.getElementById('loginAgree');
var loginTip     = document.getElementById('loginTip');
var loginOverlay = document.getElementById('loginOverlay');

/* 登录来源：benefit=权益线（领取→登录→VIP到账） / onboarding=画像线（登录→跳问答） / 其他=我的等普通登录 */
var loginFrom = 'general';
function openLoginSheet(from) {
  loginFrom = from || 'general';          /* 记录本次登录来源（决定 toast 文案 & 是否 VIP 到账） */
  loginTip.classList.remove('show');     /* 重置提示 */
  loginSheet.classList.add('show');
}
function closeLoginSheet() {
  loginSheet.classList.remove('show');
}
/* 点 ×：关闭登录弹窗，返回原页面，不登录不领 VIP */
loginClose.addEventListener('click', function() {
  closeLoginSheet();
});
/* 点遮罩：同样关闭（与 × 一致） */
loginOverlay.addEventListener('click', function() {
  closeLoginSheet();
});
/* 微信一键登录：先校验协议勾选 */
loginButton.addEventListener('click', function() {
  if (!loginAgree.checked) {
    loginTip.classList.add('show');
    return;
  }
  loginTip.classList.remove('show');
  /* 模拟登录成功（三条线共用总壳登录 Sheet，来源区分文案 & VIP 到账） */
  STATE.logged = true;
  /* 登录不覆盖已填的画像草稿（C）：合并昵称等身份字段，保留 school/major/grade 画像 */
  STATE.user = Object.assign({}, STATE.user || {},
    { nick: '团团酱', grade: STATE.user && STATE.user.grade || '大三', major: STATE.user && STATE.user.major || '计算机大类' });
  STATE.profileLevel = calcProfileLevel(STATE.user);
  var from = loginFrom;
  var toastText = '登录成功';
  if (benefitUsing) {
    /* 权益线：领取专属权益触发的登录 → 登录 + VIP 到账，toast 提示到账 */
    benefitUsing = false;
    benefitClosed = true;       /* 本次会话不再弹权益 */
    STATE.vipClaimed = true;
    toastText = '登录成功，VIP权益已到账';
  } else if (from === 'onboarding') {
    /* 画像线：完成画像后登录 → 仅登录+跳问答，不涉及权益，toast 提示画像已保存 */
    toastText = '登录成功，学习画像已保存';
  }
  /* 我的页等普通登录 → 默认「登录成功」，与权益/画像无关 */
  broadcast();
  closeLoginSheet();
  showToastText(toastText);    /* 登录成功 → 按来源提示（自动消失，无额外点击） */
});

/* ---------- 成功轻量提示（Toast）：出现→停留1.5s→自动消失 ---------- */
var toastTimer = null;
function showSuccessToast() { showToastText('登录成功，VIP权益已到账'); }
function showToastText(text) {
  var t = document.getElementById('successToast');
  if (!t) return;
  var txt = t.querySelector('.vip-success-text');
  if (txt) txt.textContent = text;
  if (toastTimer) clearTimeout(toastTimer);
  t.classList.remove('show', 'hiding');   /* 复位动画状态 */
  requestAnimationFrame(function() {
    t.classList.add('show');              /* 出现：opacity 0→1 + translateY(8px)→0 */
  });
  /* 停留 1.5s 后进入消失态，再 0.2s 完全隐藏 */
  toastTimer = setTimeout(function() {
    t.classList.remove('show');
    t.classList.add('hiding');            /* 消失：opacity 1→0 + translateY(0)→4px */
    toastTimer = setTimeout(function() {
      t.classList.remove('hiding');
    }, 200);
  }, 1500);
}

})();

  if (s) s.classList.add('hide');
}, EMBEDDED ? 0 : 3000);

      { num:'1', title:'当前状态',
        paras: [

    desc: '我的 tab（当前为占位说明，逻辑面板待补全）：个人中心登录/画像/VIP 状态见 [03_PRD](03_PRD.md) §3，权益规则见 §3.4。',

var PANEL_VIEWS = [
  { id: 'view-home',     title: '首页' },
  { id: 'view-single',   title: '单卡模式' },
  { id: 'view-list',     title: '列表模式' },
  { id: 'view-stats',    title: '章节统计' },
  { id: 'view-complete', title: '完成结算页' }
];
/* 闪卡视图 ID 集合（供 tab 联动判断 activePanel 是否落在闪卡内） */
var FLASH_VIEWS = PANEL_VIEWS.map(function(v) { return v.id; });
/* 面板视图切换胶囊：点胶囊 → 通知闪卡 iframe 跳转（联动）。仅闪卡 tab 显示 */
PANEL_VIEWS.forEach(function(v) {
  var b = document.createElement('button');
  b.className = 'view-chip';
  b.textContent = v.title;
  b.setAttribute('data-view', v.id);
  b.addEventListener('click', function() {
    setActivePanel(v.id);
    var flash = document.getElementById('frame-flash');
    if (flash && flash.contentWindow) {
      flash.contentWindow.postMessage({ type: 'REQUEST_NAV', view: v.id }, '*');
    }
  });
  viewSwitch.appendChild(b);
});

function setActivePanel(viewId) {
  activePanel = viewId;
  document.querySelectorAll('#viewSwitch .view-chip').forEach(function(chip) {
    chip.classList.toggle('active', chip.getAttribute('data-view') === viewId);
  });
}

/* 逻辑面板随功能 tab 联动：
   - 学习 tab → 学习页子 tab（登录 / 学习页 两枚胶囊）+ 对应面板
   - 闪卡 tab → 闪卡胶囊 + 闪卡状态通栏 + 当前闪卡视图说明
   - 题库/我的 tab → 占位说明（胶囊/通栏隐藏） */
var LOGIC_TABS = {
  study: { title: '📋 逻辑说明 · 学习页',           panel: null, studyTab: true },
  flash: { title: '📋 逻辑说明 · 闪卡',             panel: null },
  quiz:  { title: '📋 逻辑说明 · 题库',             panel: 'view-quiz-placeholder' },
  mine:  { title: '📋 逻辑说明 · 我的',             panel: 'view-mine-placeholder' }
};
var studySwitch = document.getElementById('studySwitch');

/* 学习页子 tab 数据：登录 / 学习页 */
var STUDY_SUBTABS = [
  { id: 'login', title: '登录',       panel: 'view-study-login' },
  { id: 'page',  title: '学习页',     panel: 'view-study-page' }
];
var studySubActive = 'login';   /* 学习页子 tab 当前激活 */

function buildStudySwitch() {
  studySwitch.innerHTML = '';
  STUDY_SUBTABS.forEach(function(st) {
    var b = document.createElement('button');
    b.className = 'view-chip';
    b.textContent = st.title;
    b.setAttribute('data-sub', st.id);
    b.addEventListener('click', function() {
      studySubActive = st.id;
      renderLogicPanel(PANELS[st.panel] || { desc: '', sections: [] });
      document.querySelectorAll('#studySwitch .view-chip').forEach(function(c) {
        c.classList.toggle('active', c.getAttribute('data-sub') === st.id);
      });
    });
    studySwitch.appendChild(b);
  });
  /* 初始激活「登录」 */
  document.querySelectorAll('#studySwitch .view-chip').forEach(function(c) {
    c.classList.toggle('active', c.getAttribute('data-sub') === studySubActive);
  });
}

function updateLogicForTab(name) {
  var cfg = LOGIC_TABS[name] || LOGIC_TABS.study;
  var titleEl = document.querySelector('.logic-head .title');
  if (titleEl) titleEl.textContent = cfg.title;
  /* 学习页子 tab 胶囊（登录/学习页），仅学习 tab 显示 */
  if (studySwitch) studySwitch.style.display = (name === 'study') ? '' : 'none';
  /* 闪卡胶囊区仅闪卡 tab 显示 */
  viewSwitch.style.display = (name === 'flash') ? '' : 'none';
  /* 闪卡状态通栏（已记住/未记住/顽固）仅闪卡 tab 显示 */
  if (logicGlobal) logicGlobal.style.display = (name === 'flash') ? '' : 'none';
  if (name === 'study') {
    /* 学习 tab → 学习页子 tab（登录/学习页），默认激活「登录」 */
    activePanel = PANELS['view-study-' + studySubActive] ? 'view-study-' + studySubActive : 'view-study-login';
    renderLogicPanel(PANELS[activePanel] || { desc: '', sections: [] });
  } else if (cfg.panel) {
    /* 固定面板：题库占位 / 我的占位 */
    activePanel = cfg.panel;
    renderLogicPanel(PANELS[cfg.panel] || { desc: '当前 tab：' + name + ' 逻辑说明待补', sections: [] });
  } else if (name === 'flash') {
    /* 闪卡 tab：保持当前闪卡视图面板（进入时默认首页说明） */
    if (!activePanel || FLASH_VIEWS.indexOf(activePanel) === -1) activePanel = 'view-home';
    renderLogicPanel(currentLogicData());
  }
}
buildStudySwitch();

function currentLogicData() {
  /* 弹窗/浮层打开时 → 逻辑说明自动切到对应面板，关闭时恢复原视图说明：
     - 完成页浮层 → 完成结算页
     - 首页设置弹窗 → 背诵设置
     优先级：完成页浮层 > 设置弹窗 （与闪卡原型一致） */
  if (completionOpen && PANELS['view-complete']) return PANELS['view-complete'];
  if (settingsOpen && PANELS['view-settings']) return PANELS['view-settings'];
  return PANELS[activePanel] || { desc: '当前视图：' + activePanel, sections: [] };
}

function renderLogicPanel(data) {
  logicBody.innerHTML = '';
  var de = document.createElement('div'); de.className = 'logic-desc'; de.textContent = data.desc || ''; logicBody.appendChild(de);
  (data.sections || []).forEach(function(sec) {
    var card = document.createElement('div'); card.className = 'logic-sec';
    var head = document.createElement('div'); head.className = 'logic-sec-head';
    head.innerHTML = '<span class="num">' + sec.num + '</span><span class="sec-name">' + esc(sec.title) + '</span>';
    card.appendChild(head);
    var body = document.createElement('div'); body.className = 'logic-sec-body';
    (sec.paras || []).forEach(function(t) { var p = document.createElement('div'); p.className = 'logic-para'; p.textContent = t; body.appendChild(p); });
    (sec.labels || []).forEach(function(lb) { var d = document.createElement('div'); d.className = 'logic-label'; d.innerHTML = '<span class="k">' + esc(lb.k) + '</span><span class="v">' + esc(lb.v) + '</span>'; body.appendChild(d); });
    if (sec.table && sec.table.length) {
      var t = document.createElement('table'); t.className = 'logic-table';
      var hr = '<tr>' + (sec.tableHead || ['项','规则']).map(function(h){return '<th>'+esc(h)+'</th>';}).join('') + '</tr>';
      var br = sec.table.map(function(r){ return '<tr>' + r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('') + '</tr>'; }).join('');
      t.innerHTML = hr + br; body.appendChild(t);
    }
    if (sec.table2 && sec.table2.length) {
      var t2 = document.createElement('table'); t2.className = 'logic-table';
      var hr2 = '<tr>' + (sec.tableHead2 || ['项','规则']).map(function(h){return '<th>'+esc(h)+'</th>';}).join('') + '</tr>';
      var br2 = sec.table2.map(function(r){ return '<tr>' + r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('') + '</tr>'; }).join('');
      t2.innerHTML = hr2 + br2; body.appendChild(t2);
    }
    card.appendChild(body);
    logicBody.appendChild(card);
  });
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---------- 逻辑面板开关 ---------- */
var logicCol = document.getElementById('logicCol');
function toggleLogic() {
  logicCol.classList.toggle('open');
}
document.getElementById('logicClose').addEventListener('click', toggleLogic);

/* 初始渲染：默认学习 tab → 学习页说明（胶囊/闪卡通栏隐藏） */
updateLogicForTab('study');

/* 手机状态栏时钟 */
setInterval(function() {
  var d = new Date();
  var t = document.getElementById('statusTime');
  if (t) t.textContent = (d.getHours() < 10 ? '0' + d.getHours() : d.getHours()) + ':' + (d.getMinutes() < 10 ? '0' + d.getMinutes() : d.getMinutes());
}, 30000);
</script>
