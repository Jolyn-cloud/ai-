<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="ebY2pWV6IVIkVWb88o8k3W">
<head data-page-node-id="g6rR4mcqa6x4tHkkpVtPMW">
<meta charset="UTF-8" data-page-node-id="iG7ugyRxpxYbhq2VBisfaU" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" data-page-node-id="McpYy62xH2uUMIAApzKjZ2" />
<title>历年真题</title>
<style>
/* ==== Product Theme：蓝靛 #5B72F5（与题库首页统一，2026-09-02） ====
   历年真题页：题库首页「历年真题」入口下钻二级页
   结构：真题卷列表（按年份，默认未做在前）
   数据：试卷状态（未做/已做+正确率），mock 演示期 */
:root{
  --primary: #5B72F5;
  --primary-dark: #4358D7;
  --primary-light: #EEF1FF;
  --brand-mid: #4358D7;
  --brand-teal: #3FA98B;
  --text-primary: #1E2130;
  --text-secondary: #6E778B;
  --text-tertiary: #98A0B2;
  --success: #20A866;
  --warning: #F28B3D;
  --danger: #EF4444;
  --card-radius: 17px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text-primary);
  background-color: #EDEFF7;
  -webkit-overflow-scrolling: touch;
}
* { scrollbar-width: none; }                          /* Firefox */
*::-webkit-scrollbar { display: none; width: 0; height: 0; } /* Chrome/Safari */

/* ===== 真题卷列表 ===== */
.scroll-area { padding: 4px 16px 32px; }
.paper-group { margin-top: 10px; }
.group-head {
  font-size: 12px; font-weight: 700; color: var(--text-secondary);
  display: flex; align-items: center; gap: 6px;
  margin: 14px 2px 10px;
}
.group-head::before {
  content: ''; width: 3px; height: 12px; border-radius: 2px;
  background: linear-gradient(180deg, var(--primary), var(--brand-teal));
}
.paper-group:first-of-type .group-head { margin-top: 0; }
.paper-list { display: flex; flex-direction: column; gap: 10px; }
.paper-card {
  background: #fff;
  border-radius: 15px 13px 17px 12px;
  padding: 14px 14px 13px;
  box-shadow: 0 1px 2px rgba(38,48,96,.04), 0 6px 16px rgba(91,114,245,.06);
  display: flex; flex-direction: column;
  width: 100%;
}
.paper-head { display: flex; gap: 10px; align-items: center; }
.paper-icon {
  width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
}
.paper-icon.real { background: linear-gradient(135deg, #13C2C2, #36CFC9); }
.paper-icon svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2; }
.paper-name {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 4px;
  font-size: 14px; font-weight: 700; color: var(--text-primary);
  white-space: nowrap; overflow: hidden;
}
.paper-name .paper-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.paper-meta {
  margin-top: 8px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: 11.5px; color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
}
.paper-meta .pm { display: inline-flex; align-items: center; gap: 3px; }
.paper-meta .pm svg { width: 12px; height: 12px; }

/* 三层：操作区 */
.paper-actions { margin-top: 11px; }
.paper-status-line {
  font-size: 12px; font-weight: 600; color: var(--success);
  margin: 0 0 9px;
}
.paper-status-line.wrong { color: var(--warning); }
.paper-btn-row { display: flex; gap: 8px; }
/* 轻量化按钮：把视觉重心让回试卷名称（PM 2026-09-05）
   关键改动：高度 38→30，圆角 19→8，去渐变/去阴影，主按钮改用主色 12% 透明底 + 主色文字 */
.paper-btn {
  flex: 1; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border: none; border-radius: 8px;
  font-size: 12.5px; font-weight: 600; cursor: pointer;
  transition: opacity .12s ease, transform .12s ease, background-color .12s ease;
}
.paper-btn:active { transform: scale(.97); }
.paper-btn.primary {
  background: rgba(91,114,245,.12);
  color: var(--primary-dark);
}
.paper-btn.primary:active { background: rgba(91,114,245,.18); }
.paper-btn.ghost {
  background: rgba(110,119,139,.08);
  color: var(--text-secondary);
}
.paper-btn.ghost:active { background: rgba(110,119,139,.14); }
.paper-btn.wide { width: 100%; }

/* 试卷标题里的「真题」徽标 */
.paper-badge {
  display: inline-block; font-size: 10px; font-weight: 700;
  padding: 1px 6px; border-radius: 5px; margin-right: 6px; vertical-align: 1px;
  background: var(--primary-light); color: var(--primary-dark);
}

/* ===== Toast ===== */
.toast {
  position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%);
  background: rgba(30,33,48,.92); color: #fff;
  padding: 9px 18px; border-radius: 22px; font-size: 13px;
  opacity: 0; transition: opacity .25s ease; z-index: 999;
  pointer-events: none; white-space: nowrap;
}
</style>
</head>
<body data-page-node-id="6j4yrEACevrEYaPYDe4xs5">

<div class="scroll-area" data-page-node-id="iesMIVhY7GzKB0WRl0wDNE">
  <div id="paperGroups" data-page-node-id="tOGEMQO1Q3UrzQPcdbvj9A"></div>
</div>

<div class="toast" id="toast" data-page-node-id="moBGOWQXcXWiyp0D9BhFLl"></div>

<script>
/* ============================================================
   历年真题 mock 数据（演示期；v5.0 接真实真题卷编排）
   字段口径同模拟考场：total题数 / minutes限时 / fullScore满分 / done已做 / right/wrong / rate正确率
   ============================================================ */
var YEARS = ['2025', '2024', '2023', '2022', '2021'];
var PAPERS = [
  { id:'real2025', year:'2025', name:'山东省 2025 年计算机真题卷', total:80, minutes:100, fullScore:150, done:1, right:62, wrong:18, skip:0,   used:5400, score:116, rate:78 },
  { id:'real2024', year:'2024', name:'山东省 2024 年计算机真题卷', total:80, minutes:100, fullScore:150, done:0, right:0, wrong:0, skip:0,   used:0, score:0, rate:null },
  { id:'real2023', year:'2023', name:'山东省 2023 年计算机真题卷', total:80, minutes:100, fullScore:150, done:0, right:0, wrong:0, skip:0,   used:0, score:0, rate:null },
  { id:'real2022', year:'2022', name:'山东省 2022 年计算机真题卷', total:80, minutes:100, fullScore:150, done:0, right:0, wrong:0, skip:0,   used:0, score:0, rate:null },
  { id:'real2021', year:'2021', name:'山东省 2021 年计算机真题卷', total:80, minutes:100, fullScore:150, done:0, right:0, wrong:0, skip:0,   used:0, score:0, rate:null }
];

function scoreOf(p) {
  // 演示得分 = 答对题数按分值折算（与模拟考场/做题页 calcPaperScore 口径对齐：逐题分值累加）
  return p.score || Math.round((p.right / p.total) * p.fullScore);
}
function fmtMMSS(sec) {
  if (!sec) return '00:00';
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
}
function metaHtml(p) {
  return '<div class="paper-meta">'
    + '<span class="pm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>' + p.total + '题</span>'
    + '<span class="pm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>' + p.minutes + '分钟</span>'
    + '<span class="pm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"/></svg>满分 ' + p.fullScore + '</span>'
    + '</div>';
}
/* 卡片三层：名称行 / 题量行 / 操作区（与模拟考场一致） */
function cardHtml(p) {
  var isDone = p.done > 0;
  var score = scoreOf(p);
  var actions = '';
  if (!isDone) {
    actions = '<div class="paper-actions">'
      + '<button class="paper-btn primary wide" onclick="startPaper(\'' + p.id + '\')">开始答题</button>'
      + '</div>';
  } else {
    var low = p.rate !== null && p.rate < 60;
    actions = '<div class="paper-actions">'
      + '<div class="paper-status-line' + (low ? ' wrong' : '') + '">已做 ' + p.right + '/' + p.total + ' · ' + score + ' 分</div>'
      + '<div class="paper-btn-row">'
      +   '<button class="paper-btn primary" onclick="startPaper(\'' + p.id + '\')">再次答题</button>'
      +   '<button class="paper-btn ghost" onclick="requestReport(\'' + p.id + '\')">薄弱点分析</button>'
      + '</div>'
      + '</div>';
  }
  return '<div class="paper-card">'
    + '<div class="paper-head">'
    +   '<div class="paper-icon real"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg></div>'
    +   '<div class="paper-name"><span class="paper-title">' + p.year + ' · ' + p.name + '</span></div>'
    + '</div>'
    + metaHtml(p)
    + actions
    + '</div>';
}
function render() {
  var box = document.getElementById('paperGroups');
  var html = '';
  YEARS.forEach(function(y) {
    var list = PAPERS.filter(function(p) { return p.year === y; })
      .sort(function(a, b) {
        // 默认排序：未做(0) 在前，已做(done>0) 在后
        return (a.done > 0 ? 1 : 0) - (b.done > 0 ? 1 : 0);
      });
    if (list.length === 0) return;
    html += '<div class="paper-group"><div class="group-head">' + y + ' 年真题</div><div class="paper-list">';
    list.forEach(function(p) { html += cardHtml(p); });
    html += '</div></div>';
  });
  box.innerHTML = html;
}

/* ===== 薄弱点分析：派生报告数据 → 请求总壳打开独立报告页 =====
   字段契约对齐报告页（成绩报告.html）：
     paperId/type/name/minutes/fullScore/submitTime/usedSec/score/rank/beat/sheet/typeStats
   sheet  答题卡：1对 0错 -1未答（按总题数铺）
   typeStats 题型概况：{name,right,total} */
function reportOf(p) {
  var score = scoreOf(p);
  var sheet = [];
  var i;
  for (i = 0; i < p.right; i++) sheet.push(1);
  for (i = 0; i < p.wrong; i++) sheet.push(0);
  for (i = p.right + p.wrong; i < p.total; i++) sheet.push(-1);
  /* 题型分布 mock：山东专升本卷 单选45/多选10/判断10/填空10/操作5 */
  var typeStats = [
    { name:'单选题', right: Math.round(45 * p.rate / 100), total: 45 },
    { name:'多选题', right: Math.round(10 * p.rate / 100), total: 10 },
    { name:'判断题', right: Math.round(10 * p.rate / 100), total: 10 },
    { name:'填空题', right: Math.round(10 * p.rate / 100), total: 10 },
    { name:'操作题', right: Math.round(5 * p.rate / 100),  total: 5 }
  ];
  return {
    paperId: p.id,
    type: 'real',
    name: p.year + ' · ' + p.name,
    minutes: p.minutes,
    fullScore: p.fullScore,
    submitTime: p.year + '-06-15 14:05',
    usedSec: p.used,
    score: score,
    rank: 32,
    beat: '击败 92% 考生',
    sheet: sheet,
    typeStats: typeStats,
    label: '本次真题'
  };
}
function requestReport(pid) {
  var p = PAPERS.filter(function(x) { return x.id === pid; })[0];
  if (!p) return;
  try {
    window.parent.postMessage({ type:'REQ_REPORT', data: reportOf(p) }, '*');
  } catch(e) {
    showToast('请从总壳进入薄弱点分析');
  }
}

/* ===== 进入做题页 =====
   向总壳请求打开做题层，entry=real，附带卷 id/名字/限时/满分 */
function startPaper(pid) {
  var p = PAPERS.filter(function(x) { return x.id === pid; })[0];
  if (!p) return;
  try {
    window.parent.postMessage({ type:'REQ_PRACTICE', data:{
      entry:'real', paperId:p.id, name:p.year + ' · ' + p.name,
      minutes:p.minutes, fullScore:p.fullScore, level:'paper'
    } }, '*');
  } catch(e) {
    showToast('请从总壳进入，开始做真题');
  }
}

/* ===== 返回：通知题库首页收起二级层 ===== */
function goBack() {
  try {
    window.parent.postMessage({ type:'CLOSE_CHAPTER' }, '*');
  } catch(e) {
    showToast('请从总壳返回');
  }
}

/* ===== Toast ===== */
var toastTimer = null;
function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.style.opacity = 0; }, 1500);
}

render();
</script>
</body>
</html>
